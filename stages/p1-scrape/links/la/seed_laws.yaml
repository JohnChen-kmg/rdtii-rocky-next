# seed_laws for Lao PDR — the laws named on purpose, with their provenance. HAND-EDITED.
#
# Chosen 2026-09-20 from the gazette's own `legaltype=6` listing, read in full during the probe that settled
# legaltype 6 against 16 (`../NOTES.md` 8). **Every entry below was seen in a listing row**, with the title, the
# dates and the portal id the gazette states; nothing here is desk research and nothing comes from a host
# baseline (`POLICY.md` section 4).
#
# `portal_key` is the gazette's own record id — the `id=` of the law's page, `/index.php?r=site/display&id=<n>`.
# It is the only stable key the portal offers: there is no act number anywhere in the listing, and the file
# addresses are inconsistent enough that one can never be constructed.
#
# **Laos does have a data-protection statute**, unlike Timor-Leste: the Law on Electronic Data Protection
# (id 1216, 2017). It sits beside a Cyber Security Law (2025), an Anti-Cybercrime Law (2015), an Electronic
# Transactions Law (revised 2022) and an Electronic Signature Law (2018) — an unusually complete pillar 7 set
# for an economy this size (`../NOTES.md` 6).
#
# The English gloss on each title is ours, for a reader of this file. The Lao title is what the portal states
# and what the scraper matches on.
# Keep the flow style `- {...}`: the dashboard's parser declines block-style entries.
