# sources_tl.yaml — Timor-Leste source registry, RDTII Pillars 6 & 7 (9 in-scope indicators)
#
# SCOPE — so the line above is not misread. Pillars 6 and 7 are what the TASK is for, not what the crawl takes. The
# crawl takes every principal law the portal lists (decision 11). In links/laws.csv: 4,788 listed, 4,739 in scope,
# 863 marked relevant, 31 seeds. The title rule further down does not limit what is fetched: it MARKS the relevant
# titles, and that marking only steers the costly per-act work — reading timelines, taking subsidiary legislation,
# and the crawl order.
# Built 2026-09-20 from the exploration of 2026-09-20 (countries/_finale-survey/explore-2026-09-20/).
# STRATEGY: one official source, the Jornal da República (www.mj.gov.tl/jornal), which IS the law: Timor-Leste
# publishes as-made acts in a gazette and keeps no consolidated database. Six category pages carry the whole
# statute book, so the link list costs six requests. The documents are native-text Portuguese PDFs.
# In-scope indicators: P6-I1..P6-I4, P7-I1..P7-I5.
economy: TL
portals:
  primary_statutes:
    name: "Jornal da República (Ministério da Justiça)"
    root: "https://www.mj.gov.tl"
    crawl_style: requests              # server-rendered Drupal tables; PDFs over plain HTTP. No browser needed
  gazette: self                        # the gazette IS the primary source here; there is no consolidated text
  regulators:
    - {name: "ANC — Autoridade Nacional de Comunicações", root: "https://www.anc.tl"}   # telecom -> P7-I3/I5
    - {name: "Governo de Timor-Leste", root: "https://timor-leste.gov.tl"}              # announces issues
# The catalogue step and the crawl (scraper/, 2026-09-20; CONVENTIONS.md section 2). Every key can be overridden
# by JORNAL_<KEY> in the environment. Changing a key other than frontier/links_file changes the list fingerprint.
jornal:
  root: "https://www.mj.gov.tl"
  categories: all                      # all six, or a comma list: leis, decretos_leis, decretos_governo,
                                       # decretos_presidente, resolucoes_parlamento, resolucoes_governo
  document_form: pdf                   # the portal offers nothing else
  frontier: discover                   # discover | links_file (the crawl sets JORNAL_FRONTIER=links_file)
# The seed laws are in links/seed_laws.yaml. At hand-back that file is appended to this one
# (countries/README.md).
#
# The title rule, on ACCENT-FOLDED, UPPER-CASED Portuguese: `fold()` in scraper/parse.py strips the accents before
# matching, so one pattern covers both orthographies — `Proteção` (1990 agreement) and `PROTECÇÃO` (before it),
# `eletrónico` and `electrónico`. Write patterns without accents.
title_rule:
  id: tl-jornal-title-relevance-v1
  groups:
    - {id: G1_dados_privacidade, tier: core, indicators: ["6.1", "6.2", "6.4", "7.1", "7.4", "7.5"],
       patterns: ['\bDADOS\b', '\bPRIVACIDADE\b', '\bINFORMACAO PESSOAL\b', '\bPROTEC(C)?AO DE DADOS\b']}
    - {id: G2_ciberseguranca_informatica, tier: core, indicators: ["7.2", "7.5"],
       patterns: ['\bCIBER', '\bINFORMATIC', '\bSEGURANCA DA INFORMACAO\b', '\bINFRAESTRUTURAS? CRITICAS?\b']}
    - {id: G3_comunicacoes_intercecao, tier: core, indicators: ["6.3", "7.3", "7.5"],
       patterns: ['\bTELECOMUNICAC', '\bCOMUNICACOES\b', '\bINTERCE(P)?CAO\b', '\bVIGILANCIA\b', '\bESPE(C)?TRO\b',
                  '\bPOSTAIS?\b', '\bRADIODIFUSAO\b']}
    - {id: G4_eletronico_digital, tier: core, indicators: ["6.2", "6.3", "7.3", "7.5"],
       patterns: ['\bELE(C)?TRONIC', '\bDIGITAL\b', '\bINTERNET\b', '\bEM LINHA\b', '\bCOMERCIO ELE(C)?TRONICO\b',
                  '\bASSINATURAS? ELE(C)?TRONICAS?\b', '\bPLATAFORMAS?\b']}
    - {id: G5_seguranca_processo_penal, tier: core, indicators: ["7.5"],
       patterns: ['\bPROCESSO PENAL\b', '\bSEGURANCA NACIONAL\b', '\bSERVICOS? DE INTELIGENCIA\b',
                  '\bTERRORISMO\b', '\bBRANQUEAMENTO\b']}
    - {id: S1_financeiro, tier: sectoral, indicators: ["6.1", "6.2", "6.3", "6.4", "7.2", "7.3", "7.4"],
       patterns: ['\bBANCARIO\b', '\bBANCO CENTRAL\b', '\bINSTITUICOES? FINANCEIRAS?\b', '\bPAGAMENTOS?\b',
                  '\bSEGUROS?\b', '\bVALORES MOBILIARIOS\b']}
    - {id: S2_registos_identificacao, tier: sectoral, indicators: ["6.2", "7.1", "7.3"],
       patterns: ['\bIDENTIFICACAO CIVIL\b', '\bREGISTO CIVIL\b', '\bARQUIVO\b', '\bESTATISTICA\b',
                  '\bRECENSEAMENTO\b']}
    - {id: S3_saude_trabalho, tier: sectoral, indicators: ["6.1", "6.2", "7.3", "7.4"],
       patterns: ['\bSAUDE\b', '\bREGISTOS? MEDICOS?\b', '\bTRABALHO\b']}
    - {id: S4_consumidor_concorrencia, tier: sectoral, indicators: ["6.4", "7.3"],
       patterns: ['\bCONSUMIDOR', '\bCONCORRENCIA\b', '\bPROPRIEDADE INTELECTUAL\b', '\bDIREITO DE AUTOR\b']}
  exclusions:
    # honours, appointments and ceremonial acts fill the presidential-decree page and are never regulatory
    - {id: X1_condecoracoes_nomeacoes, pattern: '^(CONCESSAO DE (HONRAS|CONDECORACAO)|CONDECORA|NOMEACAO|EXONERACAO|DEMISSAO|LUTO NACIONAL|INDULTO)'}
    - {id: X2_orcamento, pattern: '^(ORCAMENTO GERAL DO ESTADO|APROVA O ORCAMENTO)'}
seed_queries:                          # vocabulary-seeded, per indicator (recall-first), Portuguese
  P6-I1: ['transferencia de dados para o estrangeiro', 'localizacao de dados']
  P6-I2: ['conservacao de registos em territorio nacional', 'copia em Timor-Leste']
  P6-I3: ['centro de dados', 'servidor localizado', 'infraestrutura de comunicacoes']
  P6-I4: ['transferencia de dados pessoais', 'consentimento para transferencia', 'nivel adequado de protecao']
  P7-I1: ['protecao de dados pessoais', 'tratamento de dados pessoais']
  P7-I2: ['ciberseguranca', 'crime informatico', 'infraestruturas criticas']
  P7-I3: ['conservacao de dados de trafego', 'prazo de conservacao', 'registos por um periodo']
  P7-I4: ['encarregado de protecao de dados', 'avaliacao de impacto']
  P7-I5: ['intercecao de comunicacoes', 'acesso legal a dados', 'meios de obtencao de prova']

# ---- seed laws: links/tl/seed_laws.yaml, appended at hand-back (links/tl/README.md) ----
# seed_laws for Timor-Leste — the laws named on purpose, with their provenance. HAND-EDITED.
#
# Chosen 2026-09-20 from the portal's own category pages, read during the exploration
# (countries/_finale-survey/explore-2026-09-20/tl-timor-leste.md). Every entry below was seen in a listing row,
# with the number, title and date the portal states; nothing here is desk research.
#
# `portal_key` is how a seed is matched to a listing row: "<category>:<number>", the category being the key in
# scraper/parse.py CATEGORIES. The gazette has no per-law address, so a seed names the act, not a URL: the adapter
# resolves it to the issue that carries it.
#
# **Timor-Leste has no comprehensive data-protection statute.** Searching all 4,846 listed acts for "dados
# pessoais" and "proteção/protecção de dados" returned nothing. That absence is a finding for the instrument, and
# it is why the seeds below are telecommunications, electronic commerce and civil identification rather than a
# privacy act (`../NOTES.md` 6).
# Keep the flow style `- {...}`: the dashboard's parser declines block-style entries.
seed_laws:
  - {law_name: "Regime Jurídico Geral do Comércio Eletrónico e de Assinaturas Eletrónicas", law_number: "12/2024",
     portal_key: "decretos_leis:12/2024", indicators: [P6-I2, P6-I3, P7-I3],
     provenance: "Jornal da República, Decretos-Leis do Governo, listed 13/2/2024; the country's electronic
       transactions regime"}
  - {law_name: "Sobre a Regulamentação do Sector das Telecomunicações", law_number: "15/2012",
     portal_key: "decretos_leis:15/2012", indicators: [P6-I3, P7-I3, P7-I5],
     provenance: "Jornal da República, Decretos-Leis do Governo, listed 28/03/2012; the sector regulation, altered
       by Decreto-Lei 31/2024"}
  - {law_name: "Primeira alteração ao Decreto-Lei n.º 15/2012, sobre a Regulamentação do Sector das Telecomunicações",
     law_number: "31/2024", portal_key: "decretos_leis:31/2024", indicators: [P6-I3, P7-I3, P7-I5],
     provenance: "Jornal da República, listed 6/9/2024; the amendment to the telecommunications regime"}
  - {law_name: "Que estabelece as bases das telecomunicações", law_number: "11/2003",
     portal_key: "decretos_leis:11/2003", indicators: [P6-I3, P7-I3],
     provenance: "Jornal da República, listed 29/07/2003; the founding telecommunications law"}
  - {law_name: "Cria a Agência de Tecnologias de Informação e Comunicação I.P. — TIC TIMOR", law_number: "29/2017",
     portal_key: "decretos_leis:29/2017", indicators: [P6-I3, P7-I2],
     provenance: "Jornal da República, listed 02/08/2017; the state ICT agency, the nearest thing to a
       cybersecurity institution"}
  - {law_name: "Regime Jurídico da Identificação Civil", law_number: "2/2004",
     portal_key: "decretos_leis:2/2004", indicators: [P7-I1],
     provenance: "Jornal da República, listed 04/02/2004; the civil identification register is the country's
       principal personal-data regime in the absence of a data-protection act"}
  - {law_name: "Regulamenta a prestação de serviços de telecomunicações na rede móvel", law_number: "9/2008",
     portal_key: "decretos_governo:9/2008", indicators: [P6-I3, P7-I3],
     provenance: "Jornal da República, Decretos do Governo, listed 16/04/2008; mobile network services"}
  - {law_name: "Lei de Proteção ao Consumidor", law_number: "8/2016", portal_key: "leis:8/2016",
     indicators: [P6-I4],
     provenance: "Jornal da República, Leis do Parlamento Nacional, listed 08/07/2016; consumer protection, which
       carries the online-selling duties in the absence of a distance-selling regime"}
  - {law_name: "Lei da Concorrência", law_number: "1/2026", portal_key: "leis:1/2026", indicators: [],
     provenance: "Jornal da República, listed 25/3/2026. No indicator tag: it is named on purpose as the newest
       principal law on the portal, and is the fixture this country's tests are built on"}
