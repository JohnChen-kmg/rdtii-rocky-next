# `provenance` (POLICY.md 4.1), taken from the records that exist:
#   round1_registry            listed above the 2026-07-14 delta block of the Round 1 registry; where each came
#                              from was not recorded
#   p3_request:<doc>#<row>     requested by mapping in stages/p3-map/docs/<doc>.md, row <row>
#   host_row:<id>              requested as an error-check target naming a host baseline row; disclosed in
