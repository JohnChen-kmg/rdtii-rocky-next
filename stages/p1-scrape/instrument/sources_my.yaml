#   p1_discovery_sweep:<date>  added by P1's regulator sweep (stages/p1-scrape/docs/CORPUS_VERSIONS.md v2.3)
#
# Moved here from sources.yaml on 2026-09-14 (decision 11). Keep the flow style `- {...}`: the dashboard's
# parser declines block-style entries. law_name drives doc_id and resume: do not change it casually.
# Keep url and fallback_url on lom-listed seeds too: they are the fallback when lom cannot be read.
# P.U. seeds carry the full N/YYYY number, read from the gazette copy itself (2026-09-14), so the scraper can match
# them to the portal copy on the parent act's timeline and fetch that copy once, under the seed's name (POLICY.md 2).
