indicator: '5.3'
name: Shares owned by the Government in telecom companies
tier: C
instrument_version: 2.1.0
keywords:
- state-owned enterprise
- state enterprise
- government-owned
- wholly owned by the Government
- government shareholding
- shares held by the State
- Ministry of Finance
- sovereign wealth fund
- government-linked
- incumbent operator
- national telecommunications company
- retain full ownership
- privatisation
- shareholding pattern
- market share
- annual report
- golden share
definition_text: 'How much of each telecom operator the Government owns, directly or through state entities,
  and the operator''s market presence. Practice-based: evidence includes shareholding records, annual
  reports, regulator market reports and SOE lists, as well as ownership statutes. Ownership above 50%
  in one company, or 1-50% in several companies, scores 1; 1-50% in one company 0.5; none 0.'
exemplar_law_types:
- statutes requiring state ownership of an operator (e.g. national broadband company acts)
- company annual reports and shareholding pattern filings
- telecom regulator market reports
- SOE lists of finance or SOE ministries
- privatisation laws fixing minimum state holdings
scope_patterns:
  horizontal: SOE and privatisation laws that fix state holdings across sectors (check which telecom companies
    they reach)
  sectoral: ownership of specific telecom operators, fixed or mobile, including indirect holdings
negative_signals:
- foreign equity caps on telecom operators -> 5.2
- regulator owning or controlling an operator -> 5.7
- temporary state control of networks in emergencies -> not scored (not ownership)
- state-owned postal or broadcasting companies -> not scored (outside Pillar 5)
spec_note: 'Practice-based indicator (Internal Guide p.8): factual secondary sources are admissible evidence.
  The score counts companies, so a row-level score can differ from the economy-level score.

  '
