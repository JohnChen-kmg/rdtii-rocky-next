definition_text: Whether operators with significant market power must separate their businesses. Accounting
  separation keeps separate books so the costs, revenues and assets of each service can be identified;
  functional (operational or structural) separation splits units such as network and retail. Both mandated
  scores 0; functional only 0.25; accounting only 0.5; neither 1. Inverted polarity.
exemplar_law_types:
- regulator notifications on accounting separation reports
- accounting separation regulations or guidelines
- telecommunications acts (SMP and separation powers)
- ministerial orders on separate accounting
- carrier licence conditions declarations
scope_patterns:
  horizontal: not observed; separation duties are telecom-specific
  sectoral: SMP or dominant telecom operators, or all licensees above a turnover threshold
negative_signals:
- passive infrastructure sharing or access duties on dominant operators -> 5.1
- general accounting standards or statistical reporting to the regulator -> not scored
- abuse-of-dominance prohibition without a separation mandate -> not scored
- other licence conditions -> 5.5
