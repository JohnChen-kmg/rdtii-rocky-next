indicator: '6.2'
name: Local storage requirements
tier: A
instrument_version: 2.1.0
keywords:
- copy stored
- stored locally
- store within
- kept in
- maintained in
- stored in the country
- retained in
- local storage
- store a copy
- shall be kept at
- registered office
- data storage within
- store user data within
- maintain their databases in
definition_text: A law mandates that a copy of certain data be stored within the economy; the data may
  still be transferred abroad as long as a domestic copy remains. About the LOCATION of a copy, not the
  duration of retention and not a mandate to build infrastructure. Higher restriction when it covers personal
  data generally or applies across sectors.
exemplar_law_types:
- comprehensive data-protection laws (storage provisions)
- companies/accounting acts
- tax acts (records retained in-country)
- social-media/user-data localization rules
- health-information administrative measures
- payment-systems directives
scope_patterns:
  horizontal: personal-data storage mandate across sectors (e.g. CN PIPL, RU 152-FZ)
  sectoral: accounting records, tax records, health data, payment data
negative_signals:
- duration-based record-keeping (keep for N years, location-free) -> 7.3
- requirement to establish a data centre/server -> 6.3
- processing (not just storage) must be domestic -> 6.1 (record both if both)
- measures on government data are not scored
