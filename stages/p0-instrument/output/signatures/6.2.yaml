  law: Companies Act 1967
  coverage: Accounting records
  score: 0.5
  impact: According to Section 199, every company must retain accounting for a period of 5 years from
    the end of the financial year in which the transactions or operations to which those records relate
    are completed. This data shall be kept at the registered office of the company or other places in
