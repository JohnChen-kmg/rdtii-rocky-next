indicator: '7.4'
name: DPIA or DPO requirements
tier: A
instrument_version: 2.1.0
keywords:
- data protection officer
- DPO
- appoint one or more
- data protection impact assessment
- DPIA
- privacy impact assessment
- responsible for compliance
- designate a person
- compliance officer
- high risk processing
- risk assessment of processing
definition_text: 'A mandatory duty to appoint a Data Protection Officer and/or perform Data Protection
  Impact Assessments. Score anchors on the DPO duty: horizontal DPO requirement scores 1, sector-specific
  0.5, none 0. The duty must be mandatory — advisory or recommended assessments do not count.'
exemplar_law_types:
- comprehensive data-protection statutes (DPO sections; modern amendments)
- privacy-regulator guides (advisory — negative exemplars)
- intermediary/platform rules with adjacent officers (negative exemplars)
scope_patterns:
  horizontal: DPO duty on all organisations processing personal data -> 1
  sectoral: DPO duty limited to a sector or entity class -> 0.5
negative_signals:
- advisory/recommended DPIA (e.g. 'organisations are advised') -> not a mandate
- grievance/compliance/security officers or registry contact persons are not DPOs
- DPIA-only mandate = theoretical 0.25 per Guide — flag for human review, do not emit
