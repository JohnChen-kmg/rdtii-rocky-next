definition_text: A measure requires foreign service providers to set up a commercial presence, meaning
  a local branch, subsidiary, incorporated company or office, before supplying services in sectors relevant
  to digital trade (GATS Mode 3). It may sit in company law or in licence conditions for telecom, satellite,
  broadcasting, gaming or large online platforms. Any requirement scores 1; registration without a physical
  or operational presence does not.
exemplar_law_types:
- companies acts (foreign company branch and registered office provisions)
- telecom, satellite and broadcasting licensing regulations
- laws on large foreign internet platforms
- internet information service regulations
- FDI policy operating conditions
scope_patterns:
  horizontal: company law requiring a foreign company carrying on business to incorporate locally or register
    a branch or place of business
  sectoral: licence eligibility limited to locally established companies (telecom, satellite, broadcasting,
    online services)
negative_signals:
- duty to appoint a local agent, legal representative or contact point while serving remotely -> 12.8
- business registration with no physical or operational presence -> not scored
- licensing scheme for online content services as such -> 9.4
- foreign equity cap inside licence conditions, outside telecom and e-commerce -> 3.1
spec_note: Only two score-0 rows (both Lao PDR). The same company-law and platform-law provisions appear
  as 12.8 = 0 rows (round1 Singapore row 92; round2 Russian Federation row 108).
