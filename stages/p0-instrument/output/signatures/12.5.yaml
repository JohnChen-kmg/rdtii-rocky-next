indicator: '12.5'
name: Low De Minimis
tier: B
instrument_version: 2.1.0
keywords:
- de minimis
- low value goods
- low-value goods
- low value consignment
- value not exceeding
- does not exceed the equivalent of
- exempt from customs duties
- exempted from import duty
- free of customs duties and taxes
- duty-free threshold
- customs value
- CIF value
- goods for personal use
- international postal items
- courier consignments
- express consignments
- consigned goods
- relief from duty
- customs duty exemption
- import relief threshold
definition_text: 'A de minimis rule sets a value ceiling for imported goods below which no customs duty
  or border tax is collected. The indicator grades that ceiling: no de minimis rule at all is the most
  restrictive case, a threshold below USD 200 is intermediate, and a threshold of USD 200 or more is the
  least restrictive. Values are converted to USD at IMF rates. Found in customs codes, tariff laws and
  postal or courier import rules.'
exemplar_law_types:
- customs acts and customs codes (duty exemptions for low-value goods)
- customs tariff laws and decrees
- courier and postal import regulations
- finance ministry regulations on consigned goods
- customs union decisions on goods for personal use (EAEU)
- GST or sales tax acts with low-value goods provisions (context only)
scope_patterns:
  horizontal: one economy-wide value threshold for all imported consignments
  sectoral: 'thresholds limited to a channel or goods class: air courier, international post, personal-use
    goods, gifts or samples'
negative_signals:
- per-shipment or annual value cap on cross-border e-commerce purchases -> 12.2
- customs duty on software or other digitally transmitted products -> 12.6
- merger-control de minimis exemption (asset or turnover thresholds) -> not scored
- rules-of-origin de minimis tolerance for non-originating materials -> not scored
- GST or VAT collected by overseas vendors on low-value imports -> not scored (the border threshold still
  decides 12.5)
spec_note: 'Polarity hazard: absence of any de minimis rule scores 1, not 0 (Guide p.86). No reliable
  score-1 exemplar: both score-1 rows (India 154, Mongolia 84) describe value-based exemptions. Workbook
  conversions use mixed dates and sources, not the IMF rate of 31 August (Internal Guide p.15).

  '
