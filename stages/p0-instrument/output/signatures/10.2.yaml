indicator: '10.2'
name: Other import restrictions on ICT goods and online services
tier: B
instrument_version: 2.1.0
keywords:
- import licence
- import license
- import permit
- non-automatic import licensing
- import approval
- prior approval for import
- restricted items
- import quota
- registered importer
- importer registration
- dealer's licence
- permission to import
- surveyor report
- pre-shipment verification
- labelling requirements
- import control
- certificate of approval
- import notification
definition_text: 'A measure short of a ban that makes importing ICT goods or online services slower or
  costlier: import licences or permits (automatic or non-automatic), prior approvals, importer or product
  registration, dealer licences, surveyor or pre-shipment checks, labelling conditions and other import
  controls, plus trade-blocking quotas. Quotas, or two or more cost-adding measures, weigh most.'
exemplar_law_types:
- import policy schedules and foreign trade notifications (restricted-items lists)
- radio communication and telecommunications acts requiring import licences for equipment
- trade ministry regulations on import approvals, surveyor reports and importer registration
- strategic trade acts and customs-union decisions requiring permits for encryption or radio-electronic
  goods
- customs regulations on import notification, including for intangible goods
scope_patterns:
  horizontal: general import licensing or registration regimes whose lists include ICT goods (ID trade
    regulations, IN ITC(HS) schedule, LA importer registration)
  sectoral: telecom and radio equipment import or dealer licences (TH, SG), product-specific licences
    (IN colour TVs, laptops), walkie-talkie and satellite equipment permits (LA)
negative_signals:
- outright prohibition with no licence path -> 10.1 (Guide p.74)
- whether SDoC or foreign certificates are accepted -> 11.2; added in-country testing -> 11.3 (Internal
  Guide p.15); the import permit itself stays here
- mandated encryption algorithm or key length -> 11.4, while an import licence for encryption devices
  stays 10.2 (Guide p.81)
- customs duties on electronic transmissions -> 12.6; tariffs and taxes sit outside pillar 10 (Guide pp.74,
  86)
- licence to operate a telecom network or service -> 5.5 (workbook round1 Singapore row 30)
spec_note: Workbook scores each measure row 0.5 even where one economy has several (Lao PDR 7 rows); the
  Guide's two-or-more rule looks economy-level. Only one unstruck score-1 row (Indonesia row 131).
