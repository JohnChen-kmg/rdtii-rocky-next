indicator: '11.4'
name: Deviation from international encryption standards (ISO, IEC, ITU, FIPS, AES, TDES, and ECC)
tier: C
instrument_version: 2.1.0
keywords:
- encryption
- cryptography
- cryptographic algorithm
- encryption algorithm
- commercial cryptography
- national cryptographic algorithm
- encryption standard
- key length
- key management
- block cipher
- cryptographic module
- approved cryptographic algorithms
- encryption keys
- source code
- ISO/IEC 18033
- ISO/IEC 11770
- ISO/IEC 19790
- cipher
definition_text: 'A binding rule to use encryption that departs from ISO/IEC-recognised practice: mandated
  domestic algorithms not listed in ISO/IEC 18033, block sizes or key lengths below recommended minimums
  (e.g. symmetric keys under 128 bits), key management outside ISO/IEC 11770, or forced disclosure of
  source code or keys when certifying encryption products beyond ISO/IEC validation requirements.'
exemplar_law_types:
- cryptography laws and commercial cryptography regulations
- cyber and crypto agency regulations on national algorithms and module certification
- financial regulator security directions specifying encryption strength
- national cryptographic module validation schemes
- government security manuals listing approved algorithms
scope_patterns:
  horizontal: cryptography laws or national algorithm policies applying to all commercial encryption products
  sectoral: banking and payment security directions, government or classified systems, critical infrastructure
    operators
negative_signals:
- licence or registration to use, import or distribute encryption devices -> 9.4 or 10.2, not 11.4 (Guide
  p.81; workbook round2 Russian Federation row 77)
- specific encryption required to win public tenders -> 2.2 (Guide p.19)
- payment-security standards that deviate from international standards -> 12.4.3 (Guide p.85)
- government power to order decryption of data -> 7.5 (workbook round2 Thailand row 69)
- domestic algorithm already adopted into ISO/IEC standards -> not scored (workbook round2 China row 107)
spec_note: Binary. Pool has 11 rows, all score 0; no score-1 example. Guide p.37 routes encryption-related
  trade-secret disclosure to pillar 11, not 4.9.
