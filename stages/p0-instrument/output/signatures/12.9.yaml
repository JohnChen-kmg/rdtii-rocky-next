definition_text: 'Whether any consumer protection law reaches online purchases. A general consumer protection
  act covering all transactions is enough, as are e-commerce consumer rules on disclosure, returns, refunds,
  complaints or unfair terms. Inverted polarity: an economy with such a law scores 0, and it scores 1
  only when no consumer protection law applies to online purchases, for example a regime limited to offline
  sales.'
exemplar_law_types:
- general consumer protection or consumer rights acts
- e-commerce consumer protection rules and regulations
- e-commerce laws with consumer rights chapters
- fair trading and unfair contract terms acts
- electronic transactions laws (consumer protection provisions only)
scope_patterns:
  horizontal: cross-sector consumer protection act whose scope covers online transactions
  sectoral: e-commerce consumer rules, telecom and internet service consumer decisions, e-money user protections
negative_signals:
- provisions giving legal validity to electronic signatures, messages or contracts -> not scored (UNCITRAL
  indicators 12.11 and 12.12 are non-regulatory)
- personal data consent or breach-notification duties -> 7.1
- online advertising limits not aimed at consumer protection -> 9.3
- e-money or payment service approval and licensing rules -> 12.4.4
- sale or delivery limits on alcohol, tobacco or medicines for consumer protection -> not scored under
  12.2
spec_note: 'All 23 workbook rows score 0 and every economy has a general consumer protection law, so no
  score-1 example exists. Several rows attach non-consumer laws (Russia 110 e-signatures, Indonesia 185
  data protection, Malaysia 110 e-commerce recognition act).

  '
