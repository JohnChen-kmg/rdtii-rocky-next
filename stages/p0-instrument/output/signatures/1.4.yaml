indicator: '1.4'
name: Trade defence measures including anti-dumping, countervailing duties and safeguards on ICT-related
  goods imported by other economies within the considered United Nations region
tier: B
instrument_version: 2.1.0
keywords:
- anti-dumping duty
- antidumping duty
- anti-dumping measure
- definitive anti-dumping duty
- provisional anti-dumping duty
- countervailing duty
- countervailing measure
- safeguard measure
- safeguard duty
- dumping margin
- injury to the domestic industry
- sunset review
- expiry review
- originating in or exported from
- trade remedy
- subsidized imports
- subsidised imports
- Customs (ADD)
definition_text: An economy is enforcing anti-dumping duties, countervailing duties or safeguard measures
  on ICT goods or ICT-related goods, meaning finished products and components such as cables, power transformers,
  circuit boards, optical fibre or aluminium strips, imported from other economies in the region. Each
  active measure adds 0.25, up to 1. Investigations not yet in force, terminated measures and raw materials
  do not count.
exemplar_law_types:
- customs notifications imposing anti-dumping or countervailing duties
- trade remedy authority final findings and sunset or expiry review rulings
- ministry of commerce announcements on anti-dumping measures
- regional economic commission decisions on anti-dumping duties (e.g., Eurasian Economic Commission)
- anti-dumping, countervailing duty and safeguard acts (reference rows only)
scope_patterns:
  horizontal: trade remedy acts and investigating authorities; on their own they score 0 unless an active
    measure hits ICT goods
  sectoral: product-specific duty notices naming HS codes and origin economies (optical fibre, printed
    circuit boards, calculators, transformers, cables, aluminium strips)
negative_signals:
- anti-dumping duty on raw materials such as rare earths, lithium, cobalt or silicon -> not scored
- investigation opened but no duty in force, or a terminated or expired measure -> not scored
- trade remedy act with no active measure on ICT goods -> not scored
- import ban on ICT goods -> 10.1
- import quota or import licensing on ICT goods -> 10.2
spec_note: Workbook rows score each measure 0.25 (one Australia row bundles two measures at 0.5); no row
  carries 0.75 or 1, which exist only as economy totals.
