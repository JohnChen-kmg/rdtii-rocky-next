definition_text: Customs duties or other cross-border duties charged on digital products delivered by
  electronic means, such as software, electronic data and multimedia. The top score needs duties actually
  imposed; an intermediate score applies where the law creates a mechanism to levy them, such as tariff
  lines for electronically transmitted goods even at a zero rate. Consumption taxes on digital services
  and tariffs on physical goods are outside.
exemplar_law_types:
- customs tariff books and HS nomenclature regulations
- finance ministry regulations on import duty tariffs and goods classification
- customs acts and customs codes defining dutiable goods
- customs union codes (EAEU Customs Code)
scope_patterns:
  horizontal: tariff chapter or customs rule covering all electronically transmitted goods
  sectoral: duty lines for specific digital product classes (software, applications, audio, video)
negative_signals:
- GST or VAT registration for offshore online information and database access services -> not scored
- tariffs on physical ICT goods -> not scored (tariff indicators 1.1 and 1.2 are non-regulatory)
- duty exemption threshold for low-value parcels -> 12.5
- statement of adherence to the WTO moratorium or JSI -> not scored (supports score 0)
spec_note: 'No score-1 row exists (10 rows at 0, one at 0.5). Indonesia row 171 scores 0 for the same
