definition_text: 'A provision shields Internet intermediaries from civil or criminal liability for users''
  unlawful content or conduct other than copyright infringement (harmful, defamatory or prohibited material),
  typically if they did not initiate it, lacked knowledge and removed it promptly. Inverted polarity:
  no shield scores 1; a shield only in a sectoral rule (e.g. e-commerce operators) 0.5; a horizontal shield
  0. Copyright-only safe harbours do not count.'
exemplar_law_types:
- electronic transactions acts (network service provider exemption)
- information technology acts and intermediary due-diligence rules
- e-commerce and electronic system operator regulations
- computer crime acts with ministerial notice-and-takedown procedures
- provider liability or harmful digital communications acts
scope_patterns:
  horizontal: exemption for all network service providers or intermediaries (SG Electronic Transactions
    Act s.26; IN IT Rules 2021; TH computer-crime notice procedure)
  sectoral: exemptions confined to e-commerce operators or private electronic system operators (ID GR
    80/2019, MOCI Reg 5/2020)
negative_signals:
- copyright- or IP-only safe harbour -> 8.1
- copyright offences (illicit streaming devices, sharing access to infringing works) -> 8.1 context, not
  8.2
- duty to remove or block content on notice or direction -> 8.4 (and 9.1 if commercial web content is
  blocked)
- general information-security, secrecy or transparency laws with no intermediary clause -> not a safe
  harbour (8.2 stays 1 if nothing else exists)
spec_note: Only one clean score-1 row (Russian Federation row 61); the Mongolia score-1 rows rest on laws
  that never address intermediary liability.
