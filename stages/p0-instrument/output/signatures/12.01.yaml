definition_text: 'Maximum share of equity that foreign natural or legal persons may hold in firms of the
  e-commerce sector itself: bans on foreign investment in online retail or e-commerce platforms, minority-only
  limits (below 50%), or caps above 50%. Excludes equity caps in telecoms or other digital-trade sectors,
  caps set by horizontal investment laws, and caps on delivery or physical retail firms.'
exemplar_law_types:
- foreign direct investment policy circulars and press notes
- e-commerce decrees and regulations
- investment laws and positive or negative investment lists
- retail and wholesale trade rules on foreign participation
- foreign business acts
scope_patterns:
  horizontal: general investment laws or investment lists capping foreign ownership across sectors (Guide
    p.25 records these under 3.1); cited as the general rule when e-commerce has no cap
  sectoral: caps written for e-commerce itself, e.g. an FDI ban on inventory-based online retail or a
    foreign-share limit in an e-commerce decree
negative_signals:
- foreign equity cap in the telecom sector -> 5.2
- foreign equity cap in other digital-trade sectors or under a horizontal investment law -> 3.1
- foreign equity cap on express delivery, postal or logistics firms -> 3.1
- physical-store or local-establishment condition on e-commerce FDI -> 3.5
- local sourcing condition attached to e-commerce FDI -> 10.3
