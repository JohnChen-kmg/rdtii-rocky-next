indicator: '5.2'
name: Foreign equity limits in telecom sector
tier: C
instrument_version: 2.1.0
keywords:
- foreign equity
- foreign ownership
- foreign shareholding
- foreign capital contribution
- foreign investors
- shall not exceed 49
- per cent of the shares
- foreign-invested telecommunications enterprise
- aggregate foreign ownership
- individual foreign investor
- voting shares
- controlling interest
- local shareholding
- foreigner
- network facilities provider
- telecommunications licensee
- foreign direct investment
definition_text: A cap on the share of a telecommunications company that foreign persons may hold, in
  private operators or in state-owned telecom companies. A ban, or minority-only caps in more than one
  measure, scores 1; a single minority-only cap 0.8; a cap that still allows control, or caps only on
  SOEs, 0.5; full foreign ownership 0. Broadcasting and horizontal FDI caps belong to Pillar 3.
exemplar_law_types:
- regulations on foreign-invested telecom enterprises
- telecommunications business acts (licence eligibility tied to foreign shareholding)
- privatised-incumbent acts (e.g. ownership caps on the former state operator)
- FDI policy circulars and investment lists
- regulator licensing guidebooks
scope_patterns:
  horizontal: horizontal FDI or SOE caps are recorded under 3.1, not 5.2
  sectoral: caps specific to telecom operators, telecom licence types or the incumbent
negative_signals:
- foreign equity caps in broadcasting, media or other digital sectors -> 3.1
- foreign equity caps in the e-commerce sector -> 12.01
- prior approval or screening of acquisitions -> 3.4
- Government's own shareholding in operators -> 5.3
- local incorporation required to hold a licence -> 3.5
spec_note: 'No score-1 row. Several horizontal SOE caps appear under both 3.1 and 5.2 in the workbooks,
  contrary to Guide p.25 (see notes).

  '
