- economy: AU
  law: Telecommunications Act 1997; Telstra Corporation Act 1991
  coverage: Telecommunications
  score: 0.8
  impact: The Telecommunications Act 1997 provides that "[a] condition of a carrier license may relate
    to the extent of foreign ownership or control (whether direct or indirect) of the holder" (Section
    65). This restriction has been in place since its enactment in 1997. The Telstra Corporations Act
    1991 provides under Section 8BG aggregate foreign ownership of Telstra (the incumbent telecommunication
    company) is limited to 35% and individual foreign investors are only allowed to own up to 5%. This
    specific cap was imposed in 1999 as part of an amendment of the Act. Note that Telstra Corporation
    was once a government-owned telecommunications provider.
