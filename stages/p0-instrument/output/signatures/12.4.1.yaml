definition_text: 'Online payment rule obliging merchants, payment providers or payers to hold or route
  funds through a bank account in the regulating economy: for example customer balances kept in escrow
  with a domestic bank, wallets loadable only from locally regulated accounts, or online payment services
  required to receive and pay out through local bank accounts. One of seven binary online payment sub-indicators.'
exemplar_law_types:
- central bank directions on prepaid payment instruments and payment aggregators
- payment system laws
- electronic money regulations
scope_patterns:
  horizontal: payment system, banking or AML laws for all payment services; cited as the general rule
    when no mandate exists
  sectoral: e-money and prepaid instrument issuers, payment aggregators, e-commerce payment collection
negative_signals:
- domestic processing of payment transactions -> 6.1, not a bank-account mandate
- local storage of payment data -> 6.2
- currency in which payments must be made -> 12.4.2
- local incorporation as a payment licence condition -> 12.4.4
- requirements on cryptocurrencies or digital payment tokens -> not scored
spec_note: One Indonesia score-1 row rests on domestic processing of e-money transactions rather than
  an account mandate; excluded as exemplar (see notes).
