indicator: '4.2'
name: 'Patent enforcement issues: civil and administrative procedures and remedies; and provisional measures'
tier: B
instrument_version: 2.1.0
keywords:
- patent infringement
- infringement proceedings
- action for infringement
- injunction
- interim injunction
- temporary injunction
- preliminary injunction
- provisional measures
- provisional determination
