definition_text: Whether the patent legal framework gives right holders civil and administrative procedures
  and remedies (lawsuits, damages, administrative handling of infringement) and provisional measures (urgent
  orders to stop infringement, keep infringing goods out of commerce or preserve evidence), following
  TRIPS Articles 42-50. Civil codes and procedure laws count. Absence scores 1; one element 0.5; both
  0.
exemplar_law_types:
- patents acts (infringement and remedies chapters)
- civil procedure codes (temporary injunction orders)
- general intellectual property laws
- civil code parts on intellectual property
- laws on enforcement of intellectual property rights
scope_patterns:
  horizontal: patent remedies and court procedures apply to all sectors; all workbook rows are coded Horizontal
    or Patent
  sectoral: not observed; specialised IP courts or divisions are institutional, not sectoral
negative_signals:
- compulsory licensing or government use provisions -> 4.3
- copyright infringement remedies, notice-and-takedown or site blocking -> 4.6
- criminal offences and fines only, with no civil or administrative route -> not scored as 4.2 evidence
- provisional protection of a published application before grant -> not scored (not a TRIPS Art.50 provisional
  measure)
- local agent or foreign-filing rules at the application stage -> 4.01
spec_note: 'Absence-based polarity: 1 when both elements are missing. All 10 workbook rows score 0, so
  there is no 0.5 or 1 example.

  '
