  law: Patents Act (Act 291) 1983; Patents (Amendment) Act (Act A1649) 2022
  coverage: Horizontal
  score: 0
  impact: A patent owner has the right to initiate court proceedings (Section 59) against anyone who infringes
    or is likely to infringe the patent. This includes actions against actual infringement as well as
    “imminent infringement”, where acts make it likely that an infringement will occur. Civil remedies
    such as injunctions (Section 60) and damages can be sought. The court may award damages to the patent
    owner and grant an injunction or interim injunctions to prevent ongoing or imminent infringement and
    further infringement. Infringement proceedings must be initiated within five years of the infringing
    act to ensure timely action.
