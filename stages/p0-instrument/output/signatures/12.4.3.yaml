definition_text: Online payment rule requiring payment security (card data protection, authentication,
  encryption, QR or mobile payment interfaces) to follow national standards that deviate from international
  ones. Any international standard referenced in law counts, e.g. ISO/IEC or PCI DSS; national standards
  built on them, or rules requiring internationally accepted standards, are not deviations. One of seven
  binary online payment sub-indicators.
exemplar_law_types:
- central bank payment security directions
- payment system regulations
- national technical standards for mobile or QR payments
- e-payment guidelines and technical references
scope_patterns:
  horizontal: information-security or encryption rules for all sectors (see 11.4)
  sectoral: payment systems, card payments, mobile and QR payments, e-money
negative_signals:
- general encryption algorithm, key-length or key-management mandates not specific to payments -> 11.4
- voluntary technical reference or industry guidance -> score 0
- national standard adopting ISO/IEC or EMVCo specifications -> score 0
spec_note: No score-1 row in either workbook (all 12 rows score 0). Split between 12.4.3 and 11.4 for
  payment-specific encryption rules is an inference.
