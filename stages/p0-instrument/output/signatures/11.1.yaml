definition_text: 'Inverted polarity: scores 1 where the process of setting technical standards for digital-trade
  sectors is closed or opaque, meaning foreign firms or other stakeholders are barred or restricted from
  standard-setting bodies, or there is no public consultation, no public notice of drafts or no channel
  for stakeholder comment; scores 0 where participation is open and drafts are consulted.'
exemplar_law_types:
- standardization acts and national standards body statutes
- procedures for developing and adopting national standards
- guidelines on foreign-invested enterprise participation in standardization
- technical regulation laws with public comment periods
- telecom regulator acts empowering equipment and service standard-setting
scope_patterns:
  horizontal: national standardization law and standards-body procedures (every row in the pool is of
    this kind)
  sectoral: telecom regulator standard-setting for equipment and ICT services (e.g. NBTC, TEC)
negative_signals:
- mandatory conformity with a standard, certification or testing -> 11.2 or 11.3 (Guide pp.79-80)
- adopting or aligning with ISO/IEC standards, without participation or consultation facts -> not scored
  under 11.1 (Guide p.78)
- cybersecurity agency powers with no standard-setting participation rules -> not scored (host hands-on
  exercise 1, 11.1 India)
spec_note: Inverted polarity (a 'Lack of' indicator). Pool has 13 rows, all score 0; neither workbook
  holds a score-1 example.
