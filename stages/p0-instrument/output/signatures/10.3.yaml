indicator: '10.3'
name: Local content requirements
tier: C
instrument_version: 2.1.0
keywords:
- local content
- local content requirement
- domestic component level
- TKDN
- domestic content
- minimum local content
- locally manufactured
- locally sourced
- local sourcing
- domestic products
- domestically produced
- local components
- percentage of domestic components
- domestic origin
- content quota
- local content share
- import substitution
- pre-installed software
definition_text: 'A commercial-market rule (not public procurement) obliging makers or sellers of ICT
  goods or providers of online services to use a set share of domestically made components, domestic services
  or local content: minimum domestic component levels for phones, set-top boxes or network gear, local
  sourcing conditions on retailers, or local content shares for streaming and IPTV.'
exemplar_law_types:
- telecom and ICT ministry regulations setting domestic component levels for devices and network equipment
- spectrum and broadband regulations with equipment local content thresholds
- IPTV, OTT and broadcasting content regulations with domestic content shares
- FDI policy conditions tied to local sourcing (single-brand retail)
- consumer-protection or device rules mandating domestic pre-installed software
scope_patterns:
  horizontal: LCR across a sector or an HS-2/HS-4 product group, e.g. operator capex local-component rules
    or retail sourcing conditions (score 1)
  sectoral: LCR on a named product at HS-6/HS-8 level such as smartphones or set-top boxes (0.5 each),
    or on a specific online content service
negative_signals:
- local content or domestic preference applied in public procurement tenders -> 2.3 (Guide pp.20, 75)
- policy objective or institution promoting local content with no binding share -> not scored (workbook
  round1 Malaysia row 83)
- decree cancelling earlier LCRs -> not scored (workbook round2 Lao PDR row 74)
- quota on the volume of imported ICT goods -> 10.2 (Guide p.75)
- requirements on raw materials used to make ICT products -> not scored (Internal Guide p.14)
spec_note: HS-level criteria are written for goods; the workbook applies them loosely to content quotas
  (Australia row 61 = 1, China row 98 = 0.5). Only one 0.5 row in the pool.
