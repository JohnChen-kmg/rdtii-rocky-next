indicator: '11.3'
name: Product screening and testing requirements
tier: B
instrument_version: 2.1.0
keywords:
- testing
- test report
- mandatory testing
- type testing
- local testing
- in-country testing
- designated laboratory
- accredited laboratory
- recognised testing laboratory
- foreign testing laboratories
- sample testing
- security testing
- security review
- national security review
- screening
- inspection and testing
- essential requirements
- acceptance of test results
definition_text: A requirement that ICT products pass screening or technical tests, often justified by
  national security, before sale, import or use. Score 1 where testing must happen in-country or by domestically
  designated or accredited bodies with no outside results accepted; 0.5 where results from third-party
  or foreign accredited labs are accepted, at least for some products; 0 where no such requirement exists.
exemplar_law_types:
- telegraph and telecom rules on mandatory testing and certification of equipment
- standards bureau conformity assessment regulations with in-country lab testing
- national security laws providing security review of network products and services
- regulator decisions recognising foreign test laboratories
- type approval guidelines accepting foreign test reports
scope_patterns:
  horizontal: national security review provisions and standards-law testing regimes covering many products
  sectoral: telecom and radio equipment testing (MTCTE, SDPPI, NBTC Class A/B, IMDA registration)
negative_signals:
- certification or marking scheme (SDoC versus third-party certificate) -> 11.2 (Internal Guide p.15)
- voluntary security manual or framework with no mandated product testing -> not scored (workbook round1
  Australia row 66)
- national security review of foreign investment -> 3.4 (workbook round2 China row 20)
spec_note: Guide p.80 gives two conflicting rules for mixed cases (0.5 vs 1). Workbook scores routine
  RF/EMC type-approval testing here although Guide footnote 48 separates safety tests from security screening.
