definition_text: Asks whether suppliers of radio, telecom and electrical ICT products may certify conformity
  themselves. Score 0 if a supplier's declaration of conformity (SDoC) is accepted from foreign businesses
  for at least some ICT products; 0.5 if SDoC is refused but certificates from foreign conformity assessment
  bodies are accepted (e.g. via ASEAN or APEC MRAs); 1 if neither is accepted and local lab testing is
  required.
exemplar_law_types:
- communications and telecommunications acts with technical standards and type approval regulations
- radio communication regulator notifications on equipment certification and SDoC
- standards and conformity assessment acts
- compulsory product certification provisions and catalogues
- mutual recognition arrangements (ASEAN EE MRA, APEC TEL MRA, SAARC arrangement)
scope_patterns:
  horizontal: standards and conformity assessment acts and regional MRAs covering electrical and electronic
    equipment
  sectoral: telecom and radio equipment type approval and SDoC rules (MCMC, SDPPI, NBTC, TEC)
negative_signals:
- additional or in-country testing procedures -> 11.3 (Internal Guide p.15)
- language or product-information labelling duty -> not scored under 11.2; labelling as an import condition
  is 10.2 (Guide p.75; workbook round2 Indonesia row 146)
- import licence or permit for equipment -> 10.2 (Guide p.75)
- licence to operate telecom networks or services -> 5.5 (Guide p.44)
spec_note: 'ASEAN/APEC MRA members should score 0.5 or less (Internal Guide p.15). Local-entity SDoC rules
  scored inconsistently: Singapore row 72 = 0.5, Thailand row 102 = 0.'
