- economy: LA
  law: Decree on the Management and Use of Internet, and Domain Name of the Lao PDR No.164/Gov 2012
  coverage: Horizontal
  score: 1
  impact: The Decree No. 164/Gov requires internet service providers (ISPs) and website managers/ website
    owners to monitor the information disseminated through their services, i.e., content not allowed for
    dissemination on the Internet (Article 10 such as propaganda, pornography, national secrets, false
    information, etc.). Specifically, the Decree defines the ISP as entity which provides Internet service
    to consumers so that they can use the Internet; and the Website manager as the person who has the
    right to enter the system legally in order to create, edit, improve, and delete the system and the
    content of the website (Article 3).
