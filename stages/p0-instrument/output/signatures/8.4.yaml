indicator: '8.4'
name: Monitoring requirements
tier: B
instrument_version: 2.1.0
keywords:
- monitor
- content moderation
- proactively detect
- prohibited content
- illegal content
- harmful content
- remove or disable access
- take down
- block access
- filter
- word-filter
- pre-review
- real-time monitoring
- inspect the activities
- check content
- within 24 hours
- technology-based measures
- automated tools
- cease transmission
- best efforts to ensure
definition_text: 'A law obliges Internet intermediaries to police user content: monitor users'' activities,
  pre-screen posts, run mandated filters, moderation systems or algorithms that detect prohibited content,
  or remove or block content deemed illegal, including by deadlines after a notice or official direction.
  Any removal or blocking duty scores 1; a monitoring duty with no removal or blocking obligation scores
  0.5; none scores 0.'
exemplar_law_types:
- internet or information management decrees and laws
- online safety codes of practice and online harms acts
- content service conditions and communications content codes
- counter-terrorism laws (content monitoring and deletion)
- intermediary guidelines and electronic system operator regulations
- platform-specific provisions (apps, comment services, generative AI)
scope_patterns:
  horizontal: duties on all ISPs, hosts or website owners (RU 149-FZ, CN NPC Decision 2012, LA Decree
    164/Gov, AU abhorrent violent material offences)
  sectoral: designated social media, comment, app, generative AI or e-commerce services; licensed ISPs
    and content providers under SG broadcasting codes
negative_signals:
- interception, decryption or subscriber-list access for security agencies -> 7.5
- traffic data retention for a set period -> 7.3
- first-originator or real-name identification duty -> 8.3
- knowledge-based liability or safe-harbour takedown condition -> 8.1 or 8.2
- government blocking of commercial websites -> 9.1 (record under 8.4 too if intermediaries must carry
  it out)
spec_note: No score-0.5 row exists in either workbook, so the monitoring-without-removal branch is untested.
