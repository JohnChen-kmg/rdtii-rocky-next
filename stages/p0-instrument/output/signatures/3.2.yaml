indicator: '3.2'
name: Joint venture requirements
tier: B
instrument_version: 2.1.0
keywords:
- joint venture
- joint-venture company
- joint venture with a local
- form a joint venture
- local partner
- domestic partner
- in partnership with
- partnership between
- consortium
- consist of at least two
- jointly established
