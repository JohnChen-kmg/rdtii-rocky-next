  law: Communications and Multimedia Act (Act 588) 1998; Malaysian Communications and Multimedia Commission
    Licensing Guidebook 2023
  coverage: Network Facilities Provider (NFP), Network Service Provider (NSP)
  score: 1
  impact: Malaysia applies strict licensing schemes in certain areas, such as Network Facilities Providers
    (NFP) and Network Service Providers (NSP), where foreign equity is capped at 70%. Additionally, there
    may be minimum capital requirements and mandatory performance criteria for providers seeking these
    licenses. For Application Service Providers (ASP), which do not own underlying transmission infrastructure,
    Malaysia allows 100% foreign equity participation and applies no strict licensing requirements, making
    this a more liberalized category in the telecom sector.
