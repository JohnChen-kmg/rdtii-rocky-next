definition_text: Conditions attached to licences to supply telecommunication services or operate telecom
  facilities, basic or value-added. Scores 1 when conditions discriminate against foreign firms or create
  significant entry barriers for all providers, such as minimum capital, mandatory performance requirements,
  caps on the number of licences, separate value-added licences or revenue sharing on top of fees; otherwise
  0.
exemplar_law_types:
- telecommunications acts and telecommunications business acts
- administrative measures on telecom business licensing
- regulator licensing guidebooks and notifications
- unified licence agreements
- satellite licensing notifications
- general laws on licensing of activities
scope_patterns:
  horizontal: general licensing-of-activities laws that list communication services among licensed activities
  sectoral: telecom operator, facilities, value-added and satellite licences issued by the telecom regulator
    or ministry
negative_signals:
- licences for ISPs, ICPs, cloud, VPN or other digital service providers -> 9.4
- broadcasting licences -> 9.4
- e-commerce platform licences -> 12.3
- telecom equipment certification or type approval -> 11.2
- standalone foreign equity cap on operators -> 5.2
