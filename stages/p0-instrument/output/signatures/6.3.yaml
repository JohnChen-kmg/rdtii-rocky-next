indicator: '6.3'
name: Infrastructure requirements
tier: A
instrument_version: 2.1.0
keywords:
- data centre
- data center
- local server
- server located
- servers within
- physically located
- establish a data
- local infrastructure
- computing facilities
- hosted in
- store in servers
- maintain at least one local server
- contingency data processing centre
definition_text: A law mandates establishing or using dedicated local physical infrastructure — a data
  centre or in-country server — as a precondition for providing services using data. Unlike a storage
  rule (which can be satisfied by renting existing facilities), this obliges the provider to set up or
  use local infrastructure.
exemplar_law_types:
- platform-sector measures (ride-hailing, online publishing, maps)
- personal-data laws with database-location provisions (RU 152-FZ)
- financial-regulator rules (data centre in-country)
- ministerial/technical orders on server location
scope_patterns:
  horizontal: rare — usually a general database-location provision in the DP law
  sectoral: ride-hailing, maps, online publishing, banking/finance, sensitive-data servers
negative_signals:
- licensing/registration to build or operate data centres -> indicator 9.4, out of scope
- operational/technical rules on existing data centres (security, privacy) -> not scored
- copy-in-country rules satisfiable by renting -> 6.2
- measures on government data are not scored
