indicator: '10.1'
name: Import ban applied to ICT goods and online services (e.g. network equipment, servers, handsets,
  applications, and data processing)
tier: B
instrument_version: 2.1.0
keywords:
- import ban
- prohibited imports
- prohibition of imports
- importation is prohibited
- absolutely prohibited
- shall not be imported
- prohibited from import
- prohibited goods
- list of prohibited items
- schedule of prohibited goods
- suspension of importation
- temporary suspension
- embargo
- banned apps
- ban on mobile applications
- prohibited telecommunication equipment
- jamming devices
definition_text: A measure that flatly prohibits bringing ICT goods into the economy (network equipment,
  servers, handsets, receivers, storage media) or bars named online services and applications, whether
  the ban targets ICT products alone or is a general prohibited-goods list that includes them. One ban
  on a single product weighs less than a ban on several products or several bans.
exemplar_law_types:
- customs prohibition-of-imports orders and prohibited-goods schedules
- telecommunications acts and dealer regulations listing prohibited equipment
- import-export of goods acts and ministerial prohibition notifications
- IT acts and blocking rules used to ban named mobile applications
- customs-union non-tariff measure decisions (e.g. EAEU prohibited-goods list)
- regulator notifications suspending imports of a specific device
scope_patterns:
  horizontal: general customs prohibition lists or import-export acts whose schedules include ICT items
    (MY, RU, TH rows)
  sectoral: telecom-act schedules of prohibited equipment (SG), named-app bans (IN), single-device import
    suspensions such as satellite receivers (LA)
negative_signals:
- import barred unless a permit or licence is obtained -> 10.2 (workbook round2 Lao PDR row 65)
- ban limited to government entities or government devices -> 2.1 (Internal Guide p.11; workbook round1
  Australia row 5)
- bans on e-waste, used ICT products or raw materials such as rare earths -> not scored (Internal Guide
  pp.7, 14)
- blocking or filtering of websites and web content -> 9.1 (Guide p.69)
- domestic-content threshold that a banned product failed to meet -> 10.3 (Guide pp.75-76)
spec_note: Row scores are per measure. Only one 0.5 row in the pool (Lao PDR row 66). E-waste, counterfeit
  and obscene-media bans were scored 0 in the workbooks.
