indicator: '4.5'
name: Lack of copyright framework and exceptions
tier: C
instrument_version: 2.1.0
keywords:
- fair use
- fair dealing
- exceptions to copyright
- limitations on copyright
- permitted use
- free use
- acts not constituting infringement
- not an infringement of copyright
- research or private study
- criticism or review
- reporting of current events
- parody or satire
- quotation
- teaching purposes
- normal exploitation of the work
- unreasonably prejudice the legitimate interests
- non-commercial purposes
- copyright act
definition_text: 'Whether a copyright law exists and what exceptions it adopts. A flexible fair use test
  or a fair dealing regime (listed purposes plus a fairness requirement) scores 0. Exceptions limited
  to a three-step test or a closed list of permitted uses score 0.5. No copyright law, or no exceptions
  at all, scores 1. Inverted polarity: a clear exception regime lowers the score.'
exemplar_law_types:
- copyright acts
- civil code copyright chapters
- general intellectual property laws
- copyright amendment acts (fair dealing and accessibility exceptions)
scope_patterns:
  horizontal: copyright statutes and their exception chapters apply to all works and sectors
  sectoral: exceptions for specific users or works (libraries, education, print-disabled persons) inside
    the same statute
negative_signals:
- infringement remedies, injunctions, notice-and-takedown or blocking of pirate sites -> 4.6
- safe harbour protecting intermediaries from liability for user infringement -> 8.1
- exceptions to patent rights (TRIPS Art.30) -> 4.3
- accession to the WIPO Copyright Treaty or WPPT -> not scored (4.7 and 4.8 are non-regulatory)
- piracy-rate statistics or trade watch-list reports -> not scored (not legislation; see notes)
spec_note: 'TRAP: inverted polarity. Guide p.33 puts closed-list exceptions at 0.5, but several civil-law
  rows with that structure are scored 0 (see notes). No score-1 row.

  '
