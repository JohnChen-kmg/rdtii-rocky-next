indicator: '10.4'
name: Export restrictions on ICT goods and online services
tier: B
instrument_version: 2.1.0
keywords:
- export licence
- export license
- export permit
- export control
- prohibited exports
- prohibition of exports
- export ban
- temporary export ban
- strategic items
- strategic goods
- dual-use items
- dual-use goods
- controlled goods
- export authorisation
- restricted from export
- defence and strategic goods list
- permission to export
- technology export
definition_text: 'A measure that bans or limits exporting ICT goods or related technologies and services:
  export prohibitions, temporary export bans, export licences or permits, dual-use and strategic-goods
  controls covering computers, telecom or information-security products, and catalogues of technologies
  restricted from export. One such measure on products in the WTO ITA lists is enough.'
exemplar_law_types:
- strategic trade and export control acts with dual-use lists (computers, telecom, information security)
- customs prohibited-exports regulations and orders
- catalogues of technologies prohibited or restricted from export
- radio communication and satellite decrees requiring export licences for equipment
- government resolutions imposing temporary export bans
- customs-union non-tariff measure decisions (e.g. EAEU permits)
scope_patterns:
  horizontal: general export control or prohibited-exports regimes whose lists include ICT items (AU DSGL,
    CN dual-use catalogue, IN SCOMET, RU temporary export ban)
  sectoral: export licences or permissions for radio or satellite communication equipment (LA, TH) and
    encryption devices
negative_signals:
- export bans or duties on raw materials such as nickel ore or rare earths -> not scored (Internal Guide
  p.14; workbook round2 Indonesia row 140)
- export duties and taxes -> outside pillar 10 (Guide p.74)
- enabling power to list goods with no ICT item actually listed -> not scored (workbook round2 Thailand
  row 93)
- import-side licence under the same instrument -> 10.2 (workbook round2 Russian Federation row 81)
- export controls on e-waste or used ICT products -> not scored (Internal Guide p.7)
spec_note: Binary. Singapore row 69 (strategic goods export licensing scored 0) conflicts with Guide p.76
  examples; Thailand row 94 mirrors a Guide example but carries a reviewer note 'Not correct'.
