- economy: CN
  law: Patent Law of the People's Republic of China《中华人民共和国专利法》
  coverage: Horizontal
  score: 1
  impact: Article 18 of the amended Chinese Patent Law establishes that non-resident foreigners or organizations
    without business establishments in China shall entrust the patent agency established by law to handle
    patent applications or other patent-related matters in China. Article 19 provides that any entity
    or individual intending to file a patent application in a foreign country for an invention or utility
    model completed in China shall submit a request for confidential examination to the patent administration
    department under the State Council in advance.
