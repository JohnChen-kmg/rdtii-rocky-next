  impact: To file patents, the Ministerial Regulation states that if the patent applicant does not reside
    in Thailand, the applicant shall authorize an agent or patent attorney registered with the Director-General
    of the Department of Intellectual Property to act on his behalf (Clause 13). The Power of Attorney
    (POA) shall be attached with the revenue stamp of 30 Thai Baht (around 1 USD) for each patent agent/patent
    attorney/application. The POA document if not in a foreign language is required to translate to the
    Thai language. The translation should be certified by the translator and agent to be accurate translation
    (Clause 15).
