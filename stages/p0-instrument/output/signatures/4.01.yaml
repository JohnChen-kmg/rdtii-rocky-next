- economy: MY
  law: Patents Act (Act 291) 1983; Patents (Amendment) Act (Act A1649) 2022
  coverage: Horizontal
  score: 1
  impact: There are differential treatment relevant to patent applications in Malaysia. According to the
    Patents Act (Act 291) 1983, patent applicants who are not residents of Malaysia are explicitly required
    to appoint a local patent agent to act on their behalf. This is stipulated under the requirement for
    patent agents in Section 86(5), where non-residents must appoint local representatives to file and
    manage their applications. Section 29A legal language stresses the need for all patent applications
    to comply with procedural and substantive examination requirements.
  url: http://www.myipo.gov.my/wp-content/uploads/2016/09/PATENT-ACT-1983-ACT-291.pdf
  teaching_note: 'Score-1: non-residents must appoint a local patent agent; the rule that residents file
    domestically first is only a 0.5-type procedural burden.'
