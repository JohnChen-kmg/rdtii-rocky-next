indicator: '7.3'
name: Minimum period of data retention requirements
tier: A
instrument_version: 2.1.0
keywords:
- retain for
- retained for
- kept for
- preserve for
- maintain records for
- not less than
- at least
- minimum period
- for a period of
- years from
- months from
- retention period
- keep records
- log retention
- call detail record
- subscriber records
definition_text: A requirement that data be retained for AT LEAST a specified minimum period (days, months,
  years — or permanently), typically so authorities can access it for investigations. About DURATION,
  not location. Requirements to not keep data longer than necessary are maximum-period rules and are NOT
  scored.
exemplar_law_types:
- telecom/interception acts and licences (12-24 month data retention)
- tax and companies acts (5-7 year record keeping)
- employment acts
- AML/KYC and financial regulations
- e-commerce transaction rules
- cyber-café / intermediary rules
scope_patterns:
  horizontal: rare — general record-keeping mandates
  sectoral: telecom, tax, accounting, employment, banking/AML — the usual carriers
negative_signals:
- '''not longer than necessary'' / ''as long as necessary'' retention-limitation principles -> score 0
  (maximum-period rule)'
- permissive 'may be retained for N years' without obligation -> 0
- where the copy must be located -> 6.2
- retention requirements on government data are not scored
