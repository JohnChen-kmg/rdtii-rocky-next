definition_text: 'Whether the economy has a comprehensive data-protection legal framework: a horizontal
  law applying across sectors with detailed provisions on data subjects'' rights and obligations (access,
  rectification, erasure, portability) covering collection, processing and cross-border transfer of personal
  data. INVERTED: a comprehensive law scores 0; sectoral-only 0.5; none 1.'
exemplar_law_types:
- omnibus data-protection statutes (PDPA, Privacy Act, PIPL, DPDP)
- sectoral data-protection codes (banking, communications, health) — recorded as complements
scope_patterns:
  horizontal: the omnibus act itself -> controlling evidence, score 0
  sectoral: sector codes/rules exist but no omnibus law -> 0.5
negative_signals:
- 'INVERTED POLARITY: finding a strong comprehensive law means score 0, never 1'
- sectoral complements are recorded but do not change the indicator score when a horizontal law exists
- constitutional privacy rights alone are not a framework
spec_note: No score-1 exemplar exists in the Round 1/Round 2 economies (all have some framework). Score
  1 = documented absence of any DP legal framework.
