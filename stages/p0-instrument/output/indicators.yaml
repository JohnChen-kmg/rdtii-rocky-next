  - id: "9.4"
    pillar: 9
    tier: B
    review_status: draft 2026-09-13 (Claude), pending human review
    name: Licensing requirements for online content providers and applications (social media platforms,
      news providers, VPN, cloud services, etc.)
    category_official: Licensing requirements for online content providers and applications (social media
      platforms, new providers, VPN, cloud servics, etc.)
    question: Must an online content provider or digital application (social media, news or broadcast service,
      VPN, cloud or data-centre service) hold a licence to operate, and is that licence strict?
    definition: 'A licensing scheme applicable to online service providers, meaning Internet content providers
      and applications such as social media platforms, news providers (media and broadcast services), VPNs
      and cloud services (Guide p.71). It excludes telecommunication facilities and service providers, covered
      by Pillar 5, and e-commerce platforms, covered by Pillar 12 (Guide p.71). A scheme is strict when
      licence conditions significantly limit market access or competition beyond normal regulatory standards,
      such as commercial presence, nationality or residency, excessively high minimum paid-up capital, or
      mandated government-approved systems, local data storage or proprietary technology (Guide p.72).

      '
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - Strictness of the licence conditions (Guide p.72).
    - Number of licensing schemes the economy imposes on online content providers and applications (Guide
      p.72).
    scoring_tree:
    - if: At least one strict licensing scheme, or more than one licensing scheme in this category even
        if none is individually strict (Guide p.72; Methodology sheet 9.4).
      score: 1
    - if: Exactly one licensing scheme for online content providers or applications, with no strict conditions
        (Guide p.72; Methodology sheet 9.4).
      score: 0.5
    - else:
        score: 0
        meaning: No licensing requirement for online content providers or applications (Guide p.72; Methodology
          sheet 9.4).
    coding_rules:
    - Scope includes licences for digital service providers such as ISPs and ICPs (Internal Guide p.12),
      broadcasting licences, and licences for digital services and applications such as cloud computing
      and data centres (Internal Guide p.14).
    - Judge strictness from the licence conditions, not the licence name; the Guide's strict examples are
      an IoT licence tied to a local numbering or addressing system, a broadcasting licence closed to foreigners,
      and social network licences limited to locally established companies (Guide p.72).
    - The more-than-one-scheme escalation is an economy-level rule (Guide p.72), yet Round 2 rows still
      score each non-strict scheme 0.5 when an economy has several (workbook round2 China rows 89 and 91;
      workbook round2 Russian Federation rows 77 and 78).
    - A duty only to register or to give prior notification was recorded but scored 0 as not a licence (workbook
      round2 Thailand row 87; workbook round2 Indonesia row 123).
    - A law requiring licences for digital platforms that span online marketplaces, car sharing and social
      media is recorded under both 9.4 and 12.3 (Guide p.11).
    - Record the licence here and its component conditions under their own indicators as well, for example
      an in-country server condition under 6.3 (Guide p.11; workbook round2 China rows 49 and 88).
    exceptions:
    - Do not cover licences for telecommunication facilities and service providers; they are captured under
      Pillar 5 (Indicator Reference note; Guide p.71).
    - Do not cover licences for e-commerce platforms; they are captured under Pillar 12 (Indicator Reference
      note; Guide p.71).
    disambiguation:
    - 'TRAP: a telecom operator licence (network facilities, network services, basic or value-added telecom
      operation) is 5.5, while a licence for digital service providers such as ISPs and ICPs is 9.4; classify
      by licence type (Internal Guide p.12; workbook round2 India rows 54 and 122).'
    - 'TRAP: an e-commerce business or marketplace licence is 12.3; a platform licence that also reaches
      social media or other applications is recorded under both 12.3 and 9.4 (Guide p.11; Guide p.85).'
    - 'TRAP: data-centre licensing or registration is not 6.3 but may be 9.4, whereas a licence condition
      to keep servers in-country is also recorded under 6.3 and makes the licence strict (Internal Guide
      p.13; Guide p.72; workbook round2 China rows 49 and 88).'
    - 'TRAP: broadcasting licences are 9.4, not 5.5, because Pillar 5 does not cover broadcasting services
      (Internal Guide p.14; Guide p.40).'
    - A standalone duty to establish a local office or entity is 3.5 and one to appoint a local representative
      is 12.8; a commercial presence condition inside a licence also makes the 9.4 scheme strict (Guide
      pp.27-28; Guide pp.87-88; Guide p.72).
    - Blocking a service that operates without a required registration or licence is 9.1, not 9.4 (workbook
      round2 Indonesia rows 107 and 122).
    guide_examples:
    - 'Indonesia: Internet of Things service providers must obtain a licence or partner with a licensed
      telecom operator, and must implement a unique addressing system such as a local MSISDN, device end-user
      ID or IP number (strict) (Guide p.72).'
    - 'Pakistan: a broadcasting media and distribution licence is barred to persons who are neither citizens
      nor residents, foreign companies, foreign-controlled companies and anyone funded by a foreign Government
      or organisation (strict) (Guide p.72).'
    - 'Viet Nam: aggregate sites and social networks must be operated by companies legally established in
      Viet Nam that meet technical and operational standards in order to register for a licence (strict)
      (Guide p.72).'
    sources:
      guide_pages:
      - 71
      - 72
