      - 19
      - 20
      guide_heading: Specific requirements on source code, encryption and trade secrets

  - id: "2.3"
    pillar: 2
    tier: B
    review_status: draft 2026-09-13 (Claude), pending human review
    name: Limitations in procurement bidding
    category_official: Limitations in procurement bidding
    question: Does a procurement measure limit bidding through quotas, supplier preferences or price preferences,
      and does it discriminate against foreign bidders or apply to all bidders alike?
    definition: 'Limitations restrict participation in public procurement through a quota, a preference
      for certain suppliers or a price preference, triggered by the nationality of suppliers, another status
      such as being an SME or indigenous, or the local content of supplies (Guide p.20). A measure is first
      distinguished from a 2.1 exclusion and then classed as discriminatory against foreign suppliers or
      equally applied to all suppliers (Guide p.20).

      '
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features: []
    scoring_tree:
    - if: 'At least one limitation discriminates directly against foreign bidders, for example a quota,
        preference or price margin that depends on the bidder''s nationality; or two or more limitations
        of the 0.5 kind apply (Guide p.20; Methodology sheet 2.3).

        '
      score: 1
    - if: 'One limitation applies to all bidders, domestic or foreign, such as a local content requirement
        or a performance-based condition (Guide p.20; Methodology sheet 2.3).

        '
      score: 0.5
    - else:
        score: 0
        meaning: No limitation, or only a legal basis that empowers the government to impose limitations
          (Guide p.20; Methodology sheet 2.3).
    coding_rules:
    - 'Apply the two steps in order: first rule out an exclusion under 2.1, then decide whether the limitation
      targets foreign suppliers or applies equally to all suppliers (Guide p.20).'
    - 'Count limitations across the economy''s measures: two or more equal-treatment limitations together
      score 1 (Guide p.20; Methodology sheet 2.3).'
    - Set-asides triggered by status, such as SME or indigenous business targets, are limitations; the round1
      workbook scores such a scheme 0.5 as one measure when nationality is not a condition (Guide p.20;
      workbook round1 Australia row 9).
    - The Guide also gives 1 where institutional transparency is absent, meaning procurement laws, rules,
      guidelines and bidding procedures are not publicly and easily available; the methodology criteria
      omit this trigger, so state the evidence explicitly (Guide p.20; Guide p.12; Methodology sheet 2.3).
    exceptions:
    - Setting or changing a target price is a normal government process and is not scored, unless it treats
      domestic and foreign applicants differently, e.g. a lower price for domestic applicants (Internal
      Guide p.11).
    - A provision that only empowers the government to impose limitations is not itself a limitation (Guide
      p.20; Methodology sheet 2.3).
    disambiguation:
    - 'TRAP: when foreign bidders are barred, or admitted only if no domestic supplier is available, the
      measure is an exclusion under 2.1, not a 2.3 limitation (Guide p.19; Guide p.20; Internal Guide p.11).'
    - 'TRAP: local content requirements in the commercial market are 10.3; local content conditions in public
      procurement tenders stay in Pillar 2 (Guide p.75).'
    - 'TRAP: a preference in a procurement order is scored here even when the same order is also recorded
      under 2.1; the workbook scores India''s cyber security product preference 2.3 = 1 and 2.1 = 0 (workbook
      round2 India row 18; workbook round2 India row 11).'
    - Conditions to surrender source code, trade secrets or patents, or to use a specific encryption standard,
      to win tenders are 2.2 (Guide pp.19-20).
    guide_examples:
    - 'Argentina: at least 33% of the goods and services used in public-private partnership contracts must
      come from local companies (Guide p.20).'
    - 'Azerbaijan: procurement discount of up to 20% in favour of locally produced goods (Guide p.20).'
    - 'India: 25% of the annual procurement quota reserved for micro and small enterprises, including 3%
      for women-owned firms (Guide p.20).'
    - 'Indonesia: minimum 40% domestic content for transmission towers and steel-reinforced conductors in
      public procurement (Guide p.20).'
    - 'Rwanda: 15% preference for locally produced goods and 10% for bidders registered in Rwanda (Guide
      p.20).'
    - 'Sri Lanka: 20% domestic preference margin for government-funded purchases of manufactured goods that
      pass a 30% local value-added test and other eligibility criteria (Guide p.20).'
    sources:
      guide_pages:
      - 12
      - 19
      - 20
      - 75
      methodology_row_round1_db: 7
      faq_pages:
      - 11
      template_row: 9

