# ----------------------------------------------------------------------------
# PILLAR 2 — PUBLIC PROCUREMENT
# ----------------------------------------------------------------------------

  - id: "2.1"
    pillar: 2
    tier: B
    review_status: draft 2026-09-13 (Claude), pending human review
    name: Foreign exclusions from public procurement related to ICT goods and digital services
    category_official: Foreign exclusions from public procurement related to ICT goods and digital services
    question: Does a legislative measure bar foreign firms, or a specific group of foreign firms, from public
      procurement of ICT goods or digital services?
    definition: 'An exclusion exists when foreign enterprises may not take part in public procurement of
      certain ICT goods and online services, or when a list of specific economies, groups or companies is
      banned from public tenders (Guide p.19). Rules that let foreign enterprises bid only when domestic
      suppliers are not participating or not available are also forms of exclusion (Guide p.19; Internal
      Guide p.11).

      '
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features: []
    scoring_tree:
    - if: 'A legislative measure excludes foreign firms, or foreign goods and services, from public procurement,
        including rules that admit them only when domestic suppliers cannot meet the demand; or two or more
        measures each exclude a specific (group of) foreign firm(s) (Guide p.19; Internal Guide p.11; Methodology
        sheet 2.1).

        '
      score: 1
    - if: 'A single measure excludes a specific foreign firm, group of firms or the firms of specific economies,
        such as a ban on a listed set of foreign messenger services (Guide p.19; Methodology sheet 2.1;
        workbook round2 Russian Federation row 6).

        '
      score: 0.5
    - else:
        score: 0
        meaning: No exclusion, or only a legal basis that empowers the government to exclude foreign firms
          (Guide p.19; Methodology sheet 2.1).
    coding_rules:
    - 'Combine measures at economy level: two or more exclusions of specific firms or groups, each worth
      0.5, raise the indicator to 1 (Guide p.19; Methodology sheet 2.1).'
    - A rule that shuts out all foreign companies whenever national suppliers can meet demand scores 1,
      not 0.5, because it is not limited to specific companies (Internal Guide p.11).
    - An enabling clause that lets the government adopt bans scores 0 until an implementing exclusion is
      found; record and score the implementing instrument (Guide p.19; Methodology sheet 2.1).
    - Where no exclusion exists, cite the public procurement act or other governing procurement rules as
      the reference row with score 0 (Guide p.12).
    exceptions:
    - Exclusions confined to non-digital procurement, such as nationality rules for construction design
      and supervision work, are not scored (Guide p.18; workbook round2 Thailand row 5).
    - Procurement reservations in a trade agreement schedule are preferential commitments, not domestic
      measures, and are not scored (Internal Guide p.8; Hands-on workshop deck p.17).
    disambiguation:
    - 'TRAP: quotas, set-asides, price preferences and local-content conditions are limitations under 2.3
      even when they disadvantage foreign bidders; decide limitation versus exclusion before scoring (Guide
      p.20).'
    - 'TRAP: a ban on government bodies using a named foreign application or product can be a procurement
      restriction (2.1) or an import ban (10.1); check which applies, and list the measure under each indicator
      that fits (Internal Guide p.11).'
    - 'TRAP: a procurement preference is not an exclusion even when it favours national firms; the workbook
      scores India''s cyber security product preference 2.1 = 0 and 2.3 = 1 (workbook round2 India row 11;
      workbook round2 India row 18).'
    - Preferences reserved for a status group such as Bumiputera, SME or indigenous suppliers also disadvantage
      domestic firms outside the group; treat them as 2.3 limitations, not 2.1 exclusions (Guide p.20; Hands-on
      workshop deck p.17).
    - Conditions to hand over source code or trade secrets, or to use a specific encryption standard, in
      order to win tenders are 2.2 (Guide pp.19-20).
    guide_examples:
    - 'Russian Federation: ban on the use of foreign messenger services in public procurement (Guide p.19).'
    - 'Nigeria: government entities must buy hardware locally and procure software from local developers
      (Guide p.19).'
    - 'Nepal: foreign suppliers are accepted only when competitive prices are not available from more than
      one local supplier, no national bids are submitted, or the goods are certified as complex or specialised
      (Guide p.19).'
    - 'Bolivia: national purchases up to about US$ 1,166,000 are reserved to national production companies,
      with foreign companies allowed only if no national provider is available (Guide p.19).'
    - 'Thailand: foreign consultants must team up with domestic consultants to take part in public tenders
      (Guide p.19).'
    sources:
      guide_pages:
      - 12
      - 18
      - 19
      - 20
      methodology_row_round1_db: 5
      faq_pages:
      - 11
      template_row: 7

  - id: "2.2"
    pillar: 2
    tier: C
    review_status: extracted by script from host sheets on 2026-09-13; not reviewed
    name: Specific requirements on source codes, encryption and trade secrets
    category_official: Specific requirements on source codes, encryption and trade secrets
    question: 'The indicator asks: (a) whether firms are required to surrender source code, encryption or
      other trade secrets, or to transfer ownership of exclusive rights to use IP such as patented technology,
      as a condition for successful public procurement and (b) whether firms are required to use a specific
      encryption standard to be successful for their bidding. (Guide p.19)'
    definition: 'The indicator asks: (a) whether firms are required to surrender source code, encryption
      or other trade secrets, or to transfer ownership of exclusive rights to use IP such as patented technology,
      as a condition for successful public procurement and (b) whether firms are required to use a specific
      encryption standard to be successful for their bidding. (Guide p.19)'
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_tree:
    - if: For any requirement to surrender patents, source codes or trade secrets as a condition for participating
        in tenders (Methodology sheet 2.2)
      score: 1
    - if: For any requirement to use specific encryption to win tenders (Methodology sheet 2.2)
      score: 0.5
    - else:
        score: 0
