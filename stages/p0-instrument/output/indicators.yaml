  - id: "3.5"
    pillar: 3
    tier: B
    review_status: draft 2026-09-13 (Claude), pending human review
    name: Commercial presence requirements to offer cross-border services in sectors relevant to digital
      trade
    category_official: Commercial presence requirements to offer cross-border services in sectors relevant
      to digital trade
    question: Must a foreign service provider establish a local branch, subsidiary, company or office in
      the economy in order to supply services in a sector relevant to digital trade?
    definition: 'A commercial presence requirement obliges foreign service providers to supply services
      through a locally established office, branch, subsidiary or representative office, which corresponds
      to Mode 3 under the WTO GATS, in sectors relevant to digital trade (Guide p.27). Requirements limited
      to business registration, with no physical or operational presence, are not covered (Guide p.27).

      '
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: 'At least one measure requires foreign providers to set up a local branch, subsidiary, locally
        incorporated company or other physical or operational office as a condition for supplying services
        in a sector relevant to digital trade (Guide pp.27-28; Methodology sheet 3.5).

        '
      score: 1
    - else:
        score: 0
        meaning: No commercial presence requirement; registration-only rules and local contact-point duties
          do not count (Guide p.27; Guide p.88).
    coding_rules:
    - 'Horizontal company-law rules count: a foreign company that must incorporate a local company or register
      a branch before carrying on business meets the test (Guide p.27).'
    - 'Sector rules count too: licences reserved for locally established companies in telecom, satellite
      or online gaming services are commercial presence requirements (Guide pp.27-28).'
    - Commercial presence conditions in telecommunications rules are recorded under 3.5; the telecom pillar
      keeps the telecom-specific foreign ownership limits (5.2) (Guide p.11).
    - A presence duty that applies only above a size threshold, such as a user count for social media companies,
      still counts (Guide p.27).
    - When one law requires both a local entity and a local representative, classify it as a commercial
      presence requirement (Guide p.88).
    - A registered office that must be open to the public or staffed during set hours is a physical presence;
      the workbook scores such rules 1 (workbook round1 Australia row 16; workbook round1 Singapore row
      14).
    exceptions:
    - Business registration requirements that involve no physical or operational presence are not scored
      (Guide p.27).
    disambiguation:
    - 'TRAP: a duty to appoint a local agent, legal representative, contact point or post-box while serving
      remotely is a local presence requirement under 12.8; a duty to establish a branch, subsidiary or company
      is 3.5 (Guide pp.87-88).'
    - 'TRAP: corporate-law registered office rules are not 12.8 local presence requirements; the workbook
      records the same Singapore Companies Act provision as 3.5 = 1 and 12.8 = 0 (Guide pp.87-88; workbook
      round1 Singapore row 14; workbook round1 Singapore row 92).'
    - 'TRAP: a licensing scheme for online services whose conditions include a legally established local
      company is a licence under 9.4, while the establishment condition is also recorded under 3.5 (Guide
      p.72; Guide p.11; workbook round2 China row 21; workbook round2 China row 89).'
    - Both the 3.5 and 12.8 sections mention representative offices; decide by whether the law requires
      establishing a local entity or office to supply services (3.5) or only administrative representation
      for remote supply (12.8) (Guide p.27; Guide pp.87-88).
    - Commercial presence requirements aimed at delivery service providers are recorded in Pillar 3, not
      under online purchase and delivery limitations in 12.2 (Guide p.84).
    guide_examples:
    - 'Colombia: foreign companies must set up a branch to engage in permanent business, such as opening
      business offices or acting as contractors for works or services (Guide p.27).'
    - 'Lao PDR: satellite communication businesses must establish a registered business with a local office
      (Guide p.27).'
    - 'Malaysia: a foreign company carrying out business in Malaysia must incorporate a local company or
      register a branch (Guide p.27).'
    - 'Pakistan: significant social media companies, with over 500,000 users or listed by the Authority,
      must establish a permanent registered office in the country (Guide p.27).'
    - 'Kyrgyzstan: telecom licence applicants must establish a local presence by filing legal registration
      documents, taxpayer identification and other local documents (Guide p.28).'
    - 'Viet Nam: providers of specific online gaming services to local users must establish a company in
      Viet Nam to obtain a licence (Guide p.28).'
