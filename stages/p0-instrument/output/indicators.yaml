  - id: "6.1"
    pillar: 6
    tier: A
    review_status: "Round 1 codebook (2026-07-12); migrated 2026-09-13"
    name: "Ban and local processing requirements"
    category_official: "Ban and local processing requirements"   # methodology sheet row 30
    weight: 0.38                     # informational — pillar-internal weight (Guide p.55)
    question: "Does a law prohibit cross-border data transfer outright, or require that certain data be processed domestically?"
    definition: >
      'Ban on data transfers' prohibits, per se, cross-border transfer of
      data. 'Local processing requirement' mandates that businesses process
      certain data domestically (processing = collection, organization,
      structuring, storage, adaptation, use, disclosure, dissemination). Both
      are classified under this single indicator because their business costs
      are similar. (Guide p.50)
    scoring: {values: [1, 0.5, 0], type: ordinal}
    scoring_features:
      - "type of data: personal scores higher than non-personal (Guide p.50)"
      - "scope: horizontal (all sectors) scores higher than sectoral / specific data types (Guide p.50)"
      - "number of economies: a ban toward more economies scores higher than a ban toward one economy (Guide p.50)"
    scoring_tree:
      - if: >
          A ban and/or local processing requirement covers personal data
          generally or applies horizontally across all sectors — OR there is
          MORE THAN ONE measure of category (2) (multiple sector-/data-limited
          or single-country measures escalate to 1). (Guide p.50; Methodology sheet 6.1)
        score: 1
      - if: >
          ONE ban and/or local processing requirement applied to a specific
          sector, a specific set of data, or non-personal data only — or
          transfer is prohibited to one country only. (Guide p.50; Methodology sheet 6.1)
        score: 0.5
      - else: {score: 0, meaning: "Data may be transferred freely; no ban or local-processing requirement. (Guide p.50)"}
    coding_rules:
      - "Applies to measures potentially affecting COMMERCIAL transactions by private organisations. (Guide p.50)"
      - >
        A sectoral measure on personal data (e.g. health records only) is
        category (2) → 0.5, not 1 — 'personal data' in category (1) means
        personal data generally/horizontally. Escalate to 1 only via the
        more-than-one-measure rule. (workbook round1 Australia row 34: My Health Records = 0.5)
      - >
        DUAL-RECORDING RULE: where one law imposes BOTH local processing and
        local storage, record the measure under BOTH 6.1 and 6.2. (Guide p.51, Australia example)
      - "Local processing subsumes storage in practice, but is recorded here; a storage-only rule is 6.2. (Guide p.51)"
    exceptions:
      - "Do NOT score data-localization measures applied to GOVERNMENT data (applies to all of 6.1-6.4). (Indicator Reference note; Guide p.50)"
    disambiguation:
      - >
        TRAP (the #1 mis-mapping): a law that prohibits transfer BUT allows it
        when conditions are fulfilled (consent, adequacy, contract, approval)
        is a CONDITIONAL FLOW REGIME → 6.4, NOT a ban. Only a COMPLETE
        prohibition (or a mandate to process locally) is 6.1. 'Must not transfer
        UNLESS [condition]' is 6.4. (Internal Guide p.13; Indicator Reference row 84; Extraction slides pp.33, 56)
      - >
        TRAP: banking/professional CONFIDENTIALITY or secrecy rules (e.g.
        Singapore Banking Act s.47 customer-information secrecy) are not, by
        themselves, cross-border transfer bans. Check whether the provision
        regulates the MOVEMENT of data across borders, not merely disclosure.
        (Canvas deck pp.10-11; workbook round1 Singapore row 39)
      - "A requirement to keep a COPY domestically while transfer remains allowed → 6.2. (Guide p.50)"
      - "A requirement to establish/use a local data centre or server as a service precondition → 6.3. (Guide p.51)"
    guide_examples:
      - "Australia: health records containing personal/identifying information must be stored and processed locally (sectoral → also recorded under 6.2). (Guide p.50)"
      - "Republic of Korea: financial service providers using cloud services must locally process credit and unique identification information. (Guide p.50)"
      - "Thailand: credit information companies / information controllers / processors operating in Thailand must control or process information locally. (Guide p.50)"

  - id: "6.2"
    pillar: 6
    tier: A
    review_status: "Round 1 codebook (2026-07-12); migrated 2026-09-13"
    name: "Local storage requirements"
    category_official: "Local storage requirements"               # methodology sheet row 31
    weight: 0.12
    question: "Must a COPY of certain data be stored domestically, while transfer abroad may still be permitted?"
    definition: >
      A 'local storage requirement' mandates that a copy of certain data be
      kept within the economy. Businesses can transfer the data across borders
      as long as a copy remains domestically. Less demanding than local
      processing: a processing mandate typically necessitates local storage,
      but a storage mandate does not imply local processing. (Guide pp.50-51)
    scoring: {values: [1, 0.5, 0], type: ordinal}
    scoring_features:
      - "type of data: personal scores higher than non-personal (Guide p.51)"
      - "scope: horizontal scores higher than sectoral / specific data types (Guide p.51)"
    scoring_tree:
      - if: >
          A local storage requirement covers personal data generally or
          applies horizontally across all sectors — OR there are TWO OR MORE
          local storage requirements applied to non-personal data or specific
          sets of data (multiple category-(2) measures escalate to 1). (Guide p.51; Methodology sheet 6.2)
        score: 1
      - if: "ONE local storage requirement applied to a specific sector, a specific set of data, or non-personal data only. (Guide p.51; Methodology sheet 6.2)"
        score: 0.5
      - else: {score: 0, meaning: "Data may be transferred freely; no copy-retention-in-country requirement. (Guide p.51)"}
    coding_rules:
      - "Applies to measures potentially affecting COMMERCIAL transactions. (Guide p.51)"
      - >
        Sectoral personal-data storage mandates are category (2) → 0.5.
        (workbook round1 Australia row 35: My Health Records = 0.5)
      - >
        DUAL-RECORDING RULE: a law imposing BOTH local processing and local
        storage is recorded under BOTH 6.1 and 6.2. (Guide p.51)
    exceptions:
      - "Do NOT score data-localization measures applied to GOVERNMENT data. (Indicator Reference note; Guide p.51)"
    disambiguation:
      - >
        TRAP: storage (LOCATION) vs retention (DURATION). A rule about HOW
        LONG data must be kept is 7.3, not 6.2 — under a retention rule
        the data may be kept anywhere, including abroad. Only a rule about
        WHERE data must reside is 6.2. (Guide p.59 fn.34)
      - >
        TRAP: 6.2 is data STORED in-country — a storage locus, not general
        record-keeping. A duty to keep books or records, with no requirement
        about where they are kept, is not 6.2. (Indicator Reference row 83)
      - "A storage rule does NOT require building/owning a data centre — an establishment mandate is 6.3. (Guide p.51)"
      - "If processing (not just storage) must happen domestically → 6.1 (and record both if both are mandated). (Guide p.51)"
    guide_examples:
      - "Australia: health records stored and processed locally (also 6.1). (Guide p.50)"
      - "Malawi: local storage requirement for health-related data. (Guide p.50)"
      - "New Zealand: registered entities must store specified tax-related records locally. (Guide p.50)"
      - "El Salvador: data information agencies must maintain their databases in the country with access for the financial superintendence. (Guide p.51)"
      - "Türkiye: social network providers with >1M daily users must store user data within the economy. (Guide p.51)"

  - id: "6.3"
    pillar: 6
    tier: A
    review_status: "Round 1 codebook (2026-07-12); migrated 2026-09-13"
    name: "Infrastructure requirements"
    category_official: "Infrastructure requirements"              # methodology sheet row 32
    weight: 0.31
    question: "Must a service provider establish or use dedicated local physical infrastructure (data centre, local server) as a precondition for supplying services?"
    definition: >
      An 'infrastructure requirement' mandates the establishment of a local
      data centre (or dedicated local physical infrastructure such as a local
      server) as a condition to provide certain services using data. Distinct
      from 6.2: a storage rule can be satisfied by renting existing local
      facilities; an infrastructure rule obliges the provider to establish or
      use dedicated local physical infrastructure. (Guide p.51)
    scoring: {values: [1, 0], type: binary}
    scoring_tree:
      - if: "There is at least one infrastructure requirement (as defined above) acting as a barrier/precondition to data movement or service supply. (Guide p.52; Methodology sheet 6.3)"
        score: 1
      - else: {score: 0, meaning: "No requirement to establish/use local physical infrastructure. (Guide p.52)"}
    coding_rules:
      - "Applies to measures potentially affecting COMMERCIAL transactions. (Guide p.52)"
      - >
        The indicator captures requirements that act as a PRIMARY BARRIER to
        data movement — regulations explicitly mandating establishment of a
        data centre or other local data-storage infrastructure as a condition
        for service. (Guide p.52)
      - >
        FAQ rule: where a country has data-centre regulations but NO
        establishment mandate for data-transfer purposes, the information MAY
        be recorded with score 0.00 (note-only row). (Internal Guide p.13)
    exceptions:
      - "Do NOT score data-localization measures applied to GOVERNMENT data. (Indicator Reference note; Guide p.52)"
      - >
        Do NOT score operational/technical requirements applied to
        already-established data centres (e.g. security controls, privacy
        obligations on the collected data). (Guide p.52; Internal Guide p.13)
      - >
        Do NOT score licensing/registration requirements for building or
        operating data centres — those belong to indicator 9.4, not 6.3. (Internal Guide pp.13-14)
    disambiguation:
      - "TRAP: a data-centre LICENSING or registration scheme is NOT 6.3 (it is 9.4). 6.3 = 'you must build/use local infrastructure to serve customers'. (Internal Guide pp.13-14)"
      - "A rule that a copy of data reside locally (rentable, no build mandate) → 6.2. (Guide p.51)"
      - >
        Guide erratum: the Guide's 6.3 section once says local storage is
        'indicator 6.1' — a typo for 6.2. Ignore it; the mapping here is
        authoritative. (Guide p.51)
      - "Network-security or access-control rules for licensees are not infrastructure requirements; judge the legal function, not the keywords. (Extraction slides pp.36-37)"
    guide_examples:
      - "Chile: banks outsourcing data processing abroad must have a contingency data processing centre located in-country. (Guide p.51)"
      - "Mongolia: servers processing sensitive, biometric and genetic data must be physically located within the economy. (Guide p.51)"
      - "Kazakhstan: communications-network operators must establish a local centralized network-management system. (Guide p.52)"
      - "Viet Nam: providers of websites, social networks, mobile networks and online games must maintain at least one local server. (Guide p.52)"

  - id: "6.4"
    pillar: 6
    tier: A
    review_status: "Round 1 codebook (2026-07-12); migrated 2026-09-13"
    name: "Conditional flow regimes"
    category_official: "Conditional flow regimes"                 # methodology sheet row 33
    weight: 0.12
    question: "Is cross-border data transfer permitted ONLY IF conditions are met (data-subject consent, adequacy/equivalence of protection, contracts/self-assessment, or government approval)?"
    definition: >
      Conditions businesses must satisfy to transfer data across borders,
      typically preventing transfer to economies whose data protection is not
      adequate/equivalent to domestic protection. The deciding entity varies —
      (a) the data subject via consent, (b) the business via adequacy
      self-assessment, (c) the Government via adequacy determinations or
      approvals — but the SCORE DOES NOT DEPEND on which entity decides. (Guide pp.52-54)
    scoring: {values: [1, 0.5, 0], type: ordinal}
    scoring_features:
      - "type of data: personal scores higher than non-personal (Guide p.54)"
      - "scope: horizontal scores higher than specific data types (Guide p.54)"
    scoring_tree:
      - if: >
          The conditional regime covers PERSONAL data — regardless of whether it
          is horizontal or sector-specific — OR applies horizontally across all
          sectors (even if only to non-personal or specific data types). (Guide p.54; Methodology sheet 6.4)
        score: 1
      - if: "The conditional regime applies to non-personal data and/or a specific set of data only (e.g. geographical survey data, financial/telecom/cloud data categories). (Guide p.54; Methodology sheet 6.4)"
        score: 0.5
      - else: {score: 0, meaning: "No condition attached to cross-border transfer. (Guide p.54)"}
    coding_rules:
      - "Applies to measures potentially affecting COMMERCIAL transactions. (Guide p.54)"
      - >
        NOTE the asymmetry vs 6.1/6.2: for 6.4 the Guide EXPLICITLY scores
        personal-data conditions 1 even when sector-specific. A
        financial-sector-only condition on personal data is still 1 here,
        whereas a sectoral personal-data ban/storage rule is 0.5 under 6.1/6.2. (Guide p.54 vs pp.50-51)
      - "There is NO more-than-one-measure escalation clause for 6.4 (unlike 6.1/6.2). (Guide p.54; Methodology sheet 6.4)"
      - >
        All condition types score identically: consent regimes, business
        adequacy self-assessment, standard contractual clauses, prior
        government authorization, whitelist/adequacy determinations. (Guide p.54)
    exceptions:
      - "Do NOT score conditions applied to GOVERNMENT data. (Indicator Reference note; Guide p.54)"
    disambiguation:
      - >
        TRAP (mirror of the 6.1 trap): 'prohibited unless conditions are
        met' — the default-prohibition + exception drafting pattern (e.g.
        Singapore PDPA s.26: transfer only per prescribed requirements
        ensuring comparable protection) — is 6.4, NOT a 6.1 ban. Classify
        by whether a compliant transfer path EXISTS: conditions → 6.4;
        no path → 6.1. (Guide p.54; Canvas deck p.7; Indicator Reference row 84)
      - "If, in addition to conditions, a COPY must stay onshore → also record 6.2; if processing must be local → also record 6.1. (Guide p.51)"
    guide_examples:
      - "Singapore: PDPA requires transfers abroad to meet prescribed requirements ensuring a standard of protection comparable to the PDPA (consent + comparable protection) → 1. (Guide p.54)"
      - "Brazil: central-bank-regulated institutions hiring cloud services that store/process data abroad need prior authorization (60 days) absent a regulator agreement. (Guide p.54)"
      - "Palau: agencies must notify the Ministry of State and obtain individual consent before transferring personal information abroad. (Guide p.54)"
      - "Republic of Korea: transfer abroad of geographical/survey data requires ministerial permission (specific non-personal data → 0.5 pattern). (Guide p.54)"
      - "Uzbekistan: cross-border personal data transfer allowed only on adequacy, consent, public-order grounds or treaty requirement. (Guide p.54)"

# ----------------------------------------------------------------------------
# PILLAR 7 — DOMESTIC DATA PROTECTION AND PRIVACY
# Where the measures live: data-protection statutes, cybersecurity acts, AND
# NON-privacy laws (criminal procedure, surveillance/interception, telecom,
# AML/financial, tax/corporate record-keeping). (Guide pp.57-62; Extraction slides p.47)
# ----------------------------------------------------------------------------

  - id: "7.1"
    pillar: 7
    tier: A
    review_status: "Round 1 codebook (2026-07-12); migrated and extended with host row 80 on 2026-09-13"
    name: "Lack of comprehensive legal framework for data protection"
    category_official: "Lack of comprehensive legal framework for data protection"   # sheet row 35
    weight: 0.31
    polarity: inverted               # higher score = LESS protection in place
    level: economy                   # answered once per economy (Indicator Reference row 80)
    question: "Does the economy LACK a comprehensive (horizontal) data-protection legal framework for personal data?"
    definition: >
      'Comprehensive' = broad, cross-sectoral (horizontal) applicability PLUS
      detailed provisions on the scope and application of data subjects'
      rights and obligations — e.g. rights of access, rectification, erasure,
      portability — covering activities such as collection, processing and
      cross-border transfer of personal data. (Guide p.58)
    scoring: {values: [1, 0.5, 0], type: ordinal}
    scoring_tree:
      - if: "No data-protection legal framework exists at all. (Guide p.58; Methodology sheet 7.1)"
        score: 1
      - if: "A data-protection legal framework exists but applies only to specific sectors (sectoral law(s) only). (Guide p.58; Methodology sheet 7.1)"
        score: 0.5
      - else: {score: 0, meaning: "A comprehensive horizontal data-protection framework exists (e.g. SG PDPA 2012, MY PDPA 2010, AU Privacy Act 1988). (Guide p.58; workbook round1 Singapore row 38)"}
    coding_rules:
      - "Comprehensive = the law applies horizontally across all sectors; if it applies to a specific sector, assign 0.5. (Internal Guide p.13)"
      - >
        ECONOMY-LEVEL: answer once per economy. Record the framework (or its
        absence) once, citing the comprehensive act's scope/application
        provision as the verbatim evidence. Per-provision citations of a
        data-protection act tagged 7.1 are not discoveries and score zero. (Indicator Reference row 80)
      - >
        Sectoral data-protection instruments are part of the economy-level
        answer: they decide 0.5 when no comprehensive law exists, and they do
        not lift a 0 when one does. (Guide p.58; Assignment 1 answer key p.2)
    exceptions: []
    disambiguation:
      - >
        TRAP — INVERTED POLARITY: this indicator measures the LACK of a
        framework. An economy WITH a comprehensive DP law scores 0 (good for
        digital trade), NOT 1. Never emit 1 because a strong law was found. (Methodology sheet 7.1; Guide p.58; Assignment 1 answer key p.2)
      - >
        TRAP: economy-level, not provision-level. The question is whether the
        framework exists at all, not whether one provision does; individual
        provisions of the act are not separate 7.1 discoveries. (Indicator Reference row 80)
      - >
        The existence of sectoral DP rules alongside a comprehensive law does
        not lift the score above 0 — the comprehensive law controls the score. (Assignment 1 answer key p.2)
      - "General/constitutional privacy rights without detailed data-protection provisions do not constitute a comprehensive framework by themselves. (Guide p.58)"

  - id: "7.2"
    pillar: 7
    tier: A
    review_status: "Round 1 codebook (2026-07-12); migrated and extended with host row 80 on 2026-09-13"
    name: "Lack of dedicated legal framework for cybersecurity"
    category_official: "Lack of dedicated legal framework for cybersecurity"          # sheet row 36
    weight: 0.31
    polarity: inverted
    level: economy                   # answered once per economy (Indicator Reference row 80)
    question: "Does the economy LACK a dedicated cybersecurity legal framework?"
    definition: >
      'Dedicated' = broadly applicable cybersecurity-SPECIFIC laws
      (horizontal), or cybersecurity-focused laws applicable to specific
      sectors (sectoral). 'Non-dedicated' = no specific cybersecurity law;
      the economy relies on other laws to govern cyber threats (monitoring,
      detection, prevention, mitigation, incident management). (Guide p.59)
    scoring: {values: [1, 0.5, 0], type: ordinal}
    scoring_tree:
      - if: "No cybersecurity legal framework exists at all. (Guide p.59; Methodology sheet 7.2)"
        score: 1
      - if: "Only a non-dedicated framework (cyber threats governed via other laws) AND/OR a dedicated cybersecurity law limited to specific sectors. (Guide p.59; Methodology sheet 7.2)"
        score: 0.5
      - else: {score: 0, meaning: "A dedicated cybersecurity legal framework applies across all sectors (horizontal), e.g. SG Cybersecurity Act 2018, MY Cyber Security Act 854 (2024). (Guide p.59; workbook round1 Singapore row 40)"}
    coding_rules:
      - >
        ECONOMY-LEVEL: answer once per economy, citing the dedicated act's
        scope provision. Per-provision citations of a cybersecurity act tagged
        7.2 are not discoveries and score zero. (Indicator Reference row 80)
      - "Sectoral cybersecurity instruments (e.g. a financial regulator's cyber-hygiene notice) are recorded, but the horizontal act is the controlling evidence for the score. (Assignment 1 answer key pp.1-2)"
    exceptions: []
    disambiguation:
      - "TRAP — INVERTED POLARITY: an economy WITH a dedicated horizontal cybersecurity act scores 0, not 1. (Methodology sheet 7.2; Guide p.59; Extraction slides p.44)"
      - "TRAP: economy-level, not provision-level — individual provisions of the cybersecurity act are not separate 7.2 discoveries. (Indicator Reference row 80)"
      - >
        Computer-misuse/cybercrime statutes are a signal but check scope: a
        law relying on offence provisions without a cybersecurity-specific
        framework is 'non-dedicated'; judge against the 'dedicated'
        definition and cite what exists. (Guide p.59)
      - "The same act's powers to access data without court orders evidence 7.5 separately. (Guide p.62)"

  - id: "7.3"
    pillar: 7
    tier: A
    review_status: "Round 1 codebook (2026-07-12); migrated and extended with host row 81 on 2026-09-13"
    name: "Minimum period of data retention requirements"
    category_official: "Minimum period of data retention requirements"               # sheet row 37
    weight: 0.16
    question: "Does any law require that data be retained for AT LEAST a specified minimum period?"
    definition: >
      Under a 'minimum period of retention', firms MUST retain data for at
      least a specific prescribed period (days, months or years) and keep it
      available for authorities. Purpose is typically investigative/law
      enforcement (corporate affairs, tax, telecom communications data). A
      'permanent retention' mandate is an atypical minimum-period requirement
      and also scores 1. (Guide pp.59-60; Guide p.60 fn.36)
    scoring: {values: [1, 0], type: binary}
    scoring_tree:
      - if: "A requirement exists to retain data for at least a specified minimum period (duration in days/months/years explicitly stated, or permanent retention mandated). (Guide p.60; Methodology sheet 7.3)"
        score: 1
      - else: {score: 0, meaning: "No retention requirement — OR a requirement exists but specifies no minimum period (e.g. 'as long as necessary'). (Guide p.60)"}
    coding_rules:
      - >
        If the duration is clearly specified → minimum period → 1. If the
        retention period is NOT specified, the measure MAY still be recorded in
        the database but scored 0.00. (Internal Guide p.13)
      - >
        A 'prescribed period' with no number, a notification deadline or an
        appeal window is not a retention rule. (Indicator Reference row 81)
      - >
        Carriers are usually NOT the privacy statute: look in telecom /
        interception laws, AML & financial due-diligence rules, tax and
        corporate record-keeping, e-commerce transaction rules, employment
        record rules. (Guide pp.59-60; Assignment 2 brief p.2)
    exceptions:
      - "Do NOT score retention requirements applied to GOVERNMENT data. (Indicator Reference note; Guide p.60)"
    disambiguation:
      - >
        TRAP (multiply attested): 'do not keep longer than necessary' /
        'as long as necessary' retention-limitation principles in data
        protection laws are MAXIMUM-period rules — NOT scored under RDTII 2.1
        (score 0). Only 'retain for AT LEAST N' (a floor) scores 1. Look for
        the words 'minimum', 'at least', 'not less than', or an explicit
        period the data must survive until. (Guide p.60 fn.35; Internal Guide p.13; Extraction slides p.45; Indicator Reference row 81)
      - "TRAP: needs a SPECIFIED minimum duration ('5 years'); a 'prescribed period' with no number, a notification deadline or an appeal window does not count. (Indicator Reference row 81)"
      - "Retention (DURATION) vs local storage (LOCATION): retained data may live abroad → 7.3; a domestic-copy rule → 6.2. (Guide p.59 fn.34)"
    guide_examples:
      - "Bangladesh: e-commerce business transaction data retained for 6 years from transaction date. (Guide p.60)"
      - "Botswana: Financial Intelligence Act — customer due-diligence records retained 20 years; Electronic Payments Services Regulations — at least 5 years. (Guide p.60)"
      - "India: cyber cafés must keep authenticated user-ID records for at least 1 year. (Guide p.60)"
      - "Malawi: required retention period of at least 7 years. (Guide p.60)"
      - "Mexico: telecom concessionaires keep user data 12 months in a system + 12 further months in electronic storage. (Guide p.60)"
      - "Peru: concessionaires keep specified telecom data 12 months + an additional 24 months. (Guide p.60)"

  - id: "7.4"
    pillar: 7
    tier: A
    review_status: "Round 1 codebook (2026-07-12); migrated 2026-09-13"
    name: "Data Protection Impact Assessment (DPIA) or Data Protection Officer (DPO) requirements"
    category_official: "Data Protection Impact Assessment (DPIA) or Data Protection Officer (DPO) requirements"   # sheet row 38
    weight: 0.06
    question: "Are firms required to appoint a Data Protection Officer and/or perform Data Protection Impact Assessments?"
    definition: >
      DPOs ensure a company processes personal data in compliance with data
      protection rules; a DPIA is a process for identifying the risks of data
      processing operations to users' rights. The scoring metric anchors on
      the presence of the DPO requirement (DPIA duties usually follow DPO
      appointment). (Guide pp.60-61)
    scoring: {values: [1, 0.5, 0], type: ordinal}
    scoring_tree:
      - if: "A DPO requirement (alone, or together with a DPIA requirement) applies to ALL sectors. (Guide p.61; Methodology sheet 7.4)"
        score: 1
      - if: "A DPO requirement (alone, or together with a DPIA requirement) applies only to a SPECIFIC sector. (Guide p.61; Methodology sheet 7.4)"
        score: 0.5
      - else: {score: 0, meaning: "No DPO/DPIA requirement. (Guide p.61)"}
    coding_rules:
      - >
        SPECIAL CASE — DPIA-only: the Guide notes a theoretical 0.25 where
        ONLY a DPIA is required (never observed in practice; absent from the
        methodology sheet's allowed scores). If encountered: do not emit 0.25;
        flag the row for human review in Notes and leave score_hint to the
        reviewer. (Guide p.61; Methodology sheet 7.4)
      - "The duty must be MANDATORY. Advisory/recommended DPIAs (e.g. Singapore's advised DPIA for children's products) do not create a DPIA mandate — Singapore scores on its mandatory DPO duty. (Guide p.61)"
    exceptions: []
    disambiguation:
      - >
        TRAP: adjacent roles are NOT DPOs — a registry contact person (e.g.
        Türkiye's VERBIS contact), a local representative, or a general
        compliance/security officer does not satisfy the DPO definition unless
        the role is responsibility for personal-data-protection compliance. (Guide p.61)
      - "General risk-assessment or breach-notification duties are not DPIAs; a DPIA specifically assesses data-processing risks to individuals' rights. (Guide pp.60-61)"
    guide_examples:
      - "Colombia: controllers/processors must appoint a person or division responsible for personal-data protection and data-subject claims. (Guide p.61)"
      - "Ghana: Data Protection Act requires controllers to appoint a data protection officer/supervisor. (Guide p.61)"
      - "Singapore: organisations must appoint one or more DPOs under the PDPA (DPIA advised, not mandated) → horizontal DPO duty. (Guide p.61)"
      - "Türkiye: 'data controller' + VERBIS contact person + local representative — no DPO/DPIA mandate (negative example). (Guide p.61)"

  - id: "7.5"
    pillar: 7
    tier: A
    review_status: "Round 1 codebook (2026-07-12); migrated and extended with host row 82 on 2026-09-13"
    name: "Requirements to allow government access to personal data"
    category_official: "Requirements to allow government access to personal data"     # sheet row 39
    weight: 0.16
    question: "Can the Government access personal data WITHOUT the explicit authorization of an independent judicial body?"
    definition: >
      The indicator asks whether Government can access personal data without a
      court decision, judicial warrant, or an equivalent order issued by a
      truly independent tribunal with due-process safeguards. Lack of judicial
      oversight of this discretionary power undermines fundamental rights and
      digital trust. (Guide p.62)
    scoring: {values: [1, 0], type: binary}
    scoring_tree:
      - if: "Any measure allows the Government to access (personal) data without a court order / independent judicial authorization — including access on regulator or ministerial request, mandatory standing access for agencies, or surveillance authorized by a non-judicial or undefined authority. (Guide p.62; Methodology sheet 7.5)"
        score: 1
      - else: {score: 0, meaning: "No such measure — access requires independent judicial authorization. (Guide p.62)"}
    coding_rules:
      - >
        SEARCH BEYOND PRIVACY LAW: the enabling provisions typically live in
        criminal procedure codes, surveillance/interception statutes, telecom
        acts, intelligence/security laws — and sometimes in the DP law's own
        law-enforcement exemptions. (Extraction slides p.47; Guide p.62)
      - >
        Ambiguity counts: where the authorizing 'authority' is undefined or
        not demonstrably an independent judicial body (e.g. Cambodia's
        'legitimate authority'), the measure scores 1. (Guide p.62)
    exceptions: []
    disambiguation:
      - "Access gated on a judicial warrant/court order from an independent tribunal → NOT a measure (score 0). (Guide p.62)"
      - "TRAP: do not stop at the privacy act. A comprehensive DP law with a broad law-enforcement exemption PLUS a CPC production-order regime without court order → the CPC provision is the evidence. (Extraction slides pp.47-49; workbook round1 Singapore row 47)"
      - >
        TRAP: 7.5 is government access to PERSONAL data without independent
        judicial authorisation — not generic inspection of business records by
        a regulator, and not a secrecy duty with a court-order carve-out. (Indicator Reference row 82)
      - "Data-retention schemes designed to guarantee authority access can evidence BOTH 7.3 (if a minimum period is set) and 7.5 (if access needs no court order) — emit two rows; indicators are not mutually exclusive. (Guide p.59; Assignment 1 answer key p.3)"
    guide_examples:
      - "Cambodia: telecom operators must provide service data to the Ministry; secret surveillance allowed on authorization of an undefined 'legitimate authority' → 1. (Guide p.62)"
      - "Cuba: criminal investigator may exceptionally use electronic surveillance without the Attorney General's authorization. (Guide p.62)"
      - "India: ISPs must maintain user logs and give authorized intelligence agencies password-controlled access to subscriber lists at any time. (Guide p.62)"
      - "Sri Lanka: mobile operators must open databases/networks to the Telecommunications Regulatory Commission upon request. (Guide p.62)"

# ----------------------------------------------------------------------------
# PILLAR 8 — INTERNET INTERMEDIARY LIABILITY
# ----------------------------------------------------------------------------

  - id: "8.1"
    pillar: 8
    tier: B
    review_status: draft 2026-09-13 (Claude), pending human review
    polarity: inverted
    name: Lack of safe harbour for copyright infringements
    category_official: Lack of safe harbour for copyright infringements
    question: Does any law shield Internet intermediaries from liability for their users' copyright infringement,
      and is that shield sector-specific or horizontal? (No shield scores 1.)
    definition: 'A safe harbour protects Internet intermediaries, such as ISPs and Internet content providers,
      from legal liability for certain activities of their users; without it, an intermediary hosting copyright-infringing
      content is liable per se even when it is unaware of that content (Guide p.64). The protection can
      sit in sector-specific laws, for example rules for telecommunications or e-commerce service providers,
      or apply across all sectors (Guide p.65). Lacking safe-harbour provisions for intermediaries is one
      of the gaps that push an indicator score towards 1 (Guide p.10).

      '
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features: []
    scoring_tree:
    - if: 'TRAP inverted polarity: no provision limits intermediaries'' liability for users'' copyright
        infringement, i.e. no intermediary liability framework is in place (Guide p.65; Methodology sheet
        8.1).'
      score: 1
    - if: A safe harbour covering copyright infringement exists only in a sectoral framework, such as an
        e-commerce or telecommunications instrument (Guide p.65; Methodology sheet 8.1).
      score: 0.5
    - else:
        score: 0
        meaning: A horizontal framework, applying across sectors, protects intermediaries from liability
          for users' copyright infringement (Guide p.65; Methodology sheet 8.1).
    coding_rules:
    - A general intermediary exemption that never mentions copyright still counts as a copyright safe harbour
      (Guide p.65, footnote 40).
    - Conditions such as no specific or actual knowledge and prompt removal once aware or notified do not
      stop a provision from being a safe harbour (Guide p.65).
    - One law that protects intermediaries against both copyright claims and other unlawful content is evidence
      for 8.1 and 8.2; record it under both (Guide pp.65-66; Guide p.11).
    - A safe harbour limited to copyright answers 8.1 only; decide 8.2 on the other laws (Guide p.65).
    - The workbook treats a shield in a copyright act, civil code or IT act that reaches intermediaries
      in every sector as horizontal (0) and one confined to e-commerce operators as sectoral (0.5) (workbook
      round1 Singapore row 49; workbook round2 Russian Federation row 60; workbook round2 Indonesia row
      95).
    - Global Network Initiative reports and the World Intermediary Liability Map may point to the law but
      are not evidence themselves (Guide p.64).
    exceptions: []
    disambiguation:
    - 'TRAP inverted polarity: score 1 means the economy LACKS a copyright safe harbour; finding a shield
      lowers the score (Guide p.65; Methodology sheet 8.1).'
    - 'TRAP: do not score 8.1 as 1 only because a general intermediary safe harbour omits the word copyright;
      the workbook scores one Lao law 1 for 8.1 and 0 for 8.2, against the Guide (Guide p.65, footnote 40;
      workbook round2 Lao PDR rows 50, 51).'
    - 'TRAP: a copyright clause that only obliges intermediaries to prevent infringement or block infringing
      works gives no shield, so it is not a safe harbour; the duty itself is 8.4 material (Guide p.64; Internal
      Guide p.13; workbook round2 Mongolia row 44).'
    - 'TRAP: takedown procedures, injunctions and other remedies framed for rights holders are 4.6 evidence;
      they count for 8.1 only where they also limit intermediaries'' liability (Guide p.34; workbook round1
      Malaysia rows 26, 66; workbook round2 Thailand rows 29, 72).'
    - 'An IP-only safe harbour leaves 8.2 open: Russia''s Civil Code shield gives 8.1 a 0 while 8.2 scores
      1 (Guide p.65; workbook round2 Russian Federation rows 60, 61).'
    - Blocking or filtering of copyright-infringing content is not a 9.1 restriction (Guide p.70).
    guide_examples:
    - 'New Zealand: the Copyright (New Technologies) Amendment Act protects ISPs from users'' infringing
      content if they lack specific knowledge or promptly disable it on notice (Guide p.65).'
    - 'Japan: Act No.137 of 2001 protects telecommunications service providers from damages over distributed
      information unless they knew or had good reason to know of the infringement (Guide p.65).'
    - 'Republic of Korea: the Copyright Act protects online service providers where it is technically impossible
      for them to take the listed measures, but offers no safe harbour for other activities (Guide p.65).'
    - 'Georgia: the Law on E-commerce exempts intermediaries for handling, caching or hosting under conditions
      and still applies to copyright (Guide p.65, footnote 40).'
    sources:
      guide_pages:
      - 64
      - 65
      methodology_row_round1_db: 41
      faq_pages: []
      template_row: 44

  - id: "8.2"
    pillar: 8
    tier: B
    review_status: draft 2026-09-13 (Claude), pending human review
    polarity: inverted
    name: Lack of safe harbour for other illegal activities
    category_official: Lack of safe harbour for other illegal activities
    question: Does any law shield Internet intermediaries from liability for users' illegal content or activities
      other than copyright infringement, and is that shield sector-specific or horizontal? (No shield scores
      1.)
    definition: 'This indicator looks for a safe harbour covering users'' illegal activities other than
      copyright infringement; without one, an intermediary hosting such content is liable per se even when
      it has not been notified of it (Guide p.65). The protection can sit in sector-specific laws, such
      as rules for telecommunications or e-commerce providers, or apply across all sectors (Guide p.66).

      '
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features: []
    scoring_tree:
    - if: 'TRAP inverted polarity: no provision limits intermediaries'' liability for users'' non-copyright
        illegal content or activities, i.e. no intermediary liability framework is in place (Guide p.66;
        Methodology sheet 8.2).'
      score: 1
    - if: A safe harbour for non-copyright illegal content exists only in a sectoral framework, such as
        an e-commerce or telecommunications instrument (Guide p.66; Methodology sheet 8.2).
      score: 0.5
    - else:
        score: 0
        meaning: A horizontal framework protects intermediaries from liability for users' illegal activities
          other than copyright infringement (Guide p.66; Methodology sheet 8.2).
    coding_rules:
    - Protection conditioned on not initiating or altering the information, lacking actual knowledge and
      removing illegal content promptly once aware is still a safe harbour (Guide p.66, footnote 41).
    - Immunity for deleting content the provider reasonably believes infringes others' rights, or after
      an unanswered notice to the uploader, is part of a safe harbour regime (Guide p.66).
    - One law covering both copyright and other unlawful content is evidence for 8.2 as well as 8.1 (Guide
      p.66; Guide p.11).
    - The workbook treats an exemption for all network service providers in an electronic-transactions or
      IT law as horizontal (0) and one confined to e-commerce or private electronic system operators as
      sectoral (0.5) (workbook round1 Singapore row 50; workbook round2 Indonesia row 98).
    - A safe harbour that lapses when statutory due-diligence duties are breached still counts as a safe
      harbour (workbook round2 India row 106).
    - When no provision limits intermediaries' liability for such content, cite the general laws searched
      and score 1 (Methodology sheet 8.2; Internal Guide p.10; workbook round2 Russian Federation row 61).
    exceptions: []
    disambiguation:
    - 'TRAP inverted polarity: score 1 means NO safe harbour for non-copyright content; finding a shield
      lowers the score (Guide p.66; Methodology sheet 8.2).'
    - 'TRAP: a copyright-only or IP-only safe harbour is not 8.2 evidence; it belongs to 8.1. The workbook
      cites the same Chinese copyright regulation under both (Guide p.65; workbook round2 China rows 72,
      73).'
    - 'TRAP: copyright offences, such as supplying illicit streaming devices or sharing access to infringing
      works, are 8.1 context and do not show a missing safe harbour for other illegal activities (Guide
      p.65; workbook round1 Malaysia row 68).'
    - 'TRAP: a duty to remove or block content by a deadline is an 8.4 requirement; for 8.2 ask whether
      complying providers are exempt. A notice procedure with an exemption scored 0, a blocking duty with
      no exemption scored 1 (Internal Guide p.13; workbook round2 Thailand row 74; workbook round2 Russian
      Federation row 61).'
    - An immunity covering all unlawful content, such as Lao PDR's e-transactions law, answers 8.1 as well
      (Guide p.65, footnote 40; workbook round2 Lao PDR rows 50, 51).
    guide_examples:
    - 'New Zealand: the Harmful Digital Communications Act protects an online content host for illegal content
      posted by its users (Guide p.66).'
    - 'Japan: Act No.137 of 2001 shields telecommunications service providers from damages to others'' rights
      unless aware, and from damages for deleting content believed to infringe IP or privacy (Guide p.66).'
    - 'Georgia: the Law on E-commerce exempts intermediaries that did not initiate or alter information,
      lack actual knowledge of illegal content and remove it promptly (Guide p.66, footnote 41).'
    sources:
      guide_pages:
      - 65
      - 66
      methodology_row_round1_db: 42
      faq_pages: []
      template_row: 45

  - id: "8.3"
    pillar: 8
    tier: B
    review_status: draft 2026-09-13 (Claude), pending human review
    name: User identity requirements
    category_official: User identify requirements
    question: Must Internet intermediaries verify and record users' identity as a condition for connecting
      to the Internet or using online services, or only for SIM card registration?
    definition: 'A user identity requirement obliges Internet intermediaries to verify and record accurate
      personal information about their users as a condition for access to their services or networks; it
      can involve collecting, storing and sometimes authenticating identity documents or other identifying
      data (Guide p.66). The intermediary thereby acts as a gatekeeper that polices users on behalf of the
      Government (Guide p.66).

      '
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features: []
    scoring_tree:
    - if: A user identity requirement applies to connecting to the Internet or accessing online services
        (Guide p.67; Methodology sheet 8.3).
      score: 1
    - if: The user identity requirement applies to SIM card registration (Guide p.67; Methodology sheet
        8.3).
      score: 0.5
    - else:
        score: 0
        meaning: No mandatory user identity requirement for Internet access, online services or SIM registration
          (Guide p.67; Methodology sheet 8.3).
    coding_rules:
    - The duty must fall on the intermediary or operator to collect, verify or record user identity as a
      condition of service; storing or authenticating ID documents or other identifying data all count (Guide
      p.66).
    - A duty to enable identification of the first originator of messages on a messaging service is a user
      identity requirement (Guide p.66).
    - Identity checks before a user may use an Internet access point, such as a cyber café computer, fall
      in the connect-to-the-Internet branch (Methodology sheet 8.3; workbook round2 India row 109).
    - Prepaid or postpaid SIM registration stays at 0.5 even with ID-database cross-checks or biometrics
      (Guide p.67; workbook round1 Australia row 49; workbook round2 Indonesia row 100).
    - Identity authentication that users may choose and platforms are merely encouraged to support is not
      a requirement (workbook round2 China row 78).
    - 'One economy can hold both levels: real-name rules for online services score 1 while its SIM registration
      row scores 0.5 (workbook round2 China rows 76, 77).'
    exceptions: []
    disambiguation:
    - 'TRAP: keeping user-identification records or traffic data for a set period is 7.3; record the verification
      duty under 8.3 and the retention period under 7.3. The Guide lists India''s cyber-café ID records
      under 7.3 and the workbook codes the same instruments under both (Guide p.60; workbook round2 India
      rows 86, 109; workbook round2 Thailand rows 65, 76).'
    - 'TRAP: a first-originator identification duty is 8.3, not 8.4; the workbook also codes India''s rule
      as 8.4 (Guide p.66; workbook round2 India rows 108, 113).'
    - 'TRAP: a government power to obtain subscriber lists or user data from providers is 7.5; 8.3 covers
      the provider''s duty to collect and verify identity (Guide p.62; Guide p.67).'
    - Duties in the same instrument to pre-review, monitor or delete users' posts are 8.4 (Guide p.67; workbook
      round2 China rows 76, 82).
    guide_examples:
    - 'Argentina: mobile communications providers must keep a registry of subscribers with name, surname,
      national identity document and address (Guide p.66).'
    - 'Bangladesh: social media intermediaries offering messaging must enable identification of the first
      originator and keep registration data for 180 days after cancellation (Guide p.66).'
    - 'Rwanda: electronic communications providers must ensure users supply accurate personal information
      (Guide p.67).'
    - 'Tajikistan: users must present identity documents for electronic communication contracts, and operators
      must verify them before providing service (Guide p.67).'
    - 'Uganda: the Regulation of Interception of Communications Act requires intermediaries to collect customer
      names, addresses and identification numbers (Guide p.67).'
    - 'Venezuela: mobile telephony operators must collect subscribers'' ID number, address, signature and
      fingerprints (Guide p.67).'
    sources:
      guide_pages:
      - 66
      - 67
      methodology_row_round1_db: 43
      faq_pages: []
      template_row: 46

  - id: "8.4"
    pillar: 8
    tier: B
    review_status: draft 2026-09-13 (Claude), pending human review
    name: Monitoring requirements
    category_official: Monitoring requirements
    question: Must Internet intermediaries monitor users' activities, or remove or block content deemed
      illegal?
    definition: 'A monitoring requirement obliges Internet intermediaries to actively monitor users'' activities
      or to remove or block content deemed illegal, so that they police content on behalf of the Government
      (Guide p.67). It can be explicit or indirect, for example a duty to install software, algorithms or
      other tools that detect or manage prohibited content (Guide p.67). The indicator captures both duties
      to monitor content and duties to block or remove content (Internal Guide p.13).

      '
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features: []
    scoring_tree:
    - if: At least one requirement obliges intermediaries to remove or block content, on its own or together
        with monitoring users' activities (Guide p.67; Internal Guide p.13; Methodology sheet 8.4).
      score: 1
    - if: Intermediaries must actively monitor users' activities but carry no legal obligation to remove
        or block the content (Guide p.67; Methodology sheet 8.4).
      score: 0.5
    - else:
        score: 0
        meaning: No duty on intermediaries to monitor users' activities or to remove or block content (Guide
          p.67; Methodology sheet 8.4).
    coding_rules:
    - 'Indirect monitoring counts: mandated filters, moderation systems, algorithms or pre-publication review
      of user content (Guide p.67; workbook round2 Mongolia row 49).'
    - A legal duty to remove or block content counts even when a notice or official direction triggers it
      rather than proactive monitoring (Internal Guide p.13; workbook round2 Indonesia row 102).
    - Duties aimed at child sexual abuse or terrorist content still count; the carve-out for political,
      criminal, age-restricted and defamatory content is stated for 9.1 only (Guide p.70; Indicator Reference
      note for 9.1; workbook round1 Singapore row 55).
    - A liability rule turning on what the intermediary knew or ought to have known may encourage monitoring
      but is not itself a monitoring requirement (workbook round2 Russian Federation row 64).
    - Record the same measure under 8.4 and under any other indicator whose scope it also meets, applying
      each indicator's own test (Guide p.11).
    exceptions: []
    disambiguation:
    - 'TRAP: duties to give security agencies interception, monitoring or decryption facilities, or subscriber
      lists, are government access (7.5). The Guide uses India''s subscriber-list licence clause as a 7.5
      example, yet the workbook codes those clauses and IT Act s.69 under both 7.5 and 8.4 (Guide p.62;
      workbook round2 India rows 97, 98, 111, 112).'
    - 'TRAP: keeping traffic data for a minimum period is 7.3, not monitoring (Guide p.59; workbook round2
      Lao PDR rows 45, 56).'
    - 'TRAP: a duty to identify the first originator of messages is 8.3, even inside intermediary due-diligence
      rules (Guide p.66; workbook round2 India rows 108, 113).'
    - 'TRAP: many takedown and blocking provisions are also recorded under 9.1, which needs blocking or
      filtering of commercial web content and excludes non-commercial content; 8.4 asks whether intermediaries
      carry the duty (Guide pp.69-70; Internal Guide p.13; workbook round2 Indonesia rows 102, 107).'
    - A notice-and-takedown condition for keeping a safe harbour is scored under 8.1 or 8.2 (Guide p.65;
      workbook round2 Russian Federation rows 60, 64).
    guide_examples:
    - 'Georgia: internet site owners must periodically review links so linked content is not offensive or
      inappropriate, and remove such content (Guide p.67).'
    - 'Kazakhstan: online platforms must strengthen moderation systems and AI algorithms against illegal
      content and report on moderation and complaints (Guide p.67).'
    - 'Lao PDR: ISPs are empowered to inspect users'' activities and warn, stop or discipline them; website
      owners must check content before others disseminate it (Guide p.67).'
    - 'Nepal: social network platform operators must verify the facts of content published on their platforms
      (Guide p.67).'
    sources:
      guide_pages:
      - 67
      methodology_row_round1_db: 44
      faq_pages:
      - 13
      template_row: 47

