  - id: "4.9"
    pillar: 4
    tier: B
    review_status: draft 2026-09-13 (Claude), pending human review
    name: Mandatory disclosure of trade secrets, such as source code and algorithms
    category_official: Mandatory disclosure of trade secrets, such as souce code and algorithms
    question: Does a law require firms to disclose trade secrets such as source code, algorithms or decryption
      means to a government authority without protecting that information against unfair commercial use?
    definition: 'Captures government mandates to disclose trade secrets, for example source code and algorithms
      (Guide p.37). A disclosure duty that comes with protection against unfair commercial use is not scored;
      without such safeguards, the score depends on how far the duty reaches, from specific products or
      circumstances up to a whole sector or all sectors (Guide p.37). The Guide''s examples include encryption
      service providers declaring their source code and authorities'' statutory access to trade secret information
      (Guide p.37).

      '
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'safeguards: protection of the disclosed information against unfair commercial use means the duty
      is not scored (Guide p.37)'
    - 'scope: a duty affecting an entire sector or all sectors scores above one limited to specific products
      or circumstances (Guide p.37; Methodology sheet 4.9)'
    - 'number of measures: more than one limited-scope duty escalates to 1 (Guide p.37; Methodology sheet
      4.9)'
    - 'national-security basis: scored 0.5 or 1 according to scope, because the security ground is broad
      and unclear (Guide p.37 fn 22)'
    scoring_tree:
    - if: 'Without safeguards against unfair commercial use, a disclosure requirement affects an entire
        sector or all sectors horizontally, OR there is more than one limited-scope disclosure requirement
        of the kind described in the next branch (Guide p.37; Methodology sheet 4.9).

        '
      score: 1
    - if: 'Without safeguards against unfair commercial use, one disclosure requirement of limited scope
        applies only to specific types of products or specific circumstances, such as disclosure through
        court orders, regulatory proceedings or a national-security provision aimed at certain companies
        (Guide p.37; Methodology sheet 4.9).

        '
      score: 0.5
    - else:
        score: 0
        meaning: No disclosure requirement, or the Government mandates disclosure where needed to protect
          the public interest and safeguards the information against unfair commercial use (Guide p.37;
          Methodology sheet 4.9).
    coding_rules:
    - 'Check for safeguards before scoring: an exception that lets a state agency disclose trade secrets
      only for public health, safety or non-commercial public interest, with steps against unfair trading
      use, scores 0 (Guide p.37; workbook round2 Thailand row 31).'
    - A duty that becomes mandatory only in certain circumstances, such as source code held in escrow and
      released if the supplier fails, is a limited-scope requirement (Guide p.37).
    - A national-security justification does not remove the score; it is scored 0.5 or 1 depending on scope
      (Guide p.37 fn 22).
    - Host coders scored duties to hand over decryption information or give decryption assistance to security
      agencies under this indicator, at 1 when the duty is horizontal (workbook round2 India row 42; workbook
      round2 Russian Federation row 30).
    - Host coders scored a national-security duty on network operators to give technical support to security
      organs at 0.5 (workbook round2 China row 28).
    - Algorithm filing that records only descriptive information (service form, algorithm type, self-assessment)
      was judged not to disclose trade secrets (workbook round2 China row 28).
    exceptions:
    - Do not score disclosure requirements tied to public procurement here; Pillar 2 captures them (Guide
      p.37).
    - Do not score disclosure of source code or encryption keys demanded when certifying encryption products
      here; 11.4 captures it (Guide p.37; Guide p.81).
    - Do not score mandated disclosure that is needed to protect the public and is paired with safeguards
      against unfair commercial use (Guide p.37; Methodology sheet 4.9).
    disambiguation:
    - 'TRAP: a law that PROTECTS trade secrets (definitions, owner''s rights, remedies) is evidence for
      4.1, not a disclosure mandate, and scores 0 here (Guide pp.37-38; workbook round2 Lao PDR row 25).'
    - 'TRAP: surrendering source code, encryption or other trade secrets as a condition of public procurement
      is 2.2 (Guide p.19; Guide p.37). The host coded Indonesia''s public-sector source-code rule under
      2.2 at 1 and under 4.9 at 0.5, so map it to 2.2 and flag any 4.9 row for review (workbook round2 Indonesia
      row 10; workbook round2 Indonesia row 41).'
    - 'TRAP: an interception or decryption power can also be 7.5 when it gives the Government access to
      personal data without independent judicial authorisation; emit both rows (Guide p.62; workbook round2
      India row 98; workbook round2 Russian Federation row 58).'
    - Disclosure of proprietary information beyond ISO/IEC validation when certifying encryption products
      is 11.4 (Guide p.81).
    - 'Neither the Guide nor the methodology names judicial oversight as a safeguard: host coders scored
      warrant-based police access to decryption codes 0, while the methodology lists court-order disclosure
      at 0.5; treat such rows as review cases (workbook round1 Malaysia row 27; Methodology sheet 4.9).'
    guide_examples:
    - 'Malawi: encryption service providers must declare their means of encryption and the source code of
      their software; the Guide names the Malawi Communications Regulatory Authority (Guide p.37).'
    - 'Solomon Islands: disclosure of trade secrets to panel members is mandatory in proceedings, and members
      may not disclose them further (Guide p.37).'
    - 'Turkmenistan: authorities may access trade secret information within their competence, handled under
      set procedures and not disclosed further (Guide p.37).'
    - 'Indonesia: escrow requirement for custom-made software, cited as a limited-scope, conditional disclosure
      (Guide p.37).'
    sources:
      guide_pages:
      - 37
      - 38
      methodology_row_round1_db: 20
      methodology_row_round2_db: 20
      faq_pages: []
      template_row: 22

