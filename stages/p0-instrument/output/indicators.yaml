  - id: "12.3"
    pillar: 12
    tier: B
    review_status: draft 2026-09-13 (Claude), pending human review
    name: Licensing scheme for e-commerce providers (B2B and B2C)
    category_official: Licensing scheme for e-commerce providers (B2B and B2C)
    question: Must a business that sells or intermediates goods or services online (a B2B or B2C platform,
      marketplace or e-commerce operator) obtain a licence to operate its e-commerce business?
    definition: 'Captures any licensing scheme imposed on e-commerce providers, covering both business-to-business
      and business-to-consumer platforms (Guide p.85). The target is the licence to run the e-commerce business
      itself; licences for other aspects of that business, such as operating online payment services or
      delivery, fall outside the indicator (Guide p.85; Indicator Reference note).

      '
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: At least one licensing requirement applies to e-commerce providers, whether B2B or B2C (Guide
        p.85; Methodology sheet 12.3).
      score: 1
    - else:
        score: 0
        meaning: No licence is required to operate an e-commerce business.
    coding_rules:
    - 'Any licence scores 1: unlike 5.5 and 9.4, the criteria do not ask for strict, discriminatory or entry-blocking
      conditions (Methodology sheet 12.3; Guide p.85; Guide p.44; Guide p.72).'
    - Prior approval to operate an e-commerce portal or platform counts, as in the Guide's Bhutan example
      (Guide p.85).
    - A licence triggered only above a size threshold still counts, as in the Guide's Türkiye example based
      on annual transaction value and number (Guide p.85).
    - A licensing law for digital platforms that include online marketplaces is recorded under both 9.4
      and 12.3 (Guide p.11).
    - When one measure has elements of several indicators, record it under each applicable indicator (Guide
      p.11).
    - A prior-notification duty for digital platforms was recorded under 12.3 but scored 0 because it is
      not a licence (workbook round2 Thailand row 112; workbook round2 Thailand row 109).
    - A registration duty imposed on every business, online or offline, was not treated as an e-commerce
      licence and scored 0 (workbook round1 Singapore row 80).
    - Cite official laws, regulations and other measures; secondary sources such as the OECD Digital STRI
      only guide researchers to them (Guide p.85).
    exceptions:
    - Do not capture licences for other aspects of e-commerce businesses, such as licences to operate online
      payment services or delivery (Indicator Reference note; Guide p.85).
    disambiguation:
    - 'TRAP: a licence to operate online payment or e-money services is not 12.3; when its conditions are
      restrictive (local incorporation, nationality, limits on licence types or numbers) it is 12.4.4 (Indicator
      Reference note; Guide p.85).'
    - 'TRAP: licences for ISPs, ICPs, social media, news, VPN or cloud services are 9.4, and 9.4 excludes
      e-commerce platform licences, which belong to Pillar 12 (Internal Guide p.12; Guide p.71; Indicator
      Reference note, 9.4).'
    - 'TRAP: a licence to provide telecom services or operate telecom facilities is 5.5; an e-commerce platform
      licence issued under telecom rules (China''s online transaction processing licence) was still coded
      12.3 (Guide p.44; Internal Guide p.12; workbook round2 China row 111).'
    - A postal, courier or delivery licence is not 12.3; restrictions on delivering goods bought online
      are 12.2 (Indicator Reference note; Guide p.84).
    - A condition to set up a local company in order to obtain the licence is also a commercial presence
      requirement under 3.5 (Guide p.28; workbook round2 China row 21).
    - A duty on foreign e-commerce operators to open a local representative office or appoint a domiciled
      liaison officer is 12.8, not a licence (Guide p.88; workbook round2 Indonesia row 178).
    - 'Other duties inside e-commerce statutes map elsewhere: a three-year transaction-record retention
      duty is 7.3 and a personal-data export condition is 6.4 (workbook round2 China row 62; workbook round2
      Indonesia row 70).'
    guide_examples:
    - 'Bhutan: a company or a Bhutanese individual aged 18 or older needs a licence to run an e-commerce
      business, and a national e-commerce portal or platform needs prior approval from the Department of
      Trade (Guide p.85).'
    - 'Colombia: commercial, financial or service websites of Colombian origin must be entered in the commercial
      registry and give the tax and customs directorate information on their transactions (Guide p.85).'
    - 'Lao PDR: B2B and B2C e-commerce businesses need an acknowledgement certificate from the Ministry
      of Industry and Commerce; electronic marketplaces must be incorporated and hold an e-commerce business
      licence and a technical conformity certificate (Guide p.85).'
    - 'Türkiye: e-commerce service providers above 10 billion lira of annual net transactions and 100,000
      transactions need a licence from the Ministry (Guide p.85).'
    sources:
      guide_pages:
      - 85
      related_guide_pages:
      - 11
      - 28
      - 44
      - 71
      - 72
      - 84
      - 88
      methodology_row_round1_db: 62
      faq_pages:
      - 12
      template_row: 65
    review_notes:
    - 'UNRESOLVED: the Guide''s Colombia example is a commercial-registry registration of commercial websites,
      yet e-commerce-specific registration duties were scored 0 in the workbook (Guide p.85; workbook round2
      Thailand row 109; workbook round2 Indonesia row 156).'

