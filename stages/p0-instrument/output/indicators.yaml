# PILLAR 9 — CONTENT ACCESS
# ----------------------------------------------------------------------------

  - id: "9.1"
    pillar: 9
    tier: B
    review_status: draft 2026-09-13 (Claude), pending human review
    name: Blocking or filtering commercial web content
    category_official: Blocking or filtering commercial web content
    question: Has the Government blocked or filtered commercial web content, or required Internet intermediaries
      to do so, outside the excluded content categories?
    definition: 'Blocking denies access to a commercial website in its entirety, while filtering limits
      access only to certain content on a given website; both count whether carried out by the Government
      or by Internet intermediaries as the Government requires (Guide p.69). The concern is limiting commercial
      websites or web content on broadly defined public-policy grounds, such as public morality or national
      security, without clear or objective criteria (Guide p.69).

      '
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - Blocking a whole website scores higher than filtering specific content on it (Guide p.70).
    - 'Every blocking technique counts: IP address and protocol-based, deep packet inspection, URL and DNS
      blocking (Guide p.70).'
    scoring_tree:
    - if: 'Any blocking measure: access to a commercial website or online service is denied in its entirety,
        by the Government or by an intermediary as the Government requires (Guide pp.69-70; Methodology
        sheet 9.1).'
      score: 1
    - if: 'Any filtering measure and no blocking measure: access is limited only to certain content on a
        given commercial website (Guide pp.69-70; Methodology sheet 9.1).'
      score: 0.5
    - else:
        score: 0
        meaning: No case of blocking or filtering commercial web content, or blocking only of excluded content
          such as internationally agreed illegal content or child pornography (Methodology sheet 9.1; Guide
          p.70).
    coding_rules:
    - 'Score per measure: each blocking measure scores 1 and each filtering measure scores 0.5 (Guide p.70).'
    - 'EVIDENCE TYPE: practice-based indicator. Record legal bases that empower or require blocking and
      documented instances of blocking; enforcement and practice sources such as government blocking announcements
      and technical monitoring reports may be recorded and scored here, not only primary law (Internal Guide
      p.8; Extraction slides pp.8-9, 21).'
    - Use the named secondary sources (Global Network Initiative, World Intermediary Liability Map, Freedom
      House on the Net) to reach the primary source wherever one exists (Guide p.70).
    - 'A legal power or duty to block on broad grounds counts without a documented incident: the Guide''s
      examples are a best-efforts ban on content against the public interest or national harmony, and powers
      to block for national security, public order and crime prevention (Guide p.69; workbook round2 Lao
      PDR row 60).'
    - 'The stated ground does not decide the case: Government blocking may rest on political or public-policy
      justifications and is recorded when it impacts commercial websites (Internal Guide p.14), but not
      when the content blocked is itself political, criminal, age-restricted, defamatory or otherwise non-commercial
      (Guide p.70).'
    - A measure letting authorities block an entire service for failing registration or local-branch duties
      is a blocking measure (workbook round2 Indonesia row 107; workbook round2 Russian Federation row 72).
    - A measure that allows blocking whole websites is scored as blocking even if it also allows removal
      or filtering of specific content (Methodology sheet 9.1; Guide p.70).
    - Workbook practice records ancillary fines on ISPs that fail to block at 0, while the blocking duty
      itself carries the score (workbook round2 Russian Federation rows 68 and 70).
    exceptions:
    - Do not score blocking or filtering of political content, criminal content (e.g. child pornography),
      age-restricted content, defamation or other non-commercial content (Indicator Reference note; Guide
      p.70).
    - Do not score blocking or filtering based on intellectual property violations such as copyright-infringing
      content; it is not considered a restriction (Guide p.70; workbook round1 Australia row 54).
    - Do not record blocking of services that are already illegal in the economy, such as illegal betting
      apps or unauthorised remote gambling sites, as commercial web content (workbook round2 India row 118;
      Hands-on deck p.10).
    disambiguation:
    - 'TRAP: an intermediary''s duty to monitor content, or to remove or block illegal content, is 8.4;
      add a 9.1 row only when the measure blocks or filters commercial web content (Guide p.67; Internal
      Guide p.13; Guide p.11).'
    - 'TRAP: the same instrument often carries both an 8.4 row and a 9.1 row, so check both (workbook round2
      Indonesia rows 102 and 107; workbook round2 Russian Federation rows 65 and 70).'
    - 'TRAP: a government ban on named applications may be an import ban on online services, 10.1; the workbooks
      code India''s 2020 ban of 267 apps as 10.1 but a later app-blocking wave as 9.1 (Guide p.74; workbook
      round2 India rows 119 and 125).'
    - 'TRAP: network-wide disruption of Internet access or online services is 9.2 Internet shutdowns, which
      is non-regulatory and not extracted; do not map shutdown powers to 9.1 (Guide p.70; Non-regulatory
      note; Internal Guide p.8).'
    - A duty to open a local branch or entity is 3.5 (a representative-only duty is 12.8); the access restriction
      imposed for breaching it is 9.1 (Guide pp.27-28; Guide pp.87-88; workbook round2 Russian Federation
      row 72).
    - The registration or licensing precondition itself is recorded under 9.4; blocking a service that has
      not registered is 9.1 (workbook round2 Indonesia rows 107 and 122).
    guide_examples:
    - 'Brunei Darussalam: bans, or requires licensed Internet service providers and online content providers
      to use their best efforts to ban, online content against the public interest or national harmony (Guide
      p.69).'
    - 'Türkiye: authorities may block or remove online content for national security, public order and crime
      prevention; social network providers with over one million daily users must remove or block illegal
      content within 24 hours of notification, on pain of fines, advertising bans or bandwidth throttling
      (Guide p.69).'
    sources:
      guide_pages:
      - 69
      - 70
      methodology_row_round1_db: 46
      faq_pages:
      - 8
      - 13
      - 14
      template_row: 49

