  - takedown notice
  - actual knowledge
  - expeditiously remove
  - disable access
  - mere conduit
  - caching
  - storage at the direction of a user
  definition_text: 'A statutory shield limits the liability of Internet intermediaries (access providers, hosts,
    caching, search and platform services) for copyright infringement by their users, usually if they lack knowledge
    and remove material on notice. Inverted polarity: no shield scores 1; a shield only in a sectoral law such as
    an e-commerce or telecoms rule scores 0.5; a horizontal shield scores 0. General intermediary exemptions count
    for copyright too.

    '
  exemplar_law_types:
  - copyright acts (service-provider liability limits, notice-and-takedown)
  - civil codes (IP liability of information intermediaries)
  - information technology or electronic transactions acts (general intermediary immunity)
  - regulations on the right of communication over information networks
  - e-commerce regulations (intermediary liability exemptions)
  scope_patterns:
    horizontal: copyright act, civil code or IT act covering intermediaries in all sectors (SG Copyright Act 2021,
      RU Civil Code Art. 1253.1, IN IT Act s.79)
    sectoral: e-commerce or telecommunications instruments that limit intermediary liability (ID GR 80/2019; Georgia's
      e-commerce law in the Guide)
  negative_signals:
  - rights-holder remedies (injunctions, takedown procedures) with no liability limit for intermediaries -> 4.6
  - shield limited to non-copyright unlawful content -> 8.2 (a general shield counts for both)
  - duty to prevent infringement or block infringing works, with no shield -> 8.4
  - blocking of copyright-infringing websites -> not scored under 9.1
  spec_note: 'No trustworthy score-1 exemplar: the only score-1 row (Lao PDR row 50) conflicts with Guide p.65 footnote
    40. See notes.md.'
'8.2':
  name: Lack of safe harbour for other illegal activities
  keywords:
  - safe harbour
  - safe harbor
  - intermediary liability
  - third-party material
  - third party content
  - network service provider
  - shall not be subject to any civil or criminal liability
  - not liable for
  - innocent carrier
  - mere conduit
  - hosting provider
  - exempt from liability
  - actual knowledge
  - remove or disable access
  - notice and takedown
  - illegal content
  - prohibited content
  - good faith
  - interactive computer service
  - electronic system operator
  definition_text: 'A provision shields Internet intermediaries from civil or criminal liability for users'' unlawful
    content or conduct other than copyright infringement (harmful, defamatory or prohibited material), typically
    if they did not initiate it, lacked knowledge and removed it promptly. Inverted polarity: no shield scores 1;
    a shield only in a sectoral rule (e.g. e-commerce operators) 0.5; a horizontal shield 0. Copyright-only safe
    harbours do not count.

    '
  exemplar_law_types:
  - electronic transactions acts (network service provider exemption)
  - information technology acts and intermediary due-diligence rules
  - e-commerce and electronic system operator regulations
  - computer crime acts with ministerial notice-and-takedown procedures
  - provider liability or harmful digital communications acts
  scope_patterns:
    horizontal: exemption for all network service providers or intermediaries (SG Electronic Transactions Act s.26;
      IN IT Rules 2021; TH computer-crime notice procedure)
    sectoral: exemptions confined to e-commerce operators or private electronic system operators (ID GR 80/2019,
      MOCI Reg 5/2020)
  negative_signals:
  - copyright- or IP-only safe harbour -> 8.1
  - copyright offences (illicit streaming devices, sharing access to infringing works) -> 8.1 context, not 8.2
  - duty to remove or block content on notice or direction -> 8.4 (and 9.1 if commercial web content is blocked)
  - general information-security, secrecy or transparency laws with no intermediary clause -> not a safe harbour
    (8.2 stays 1 if nothing else exists)
  spec_note: Only one clean score-1 row (Russian Federation row 61); the Mongolia score-1 rows rest on laws that
    never address intermediary liability.
'8.3':
  name: User identity requirements
  keywords:
  - real name
  - real-name
