  - the privacy act's own investigation powers may be warrant-gated (score 0) while the CPC is not — cite the CPC
'8.1':
  name: Lack of safe harbour for copyright infringements
  keywords:
  - safe harbour
  - safe harbor
  - service provider shall not be liable
  - not liable for infringement
  - limitation of liability
  - exempt from liability
  - network service provider
  - online service provider
  - information intermediary
  - intermediary service provider
  - copyright infringement
  - infringing material
