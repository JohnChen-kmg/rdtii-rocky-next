  definition_text: 'A de minimis rule sets a value ceiling for imported goods below which no customs duty or border
    tax is collected. The indicator grades that ceiling: no de minimis rule at all is the most restrictive case,
    a threshold below USD 200 is intermediate, and a threshold of USD 200 or more is the least restrictive. Values
    are converted to USD at IMF rates. Found in customs codes, tariff laws and postal or courier import rules.

    '
  exemplar_law_types:
