  - ban limited to government entities or government devices -> 2.1 (Internal Guide p.11; workbook round1 Australia
    row 5)
  - bans on e-waste, used ICT products or raw materials such as rare earths -> not scored (Internal Guide pp.7,
    14)
  - blocking or filtering of websites and web content -> 9.1 (Guide p.69)
  - domestic-content threshold that a banned product failed to meet -> 10.3 (Guide pp.75-76)
  spec_note: Row scores are per measure. Only one 0.5 row in the pool (Lao PDR row 66). E-waste, counterfeit and
    obscene-media bans were scored 0 in the workbooks.
