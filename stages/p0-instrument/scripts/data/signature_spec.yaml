  - critical information infrastructure
  - computer misuse
  - computer crimes
  - cybercrime
  - incident response
  - cybersecurity service provider
  - cyber threat
  - network security
  - information security
  - CII
  - security of computer systems
  definition_text: 'Whether the economy has a dedicated cybersecurity legal framework: cybersecurity-specific laws
    applying horizontally (score 0), versus reliance on other laws to govern cyber threats or dedicated laws limited
    to specific sectors (0.5), versus no cybersecurity framework (1). INVERTED polarity.'
  exemplar_law_types:
  - dedicated cybersecurity acts (SG CA 2018, MY Act 854, TH CSMA, MN, CN CSL)
  - computer-crimes/misuse statutes (offence-focused predecessors)
  - critical-infrastructure security acts + strategies (non-dedicated mixtures)
  scope_patterns:
    horizontal: a dedicated framework act covering all sectors -> 0
    sectoral: cyber rules per sector / scattered provisions -> 0.5
  negative_signals:
  - 'INVERTED POLARITY: a dedicated horizontal act means score 0'
  - pending bills are not scored (enforced measures only)
  - the same act's access powers may separately evidence 7.5
  spec_note: No score-1 exemplar exists in the Round 1/Round 2 economies.
'7.3':
  name: Minimum period of data retention requirements
  keywords:
  - retain for
  - retained for
  - kept for
  - preserve for
  - maintain records for
  - not less than
  - at least
  - minimum period
  - for a period of
  - years from
  - months from
  - retention period
  - keep records
  - log retention
  - call detail record
  - subscriber records
  definition_text: A requirement that data be retained for AT LEAST a specified minimum period (days, months, years
    — or permanently), typically so authorities can access it for investigations. About DURATION, not location.
    Requirements to not keep data longer than necessary are maximum-period rules and are NOT scored.
  exemplar_law_types:
  - telecom/interception acts and licences (12-24 month data retention)
  - tax and companies acts (5-7 year record keeping)
  - employment acts
  - AML/KYC and financial regulations
  - e-commerce transaction rules
  - cyber-café / intermediary rules
  scope_patterns:
    horizontal: rare — general record-keeping mandates
    sectoral: telecom, tax, accounting, employment, banking/AML — the usual carriers
  negative_signals:
  - '''not longer than necessary'' / ''as long as necessary'' retention-limitation principles -> score 0 (maximum-period
    rule)'
  - permissive 'may be retained for N years' without obligation -> 0
  - where the copy must be located -> 6.2
  - retention requirements on government data are not scored
