# Curated retrieval vocabulary per indicator (Stage C content; not mined from the workbooks). Keys are decimal IDs.
# Pillars 6-7 migrated from Round 1; other pillars drafted 2026-09-13, pending review.
'1.4':
  name: Trade defence measures including anti-dumping, countervailing duties and safeguards on ICT-related goods
    imported by other economies within the considered United Nations region
  keywords:
  - anti-dumping duty
  - antidumping duty
  - anti-dumping measure
  - definitive anti-dumping duty
  - provisional anti-dumping duty
  - countervailing duty
  - countervailing measure
  - safeguard measure
  - safeguard duty
  - dumping margin
  - injury to the domestic industry
  - sunset review
  - expiry review
  - originating in or exported from
  - trade remedy
  - subsidized imports
  - subsidised imports
  - Customs (ADD)
  definition_text: 'An economy is enforcing anti-dumping duties, countervailing duties or safeguard measures on
    ICT goods or ICT-related goods, meaning finished products and components such as cables, power transformers,
    circuit boards, optical fibre or aluminium strips, imported from other economies in the region. Each active
    measure adds 0.25, up to 1. Investigations not yet in force, terminated measures and raw materials do not count.

    '
  exemplar_law_types:
  - customs notifications imposing anti-dumping or countervailing duties
  - trade remedy authority final findings and sunset or expiry review rulings
  - ministry of commerce announcements on anti-dumping measures
  - regional economic commission decisions on anti-dumping duties (e.g., Eurasian Economic Commission)
  - anti-dumping, countervailing duty and safeguard acts (reference rows only)
  scope_patterns:
    horizontal: trade remedy acts and investigating authorities; on their own they score 0 unless an active measure
      hits ICT goods
    sectoral: product-specific duty notices naming HS codes and origin economies (optical fibre, printed circuit
      boards, calculators, transformers, cables, aluminium strips)
  negative_signals:
  - anti-dumping duty on raw materials such as rare earths, lithium, cobalt or silicon -> not scored
  - investigation opened but no duty in force, or a terminated or expired measure -> not scored
  - trade remedy act with no active measure on ICT goods -> not scored
  - import ban on ICT goods -> 10.1
  - import quota or import licensing on ICT goods -> 10.2
  spec_note: Workbook rows score each measure 0.25 (one Australia row bundles two measures at 0.5); no row carries
    0.75 or 1, which exist only as economy totals.
'2.1':
  name: Foreign exclusions from public procurement related to ICT goods and digital services
  keywords:
  - public procurement
  - government procurement
  - public tenders
  - domestic goods
  - domestic products
  - domestic suppliers
  - local supplier
  - non-local supplier
  - foreign supplier
  - foreign bidder
  - foreign-owned
  - international tender
  - international competitive bidding
  - not available domestically
  - cannot be obtained
  - ban on the procurement
  - eligible to bid
  - national treatment
  definition_text: 'A procurement measure bars foreign firms, or foreign goods and services, from public tenders
    for ICT goods or digital services, or bans named foreign companies or economies. Letting foreign bidders in
    only when no domestic supplier can meet demand is also an exclusion. Quotas, price preferences and local-content
    conditions are limitations (2.3); a bare legal power to exclude scores 0.

    '
  exemplar_law_types:
  - public or government procurement acts and implementing regulations
  - presidential or government regulations on procurement of goods and services
  - domestic-preference public procurement orders
  - information technology or information security laws restricting state bodies' use of foreign products
  - foreign investment laws guaranteeing equal access to procurement (score-0 reference rows)
  scope_patterns:
    horizontal: procurement laws closing tenders to foreign goods or suppliers across sectors, including ICT
    sectoral: product- or service-specific bans (messenger services, security products, mobile phones, listed electrical
      equipment)
  negative_signals:
  - quota, set-aside, price preference or local-content condition that still lets foreign bidders compete -> 2.3
  - condition to hand over source code or use a specific encryption standard to win a tender -> 2.2
  - ban on importing a foreign product, not limited to procurement -> 10.1
  - clause empowering the government to restrict foreign participation, with no implementing measure -> not scored
  - nationality rules limited to construction or other non-digital procurement -> not scored
  spec_note: Round2 Indonesia rows 6-9 code local-content, quota and price-preference rules as 2.1 = 1; the Guide
    treats these as 2.3 limitations, so they were not curated.
'2.2':
  name: Specific requirements on source codes, encryption and trade secrets
  keywords:
  - source code
  - submit the source code
  - source code and documentation
  - escrow
  - trade secret
  - patented technology
  - transfer of technology
  - exclusive rights
  - royalty-free
  - encryption
  - encryption standard
  - cryptographic
  - custom software
  - software developer
  - public electronic system
  - public procurement
  - tender
  - bidding
  definition_text: 'A public procurement rule makes taking part in or winning a tender conditional on handing over
    source code, trade secrets or patent rights (score 1), or on using a specific encryption standard (score 0.5).
    Typical cases are custom software for public electronic systems and software registers for government buyers.
    Disclosure duties outside procurement belong to 4.9; encryption standards in general belong to 11.4.

    '
  exemplar_law_types:
  - electronic systems and transactions regulations (software for public institutions)
  - public procurement acts and software procurement guidelines
  - e-government open source or open standards policies
  - encryption and information security rules for public information systems
  scope_patterns:
    horizontal: procurement laws requiring all bidders to disclose code or trade secrets, or to use a set encryption
      standard
    sectoral: custom software for public electronic systems, e-governance applications, security products for classified
      systems
  negative_signals:
  - duty to disclose source code or algorithms to a regulator outside procurement -> 4.9
  - national encryption algorithm or standard imposed generally -> 11.4
  - procuring entity must keep bidders' trade secrets confidential -> not scored
  - exclusion of foreign software suppliers from tenders -> 2.1
  - intellectual property statute with no tender condition -> not scored
  spec_note: No 0.5 (encryption-to-win) row exists in either workbook; only two score-1 rows (Indonesia source code,
    India open-source policy).
'2.3':
  name: Limitations in procurement bidding
  keywords:
  - price preference
  - preference margin
  - domestic preference
  - local content
  - domestic component level
  - reserved for
  - set aside
  - annual procurement target
  - micro and small enterprises
  - small and medium-sized enterprises
  - indigenous business
  - locally manufactured goods
  - domestically manufactured
  - bid price discount
  - price evaluation preference
  - procurement quota
  - priority procurement
  - Made in
  definition_text: 'A procurement rule limits participation without closing tenders to foreign bidders: quotas or
    set-asides, preferences for certain suppliers, or price preferences, triggered by supplier nationality, a status
    such as SME or indigenous, or local content. Discriminating against foreign bidders, or two or more equal-treatment
    limits, scores 1; a single local-content or performance condition applied to all bidders scores 0.5.

    '
  exemplar_law_types:
  - public procurement acts and implementing instructions
  - domestic-preference and local-content procurement orders
  - SME, micro and small enterprise or indigenous procurement policies
  - industrial regulations obliging use of domestic products in procurement
  - ministerial regulations on promoted goods lists (innovation lists, made-in marks, digital catalogues)
  scope_patterns:
    horizontal: procurement-wide price preferences, SME quotas and domestic-product obligations
    sectoral: product lists (electronics, telecom equipment, cyber security products, radio-electronic products,
      cloud services)
  negative_signals:
  - foreign bidders barred, or admitted only if no domestic supplier exists -> 2.1
  - local content requirement for products sold in the commercial market -> 10.3
  - target price set the same way for all applicants -> not scored
  - source code or encryption condition for winning tenders -> 2.2
  - clause that only empowers the government to adopt preferences -> not scored
  spec_note: Round2 rows score almost every limitation 1, including single local-content rules such as the Guide's
    own Indonesia transmission-tower example; round1 Australia rows keep per-measure 0.5.
'3.1':
  name: Foreign equity limits in sectors relevant to digital trade
  keywords:
  - foreign equity
  - foreign ownership
  - foreign shareholding
  - foreign capital
  - foreign investment shall not exceed
  - percent of the shares
  - prohibited for foreign investment
  - negative list
  - positive investment list
  - minority stake
  - wholly owned by citizens
  - foreign participation in the authorized capital
  - state-owned enterprise
  - broadcasting
  - mass media
  - foreign business
  - foreign direct investment policy
  - government route
  definition_text: 'A law caps or bans foreign equity in firms in sectors relevant to digital trade other than telecom
    and e-commerce, such as broadcasting, online media, computer services or fintech, in private firms or state-owned
    enterprises. A ban, or minority caps in two or more sectors, scores 1; a minority cap in one sector 0.8; a majority
    cap, or limits only in SOEs, 0.5; full ownership allowed 0.

    '
  exemplar_law_types:
  - foreign investment laws and negative or positive investment lists
  - FDI policy circulars and press notes
  - broadcasting and mass media acts
  - state-owned enterprise and privatisation laws
  - financial regulator rules on e-money, fintech or lending platform ownership
  - foreign business acts
  scope_patterns:
    horizontal: foreign business acts, investment lists and SOE-wide caps (recorded only under 3.1)
    sectoral: broadcasting, online news and publishing, audiovisual services, satellites, digital payments, peer-to-peer
      lending
  negative_signals:
  - foreign equity cap on telecommunications services or network licences -> 5.2
  - foreign equity cap on e-commerce or online retail businesses -> 12.01
  - requirement to invest through a joint venture with a local partner -> 3.2
  - approval needed above an ownership threshold -> 3.4
  - government-held shares in telecom companies -> 5.3
  spec_note: 'Rows are scored per measure; the economy total rises to 1 when minority caps exist in several sectors
    (reviewer note, round2 Indonesia row 26). No clean 0.5 controlling-stake row: 85% caps are coded 0.8.'
'3.2':
  name: Joint venture requirements
  keywords:
  - joint venture
  - joint-venture company
  - joint venture with a local
  - form a joint venture
  - local partner
  - domestic partner
  - in partnership with
  - partnership between
  - consortium
  - consist of at least two
  - jointly established
  - cooperation with a domestic enterprise
  - local participation
  - equity joint venture
  - contractual joint venture
  - national partner
  definition_text: 'A measure requires foreign investors or firms to form a joint venture, partnership or consortium
    with local firms or nationals in order to invest or operate in the economy, for example to supply VPN, IPTV
    or digital banking services. Any such requirement scores 1. Laws that only define voluntary joint ventures,
    equity caps without a mandated partner, and duties to train local staff are not joint venture requirements.

    '
  exemplar_law_types:
  - foreign investment or investment promotion laws
  - telecom and value-added service regulations (VPN, IPTV)
  - financial regulator rules on bank ownership
  - sectoral opening measures for pilot free trade zones
  - foreign business acts
  scope_patterns:
    horizontal: investment laws that make local partners mandatory for foreign investors
    sectoral: VPN, IPTV, digital banking, printing and advertising businesses
  negative_signals:
  - foreign equity cap with no mandated local partner -> 3.1
  - foreign bidders must team up with domestic firms to join public tenders -> 2.1
  - foreign postal operators must cooperate with local delivery companies -> 12.2
  - employer must pair foreign workers with local counterparts -> not scored
  - law only defines how a voluntary joint venture is formed -> not scored
  spec_note: Round2 Indonesia rows 27 and 30 code the same IPTV consortium rule as 1 and 0.
'3.3':
  name: Nationality or residency requirements for board of directors or managers
  keywords:
  - director
  - board of directors
  - resident director
  - ordinarily resident
  - reside in
  - residency
  - domicile
  - citizens of
  - nationality
  - nationals
  - managing director
  - manager
  - chief executive officer
  - majority of directors
  - positions closed to foreign
  - foreign manpower
  - local director
  - resident in the country
  definition_text: 'A law requires at least one board member or manager to be a national or resident of the economy,
    whether for all companies under company law or in digital-trade sectors such as broadcasting or internet services.
    Any such requirement scores 1. Rules for officers who are neither directors nor managers, such as company secretaries
    or chief accountants, and general local-hiring quotas do not count.

    '
  exemplar_law_types:
  - companies acts (resident director rules)
  - public companies acts
  - foreign business acts
  - FDI policy conditions for broadcasting services
  - manpower regulations reserving positions for nationals
  - banking regulator rules on executive bodies
  scope_patterns:
    horizontal: company-law resident director rules applying to every company
    sectoral: 'broadcasting, internet service providers, banks: nationality or residency of directors, CEO or key
      managers'
  negative_signals:
  - residency or nationality rule only for officers who are not directors or managers -> not scored
  - quota for local employees in the workforce -> not scored
  - foreign equity cap in the same provision, outside telecom and e-commerce -> 3.1
  - duty to appoint a local representative or contact point for online services -> 12.8
  spec_note: Beyond absence rows the pool has one true boundary negative (Russian chief accountant rule); round2
    India row 27 carries no director rule.
'3.4':
  name: Screening of investment and acquisitions
  keywords:
  - foreign investment review
  - security review
  - national security review
  - prior approval
  - government approval route
  - investment screening
  - foreign acquisition
  - acquisition of control
  - strategic importance
  - strategic enterprises
  - national interest
  - call-in
  - controlled business
  - designated entity
  - prohibit the investment
  - divest
  - notify the authority before acquiring
  - foreign state-owned
  definition_text: 'A mechanism lets the government review, approve, condition or block foreign investment or acquisitions
    in sectors relevant to digital trade, on national security, public order or economic grounds. One mechanism
    scores 0.25, two or more 0.5, and a documented case of blocking an investment in a digital-trade sector 1. Merger
    control run purely for antitrust purposes is excluded unless it discriminates.

    '
  exemplar_law_types:
  - foreign investment and foreign acquisitions acts
  - national security review measures and strategic sector laws
  - FDI policy approval-route rules
  - controlled-business decrees and investment promotion laws
  - sectoral acts requiring approval of stakes in media or telecom licensees
  - official announcements of blocked or unwound deals (practice evidence)
  scope_patterns:
    horizontal: economy-wide national security or economic-benefit screening of foreign investment
    sectoral: media, telecom, encryption, online platforms, VPN and other controlled online activities
  negative_signals:
  - competition-law merger review applied to all firms -> not scored
  - foreign equity cap or prohibition -> 3.1
  - blocked deal outside digital-trade sectors -> not scored
  - telecom operating licence conditions -> 5.5
  spec_note: 'Practice-based (Internal Guide p.8). Both workbook score-1 rows are doubtful (Australia: rare earths;
    India: pending approvals), so no score-1 exemplar is curated; 0.5 appears only as an economy total.'
'3.5':
  name: Commercial presence requirements to offer cross-border services in sectors relevant to digital trade
  keywords:
  - commercial presence
  - establish a branch
  - register a branch
  - incorporate a local company
  - locally incorporated
  - incorporated in
  - juristic person under
  - legal entity established
  - representative office
  - place of business
  - registered office
  - local office
  - subsidiary
  - foreign company
  - carry on business
  - established under the laws of
  - physical office
  - permanent establishment
  definition_text: 'A measure requires foreign service providers to set up a commercial presence, meaning a local
    branch, subsidiary, incorporated company or office, before supplying services in sectors relevant to digital
    trade (GATS Mode 3). It may sit in company law or in licence conditions for telecom, satellite, broadcasting,
    gaming or large online platforms. Any requirement scores 1; registration without a physical or operational presence
    does not.

    '
  exemplar_law_types:
  - companies acts (foreign company branch and registered office provisions)
  - telecom, satellite and broadcasting licensing regulations
  - laws on large foreign internet platforms
  - internet information service regulations
  - FDI policy operating conditions
  scope_patterns:
    horizontal: company law requiring a foreign company carrying on business to incorporate locally or register
      a branch or place of business
    sectoral: licence eligibility limited to locally established companies (telecom, satellite, broadcasting, online
      services)
  negative_signals:
  - duty to appoint a local agent, legal representative or contact point while serving remotely -> 12.8
  - business registration with no physical or operational presence -> not scored
  - licensing scheme for online content services as such -> 9.4
  - foreign equity cap inside licence conditions, outside telecom and e-commerce -> 3.1
  spec_note: Only two score-0 rows (both Lao PDR). The same company-law and platform-law provisions appear as 12.8
    = 0 rows (round1 Singapore row 92; round2 Russian Federation row 108).
'4.01':
  name: Patent application issues
  keywords:
  - patent application
  - application for a patent
  - patent agent
  - patent attorney
  - industrial property agent
  - authorized representative
  - address for service
  - non-resident applicant
  - foreign applicant
  - residing abroad
  - filing abroad
  - foreign filing licence
  - foreign filing license
  - secrecy direction
  - confidential examination
  - translation into
  - official language
  - qualifications of applicants
  definition_text: 'A patent-law provision that restricts the patent application process. The strongest form requires
    foreign or non-resident applicants to act through a local patent agent, attorney or representative, or allows
    discriminatory rejection. Lighter procedural burdens on all applicants include filing domestically or obtaining
    security clearance before filing abroad and translating the application into a local language.

    '
  exemplar_law_types:
  - patents acts and patent laws
  - patent rules and ministerial regulations issued under the patent act
  - general intellectual property laws or codes
  - civil code parts on intellectual property
  - patent office regulations on PCT national-phase filing
  scope_patterns:
    horizontal: patent statutes apply to all inventions in all sectors; workbook rows are coded Horizontal
    sectoral: 'rare: rules confined to PCT national-phase filings or to inventions made in the economy'
  negative_signals:
  - compulsory licence or government use of a granted patent -> 4.3
  - court or administrative remedies and provisional measures for patent infringement -> 4.2
  - local agent required only for enforcement-related matters -> 4.3
  - membership of, or filing through, the Patent Cooperation Treaty -> not scored (4.4 is non-regulatory)
  - trademark or industrial design filing agent rules -> not scored (patent-only indicator)
  spec_note: 'No score-0.5 row exists: the only procedural-only row (round1 Singapore row 16) is scored 1, against
    Guide p.30. Host ID "4.01" is not "4.1" (trade secrets).

    '
'4.2':
  name: 'Patent enforcement issues: civil and administrative procedures and remedies; and provisional measures'
  keywords:
  - patent infringement
  - infringement proceedings
  - action for infringement
  - injunction
  - interim injunction
  - temporary injunction
  - preliminary injunction
  - provisional measures
  - provisional determination
  - damages
  - account of profits
  - seizure of infringing goods
  - destruction of infringing goods
  - preservation of evidence
  - civil remedies
  - administrative enforcement
  - Commercial Court
  - Civil Procedure Code
  definition_text: 'Whether the patent legal framework gives right holders civil and administrative procedures and
    remedies (lawsuits, damages, administrative handling of infringement) and provisional measures (urgent orders
    to stop infringement, keep infringing goods out of commerce or preserve evidence), following TRIPS Articles
    42-50. Civil codes and procedure laws count. Absence scores 1; one element 0.5; both 0.

    '
  exemplar_law_types:
  - patents acts (infringement and remedies chapters)
  - civil procedure codes (temporary injunction orders)
  - general intellectual property laws
  - civil code parts on intellectual property
  - laws on enforcement of intellectual property rights
  scope_patterns:
    horizontal: patent remedies and court procedures apply to all sectors; all workbook rows are coded Horizontal
      or Patent
    sectoral: not observed; specialised IP courts or divisions are institutional, not sectoral
  negative_signals:
  - compulsory licensing or government use provisions -> 4.3
  - copyright infringement remedies, notice-and-takedown or site blocking -> 4.6
  - criminal offences and fines only, with no civil or administrative route -> not scored as 4.2 evidence
  - provisional protection of a published application before grant -> not scored (not a TRIPS Art.50 provisional
    measure)
  - local agent or foreign-filing rules at the application stage -> 4.01
  spec_note: 'Absence-based polarity: 1 when both elements are missing. All 10 workbook rows score 0, so there is
    no 0.5 or 1 example.

    '
'4.3':
  name: 'Patent enforcement issues: others'
  keywords:
  - compulsory licence
  - compulsory license
  - government use
  - use without authorization of the right holder
  - exploitation without permission
  - working of the patent
  - local working
  - non-working
  - national emergency
  - extreme urgency
  - adequate remuneration
  - public non-commercial use
  - revocation of the patent
  - term of protection
  - rights of the patentee
  - limitation period
  - patent agency
  definition_text: 'Other restrictions on enforcing patents: state intervention that curtails patent holders'' rights,
    terms of protection that discriminate against foreign applicants, or burdens such as a local agent for enforcement
    matters. Exceptions consistent with TRIPS Articles 30, 31 and 31bis, including compulsory licences and government
    use with remuneration, are not restrictions. Scope and number of measures set the score.

    '
  exemplar_law_types:
  - patents acts (compulsory licence and government use parts)
  - civil code patent chapters
  - general intellectual property laws
  - laws on administrative infringement enforcement
  - patent laws with local working requirements
  scope_patterns:
    horizontal: restriction on patent rights across all circumstances and sectors (1 when high impact)
    sectoral: measure limited to one case or sector, e.g. a specific product field (0.5 unless TRIPS-consistent)
  negative_signals:
  - TRIPS-consistent compulsory licence or government use with remuneration -> not scored
  - presence or absence of infringement lawsuits, injunctions or provisional measures -> 4.2
  - local agent or pre-filing security clearance at the application stage -> 4.01
  - government access to trade secrets or source code -> 4.9
  spec_note: 'All 10 workbook rows score 0; no 0.5 or 1 example. Internal Guide p.12 files the TRIPS Art.31 FAQ
    under "4.2 (Patent enforcement)", but its content matches this indicator (Guide p.31).

    '
'4.5':
  name: Lack of copyright framework and exceptions
  keywords:
  - fair use
  - fair dealing
  - exceptions to copyright
  - limitations on copyright
  - permitted use
  - free use
  - acts not constituting infringement
  - not an infringement of copyright
  - research or private study
  - criticism or review
  - reporting of current events
  - parody or satire
  - quotation
  - teaching purposes
  - normal exploitation of the work
  - unreasonably prejudice the legitimate interests
  - non-commercial purposes
  - copyright act
  definition_text: 'Whether a copyright law exists and what exceptions it adopts. A flexible fair use test or a
    fair dealing regime (listed purposes plus a fairness requirement) scores 0. Exceptions limited to a three-step
    test or a closed list of permitted uses score 0.5. No copyright law, or no exceptions at all, scores 1. Inverted
    polarity: a clear exception regime lowers the score.

    '
  exemplar_law_types:
  - copyright acts
  - civil code copyright chapters
  - general intellectual property laws
  - copyright amendment acts (fair dealing and accessibility exceptions)
  scope_patterns:
    horizontal: copyright statutes and their exception chapters apply to all works and sectors
    sectoral: exceptions for specific users or works (libraries, education, print-disabled persons) inside the same
      statute
  negative_signals:
  - infringement remedies, injunctions, notice-and-takedown or blocking of pirate sites -> 4.6
  - safe harbour protecting intermediaries from liability for user infringement -> 8.1
  - exceptions to patent rights (TRIPS Art.30) -> 4.3
  - accession to the WIPO Copyright Treaty or WPPT -> not scored (4.7 and 4.8 are non-regulatory)
  - piracy-rate statistics or trade watch-list reports -> not scored (not legislation; see notes)
  spec_note: 'TRAP: inverted polarity. Guide p.33 puts closed-list exceptions at 0.5, but several civil-law rows
    with that structure are scored 0 (see notes). No score-1 row.

    '
'4.6':
  name: 'Online copyright enforcement issues: civil and administrative procedures and remedies; and provisional
    measures'
  keywords:
  - copyright infringement
  - online infringement
  - infringing copies
  - injunction
  - interim injunction
  - dynamic injunction
  - notice and takedown
  - takedown notice
  - disable access
  - blocking order
  - online location
  - provisional measures
  - preservation of evidence
  - damages
  - statutory compensation
  - account of profits
  - network service provider
  - seizure
  definition_text: 'Whether the copyright legal framework gives right holders civil and administrative procedures
    and remedies and provisional measures against infringement, including online: lawsuits and damages, administrative
    penalties, injunctions, orders to disable access to infringing online locations, and orders preserving evidence.
    General civil and procedural laws count. Absence scores 1; one element 0.5; both 0.

    '
  exemplar_law_types:
  - copyright acts (remedies, takedown and site-blocking parts)
  - civil code copyright liability chapters
  - computer crime laws with court orders to block IP-infringing data
  - rules of court and IP court procedures
  - court judgments granting dynamic injunctions
  scope_patterns:
    horizontal: copyright remedies apply to all works; online tools (takedown, blocking) sit in the same horizontal
      statute
    sectoral: film or broadcast piracy laws (e.g. cinematograph acts) covering one content type
  negative_signals:
  - copyright exceptions, fair use or fair dealing -> 4.5
  - conditions for intermediary safe harbour from liability -> 8.1
  - government blocking of commercial websites on non-IP grounds -> 9.1
  - patent infringement procedures and remedies -> 4.2
  - piracy prevalence or enforcement statistics -> not scored (see notes)
  spec_note: 'Absence-based polarity. All 13 workbook rows score 0; round2 Thailand row 29 records a switch from
    1 to 0 under a de jure approach.

    '
'4.9':
  name: Mandatory disclosure of trade secrets, such as source code and algorithms
  keywords:
  - source code
  - algorithm
  - trade secret
  - disclosure
  - submit the source code
  - escrow
  - decryption
  - decrypt
  - encryption key
  - means of encryption
  - technical assistance
  - technical support
  - confidential business information
  - undisclosed information
  - unfair commercial use
  - technical documentation
  - access to information constituting a trade secret
  - national security
  definition_text: 'A government mandate requiring firms to disclose trade secrets such as source code, algorithms,
    decryption means or other confidential technical information. Not scored when the state protects the disclosed
    information against unfair commercial use. Without safeguards, a duty limited to certain products or circumstances
    scores 0.5; a sector-wide or horizontal duty, or several limited duties, scores 1.

    '
  exemplar_law_types:
  - information technology and cybersecurity laws (decryption or technical assistance duties)
  - counter-terrorism and national security laws
  - electronic systems and transactions regulations (source code submission or escrow)
  - trade secrets acts (state disclosure exceptions)
  - criminal procedure codes (access to encrypted data)
  scope_patterns:
    horizontal: duty on any person in charge of a computer resource, or on all network operators
    sectoral: duty limited to one product type or circumstance, e.g. custom software for public-sector systems
  negative_signals:
  - trade secret definitions, owner rights and misappropriation remedies -> 4.1
  - source code surrender as a condition of winning public tenders -> 2.2
  - source code or key disclosure when certifying encryption products -> 11.4
  - government access to personal data without judicial authorisation -> 7.5 (record both when one provision fits
    both)
  - algorithm filing that records only descriptive information -> not scored
  spec_note: 'Tier B. Name corrects the reference typo "souce". Every workbook row scored 0.5 or 1 falls inside
    a Guide p.37 carve-out (procurement or encryption); see the codebook and notes.

    '
