    '
'5.7':
  name: Lack of independent telecom authority
  keywords:
  - independent regulator
  - regulatory authority
  - regulatory commission
  - body corporate
  - statutory body
  - independence
  - ministerial direction
  - the Minister may give directions
  - appointment of members
