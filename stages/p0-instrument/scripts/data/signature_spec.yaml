  - removal from office
  - conflict of interest
  - budget of the Commission
  - industry levy
  - not subject to the direction
  - telecommunications regulatory authority
  - dissolution of the regulatory body
  definition_text: 'Whether telecommunications are supervised by an authority independent of operators, the Government
    and other interested parties. Functional independence: decisions without government or operator approval, limited
    and defined overrides, equal treatment of SOEs and rivals. Institutional and financial independence: separation
    from operators, stable budget, control of staff. Inverted polarity: no independent authority scores 1.

    '
  exemplar_law_types:
  - regulator establishment acts
  - telecommunications acts (authority and ministerial powers)
  - presidential or state council decrees on ministry structure
  - regulations dissolving or merging regulatory bodies
  - regulator staff and appointment regulations
  scope_patterns:
    horizontal: not observed; converged communications regulators may also cover broadcasting and media
    sectoral: telecom or ICT regulator established by statute or decree
  negative_signals:
  - Government ownership of telecom operators -> 5.3
  - commitment to the WTO Telecom Reference Paper -> not scored (5.6 is non-regulatory)
  - independence of data protection or competition authorities -> not scored
  - appeal tribunal for telecom disputes on its own -> not scored as the regulator
  spec_note: 'TRAP: inverted polarity (an independent regulator scores 0). The Guide does not say how many independence
    criteria must fail for a score of 1 (see notes).

    '
'6.1':
  name: Ban and local processing requirements
  keywords:
  - shall not transfer
  - prohibited from transferring
  - ban on transfer
  - cross-border transfer
  - transfer outside
  - outside the country
  - outside the Federation
  - processed locally
  - local processing
  - process within
  - processed within the territory
  - data localization
  - onshore processing
  - domestic processing
  - may not be transferred
  - transfer of personal data abroad
  definition_text: A law prohibits, per se, the cross-border transfer of data, or mandates that certain data be
    processed domestically (processing = collection, organization, structuring, storage, adaptation, use, disclosure,
    dissemination). A complete prohibition with no compliant transfer path, or an obligation that processing happen
    only in-country. Higher restriction when it covers personal data generally or applies horizontally across all
    sectors.
  exemplar_law_types:
  - comprehensive data-protection statutes (transfer-prohibition provisions)
  - sectoral health-records laws
  - financial/credit-reporting regulations
  - ride-hailing / platform-sector interim measures
  - national payment-system laws
  scope_patterns:
    horizontal: prohibition/processing mandate on personal data across all sectors
    sectoral: health records, credit data, ride-hailing, payment data, single-country bans
  negative_signals:
  - transfer permitted when conditions met (consent/adequacy/approval) -> 6.4
  - copy must remain in-country while transfer allowed -> 6.2
  - must build/use local server or data centre -> 6.3
  - bank-secrecy/confidentiality disclosure rules are not transfer bans
  - measures on government data are not scored
'6.2':
  name: Local storage requirements
  keywords:
  - copy stored
  - stored locally
  - store within
  - kept in
  - maintained in
  - stored in the country
  - retained in
  - local storage
  - store a copy
  - shall be kept at
  - registered office
  - data storage within
  - store user data within
  - maintain their databases in
  definition_text: A law mandates that a copy of certain data be stored within the economy; the data may still be
    transferred abroad as long as a domestic copy remains. About the LOCATION of a copy, not the duration of retention
    and not a mandate to build infrastructure. Higher restriction when it covers personal data generally or applies
    across sectors.
  exemplar_law_types:
  - comprehensive data-protection laws (storage provisions)
  - companies/accounting acts
  - tax acts (records retained in-country)
  - social-media/user-data localization rules
  - health-information administrative measures
  - payment-systems directives
  scope_patterns:
    horizontal: personal-data storage mandate across sectors (e.g. CN PIPL, RU 152-FZ)
    sectoral: accounting records, tax records, health data, payment data
  negative_signals:
  - duration-based record-keeping (keep for N years, location-free) -> 7.3
  - requirement to establish a data centre/server -> 6.3
  - processing (not just storage) must be domestic -> 6.1 (record both if both)
  - measures on government data are not scored
'6.3':
  name: Infrastructure requirements
  keywords:
  - data centre
  - data center
  - local server
  - server located
  - servers within
  - physically located
  - establish a data
  - local infrastructure
  - computing facilities
  - hosted in
  - store in servers
  - maintain at least one local server
  - contingency data processing centre
  definition_text: A law mandates establishing or using dedicated local physical infrastructure — a data centre
    or in-country server — as a precondition for providing services using data. Unlike a storage rule (which can
    be satisfied by renting existing facilities), this obliges the provider to set up or use local infrastructure.
  exemplar_law_types:
  - platform-sector measures (ride-hailing, online publishing, maps)
  - personal-data laws with database-location provisions (RU 152-FZ)
  - financial-regulator rules (data centre in-country)
  - ministerial/technical orders on server location
  scope_patterns:
    horizontal: rare — usually a general database-location provision in the DP law
    sectoral: ride-hailing, maps, online publishing, banking/finance, sensitive-data servers
  negative_signals:
  - licensing/registration to build or operate data centres -> indicator 9.4, out of scope
  - operational/technical rules on existing data centres (security, privacy) -> not scored
  - copy-in-country rules satisfiable by renting -> 6.2
  - measures on government data are not scored
'6.4':
  name: Conditional flow regimes
  keywords:
  - unless
  - except in accordance
  - subject to the following conditions
  - adequate level of protection
  - comparable standard of protection
  - adequacy
  - consent of the data subject
  - explicit consent
  - prior authorization
  - prior approval
  - security assessment
  - standard contractual clauses
  - binding corporate rules
  - whitelist
  - specified in the Gazette
  - transfer impact assessment
  definition_text: 'Cross-border data transfer is permitted only if conditions are satisfied: data-subject consent,
    adequacy or equivalence of protection in the destination, contractual safeguards or self-assessment, or government
    approval/authorization. The drafting is often a default prohibition with exceptions — that pattern is a conditional
    flow regime, not a ban, because a compliant transfer path exists.'
  exemplar_law_types:
  - comprehensive data-protection statutes (cross-border transfer sections)
  - privacy principles in omnibus acts (e.g. APP 8)
  - sectoral codes of practice (banking, communications)
  - central-bank/cloud outsourcing rules
  - CAC-style security-assessment provisions
  scope_patterns:
    horizontal: conditions on personal data generally (scores 1 even if sector-specific)
    sectoral: conditions limited to specific NON-personal data categories score 0.5
  negative_signals:
  - complete prohibition with no compliant path -> 6.1
  - transfer freely allowed except to blacklisted countries -> 6.1 at 0.5, not 6.4
  - conditions applied to government data are not scored
'7.1':
  name: Lack of comprehensive legal framework for data protection
  keywords:
  - personal data protection act
  - data protection law
  - privacy act
  - personal information protection
  - data subject rights
  - right of access
  - rectification
  - erasure
  - data portability
  - data controller
  - data processor
  - processing of personal data
  - privacy principles
  - breach notification
  definition_text: 'Whether the economy has a comprehensive data-protection legal framework: a horizontal law applying
    across sectors with detailed provisions on data subjects'' rights and obligations (access, rectification, erasure,
    portability) covering collection, processing and cross-border transfer of personal data. INVERTED: a comprehensive
    law scores 0; sectoral-only 0.5; none 1.'
  exemplar_law_types:
  - omnibus data-protection statutes (PDPA, Privacy Act, PIPL, DPDP)
  - sectoral data-protection codes (banking, communications, health) — recorded as complements
  scope_patterns:
    horizontal: the omnibus act itself -> controlling evidence, score 0
    sectoral: sector codes/rules exist but no omnibus law -> 0.5
  negative_signals:
  - 'INVERTED POLARITY: finding a strong comprehensive law means score 0, never 1'
  - sectoral complements are recorded but do not change the indicator score when a horizontal law exists
  - constitutional privacy rights alone are not a framework
  spec_note: No score-1 exemplar exists in the Round 1/Round 2 economies (all have some framework). Score 1 = documented
    absence of any DP legal framework.
'7.2':
  name: Lack of dedicated legal framework for cybersecurity
  keywords:
  - cybersecurity act
