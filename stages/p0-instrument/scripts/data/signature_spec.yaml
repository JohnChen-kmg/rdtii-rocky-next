  - shared use of telecommunications infrastructure
  - essential facilities
  - critical support infrastructure
  - non-discriminatory access to infrastructure
  - right of way
  - reference offer
  - mandatory standard on access
  definition_text: 'Whether telecom operators must share passive (non-electronic) infrastructure such as buildings,
    sites, towers, masts, poles, ducts and cabinets with other operators. A mandatory sharing obligation scores
    0. Sharing that is voluntary but practised, or mandated only case by case or on request, scores 0.5. No obligation
    scores 1. Active network sharing (radio access, core) is a different concept.

    '
  exemplar_law_types:
  - telecommunications acts
  - regulator notifications on infrastructure sharing
  - government decrees on access to infrastructure
  - omnibus investment laws amending telecom rules
  - telecom competition codes of practice
  - mandatory standards on access
  scope_patterns:
    horizontal: 'rare: general rules on access to transport or energy infrastructure for network deployment'
    sectoral: telecom-sector obligations on licensees, dominant operators or infrastructure owners, fixed or mobile
  negative_signals:
  - active infrastructure or spectrum sharing only -> not scored as passive sharing
  - network interconnection obligations -> not scored as passive sharing
  - functional or accounting separation for SMP operators -> 5.4
  - consultation papers or pending sharing regulations -> not scored (not enforced)
  spec_note: 'TRAP: inverted polarity (a sharing mandate scores 0). No score-1 row in the workbooks.

    '
'5.2':
  name: Foreign equity limits in telecom sector
  keywords:
  - foreign equity
  - foreign ownership
  - foreign shareholding
  - foreign capital contribution
  - foreign investors
  - shall not exceed 49
  - per cent of the shares
  - foreign-invested telecommunications enterprise
  - aggregate foreign ownership
  - individual foreign investor
  - voting shares
  - controlling interest
  - local shareholding
  - foreigner
  - network facilities provider
  - telecommunications licensee
  - foreign direct investment
  definition_text: 'A cap on the share of a telecommunications company that foreign persons may hold, in private
    operators or in state-owned telecom companies. A ban, or minority-only caps in more than one measure, scores
    1; a single minority-only cap 0.8; a cap that still allows control, or caps only on SOEs, 0.5; full foreign
    ownership 0. Broadcasting and horizontal FDI caps belong to Pillar 3.

    '
  exemplar_law_types:
  - regulations on foreign-invested telecom enterprises
  - telecommunications business acts (licence eligibility tied to foreign shareholding)
  - privatised-incumbent acts (e.g. ownership caps on the former state operator)
  - FDI policy circulars and investment lists
  - regulator licensing guidebooks
  scope_patterns:
    horizontal: horizontal FDI or SOE caps are recorded under 3.1, not 5.2
    sectoral: caps specific to telecom operators, telecom licence types or the incumbent
  negative_signals:
  - foreign equity caps in broadcasting, media or other digital sectors -> 3.1
  - foreign equity caps in the e-commerce sector -> 12.01
  - prior approval or screening of acquisitions -> 3.4
  - Government's own shareholding in operators -> 5.3
  - local incorporation required to hold a licence -> 3.5
  spec_note: 'No score-1 row. Several horizontal SOE caps appear under both 3.1 and 5.2 in the workbooks, contrary
    to Guide p.25 (see notes).

    '
'5.3':
  name: Shares owned by the Government in telecom companies
  keywords:
  - state-owned enterprise
  - state enterprise
  - government-owned
  - wholly owned by the Government
  - government shareholding
  - shares held by the State
  - Ministry of Finance
  - sovereign wealth fund
  - government-linked
  - incumbent operator
  - national telecommunications company
  - retain full ownership
  - privatisation
  - shareholding pattern
  - market share
  - annual report
  - golden share
  definition_text: 'How much of each telecom operator the Government owns, directly or through state entities, and
    the operator''s market presence. Practice-based: evidence includes shareholding records, annual reports, regulator
    market reports and SOE lists, as well as ownership statutes. Ownership above 50% in one company, or 1-50% in
    several companies, scores 1; 1-50% in one company 0.5; none 0.

    '
  exemplar_law_types:
  - statutes requiring state ownership of an operator (e.g. national broadband company acts)
  - company annual reports and shareholding pattern filings
  - telecom regulator market reports
  - SOE lists of finance or SOE ministries
  - privatisation laws fixing minimum state holdings
  scope_patterns:
    horizontal: SOE and privatisation laws that fix state holdings across sectors (check which telecom companies
      they reach)
    sectoral: ownership of specific telecom operators, fixed or mobile, including indirect holdings
  negative_signals:
  - foreign equity caps on telecom operators -> 5.2
  - regulator owning or controlling an operator -> 5.7
  - temporary state control of networks in emergencies -> not scored (not ownership)
  - state-owned postal or broadcasting companies -> not scored (outside Pillar 5)
  spec_note: 'Practice-based indicator (Internal Guide p.8): factual secondary sources are admissible evidence.
    The score counts companies, so a row-level score can differ from the economy-level score.

    '
'5.4':
  name: Lack of functional/accounting separation
  keywords:
  - accounting separation
  - separate accounts
  - separate accounting
  - regulatory financial statements
  - cost allocation
  - cross-subsidisation
  - cross-subsidization
  - functional separation
  - operational separation
  - structural separation
  - significant market power
  - dominant licensee
  - dominant operator
  - wholesale and retail
  - accounting separation report
  - separation of network operations
  definition_text: 'Whether operators with significant market power must separate their businesses. Accounting separation
    keeps separate books so the costs, revenues and assets of each service can be identified; functional (operational
    or structural) separation splits units such as network and retail. Both mandated scores 0; functional only 0.25;
    accounting only 0.5; neither 1. Inverted polarity.

    '
  exemplar_law_types:
  - regulator notifications on accounting separation reports
  - accounting separation regulations or guidelines
  - telecommunications acts (SMP and separation powers)
  - ministerial orders on separate accounting
  - carrier licence conditions declarations
  scope_patterns:
    horizontal: not observed; separation duties are telecom-specific
    sectoral: SMP or dominant telecom operators, or all licensees above a turnover threshold
  negative_signals:
  - passive infrastructure sharing or access duties on dominant operators -> 5.1
  - general accounting standards or statistical reporting to the regulator -> not scored
  - abuse-of-dominance prohibition without a separation mandate -> not scored
  - other licence conditions -> 5.5
  spec_note: 'TRAP: inverted polarity with four levels (1, 0.5, 0.25, 0). No reliable 0.25 row (round2 Lao PDR row
    31 contradicts itself).

    '
'5.5':
  name: Licensing requirements in telecom sector for operators
