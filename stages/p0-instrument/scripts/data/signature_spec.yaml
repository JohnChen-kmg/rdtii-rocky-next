  definition_text: 'A law obliges Internet intermediaries to police user content: monitor users'' activities, pre-screen
    posts, run mandated filters, moderation systems or algorithms that detect prohibited content, or remove or block
    content deemed illegal, including by deadlines after a notice or official direction. Any removal or blocking
    duty scores 1; a monitoring duty with no removal or blocking obligation scores 0.5; none scores 0.

    '
  exemplar_law_types:
  - internet or information management decrees and laws
  - online safety codes of practice and online harms acts
  - content service conditions and communications content codes
  - counter-terrorism laws (content monitoring and deletion)
  - intermediary guidelines and electronic system operator regulations
  - platform-specific provisions (apps, comment services, generative AI)
  scope_patterns:
    horizontal: duties on all ISPs, hosts or website owners (RU 149-FZ, CN NPC Decision 2012, LA Decree 164/Gov,
      AU abhorrent violent material offences)
    sectoral: designated social media, comment, app, generative AI or e-commerce services; licensed ISPs and content
