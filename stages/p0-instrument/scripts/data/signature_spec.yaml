  definition_text: 'A government blocks or filters commercial web content, or requires internet service providers
    and platforms to do so. Blocking denies access to a whole website or online service; filtering restricts only
    certain content on it. Covers blocking powers on broad grounds such as national security or public order, DNS,
    IP, URL or deep packet inspection blocking, and blocking of services that ignore registration or local-branch
    rules.

    '
  exemplar_law_types:
  - information technology / internet content laws and intermediary rules
  - ISP licensing and operation rules
  - cybercrime, computer-crime and offences acts
  - broadcasting, online safety and communications acts (operator blocking duties and systems)
  - laws on foreign internet entities and electronic system operator registration
  - government blocking announcements and technical monitoring reports (practice evidence)
  scope_patterns:
    horizontal: general power to block any online information or resource on broad grounds (national security, public
      order, morality, violation of law)
    sectoral: 'blocking tied to a service type or regime: online news media, VPNs, apps, unregistered electronic
      system operators, foreign platforms'
  negative_signals:
  - copyright or other IP site-blocking injunction -> not scored (IP exclusion, Guide p.70)
  - blocking child sexual abuse, terrorist, violent, pornographic or already-illegal gambling content -> not scored
    (excluded content)
  - intermediary duty to monitor, or to remove/block user content on notice -> 8.4 (add 9.1 only if commercial web
    content is blocked)
  - government ban on named (often foreign) applications -> 10.1 (check; may be recorded under both)
  - power to shut down or take control of networks -> not scored (9.2 Internet shutdowns is non-regulatory)
  spec_note: 'Practice-based indicator: documented instances and secondary sources may be recorded (Internal Guide
    p.8). No score-0.5 (filtering) row exists in the Round 1/Round 2 workbooks; the 0.5 branch is Guide-only.

    '
