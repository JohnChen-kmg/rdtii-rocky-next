  name: Lack of effective trade secrets legal framework
  keywords:
  - trade secret
  - trade secrets
  - confidential information
  - breach of confidence
  - undisclosed information
  - know-how
  - commercial secret
  - manufacturing secret
  - organizational secret
  - misappropriation
  - unfair competition
  - commercial value
  - reasonable measures to keep it confidential
  - unauthorized disclosure
  - non-disclosure agreement
  - springboard
  - trade secret regime
  definition_text: 'Whether the economy protects trade secrets effectively: confidential business or commercially
    valuable information shielded from unauthorised acquisition, use or disclosure by enforceable statutes, unfair-competition
    or criminal provisions, or established common-law breach-of-confidence doctrine, with remedies such as injunctions
    and damages. Inverted polarity: effective protection in any form scores 0; narrow coverage 0.5; none 1.

    '
  exemplar_law_types:
  - dedicated trade secrets acts
  - anti-unfair competition laws
  - criminal codes (infringement of trade secrets)
  - civil code chapters on know-how
  - general intellectual property laws with trade secret clauses
  - court judgments on breach of confidence
  scope_patterns:
    horizontal: dedicated statute, or common-law doctrine, protecting all confidential business information
    sectoral: narrow clauses, e.g. confidentiality offences confined to one enforcement act or to company officers
  negative_signals:
  - government power to demand source code or other trade secrets -> 4.9
  - confidentiality duty of officials handling information obtained in investigations -> not scored (safeguard evidence
    for 4.9)
  - personal data protection law -> 7.1
  - copyright or patent protection of software -> not scored
  - patent application rules carrying host ID 4.1 by mistake -> 4.01
  spec_note: 'TRAP: inverted polarity, and ID hazard (host "4.1" is the Guide''s 10th pillar-4 indicator). The only
    score-1 row (round2 Indonesia row 35) is a mis-tagged patent-application row.

    '
'5.1':
  name: Lack of passive infrastructure sharing
  keywords:
  - infrastructure sharing
  - passive infrastructure
  - co-location
  - colocation
  - tower sharing
  - towers
  - masts
  - ducts
  - poles
