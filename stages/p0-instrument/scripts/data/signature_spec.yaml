  definition_text: 'A measure that flatly prohibits bringing ICT goods into the economy (network equipment, servers,
    handsets, receivers, storage media) or bars named online services and applications, whether the ban targets
    ICT products alone or is a general prohibited-goods list that includes them. One ban on a single product weighs
    less than a ban on several products or several bans.

    '
  exemplar_law_types:
  - customs prohibition-of-imports orders and prohibited-goods schedules
  - telecommunications acts and dealer regulations listing prohibited equipment
  - import-export of goods acts and ministerial prohibition notifications
  - IT acts and blocking rules used to ban named mobile applications
  - customs-union non-tariff measure decisions (e.g. EAEU prohibited-goods list)
  - regulator notifications suspending imports of a specific device
  scope_patterns:
    horizontal: general customs prohibition lists or import-export acts whose schedules include ICT items (MY, RU,
