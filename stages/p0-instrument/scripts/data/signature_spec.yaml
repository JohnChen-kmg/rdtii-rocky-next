    users'' identity (names, ID numbers or documents, phone numbers, biometrics) before users may connect to the
    Internet or use online services such as social media, messaging, forums, apps or cyber cafés (score 1), or only
    when registering a SIM card (score 0.5). Identity checks that are merely encouraged are not a requirement.

    '
