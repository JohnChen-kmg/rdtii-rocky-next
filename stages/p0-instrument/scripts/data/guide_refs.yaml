  asks_page: 75
  scoring_page: 76
'10.4':
  guide_heading: Export restrictions on ICT goods and online services
  guide_pages:
  - 76
  asks: This indicator covers export restrictions on ICT goods and services. These restrictions include export bans,
    export licenses and other restrictions limiting the number of goods or services to be exported.
  asks_page: 76
  scoring_page: 76
'11.1':
  guide_heading: Technical standards issues
  guide_pages:
  - 78
  - 79
  asks: This indicator asks whether (a) participation from relevant stakeholders, including foreign businesses,
    is not allowed or restricted in the standard-setting of the standards in sectors relevant to digital trade,
    and (b) whether there are transparent public consultation or engagement mechanisms exist.
  asks_page: 78
  scoring_page: 79
'11.2':
  guide_heading: Self-certification limitations for product safety (radio transmissions, EMC/EMI)
  guide_pages:
  - 79
  asks: This indicator asks whether the self-certification of product safety by suppliers is not allowed. Certification
    refers to a process of verifying that imported products meet domestic standards.
  asks_page: 79
  scoring_page: 79
'11.3':
  guide_heading: Product screening and testing requirements
  guide_pages:
  - 80
  asks: The indicator asks whether an economy imposes an additional screening or testing requirement on ICT imports.
    Additional screening or testing refers to processes where products are required to undergo further technical
    tests beyond standard conformity assessments to verify certain aspects of compliance before they are allowed
    into the market.
  asks_page: 80
  scoring_page: 80
'11.4':
  guide_heading: Deviation from international encryption standards
  guide_pages:
  - 80
  - 81
  asks: The indicator asks whether an economy adopts encryption standards that deviate from internationally recognized
    standards based on the principles in the International Organization for Standardization (ISO) and International
    Electrotechnical Commission (IEC) encryption standards.
  asks_page: 80
  scoring_page: 81
