  scoring_page: 87
'12.8':
  guide_heading: Local presence requirements
  guide_pages:
  - 87
  - 88
  asks: This indicator asks whether an economy imposes local presence requirements on online service providers.
    The 'local presence requirement' requires companies to have a physical representative office, local agent, legal
    representative or a post-box within the economy to provide their services.
  asks_page: 87
  scoring_page: 88
'12.9':
  guide_heading: Lack of legal framework for online consumer protection
  guide_pages:
  - 88
  asks: This indicator asks whether an economy has adopted an online consumer protection legal framework. The domestic
    laws of consumer protection need not be specific to e-commerce.
  asks_page: 88
  scoring_page: 88
