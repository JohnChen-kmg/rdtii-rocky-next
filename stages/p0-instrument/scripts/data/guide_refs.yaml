'12.5':
  guide_heading: Low de minimis
  guide_pages:
  - 86
  asks: The indicator asks whether an economy adopts a threshold for the de minimis rule. The de minimis rule sets
    a valuation ceiling for goods below which no duty or tax is charged at the border to ensure the flow of digital
    trade.
  asks_page: 86
  scoring_page: 86
'12.6':
  guide_heading: Imposition of customs duties on electronic transmission
  guide_pages:
  - 86
