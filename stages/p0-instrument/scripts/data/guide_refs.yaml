    directors or managers.
  asks_page: 26
  scoring_page: 26
'3.4':
  guide_heading: Investment screenings
  guide_pages:
  - 26
  - 27
  asks: This indicator asks whether (a) an economy has adopted any screening mechanism for foreign investment or
    mergers and acquisitions (M&A) in sectors relevant to digital trade, excluding those implemented solely for
