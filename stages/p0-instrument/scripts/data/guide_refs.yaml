'1.4':
  guide_heading: Trade defence measures, including anti-dumping, countervailing duties and safeguards on ICT goods
    and ICT-related goods imported by other economies within the considered United Nations region
  guide_pages:
  - 16
  - 17
  asks: The indicator looks at whether an economy is enforcing trade defence measures such as anti-dumping duties,
    countervailing duties, and safeguard measures against ICT goods and ICT-related goods imported from any economy
    in the considered region.
  asks_page: 16
  scoring_page: 17
'2.1':
  guide_heading: Foreign exclusions from public procurement
  guide_pages:
  - 19
  asks: This indicator covers measures that exclude foreign enterprises from public procurement, including for ICT
    goods and online services.
  asks_page: 19
  scoring_page: 19
'2.2':
  guide_heading: Specific requirements on source code, encryption and trade secrets
  guide_pages:
  - 19
  - 20
  asks: 'The indicator asks: (a) whether firms are required to surrender source code, encryption or other trade
    secrets, or to transfer ownership of exclusive rights to use IP such as patented technology, as a condition
    for successful public procurement and (b) whether firms are required to use a specific encryption standard to
    be successful for their bidding.'
  asks_page: 19
  scoring_page: 20
'2.3':
  guide_heading: Limitations in procurement bidding
  guide_pages:
  - 20
  asks: This indicator covers limitations on participation in public procurement.
  asks_page: 20
  scoring_page: 20
