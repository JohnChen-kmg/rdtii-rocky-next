  asks_page: 60
  scoring_page: 61
'7.5':
  guide_heading: Requirements to allow government access to personal data
  guide_pages:
  - 62
  asks: The indicator asks whether the Government can access personal data without the explicit authorization of
    an independent judicial body, such as a court decision, a judicial warrant or an equivalent order issued by
    a truly independent tribunal with due process safeguards.
  asks_page: 62
  scoring_page: 62
'8.1':
  guide_heading: Lack of safe harbour for copyright infringements
  guide_pages:
  - 64
  - 65
  asks: This indicator asks whether an economy has a safe harbour provision for copyright infringement. A safe harbour
    provision protects the Internet intermediaries from legal liability for certain activities performed by their
    users.
  asks_page: 64
  scoring_page: 65
'8.2':
  guide_heading: Lack of safe harbour for other illegal activities
  guide_pages:
  - 65
  - 66
  asks: This indicator asks whether an economy has a safe harbour provision for illegal activities other than copyright
    infringement. As mentioned, a safe harbour provision protects the Internet intermediaries from legal liability
    for certain activities performed by their users.
  asks_page: 65
  scoring_page: 66
'8.3':
  guide_heading: User identity requirements
  guide_pages:
  - 66
  - 67
  asks: The indicator asks whether an economy imposes user identity requirements. The ‘user identity requirement’
    mandates that Internet intermediaries verify and record accurate personal information of their users as a condition
    for accessing their services or networks.
  asks_page: 66
  scoring_page: 67
'8.4':
  guide_heading: Monitoring requirements
  guide_pages:
  - 67
  asks: The entry asks whether an economy imposes content monitoring requirements. The ‘monitoring requirement’
    mandates that Internet intermediaries actively monitor the users’ activities or remove or block content that
    is deemed illegal to avoid legal liability due to such content.
  asks_page: 67
  scoring_page: 67
'9.1':
  guide_heading: Blocking or filtering commercial web content
  guide_pages:
  - 69
  - 70
  asks: This indicator asks whether there have been any instances of blocking or filtering commercial web content
    either by a Government or Internet intermediaries as required by the Government
  asks_page: 69
  scoring_page: 70
'9.3':
  guide_heading: Online advertising requirements
  guide_pages:
  - 71
  asks: The indicator covers requirements for online advertising. The measures could be limitations affecting online
    advertising, but exclude general consumer protection measures, such as prohibitions on misleading or false advertising,
    and restrictions on specific products and services (e.g., weapons, drugs, tobacco, alcohol, or medicine) for
    public health or safety reasons.
  asks_page: 71
  scoring_page: 71
'9.4':
  guide_heading: Licensing requirements for online service providers
  guide_pages:
  - 71
  - 72
  asks: It asks whether (a) the ICPs are subjected to licensing requirements to operate their business, and (b)
    whether the licensing requirement is considered as a “strict” requirement, in that they have the potential to
    block businesses from operating their services.
  asks_page: 71
  scoring_page: 72
