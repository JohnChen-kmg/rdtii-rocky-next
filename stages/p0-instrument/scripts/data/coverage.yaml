# What the tool automates, and what kind of thing each indicator's answer is (decisions D13 and D14).
# Read by scripts/build_indicator_order.py, which writes these marks into output/indicator_order.yaml.
#
# Source: the coverage register, RDTII Finale Plan/3_Final_Stage/COVERAGE_AND_MANUAL_CHECKS.md
# (generated 2026-09-20, revised 2026-09-21). The nature codes below were read from its tables on
# 2026-10-04. The register and this file must agree; the validator compares them when
# RDTII_COVERAGE_REGISTER points at the register.
#
# To make the tool automate another indicator: add its pillar to automated_pillars, or its ID to
# automated_indicators, then rebuild. The mapping stage maps the automated set by default.

register: "RDTII Finale Plan/3_Final_Stage/COVERAGE_AND_MANUAL_CHECKS.md (generated 2026-09-20, revised 2026-09-21)"

classes:
  automated: "retrieved, extracted, mapped and verified by the tool"
  manual: "in scope for the index, but not automated: every row or null row carries a manual-check notice with the reason. The mapping stage can still run it on request (INDICATORS_SCOPE)"
  excluded: "non-regulatory: the host fills it from external databases and treaty status; no row is written"

reasons:        # the mapping stage's three reason categories (its decision M9), by key
  scope: "outside the automated scope"
  practice: "practice or external evidence"
  portal_tier: "the tier that answers it is not published by this economy's portal"

nature_codes:   # what kind of thing the answer is; the first code on an indicator is the operative one
  L: "a rule's existence, in primary legislation"
  Dg: "a number or a list set by delegated legislation, published in the official gazette or legislation database"
  Dr: "a number, list or procedure set by a regulator or administrative body"
  T: "a technical specification, in a standards document"
  F: "a fact or a practice: who owns shares, what is actually blocked, whether screening was ever applied"
  W: "an international trade posture: measures in force, participation in a moratorium"

# A manual indicator whose operative code is one of these gets the reason "practice": no legal
# instrument states its answer, in any economy.
outside_any_law_database: [F, T, W]

automated_pillars: [6, 7]      # decision D14; the mapping stage's M7
automated_indicators: []       # single indicators to automate beyond those pillars

