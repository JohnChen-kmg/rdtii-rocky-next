# Reviewed label flags on host rows (gold_id -> status, basis, reason). build_gold.py writes them into
# gold/gold_set.jsonl. Two statuses are set here:
#   suspect   the score contradicts an explicit host rule, or the row is filed under the wrong indicator;
#             never used as an exemplar
#   advisory  the score is defensible but rests on a judgement the reader should know about
# basis says which review made the call: round1_review (pillars 6-7, July 2026) or
# drafting_review_2026-10-04 (the other pillars; made while drafting, not confirmed by a person).
# host_marked and candidate flags are computed by build_gold.py and are not listed here.
