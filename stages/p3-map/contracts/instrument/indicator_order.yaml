- '9.2'
- '12.10'
- '12.11'
- '12.12'
- '12.13'
practice_based:
  '3.4': 'Screening of investment: the top score needs a case where screening blocked an investment (Internal Guide
    p.8; Methodology sheet 3.4)'
  '5.3': 'Government shares in telecom companies: ownership facts from SOE lists, market reports and company records
    (Internal Guide pp.8, 12)'
  '9.1': 'Blocking or filtering commercial web content: blocking practice can be evidenced by official announcements
    and secondary reports (Internal Guide pp.8, 14)'
host_mapping_traps:
- template_row: 79
  text: 'The five mapping traps checked every round:'
- template_row: 80
  text: 7.1 and 7.2 are ECONOMY-LEVEL — does the framework exist, answered once per economy. Per-provision citations
    of a data-protection or cybersecurity act tagged 7.1/7.2 are not discoveries and score zero.
- template_row: 81
  text: 7.3 needs a SPECIFIED minimum duration ('5 years'). A 'prescribed period' with no number, a notification
    deadline or an appeal window is not a retention rule.
- template_row: 82
  text: 7.5 is government access to PERSONAL data without independent judicial authorisation — not generic inspection
    of business records, and not a secrecy duty with a court-order carve-out.
- template_row: 83
  text: 6.2 is data STORED in-country — a storage locus, not general record-keeping.
- template_row: 84
  text: 6.1 vs 6.4 — 'must not transfer UNLESS [condition]' is a conditional flow regime (6.4), not an outright
    ban (6.1).
- template_row: 85
  text: Drafts, repealed provisions, and an amending act cited in place of the principal act all score zero.
coverage_marks:
  register: RDTII Finale Plan/3_Final_Stage/COVERAGE_AND_MANUAL_CHECKS.md (generated 2026-09-20, revised 2026-09-21)
  classes:
    automated: retrieved, extracted, mapped and verified by the tool
    manual: 'in scope for the index, but not automated: every row or null row carries a manual-check notice with
      the reason. The mapping stage can still run it on request (INDICATORS_SCOPE)'
    excluded: 'non-regulatory: the host fills it from external databases and treaty status; no row is written'
  reasons:
    scope: outside the automated scope
    practice: practice or external evidence
    portal_tier: the tier that answers it is not published by this economy's portal
  nature_codes:
    L: a rule's existence, in primary legislation
    Dg: a number or a list set by delegated legislation, published in the official gazette or legislation database
    Dr: a number, list or procedure set by a regulator or administrative body
    T: a technical specification, in a standards document
    F: 'a fact or a practice: who owns shares, what is actually blocked, whether screening was ever applied'
    W: 'an international trade posture: measures in force, participation in a moratorium'
  counts:
    automated: 9
    manual: 52
    excluded: 1
  economy_overrides:
    CN:
    - pillars:
      - 6
      reason: portal_tier
      evidence: 'coverage register, China section: the national database stops above departmental rules, so pillar
        6 is framework-only'
