# Generated by scripts/build_indicator_order.py from the host template's
# 'Indicator Reference' sheet. The one ordered list of indicator IDs; do not hand-edit.
source:
  workbook: reference/OUTPUT_TEMPLATE_FINAL_ROUND.xlsx
  sheet: Indicator Reference
  host_note: 'Source: ESCAP-RDTII-2.1 Round 1 Database, ''RDTII 2.1 Methodology'' sheet. Use these codes exactly,
    as text. Gaps in the numbering are intentional. Pillars 6 and 7 are mandatory for this hackathon; the sealed
    live task on 15 October may fall in any pillar.'
listed: 62
in_scope: 61
out_of_scope:
  '6.5': 'Non-regulatory: participation in agreements with binding data-transfer commitments is checked from treaty
    texts, not national legislation. The methodology sheet has no criteria row for it, its header says gaps in the
    ID sequence are intentional and the tool is not required to extract non-regulatory indicators, and the template
    note says it is not present in the database extract.'
non_regulatory_indicators:
- '1.1'
- '1.2'
- '1.3'
