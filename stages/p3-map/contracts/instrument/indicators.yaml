# PILLAR 9 — CONTENT ACCESS
# Where the measures live: Information-technology, cybercrime, broadcasting
# and media acts with blocking powers, electronic-system and platform
# regulations, government blocking orders, advertising laws and content codes,
# and licensing rules for news, broadcasting, social media, VPN, cloud and
# data-centre services. Internet shutdowns (9.2) come from V-Dem and are not
