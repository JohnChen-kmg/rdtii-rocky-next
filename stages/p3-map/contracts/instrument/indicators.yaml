  - id: "4.9"
    pillar: 4
    tier: B
    review_status: drafted 2026-09-13 at Tier A depth (Claude), additions 2026-10-04, not yet reviewed
    name: Mandatory disclosure of trade secrets, such as source code and algorithms
    category_official: Mandatory disclosure of trade secrets, such as souce code and algorithms
    weight: 0.22
    question: Does a law require firms to disclose trade secrets such as source code, algorithms or decryption
      means to a government authority without protecting that information against unfair commercial use?
    definition: Captures government mandates to disclose trade secrets, for example source code and algorithms
      (Guide p.37). A disclosure duty that comes with protection against unfair commercial use is not scored;
      without such safeguards, the score depends on how far the duty reaches, from specific products or
      circumstances up to a whole sector or all sectors (Guide p.37). The Guide's examples include encryption
      service providers declaring their source code and authorities' statutory access to trade secret information
      (Guide p.37).
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'safeguards: protection of the disclosed information against unfair commercial use means the duty
      is not scored (Guide p.37)'
    - 'scope: a duty affecting an entire sector or all sectors scores above one limited to specific products
      or circumstances (Guide p.37; Methodology sheet 4.9)'
    - 'number of measures: more than one limited-scope duty escalates to 1 (Guide p.37; Methodology sheet
      4.9)'
    - 'national-security basis: scored 0.5 or 1 according to scope, because the security ground is broad
      and unclear (Guide p.37 fn 22)'
    scoring_tree:
    - if: Without safeguards against unfair commercial use, a disclosure requirement affects an entire sector
        or all sectors horizontally, OR there is more than one limited-scope disclosure requirement of the
        kind described in the next branch (Guide p.37; Methodology sheet 4.9).
      score: 1
    - if: Without safeguards against unfair commercial use, one disclosure requirement of limited scope
        applies only to specific types of products or specific circumstances, such as disclosure through
        court orders, regulatory proceedings or a national-security provision aimed at certain companies
        (Guide p.37; Methodology sheet 4.9).
      score: 0.5
    - else:
        score: 0
        meaning: No disclosure requirement, or the Government mandates disclosure where needed to protect
          the public interest and safeguards the information against unfair commercial use (Guide p.37;
          Methodology sheet 4.9).
    coding_rules:
    - 'Check for safeguards before scoring: an exception that lets a state agency disclose trade secrets
      only for public health, safety or non-commercial public interest, with steps against unfair trading
      use, scores 0 (Guide p.37; workbook round2 Thailand row 31).'
    - A duty that becomes mandatory only in certain circumstances, such as source code held in escrow and
      released if the supplier fails, is a limited-scope requirement (Guide p.37).
    - A national-security justification does not remove the score; it is scored 0.5 or 1 depending on scope
      (Guide p.37 fn 22).
    - Host coders scored duties to hand over decryption information or give decryption assistance to security
      agencies under this indicator, at 1 when the duty is horizontal (workbook round2 India row 42; workbook
      round2 Russian Federation row 30).
    - Host coders scored a national-security duty on network operators to give technical support to security
      organs at 0.5 (workbook round2 China row 28).
    - Algorithm filing that records only descriptive information (service form, algorithm type, self-assessment)
      was judged not to disclose trade secrets (workbook round2 China row 28).
    - Escrow appears in the Guide only as a public procurement example. Where the duty to hand over or escrow
      source code is a condition of supplying software to public bodies, record it under 2.2 and not here;
      an escrow or conditional disclosure duty outside procurement is the limited-scope 0.5 case (Guide
      p.37; Guide p.19; workbook round2 Indonesia rows 10 and 41).
    - Where no disclosure mandate is found, record 0 and cite the laws searched as the governing rules (Guide
      p.12; workbook round1 Australia row 23; workbook round2 Mongolia row 20).
    exceptions:
    - Do not score disclosure requirements tied to public procurement here; Pillar 2 captures them (Guide
      p.37).
    - Do not score disclosure of source code or encryption keys demanded when certifying encryption products
      here; 11.4 captures it (Guide p.37; Guide p.81).
    - Do not score mandated disclosure that is needed to protect the public and is paired with safeguards
      against unfair commercial use (Guide p.37; Methodology sheet 4.9).
    disambiguation:
    - 'TRAP: a law that PROTECTS trade secrets (definitions, owner''s rights, remedies) is evidence for
      4.1, not a disclosure mandate, and scores 0 here (Guide pp.37-38; workbook round2 Lao PDR row 25).'
    - 'TRAP: surrendering source code, encryption or other trade secrets as a condition of public procurement
      is 2.2 (Guide p.19; Guide p.37). The host coded Indonesia''s public-sector source-code rule under
      2.2 at 1 and under 4.9 at 0.5, so map it to 2.2 and flag any 4.9 row for review (workbook round2 Indonesia
      row 10; workbook round2 Indonesia row 41).'
    - 'TRAP: an interception or decryption power can also be 7.5 when it gives the Government access to
      personal data without independent judicial authorisation; emit both rows (Guide p.62; workbook round2
      India row 98; workbook round2 Russian Federation row 58).'
    - Disclosure of proprietary information beyond ISO/IEC validation when certifying encryption products
      is 11.4 (Guide p.81).
    - 'Neither the Guide nor the methodology names judicial oversight as a safeguard: host coders scored
      warrant-based police access to decryption codes 0, while the methodology lists court-order disclosure
      at 0.5; treat such rows as review cases (workbook round1 Malaysia row 27; Methodology sheet 4.9).'
    - A duty to submit an invention for a confidentiality or secrecy examination before filing a patent
      abroad is a patent application procedure, 4.01 at 0.5, not a mandate to disclose trade secrets (Guide
      p.30; Guide p.37).
    - 'TRAP: powers that compel disclosure in proceedings are assessed here and do not lower the score of
      the trade secrets framework indicator 4.1; a host row cited criminal-procedure and trade-descriptions
      disclosure powers as a reason to score 4.1 at 0.5 (Guide pp.37-38; workbook round1 Malaysia rows 27
      and 28).'
    guide_examples:
    - 'Malawi: encryption service providers must declare their means of encryption and the source code of
      their software; the Guide names the Malawi Communications Regulatory Authority (Guide p.37).'
    - 'Solomon Islands: disclosure of trade secrets to panel members is mandatory in proceedings, and members
      may not disclose them further (Guide p.37).'
    - 'Turkmenistan: authorities may access trade secret information within their competence, handled under
      set procedures and not disclosed further (Guide p.37).'
    - 'Indonesia: escrow requirement for custom-made software, cited as a limited-scope, conditional disclosure
      (Guide p.37).'
    null_statement: no mandatory disclosure of trade secrets, source code or algorithms found in the corpus
    sources:
      guide_heading: Mandatory disclosure of trade secrets
      guide_pages:
      - 37
      - 38
      faq_pages: []
      methodology_row: 20
      template_row: 22

  - id: "4.1"
    pillar: 4
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Lack of effective trade secrets legal framework
    category_official: Lack of effective trade secrets legal framework
    weight: 0.14
    polarity: inverted
    level: economy
    framework_name: trade secrets legal framework that provides effective protection
    question: Does the economy lack a legal framework, in statute or case law, that effectively protects
      trade secrets against unauthorised acquisition, use or disclosure, or is its protection only limited
      in scope?
    definition: 'The indicator asks whether the economy has adopted a trade secrets legal framework that
      provides effective protection (Guide p.37). Effective protection means that confidential business
      information or commercially valuable data are protected from unauthorised acquisition, use or disclosure
      by clear and enforceable legal provisions or well-established common-law principles, and that right
      holders can take legal action against misappropriation, with remedies such as injunctions, damages
      and, where applicable, criminal sanctions (Guide p.37). The scope is protection under domestic law
      in any form: Acts, provisions and clauses in intellectual property or other laws, case law and common-law
      doctrine such as breach of confidence, so the absence of a standalone statute does not by itself mean
      a lack of protection (Guide p.38). Trade secrets are one of the three rights pillar 4 covers, and
      this is the last indicator in the pillar''s list, which the host numbers 4.1 (Guide p.29; Methodology
      sheet 4.1).'
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'existence: no trade secrets legal framework able to provide effective protection scores 1 (Guide
      p.38; Methodology sheet 4.1)'
    - 'coverage: protection that is limited in scope or only partially enforced, resting on narrow provisions
      without comprehensive coverage, scores 0.5 (Guide p.38; Methodology sheet 4.1)'
    - 'form does not matter: effective protection in any form, statutory or common law, scores 0 (Guide
      p.38; Methodology sheet 4.1)'
    scoring_tree:
    - if: 'Inverted polarity: the economy lacks a trade secrets legal framework that is able to provide
        effective protection (Guide p.38; Methodology sheet 4.1).'
      score: 1
    - if: 'Protection exists but is limited: narrow provisions without comprehensive coverage, limited practice
        or scope, or only certain clauses included in the intellectual property law or another relevant
        law (Guide p.38; Methodology sheet 4.1).'
      score: 0.5
    - else:
        score: 0
        meaning: 'A regime for effective trade secrets protection is present in any form: a dedicated act,
          provisions across several laws, or common-law doctrine enforced by the courts (Guide p.38; Methodology
          sheet 4.1).'
    coding_rules:
    - 'ECONOMY-LEVEL: answer once per economy. Cite the provision or doctrine that establishes protection
      (the trade secrets act''s definition and remedies sections, the unfair-competition or criminal-code
      articles, or the leading breach-of-confidence case); further laws or cases are complements that carry
      the same answer (Guide p.38; workbook round2 Russian Federation rows 31 and 32).'
    - 'Test effectiveness with the Guide''s three parts: protection against unauthorised acquisition, use
      or disclosure; clear and enforceable provisions or well-established common-law principles; and legal
      action against misappropriation with remedies such as injunctions, damages or criminal sanctions (Guide
      p.37).'
    - No standalone statute is needed. Court-enforced breach of confidence scores 0, and so does protection
      spread over unfair-competition, criminal and civil law (Guide p.38; workbook round1 Singapore row
      23; workbook round2 India row 43; workbook round2 China row 29).
    - 'Guide and methodology differ on clauses. The Guide counts clauses as a valid form and gives 0.5 only
      to narrow provisions without comprehensive coverage; the methodology sheet gives 0.5 to certain clauses
      included in the IP law or a relevant law. Follow the methodology sheet: two articles inside a general
      IP law scored 0.5, while provisions across several laws with fines and imprisonment scored 0. State
      the reading in Notes (Methodology sheet 4.1; Guide p.38; workbook round2 Lao PDR row 26; workbook
      round2 China row 29).'
    - 'Common-law protection is scored both ways by the host: breach of confidence scores 0 for Singapore
      and India but 0.5 for Australia and Malaysia. The Guide uses Singapore''s doctrine as its example
      of effective protection, so score court-enforced breach of confidence 0 unless the source itself shows
      the protection is limited (Guide p.38; workbook round1 Singapore row 23; workbook round1 Australia
      row 24; workbook round1 Malaysia row 28).'
    - Score from the legal text. A dedicated trade secrets act with a definition, holder rights, civil remedies
      and criminal penalties scores 0 even where commentators report weak practice; secondary sources only
      point to the law (Guide p.12; workbook round2 Indonesia row 42).
    exceptions: []
    disambiguation:
    - 'TRAP: inverted polarity. A trade secrets act, or court-enforced breach of confidence, is evidence
      of presence and scores 0; never score 1 because a protective law was found (Guide p.38; Methodology
      sheet 4.1).'
    - 'TRAP: ID hazard. Host ID 4.1 is this trade secrets indicator; patent application rules are host ID
      4.01. The host filed a patent-application regulation under 4.1 with score 1, which contradicts the
      same economy''s trade secrets row at 0; map patent filing rules to 4.01 (Guide p.29; Guide p.37; workbook
      round2 Indonesia rows 35 and 42).'
    - 'TRAP: protection versus compelled disclosure. A law that makes firms hand trade secrets, source code
      or algorithms to the Government is 4.9, where a mandate raises the score; a law that protects trade
      secrets against others is 4.1, where protection lowers it. The same trade secret articles were cited
      in both rows of one economy (Guide p.37; workbook round2 Lao PDR rows 25 and 26).'
    - 'TRAP: powers to compel disclosure do not show a lack of protection. A host row scored 0.5 partly
      because criminal-procedure and trade-descriptions provisions can require disclosure in proceedings;
      those powers are 4.9 questions, and the test here is the Guide''s effectiveness test (Guide pp.37-38;
      workbook round1 Malaysia row 28).'
    - 'TRAP: economy-level, not provision-level. Each article of a trade secrets act is not a separate finding;
      give one answer per economy (Guide p.38; Methodology sheet 4.1).'
    - 'The scope is domestic law: a statement that the economy complies with TRIPS Article 39 is not the
      framework itself. Cite the statute or case law that protects trade secrets (Guide p.38; workbook round1
      Australia row 24).'
    - A tender condition that bidders surrender trade secrets, source code or patents is 2.2; whether domestic
      law protects trade secrets is 4.1, and a protective law is no surrender requirement (Guide p.19; Guide
      p.38).
    guide_examples:
    - 'Singapore: no dedicated statute; protection rests on the common-law doctrine of breach of confidence,
      and the framework and case law meet the TRIPS Article 39 standard by protecting against unauthorised
      acquisition, use or disclosure and providing remedies (Guide p.38).'
    null_statement: no trade secrets legal framework providing effective protection found in the corpus
    sources:
      guide_heading: Lack of effective trade secrets legal framework
      guide_pages:
      - 37
      - 38
      faq_pages: []
      methodology_row: 21
      template_row: 23
    review_notes:
    - 'Guide vs methodology: the methodology''s criterion 2 puts ''practices with certain clauses included
      in the IP law / relevant law'' at 0.5; the Guide accepts clauses as a valid form and scores coverage
      and effectiveness. round2 Lao PDR row 26 (0.5) follows the methodology although its clauses include
      the right to sue and claim compensation; round2 China row 29 (0) is clause-based protection across
      four laws. The block follows the methodology for Lao-type cases and describes both rows.'
    - 'Host inconsistency on common-law protection: round1 Australia row 24 and round1 Malaysia row 28 score
      0.5; round1 Singapore row 23 and round2 India row 43 score 0 on the same basis. Guide p.38 supports
      0. Both 0.5 rows flagged advisory.'
    - round2 Indonesia row 35 is a patent-application row filed under 4.1 and is the pool's only score-1
      row; flagged suspect. There is no valid score-1 example.
    - 'round2 Indonesia row 42: score 0 but the note argues ''limited practice/scope'' (0.5 wording) from
      secondary sources; flagged advisory.'
    - round2 India row 44 relies on a press release about the IPR Policy 2016; score 0 matches India row
      43, so it is not flagged.
    - The Guide gives one country example only (Singapore).
    - The 13 September notes record a workshop slide saying that in China court cases do not count as legal
      sources, so protection there must be statutory. Slides are not a permitted citation, so no rule was
      written.

