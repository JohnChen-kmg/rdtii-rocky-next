  - id: "7.1"
    pillar: 7
    tier: A
    review_status: "Round 1 codebook (2026-07-12); migrated and extended with host row 80 on 2026-09-13"
    name: "Lack of comprehensive legal framework for data protection"
    category_official: "Lack of comprehensive legal framework for data protection"   # sheet row 35
    weight: 0.31
    polarity: inverted               # higher score = LESS protection in place
    level: economy                   # answered once per economy (Indicator Reference row 80)
    question: "Does the economy LACK a comprehensive (horizontal) data-protection legal framework for personal data?"
    definition: >
      'Comprehensive' = broad, cross-sectoral (horizontal) applicability PLUS
      detailed provisions on the scope and application of data subjects'
      rights and obligations — e.g. rights of access, rectification, erasure,
      portability — covering activities such as collection, processing and
      cross-border transfer of personal data. (Guide p.58)
    scoring: {values: [1, 0.5, 0], type: ordinal}
    scoring_tree:
      - if: "No data-protection legal framework exists at all. (Guide p.58; Methodology sheet 7.1)"
        score: 1
      - if: "A data-protection legal framework exists but applies only to specific sectors (sectoral law(s) only). (Guide p.58; Methodology sheet 7.1)"
        score: 0.5
      - else: {score: 0, meaning: "A comprehensive horizontal data-protection framework exists (e.g. SG PDPA 2012, MY PDPA 2010, AU Privacy Act 1988). (Guide p.58; workbook round1 Singapore row 38)"}
    coding_rules:
      - "Comprehensive = the law applies horizontally across all sectors; if it applies to a specific sector, assign 0.5. (Internal Guide p.13)"
      - >
        ECONOMY-LEVEL: answer once per economy. Record the framework (or its
        absence) once, citing the comprehensive act's scope/application
        provision as the verbatim evidence. Per-provision citations of a
        data-protection act tagged 7.1 are not discoveries and score zero. (Indicator Reference row 80)
      - >
        Sectoral data-protection instruments are part of the economy-level
        answer: they decide 0.5 when no comprehensive law exists, and they do
        not lift a 0 when one does. (Guide p.58; Assignment 1 answer key p.2)
    exceptions: []
    disambiguation:
      - >
        TRAP — INVERTED POLARITY: this indicator measures the LACK of a
        framework. An economy WITH a comprehensive DP law scores 0 (good for
        digital trade), NOT 1. Never emit 1 because a strong law was found. (Methodology sheet 7.1; Guide p.58; Assignment 1 answer key p.2)
      - >
        TRAP: economy-level, not provision-level. The question is whether the
        framework exists at all, not whether one provision does; individual
        provisions of the act are not separate 7.1 discoveries. (Indicator Reference row 80)
      - >
        The existence of sectoral DP rules alongside a comprehensive law does
        not lift the score above 0 — the comprehensive law controls the score. (Assignment 1 answer key p.2)
      - "General/constitutional privacy rights without detailed data-protection provisions do not constitute a comprehensive framework by themselves. (Guide p.58)"
    scoring_features: []
    guide_examples: []
    framework_name: "comprehensive legal framework for personal data protection"   # the mapping stage's wording (rollup.py)
    null_statement: "no personal-data-protection framework evidence collected"   # the mapping stage's wording (submission.py)
    sources: {"guide_heading": "Lack of comprehensive legal framework for data protection", "guide_pages": [57, 58], "faq_pages": [13], "methodology_row": 35, "template_row": 38}

  - id: "7.2"
    pillar: 7
    tier: A
    review_status: "Round 1 codebook (2026-07-12); migrated and extended with host row 80 on 2026-09-13"
    name: "Lack of dedicated legal framework for cybersecurity"
    category_official: "Lack of dedicated legal framework for cybersecurity"          # sheet row 36
    weight: 0.31
    polarity: inverted
    level: economy                   # answered once per economy (Indicator Reference row 80)
    question: "Does the economy LACK a dedicated cybersecurity legal framework?"
    definition: >
      'Dedicated' = broadly applicable cybersecurity-SPECIFIC laws
      (horizontal), or cybersecurity-focused laws applicable to specific
      sectors (sectoral). 'Non-dedicated' = no specific cybersecurity law;
      the economy relies on other laws to govern cyber threats (monitoring,
      detection, prevention, mitigation, incident management). (Guide p.59)
    scoring: {values: [1, 0.5, 0], type: ordinal}
    scoring_tree:
      - if: "No cybersecurity legal framework exists at all. (Guide p.59; Methodology sheet 7.2)"
        score: 1
      - if: "Only a non-dedicated framework (cyber threats governed via other laws) AND/OR a dedicated cybersecurity law limited to specific sectors. (Guide p.59; Methodology sheet 7.2)"
        score: 0.5
      - else: {score: 0, meaning: "A dedicated cybersecurity legal framework applies across all sectors (horizontal), e.g. SG Cybersecurity Act 2018, MY Cyber Security Act 854 (2024). (Guide p.59; workbook round1 Singapore row 40)"}
    coding_rules:
