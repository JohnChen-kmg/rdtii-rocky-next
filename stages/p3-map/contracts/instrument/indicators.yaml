    category_official: 'Online payment limitations: ceiling on the maximum amount'
    weight: null
    question: Does a law or regulation cap the amount that can be paid, transferred or held through electronic
      payment methods?
    definition: One of seven sub-indicators that the host scores separately within the Guide's single section
      on online payment limitations. That section covers requirements for online payments and other requirements
      affecting the use of electronic payment and credit services, such as online transactions, digital
      wallets and mobile payments (Guide p.85; workbook round2 Mongolia row 80). This sub-indicator asks
      whether there are ceilings on the maximum amount that can be paid by electronic payment methods (Guide
      p.85; Methodology sheet 12.4.5). The host counts as a ceiling a regulatory cap on the value of a transaction,
      on transactions over a period, or on the balance an electronic money account may hold, reasoning that
      a wallet cap has a similar effect (workbook round1 Singapore row 86; workbook round1 Malaysia row
      103). The score is 1 if such a measure is present and 0 otherwise (Guide p.86).
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: 'At least one measure in force sets a ceiling on the amount that can be paid by an electronic
        payment method: a cap per transaction, per period, or on the balance an electronic money account
        may hold (Guide pp.85-86; Methodology sheet 12.4.5; workbook round1 Singapore row 86)'
      score: 1
    - else:
        score: 0
        meaning: 'No restriction: no regulatory ceiling on amounts paid by electronic payment methods (Guide
          p.86; Methodology sheet 12.4.5)'
    coding_rules:
    - 'Caps on stored value count as ceilings: balance limits on electronic money accounts scored 1 in Singapore,
      Indonesia and Mongolia (workbook round1 Singapore row 86; workbook round2 Indonesia row 166; workbook
      round2 Mongolia row 81).'
    - 'Transaction caps count: daily cumulative limits on payment-account transactions, and a maximum value
      per unit of goods or services for cross-border payment aggregators, scored 1 (workbook round2 China
      row 116; workbook round2 India row 150).'
    - 'A reporting threshold is not a ceiling: anti-money-laundering duties to report transactions above
      an amount leave the payment itself uncapped and scored 0 (workbook round1 Australia row 76; workbook
      round2 Lao PDR row 94).'
    - 'An authentication threshold is not a ceiling: India''s limit for recurring payments made without
      an additional authentication factor scored 0 (workbook round2 India row 151).'
    - The host also scored 1 where the regulator obliges each provider to set its own maximum electronic
      money value per card or account without fixing an amount (workbook round2 Thailand row 119).
    - Each payment sub-indicator is scored on its own type of measure and a cumulative weight is applied
      across the seven, so file a measure under the type it matches (Guide p.86).
    - Cite the official law or regulation; secondary sources such as the OECD Digital STRI only guide researchers
      to it (Guide p.86).
    exceptions:
    - Requirements on cryptocurrencies are not listed under online payment limitations and are not scored
      (Guide p.86).
    disambiguation:
    - 'TRAP: a ceiling on how much a buyer may purchase or import through e-commerce, such as a per-shipment
      value limit or an annual purchase quota, limits the goods and not the payment method, and is 12.2.
      China''s cross-border purchase quota was coded 12.2 and its daily payment-account limits 12.4.5 (Guide
      p.84; workbook round2 China rows 110 and 116).'
    - 'TRAP: a de minimis threshold, the value below which no duty or tax is charged on goods at the border,
      is 12.5; it is a customs valuation threshold, not a cap on payments (Guide p.86).'
    - 'TRAP: a value ceiling belongs here even when a row files it under other restrictions: India''s per-unit
      cap for cross-border payment aggregators is scored under 12.4.5 and is repeated in the India row for
      12.4.7 (Methodology sheet 12.4.5; workbook round2 India rows 150 and 153).'
    - 'The other payment measures have their own sub-indicators: a local bank account mandate is 12.4.1,
      a currency mandate for international payments 12.4.2, a national payment-security standard that deviates
      from international standards 12.4.3, a payment licence with restrictive conditions 12.4.4 and a mandated
      payment intermediary 12.4.6; a licence to run the e-commerce business itself is 12.3 (Guide p.85).'
    guide_examples: []
    null_statement: no ceiling on amounts payable by electronic payment methods found in the corpus
    sources:
      guide_heading: Online payment limitations
      guide_pages:
      - 85
      - 86
      faq_pages: []
      methodology_row: 67
      template_row: 70
    review_notes:
    - The Guide gives no example for this bullet, so guide_examples is empty.
    - Russian Federation row 101 scores 0 while its own note lists balance and monthly transfer caps on
      electronic payment instruments (payment system law Article 10); the note is headed 'From 2025 July',
      so timing may explain it. Flagged advisory.
    - 'Thailand row 119 (score 1): providers must set their own maximum; the regulator fixes no amount.
      Flagged advisory, and stated as host practice in a coding rule.'
    - 'Malaysia row 103 (score 1): approval needed to raise wallet limits above RM5,000; the row itself
      reasons by similar effect. No flag.'
    - Treating wallet balance caps as payment ceilings is host practice in four economies; the Guide's wording
      is 'maximum amount that can be paid'.

  - id: "12.4.6"
    pillar: 12
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: 'Online payment limitations: mandate specific intermediaries'
    category_official: 'Online payment limitations: mandate specific intermediaries'
    weight: null
    question: Does a law or regulation require that online payments be made or processed through specific
      intermediaries, leaving payers, merchants or providers no choice of channel?
    definition: One of seven sub-indicators that the host scores separately within the Guide's single section
      on online payment limitations. That section covers requirements for online payments and other requirements
      affecting the use of electronic payment and credit services, such as online transactions, digital
      wallets and mobile payments (Guide p.85; workbook round2 Mongolia row 82). This sub-indicator asks
      whether there are requirements mandating the use of specific intermediaries for online payments (Guide
      p.85; Methodology sheet 12.4.6). An intermediary here is a party that stands between payer and payee
      in a payment, such as an acquirer, switch, clearing operator, payment agent or aggregator (workbook
      round2 Indonesia row 167; workbook round2 Russian Federation row 102). The score is 1 if such a measure
      is present and 0 otherwise (Guide p.86).
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: At least one measure in force mandates the use of specific intermediaries for online payments,
        so that the payment must pass through an intermediary the rule designates rather than one the parties
        choose (Guide pp.85-86; Methodology sheet 12.4.6)
      score: 1
    - else:
        score: 0
        meaning: 'No restriction: no requirement to use specific intermediaries for online payments (Guide
          p.86; Methodology sheet 12.4.6)'
    coding_rules:
    - A duty to work with authorised or licensed payment providers is not a mandate to use a specific intermediary
      and scored 0 (workbook round2 Indonesia row 167; workbook round2 Mongolia row 82).
    - 'A permission is not a mandate: rules that let operators engage transfer intermediaries, payment agents
      or aggregators by agreement scored 0 (workbook round2 Russian Federation row 102).'
    - Provisions that only define intermediaries and their liabilities do not mandate their use and scored
      0 (workbook round2 Lao PDR row 95).
    - Score 1 needs text that obliges payers, merchants or providers to use a particular intermediary for
      online payments; where none is found, record score 0 and cite the payment law as the governing rule
      (Methodology sheet 12.4.6; Guide p.85; Guide p.12).
    - Each payment sub-indicator is scored on its own type of measure and a cumulative weight is applied
      across the seven, so file a measure under the type it matches (Guide p.86).
    - Cite the official law or regulation; secondary sources such as the OECD Digital STRI only guide researchers
      to it (Guide p.86).
    exceptions:
    - Requirements on cryptocurrencies are not listed under online payment limitations and are not scored
      (Guide p.86).
    disambiguation:
    - 'TRAP: a requirement that payment aggregators or providers be authorised is licensing, tested under
      12.4.4, not a mandated intermediary. The host scored India''s authorisation rule for non-bank payment
      aggregators 1 here, but must-be-licensed regimes scored 0 under 12.4.6 elsewhere; follow the criterion
      (Methodology sheet 12.4.6; workbook round2 India row 152; workbook round2 Mongolia row 82).'
    - 'TRAP: a rule that foreign payment providers may operate only through an agreement with a domestic
      operator reads like a mandated intermediary, but the host recorded Russia''s rule under 12.4.7 with
      score 1 and scored 12.4.6 = 0 for the same law; file a like rule under 12.4.7 as the host did (workbook
      round2 Russian Federation rows 102 and 103).'
    - 'TRAP: a rule that payment transactions be processed inside the economy is recorded under 6.1 as local
      processing: the host did so for Thailand''s domestic debit-card transactions and scored 12.4.6 = 0
      for Thailand. Score 12.4.6 only where the text obliges the use of a particular intermediary, not merely
      processing in the economy (Methodology sheet 12.4.6; workbook round2 Thailand rows 43 and 120).'
    - 'The other payment measures have their own sub-indicators: a local bank account mandate is 12.4.1,
      a currency mandate for international payments 12.4.2, a national payment-security standard that deviates
      from international standards 12.4.3 and a ceiling on amounts payable electronically 12.4.5; a licence
      to run the e-commerce business itself is 12.3 (Guide p.85).'
    guide_examples: []
    null_statement: no requirement to use specific intermediaries for online payments found in the corpus
    sources:
      guide_heading: Online payment limitations
      guide_pages:
      - 85
      - 86
      faq_pages: []
      methodology_row: 68
      template_row: 71
    review_notes:
    - The Guide gives no example for this bullet, so guide_examples is empty.
    - No clean score-1 row exists. India row 152, the only score-1 row, describes an authorisation requirement
      and is flagged suspect.
    - '''Specific intermediaries'' is not defined in the Guide. Mongolia row 82 speaks of ''specific intermediaries
      or the use of local operators'', which suggests a local-operator mandate would count; Russia''s local-operator
      rule was nonetheless filed under 12.4.7 (row 103) with 12.4.6 = 0 (row 102). The block follows the
      host''s placement. Rows 102 and 103 are flagged advisory.'
    - Russian Federation row 43 (6.1) describes the National Payment Card System as single operator for
      card processing, which reads like a mandated intermediary; that row's own note says no official source
      was located. Should a national-switch mandate be recorded under both 6.1 and 12.4.6 (Guide p.11)?
      Not settled by host text.

  - id: "12.4.7"
    pillar: 12
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: 'Online payment limitations: others restrictions'
    category_official: 'Online payment limitations: others restrictions'
    weight: null
    question: Is there any other requirement that restricts online payments or the use of electronic payment
      and credit services, beyond the six types that have their own sub-indicators?
    definition: 'The residual one of seven sub-indicators that the host scores separately within the Guide''s
      single section on online payment limitations. That section covers requirements for online payments
      and other requirements affecting the use of electronic payment and credit services, such as online
      transactions, digital wallets and mobile payments (Guide p.85; workbook round2 Mongolia row 83). The
      Guide lists six types of requirement, each with its own sub-indicator: a local bank account (12.4.1),
      the currency of international payments (12.4.2), deviating national payment-security standards (12.4.3),
      licences with restrictive conditions (12.4.4), ceilings on amounts (12.4.5) and mandated intermediaries
      (12.4.6) (Guide p.85). The methodology sheet adds this row for other restrictions, which has no bullet
      of its own in the Guide (Methodology sheet 12.4.7). The score is 1 if such a measure is present and
      0 otherwise (Guide p.86).'
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: At least one measure in force restricts online payments or the use of electronic payment and credit
        services in a way that is none of the six listed types, such as a rule that foreign payment providers
        may operate only through an agreement with a domestic operator and entry in a central bank register
        (Guide pp.85-86; Methodology sheet 12.4.7; workbook round2 Russian Federation row 103)
      score: 1
    - else:
        score: 0
        meaning: 'No restriction: no other restriction on online payments beyond the six listed types (Guide
          p.86; Methodology sheet 12.4.7)'
    coding_rules:
    - 'Use this sub-indicator last: a measure that matches one of the six listed types is recorded under
      that type, and only a restriction that matches none of them is recorded here (Methodology sheet 12.4.7;
      Guide p.85).'
    - 'Ordinary safeguards on licensed providers are not restrictions: a ban on using customer money to
      fund the business, and a rule that agents be licensed, scored 0 (workbook round1 Singapore row 88).'
    - Anti-money-laundering and counter-terrorist-financing duties are not scored as other restrictions
      (workbook round2 Mongolia row 83).
    - 'A market problem is not a measure: reported credit card fraud that deters online payment scored 0
      because no regulation restricts payments (workbook round1 Malaysia row 105; Internal Guide p.8).'
    - Each payment sub-indicator is scored on its own type of measure and a cumulative weight is applied
      across the seven, so file a measure under the type it matches (Guide p.86).
    - Cite the official law or regulation; secondary sources such as the OECD Digital STRI only guide researchers
      to it (Guide p.86).
    exceptions:
    - Requirements on cryptocurrencies are not listed under online payment limitations and are not scored
      (Guide p.86).
    disambiguation:
    - 'TRAP: a ceiling on the value of a payment is 12.4.5, not another restriction. India''s row here repeats
      per-transaction and per-unit value caps, and the per-unit cap is already scored under 12.4.5 (Methodology
      sheet 12.4.5; workbook round2 India rows 150 and 153).'
    - 'TRAP: domestic share and voting-rights conditions for a payment service provider licence scored 0
      here: licence conditions are tested under 12.4.4, and foreign equity caps on payment firms were coded
      3.1 (workbook round2 Indonesia rows 168 and 23).'
    - 'TRAP: Russia''s rule that foreign payment providers operate only through an agreement with a Russian
      money transfer operator was recorded here with score 1, while 12.4.6, the mandated-intermediary sub-indicator,
      scored 0 for the same law; keep that placement for a like rule (workbook round2 Russian Federation
      rows 102 and 103).'
    - Provisions on electronic-signature providers and on the liability of intermediaries are not payment
      restrictions; a Lao PDR row that lists them scored 0 (workbook round2 Lao PDR row 96).
    - 'A measure fitting a listed type is recorded there; 12.4.7 takes only the rest: bank account 12.4.1,
      currency 12.4.2, security standard 12.4.3, licence 12.4.4, ceiling 12.4.5, intermediary 12.4.6 (Guide
      p.85; Methodology sheet 12.4.7).'
    - A licence to run the e-commerce business itself is 12.3 and is never an online payment restriction;
      a licence for payment services is tested under 12.4.4 (Guide p.85).
    guide_examples: []
    null_statement: no other restriction on online payments found in the corpus
    sources:
      guide_heading: Online payment limitations
      guide_pages:
      - 85
      - 86
      faq_pages: []
      methodology_row: 69
      template_row: 72
    review_notes:
    - 'The Guide has no bullet and no example for other restrictions; the row exists only in the methodology
      sheet (criterion text: ''Other restrctions'').'
    - The residual rule (use last) is an inference from the word 'other'; no host text states it. The host
      partly follows it (Indonesia row 168 = 0, Singapore row 88 = 0).
    - India row 153 (score 1) is mostly value ceilings (12.4.5 material, already scored in row 150) and
      partly 2011 instructions the row says were replaced in 2023. Flagged advisory.
    - Russian Federation row 103 (the only clean score-1 row) could equally be 12.4.6. Flagged advisory.
      Because a cumulative weight is applied (Guide p.86 fn 53), the placement changes the index.
    - Indonesia row 168 (score 0, current exemplar) describes ownership conditions that are restrictions;
      the 0 is right only on the residual reading. Flagged advisory.

  - id: "12.5"
    pillar: 12
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Low De Minimis
    category_official: Low De Minimis
    weight: 0.07
    polarity: inverted
    question: Does the economy set a de minimis value below which imported goods pay no duty or tax at the
      border, and if so, is that value below USD 200 or at least USD 200?
    definition: 'A de minimis rule sets a value ceiling for goods below which no duty or tax is charged
      at the border, so that low-value consignments ordered online keep moving (Guide p.86). The indicator
      asks whether the economy has adopted such a threshold and compares it with a USD 200 benchmark, taken
      from an International Chamber of Commerce recommendation for a global baseline (Guide p.86). It grades
      a threshold, not a restriction: having no rule at all is the costliest outcome, a threshold below
      USD 200 is intermediate, and a threshold of USD 200 or more is the best outcome (Guide p.86; Methodology
      sheet 12.5). Thresholds in local currency are converted at International Monetary Fund exchange rates
      (Guide p.86). A low threshold does not block goods but tends to raise the price of imports (Guide
      p.91).'
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'existence of a de minimis rule: an economy with no rule at all scores highest (Guide p.86; Methodology
      sheet 12.5)'
    - 'level of the threshold: a threshold below USD 200 scores higher than one of USD 200 or more (Guide
      p.86; Methodology sheet 12.5)'
    scoring_tree:
    - if: 'The economy has no de minimis rule: no value ceiling below which imported goods are free of duty
        or tax at the border (Guide p.86; Methodology sheet 12.5)'
      score: 1
    - if: A de minimis rule exists and its threshold, converted at the IMF exchange rate, is below USD 200
        (Guide p.86; Methodology sheet 12.5)
      score: 0.5
    - else:
        score: 0
        meaning: A de minimis rule exists and its threshold is equal to or above USD 200 (Guide p.86; Methodology
          sheet 12.5)
    coding_rules:
    - Answer once per economy. Cite the provision that sets the duty-free value ceiling and score the economy
      on that threshold; if the customs, tariff and postal or courier import rules set no ceiling, record
      the absence once, naming the customs law searched, and score 1 (Guide p.86; Methodology sheet 12.5;
      Internal Guide p.10).
    - Convert a local-currency threshold to USD at the IMF exchange rate and give the local amount with
      its USD equivalent, as host rows do; the host FAQ fixes the IMF USD rate of 31 August and says the
      earlier SDR 133 benchmark was replaced by USD 200 (Guide p.86; Internal Guide p.15; workbook round1
      Singapore row 89).
    - 'Where thresholds differ by channel, score the one that applies to goods bought online and delivered
      by post or courier: the host scored Russia on the EUR 200 postal threshold and noted that the EUR
      10,000 air-baggage allowance does not cover internet purchases (workbook round2 Russian Federation
      rows 104 and 105).'
    - 'A threshold limited to one channel or class of goods, or set on the duty amount instead of the goods
      value, was still coded as a de minimis rule: air-courier consignments, non-commercial goods, and duty
      below RMB 50 (workbook round1 Malaysia row 106; workbook round2 Lao PDR row 97; workbook round2 China
      row 119).'
    - A GST or sales tax charged on low-value imported goods, for example through overseas vendor registration,
      does not remove the de minimis rule; the host still scored the customs threshold (workbook round1
      Singapore row 89; workbook round1 Malaysia row 106).
    - For a member of a customs union the threshold may sit in a union decision that applies to every member,
      such as the Eurasian Economic Union decisions cited for Russia (Internal Guide p.4; workbook round2
      Russian Federation row 104).
    - Cite the official law, regulation or notification that sets the threshold; the Global Express Association
      database only guides researchers to it (Guide p.86).
    exceptions: []
    disambiguation:
    - 'TRAP: inverted polarity. A de minimis provision found in the law is evidence that the rule exists
      and scores 0.5 or 0 by its USD value, never 1; score 1 is for an economy with no de minimis rule,
      so an empty search points to 1 here, the reverse of the usual absence rule (Guide p.86; Methodology
      sheet 12.5; Internal Guide p.10).'
    - 'TRAP: score 1 needs the absence of any value ceiling, the reverse of normal polarity, yet two host
      rows score 1 while describing a value-based exemption (India: INR 100 and INR 1,000 thresholds; Mongolia:
      mail parcels worth up to ten times the monthly minimum wage). Follow the Guide: an existing value
      ceiling scores 0.5 or 0 (Guide p.86; workbook round2 India row 154; workbook round2 Mongolia row 84).'
    - 'TRAP: a cap on how much a consumer may buy through cross-border e-commerce (per transaction, per
      shipment or per year) is a purchase limit under 12.2; the value below which a parcel pays no duty
      or tax is 12.5. China''s RMB 5,000 per-transaction and RMB 26,000 annual quotas were coded 12.2, and
      its exemption for duty under RMB 50 was coded 12.5 (Guide p.84; Guide p.86; workbook round2 China
      rows 110 and 119).'
    - 'TRAP: the words de minimis also name a merger-control exemption by asset or turnover size and a rules-of-origin
      tolerance; these are not border value thresholds and are not scored (Guide p.86; workbook round2 India
      row 154; workbook round2 Mongolia row 84).'
    - A ceiling on the amount payable by an electronic payment method is 12.4.5; the de minimis threshold
      is a customs value ceiling on goods, not a cap on payments (Guide p.85; Guide p.86).
    - Customs duties on digital products delivered electronically are 12.6; 12.5 is only about the duty-free
      value ceiling for goods that cross the border physically (Guide p.86).
    - Tariff rates and duty-free tariff lines on ICT goods are 1.1 and 1.2, which are not extracted; a tariff
      schedule is not a de minimis rule (Internal Guide p.8; Guide p.86).
    guide_examples: []
    null_statement: no de minimis rule (duty-free value threshold for imported goods) found in the corpus
    sources:
      guide_heading: Low de minimis
      guide_pages:
      - 86
      faq_pages:
      - 15
      methodology_row: 70
      template_row: 73
    review_notes:
    - 'Polarity call: 12.5 is a threshold indicator whose top criterion is an absence (Methodology sheet
      12.5: no de minimis = 1). polarity: inverted is set under the brief''s rule for absence-based top
      criteria; policies.yaml already lists 12.5 among the absence-based criteria. level: economy is not
      set: presence does not give one answer (0.5 or 0 by value).'
    - 'No trustworthy score-1 row exists: India row 154 and Mongolia row 84 score 1 while describing value-based
      exemptions (both flagged suspect in flags.yaml).'
    - 'Attribution differs: Guide p.86 credits the ICC (2016) for USD 200; Internal Guide p.15 credits UNECE
      guidelines. No effect on any score.'
    - 'The 31 August IMF rate appears only in Internal Guide p.15 and names no year. Host rows convert at
      other dates (India row 154: December 2023; Thailand row 122: June 2025) or give undated approximations.
      No row sits near USD 200 (closest: Russia EUR 200, Singapore SGD 400).'
    - 'Channel-specific thresholds: no host rule says which channel decides. The coding rule rests on Russia
      rows 104-105 only.'
    - 'Open question: must both duty and tax be exempt? Lao PDR row 97 exempts customs duties only; India
      row 154 gives separate thresholds for duty and GST. China row 119 sets the threshold on the duty amount,
      not the goods value, and was still coded 0.5.'
    - 'Open question: the Guide''s 12.2 examples include Argentina''s USD 50 monthly tax-free purchase allowance
      (Guide p.84), which resembles a de minimis rule, while the same section excludes tax and customs duty
      measures from 12.2. Group gF owns 12.2.'
    - The Guide gives no economy example for 12.5, so guide_examples is empty.

  - id: "12.6"
    pillar: 12
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Imposition of custom duties on electronic transmission
    category_official: Imposition of custom duties on electronic transmission
    weight: 0.07
    question: Does the economy charge customs duties on digital products delivered by electronic transmission,
      or keep a legal mechanism that would allow it to charge them?
    definition: The indicator asks whether an economy imposes customs duties or other cross-border duties
      on electronic transmissions, meaning the import or export of digital products by electronic means
      (Guide p.86). Digital products are intangible items created and delivered in digital form, such as
      software, e-books, music and online courses (Guide p.9). A legal mechanism or regulation that allows
      such duties counts even where the current tariff lines are zero (Guide p.86). WTO law does not formally
      define electronic transmission, and WTO members have kept a moratorium on these duties since 1998
      (Guide p.86). Such duties raise the cost of accessing digital services for consumers and businesses
      (Guide p.91).
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'actual imposition: duties actively charged on electronic transmissions score higher than a mechanism
      that only allows them (Guide p.86; Methodology sheet 12.6)'
    - 'legal mechanism: tariff lines or rules for electronically transmitted products score 0.5 even at
      a zero rate (Guide p.86; Methodology sheet 12.6)'
    scoring_tree:
    - if: The economy actively imposes customs duties on electronic transmissions in practice, which is
        more than keeping tariff lines at a zero rate (Guide p.86; Methodology sheet 12.6)
      score: 1
    - if: A legal mechanism or regulation allows customs duties on electronic transmissions, for example
        tariff headings for software or other intangible goods delivered electronically, even though the
        current rate is zero and no duty is collected (Guide p.86; Methodology sheet 12.6)
      score: 0.5
    - else:
        score: 0
        meaning: No legal mechanism or regulation is applicable to impose customs duties on electronic transmissions
          (Guide p.86; Methodology sheet 12.6)
    coding_rules:
    - 'Answer once per economy: decide whether duties are actively charged, whether only a mechanism exists,
      or neither, and cite the tariff or customs provision that shows it (Guide p.86; Methodology sheet
      12.6).'
    - 'A zero rate is not a zero score: tariff headings created for software, electronic data or multimedia
      delivered electronically show a mechanism and score 0.5, as in the Guide''s Indonesia example (Guide
      p.86; workbook round2 Indonesia row 170).'
    - Score 1 needs evidence that the duty is actively imposed in practice, not only that the law would
      permit it (Guide p.86; Methodology sheet 12.6).
    - Customs law that charges duty only on goods moved across the border as physical or movable property,
      with no provision for digital products, supports 0 (workbook round2 Russian Federation row 106; workbook
      round2 Lao PDR row 98).
    - 'A statement that the economy follows the WTO moratorium is context, not a measure: it accompanies
      a 0 where no mechanism exists, and it does not lower a 0.5 where tariff headings exist (Guide p.86;
      workbook round1 Australia row 80; workbook round2 Indonesia row 170).'
    - The indicator covers duties on both imports and exports of digital products by electronic means (Guide
      p.86).
    - For a member of a customs union, read the union's customs code, which applies to every member; the
      host cited the Eurasian Economic Union code for Russia (Internal Guide p.4; workbook round2 Russian
      Federation row 106).
    exceptions: []
    disambiguation:
    - 'TRAP: a zero duty rate does not mean score 0. The host scored 0 for one row describing the zero-rated
      tariff lines for software and digital products that the Guide and the neighbouring row score 0.5;
      follow the Guide (Guide p.86; workbook round2 Indonesia rows 170 and 171).'
    - 'TRAP: VAT or GST on digital services supplied from abroad is a consumption tax, not a customs duty,
      and is not scored under 12.6; the Guide also keeps tax measures out of 12.2, where the host recorded
      an offshore VAT collection rule with 0 (Guide p.84; workbook round2 India row 155; workbook round2
      Indonesia row 155).'
    - 'TRAP: tariffs on physical ICT goods belong to the tariff indicators 1.1 and 1.2, which are not extracted;
      12.6 is only about digital products delivered by electronic means (Internal Guide p.8; Guide p.86).'
    - 'TRAP: the duty-free value ceiling for low-value parcels is 12.5; 12.6 concerns duties on intangible
      products sent electronically (Guide p.86).'
    - 'TRAP: a customs declaration or import notification duty for intangible goods is an import procedure
      under 10.2, while the tariff mechanism is 12.6; the host recorded Indonesia''s import notification
      rule for electronically transmitted software under 10.2 and its tariff headings under 12.6 (Guide
      p.75; workbook round2 Indonesia rows 132 and 170).'
    guide_examples:
    - 'Indonesia: no customs duties are currently imposed on electronic transmissions, but regulations classify
      intangible goods delivered electronically (software, electronic data, multimedia) under Heading 99.01
      at a 0% rate, which shows that a legal framework for such duties exists (Guide p.86).'
    null_statement: no customs duty on electronic transmissions and no legal mechanism to impose one found
      in the corpus
    sources:
      guide_heading: Imposition of customs duties on electronic transmission
      guide_pages:
      - 86
      faq_pages: []
      methodology_row: 71
      template_row: 74
    review_notes:
    - 'Open question: score 1 needs duties imposed ''in practice'' (Guide p.86), but 12.6 is not on the
      Internal Guide''s list of practice-based indicators (3.4, 5.3, 9.1; Internal Guide p.8). The host
      does not say what evidence shows active imposition (a tariff line above zero, or collection data).
      No host row scores 1.'
    - Indonesia rows 170 (0.5) and 171 (0) score the same zero-rated tariff lines differently; row 171 is
      flagged suspect in flags.yaml.
    - 'Open question: does ''cross-border duties'' (Guide p.86) reach levies other than customs duties?
      No host guidance. Consumption taxes are treated as outside on the strength of India row 155 and Malaysia
      row 107 only.'
    - Indonesia row 132 (10.2 = 0.5) says import duties on intangible goods are calculated on customs value
      under a 2022 finance regulation. If duty were in fact collected this would point to 1 under 12.6,
      but rows 170-171 say the rate is 0%.
    - The Guide gives one example only (Indonesia). Thailand row 123 (score 0) is host-marked Not correct
      and is not cited.
    - The Guide's 12.6 section names no secondary database, so the block carries no pointer-only rule.

  - id: "12.7"
    pillar: 12
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Domain name requirements
    category_official: Domain name requirements
    weight: 0.07
    question: Must businesses use a local domain name to sell online, or meet a local presence or local
      representative condition to register a commercial domain name under the country code?
    definition: 'The indicator covers requirements on commercial domain names, which carry compliance costs
      (Guide p.87). Three kinds are covered: a rule that companies must have a local domain name to engage
      in electronic retail in the market, a local presence condition for using a local domain name, and
      a duty to appoint a local representative (Guide p.87). A local domain name is one under the economy''s
      country-code top-level domain (ccTLD), such as .vn or .br; all commercial ccTLDs and their sub-domains
      are in scope, while domains for government, the military and educational institutions are not, because
      they are not commercial (Guide p.87). The indicator includes commercial or local presence conditions
      for buying a local domain name (Guide p.91).'
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'type of requirement: a presence condition or a mandate to use a local domain name scores higher than
      a duty to appoint a local administrator (Guide p.87; Methodology sheet 12.7)'
    scoring_tree:
    - if: A physical presence in the economy (for example residence, a registered office or a branch) is
        required to register or use a local commercial domain name, or companies must obtain a local domain
        name in order to conduct e-commerce (Guide p.87; Methodology sheet 12.7)
      score: 1
    - if: Registrants must appoint a local administrator or local representative for the domain name, and
        neither condition of the branch above applies (Guide p.87; Methodology sheet 12.7)
      score: 0.5
    - else:
        score: 0
        meaning: 'No requirement on commercial domain names: registration is open without presence or a
          local representative, and no law makes businesses use a local domain name (Guide p.87; Methodology
          sheet 12.7)'
    coding_rules:
    - Scope is commercial domain names under the country code and their sub-domains, such as the commercial
      second-level categories of a ccTLD (Guide p.87; workbook round1 Australia row 81).
    - The rules usually sit in the registration policy of the ccTLD registry or in a domain name regulation,
      and host rows cite those documents as the source (workbook round1 Malaysia row 108; workbook round2
      Thailand row 125; workbook round2 China row 121).
    - 'Test the route open to a foreign registrant: where it can register by appointing a local administrative
      contact, score 0.5; where registration is open only to locally registered, resident or licensed entities,
      score 1 (Guide p.87; workbook round1 Singapore row 91; workbook round1 Malaysia row 108; workbook
      round1 Australia row 81; workbook round2 Thailand row 125).'
    - 'A mandate to use the local domain must be binding: the host scored 0 where the regulation tells businesses
      to prioritise the national domain or encourages its use (workbook round2 Indonesia rows 172 and 177).'
    - 'A use mandate on a class of online businesses counts: the Guide''s Viet Nam example covers licensed
      online newspapers, websites, web portals and social networking sites (Guide p.87).'
    - Where the registry sets different rules for each second-level domain, the host recorded one row per
      domain category, each with its own score (workbook round2 Thailand rows 124-126).
    - An open registry is recorded as 0 with the registration rule cited, for example registration available
      to all parties worldwide (workbook round2 India row 156; workbook round2 Russian Federation row 107).
    exceptions:
    - Domain names for government agencies, the military, educational institutions and other non-commercial
      organisations (.gov, .mil, .edu, .org) are outside the indicator (Guide p.87).
    - A mandate that only government or party websites use the national domain is not scored, because only
      commercial domain names are captured (Guide p.87; workbook round2 Lao PDR row 99).
    disambiguation:
    - 'TRAP: a local representative that a foreign online service provider must appoint in order to supply
      its services, with no link to registering a domain, is a local presence requirement under 12.8 (score
      1 there); only a representative or administrative contact required for the domain registration is
      12.7 (score 0.5). The host put a representative duty for foreign e-commerce operators in a 12.7 row
      and coded the same duty under 12.8 (Guide pp.87-88; workbook round2 Indonesia rows 176 and 178).'
    - 'TRAP: a presence condition that only gates registration of the local domain stays in 12.7; commercial
      presence under 3.5 is a duty to establish locally in order to supply services (Guide p.87; Guide p.91;
      Guide p.27).'
    - 'TRAP: registration of commercial websites in a commercial registry, or a licence to run an e-commerce
      business, is 12.3, not a domain name requirement (Guide p.85).'
    - 'TRAP: an order to block domain names is content blocking under 9.1, which lists DNS-based blocking;
      a register of blocked domain names is not a domain name requirement (Guide p.70; workbook round2 Russian
      Federation row 70).'
    - A clause that brings offshore platforms under a law because they use the national domain is a scope
      test, not a domain name requirement; the host recorded that decree under 9.4 and 12.3 (workbook round2
      Thailand rows 87 and 112).
    - A duty to give true registrant identity information is not a domain name requirement; the host coded
      it 0 (workbook round2 China row 121).
    guide_examples:
    - 'Brazil: foreign companies that want to register a domain must have a representative in the country
      to register with the official domain name registry administrator (Guide p.87).'
    - 'New Caledonia: .nc domains are limited to individuals resident for at least six consecutive months
      and legal entities with a local registered office or branch, and every applicant must appoint an administrative
      contact based in the territory (Guide p.87).'
    - 'Viet Nam: licensed online newspapers, websites, web portals and social networking sites must use
      the .vn domain name (Guide p.87).'
    null_statement: no requirement on commercial domain names found in the corpus
    sources:
      guide_heading: Domain name requirements
      guide_pages:
      - 87
      faq_pages: []
      methodology_row: 72
      template_row: 75
    review_notes:
    - 'Guide inconsistency: the body text lists .org among non-commercial domains that are out of scope,
      while footnote 56 says the indicator refers to .com, .net and .org within a ccTLD used for commercial
      purposes (Guide p.87). Second-level .org domains are ambiguous; the exception line follows the body
      text.'
    - 'Wording: the Guide''s scoring sentence says ''local administrator'', its scope sentence and the methodology
      sheet say ''local representative''. Treated as the same thing.'
    - The Guide does not state the scores of its three examples. By the scoring sentence Brazil fits 0.5
      and New Caledonia and Viet Nam fit 1 (inference, not written into the examples).
    - Indonesia rows 173-175 score 0.5 for presence-only eligibility with no local administrator, while
      Australia row 81 and Thailand rows 125-126 score comparable conditions 1. Rows 174 and 175 are flagged
      suspect and row 173 advisory in flags.yaml.
    - 'Open question: is a sanction-backed duty to ''prioritise'' the national domain a mandate? Indonesia
      row 176 says Government Regulation 80/2019 Article 21 attaches warnings, blacklisting, blocking and
      licence revocation, yet codes 0.'
    - 'Open question: when second-level categories differ (Thailand: .in.th presence only = 1, .co.th agent
      route = 0.5), no host rule says which decides the economy score. The block follows the host practice
      of one row per category.'
    - The foreign-route rule (0.5 where a local administrative contact replaces presence) rests on Singapore
      row 91 and Malaysia row 108; the Guide does not state it in those words.

  - id: "12.8"
    pillar: 12
    tier: B
    review_status: drafted 2026-09-13 at Tier A depth (Claude), additions 2026-10-04, not yet reviewed
    name: Local presence requirements for online service providers
    category_official: Local presence requirements for online service providers
    weight: 0.07
    question: Must a foreign online service provider appoint or keep a local representative, agent, contact
      point, representative office or post-box in the economy as a condition for supplying its services
      remotely?
    definition: 'A local presence requirement obliges companies to have a physical representative office,
      local agent, legal representative or post-box in the economy in order to provide their services (Guide
      p.87). The indicator targets preconditions on cross-border (Mode 1) online supply: it asks only for
      administrative representation, such as an agent or contact point, whereas commercial presence (Mode
      3) means setting up a local subsidiary or branch (Guide p.87).'
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: At least one law or regulation, in at least one sector, requires a foreign online service provider
        to appoint or keep a local representative, agent, contact point, representative office or post-box
        as a condition for supplying services remotely without an establishment (Guide pp.87-88; Methodology
        sheet 12.8).
      score: 1
    - else:
        score: 0
        meaning: No local presence precondition on cross-border online supply; entity-establishment duties
          and corporate-law registered offices do not count here (Guide pp.87-88; Methodology sheet 12.8).
    coding_rules:
    - One sector or one class of provider is enough for score 1 (Methodology sheet 12.8).
    - 'Threshold-triggered duties count: the Guide''s Türkiye example applies only above one million daily
      accesses (Guide p.88), and Indonesia''s e-commerce rule applies above consumer, package or traffic
      thresholds (workbook round2 Indonesia row 178).'
    - 'The representative''s mandate does not narrow the indicator: Guide examples include liaison officers
      who facilitate government access requests and local agents responsible for data privacy compliance
      (Guide p.88).'
    - 'Look beyond e-commerce law: a personal information protection law requiring offshore processors to
      designate a representative in China was coded 1 (workbook round2 China row 122).'
    - 'Registration with a ministry is not entity establishment: the Guide''s Indonesia example pairs ministry
      registration with domiciled liaison officers and still counts here (Guide p.88).'
    - Administrative representation is enough; the provider need not have any physical office (Guide pp.87-88).
    - Cite the official law or regulation; the DSTRI database only guides researchers to the primary source
      (Guide p.88).
    exceptions:
    - Requirements to maintain a registered office or registered agent, typically under corporate law, are
      not local presence requirements because they apply only after a company has a legal presence (Mode
      3) (Guide pp.87-88).
    disambiguation:
    - 'TRAP: a duty to incorporate, open a branch or subsidiary, or set up a permanent office before serving
      the market is commercial presence, 3.5; when one law requires both registration as a legal entity
      and a local representative, classify it as 3.5 (Guide p.88; Guide p.27).'
    - 'TRAP: the same foreign-company registered-office provisions were coded 3.5 = 1 and 12.8 = 0 in Australia
      and Singapore (workbook round1 Australia rows 16 and 82; workbook round1 Singapore rows 14 and 92).'
    - 'TRAP: Russia''s 236-FZ duty to open a branch, representative office or legal entity was coded 3.5
      = 1 and 12.8 = 0, while the Guide''s 12.8 Türkiye example asks only for an appointed representative
      (workbook round2 Russian Federation rows 23 and 108; Guide p.88).'
    - 'TRAP: a representative or administrative contact required only to register a local domain name is
      12.7, scored 0.5 there (Guide p.87).'
    - 'TRAP: a Data Protection Officer or person-in-charge duty is 7.4, while an offshore processor''s local
      representative is 12.8; China''s PIPL Article 52 was coded 7.4 and Article 53 was coded 12.8 (Guide
      p.61; Guide p.88; workbook round2 China rows 63 and 122).'
    - A local agent or representative required for patent applications is 4.01, and one for patent enforcement
      matters is 4.3 (Guide pp.29-31).
    - A representative office that a foreign payment system must open to be registered was coded 12.4.4,
      payment licensing with restrictive conditions (workbook round2 Russian Federation row 100; Guide p.85).
    - Registration of electronic system operators without a licence was coded 0 under 9.4, while the liaison
      officer duty in the same regulation was coded 12.8 = 1 (workbook round2 Indonesia rows 121 and 179).
    - 'TRAP: a duty to build or use a local data centre, or to keep a local server, as a condition for supplying
      a service is an infrastructure requirement, 6.3; 12.8 is about a person, agent, office or post-box
      that represents the provider in the economy, not computing facilities (Guide pp.51-52; Guide p.87).'
    - 'TRAP: the host scored 0 for a decree that makes offshore digital platforms appoint a point of contact
      located in the country, reasoning that a contact point is not a representative office, agent, legal
      representative or post-box, and scored the decree''s prior-notification scheme 0 under 9.4 and 12.3
      as a non-licence. The Guide counts a local contact point, so follow the Guide for 12.8 (Guide pp.87-88;
      workbook round2 Thailand rows 87, 112 and 128).'
    - A licence to run an e-commerce business is 12.3; a duty on foreign e-commerce operators to appoint
      a local representative is 12.8, and one regulation can be recorded under both (Guide p.85; Guide p.88;
      Guide p.11; workbook round2 Indonesia rows 158 and 178).
    - A block or access restriction imposed on a foreign provider that fails to meet its presence or representative
      duty is recorded under 9.1; the duty itself is 12.8 when only a representative is required and 3.5
      when an establishment is required (Guide pp.69-70; Guide pp.87-88; workbook round2 Russian Federation
      row 72).
    - 'Both the 12.8 and the 3.5 sections of the Guide mention representative offices: a representative
      office or officer required only as the administrative contact of a provider that keeps supplying remotely
      is 12.8, and an office that must be set up as the provider''s local establishment is 3.5; the host
      kept Indonesia''s liaison-officer duty out of 3.5 because no entity is required (Guide p.27; Guide
      pp.87-88; workbook round2 Indonesia row 179).'
    - 'A locality condition on a Data Protection Officer stays in 7.4: India''s rule that the officer of
      a significant data fiduciary be based in India was coded 7.4, and India''s 12.8 row is 0 (Guide p.61;
      workbook round2 India rows 96 and 157).'
    guide_examples:
    - 'Indonesia: private electronic system operators must register with the relevant ministry and appoint
      liaison officers domiciled in Indonesia to facilitate government access requests (Guide p.88).'
    - 'Republic of Korea: foreign IT service providers without a physical office must designate a local
      agent responsible for data privacy compliance (Guide p.88).'
    - 'Türkiye: foreign-based social network providers accessed from Türkiye more than one million times
      a day must appoint a local real or legal person representative (Guide p.88).'
    null_statement: no local presence requirement for online service providers found in the corpus
    sources:
      guide_heading: Local presence requirements
      guide_pages:
      - 87
      - 88
      faq_pages: []
      methodology_row: 73
      template_row: 76

  - id: "12.9"
    pillar: 12
    tier: B
    review_status: drafted 2026-09-13 at Tier A depth (Claude), additions 2026-10-04, not yet reviewed
    name: Lack of legal framework for online consumer protection
    category_official: Lack of legal framework for online consumer protection
    weight: 0.04
    polarity: inverted
    level: economy
    framework_name: consumer protection legal framework that applies to online purchases
    question: 'Does the economy lack any consumer protection law that applies to online purchases? (Inverted
      polarity: lacking one scores 1, having one scores 0.)'
    definition: 'The indicator checks whether an economy has adopted a legal framework protecting consumers
      in online transactions (Guide p.88). The law need not be specific to e-commerce: a cross-sector consumer
      protection law can extend to online purchases, and the protection may sit in the rules for offline
      transactions or in a separate regulation (Guide p.88). It is a lack indicator, so the absence of such
      a law scores 1 (Guide p.88).'
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: 'No consumer protection legal framework applies to online commerce: the economy has no consumer
        protection law, or none of its consumer protection laws reaches online purchases (Guide p.88; Methodology
        sheet 12.9).'
      score: 1
    - else:
        score: 0
        meaning: At least one consumer protection law, general or e-commerce specific, applies to online
          purchases (Guide p.88; Methodology sheet 12.9).
    coding_rules:
    - 'Answer once per economy: one consumer protection law that reaches online purchases gives 0, and further
      consumer-related rows only complement it (Guide p.88; workbook round2 Indonesia rows 181-184).'
    - A general consumer protection law with cross-sector scope counts even if it never mentions e-commerce
      (Guide p.88; workbook round1 Singapore row 93).
    - E-commerce-specific consumer rules also count, whether in a separate regulation or an e-commerce law
      (Guide p.88; workbook round2 India row 158; workbook round2 China row 124).
    - A consumer protection regime limited to offline transactions leaves online purchases without equivalent
      safeguards and supports score 1 (Guide p.10; Guide p.88).
    - Cite the primary law; the UNCTAD Cyber Tracker only points researchers to it (Guide p.88).
    - 'Economy-level: record the answer once per economy and cite the provision that establishes the framework,
      normally the scope or application article that brings online purchases under the consumer protection
      law; other provisions of that law are not separate findings (Guide p.88; Methodology sheet 12.9; workbook
      round2 Lao PDR row 101).'
    - 'Score on the law in force: a draft chapter on remote or electronic sales does not count, and it does
      not undo a general consumer law that already reaches online transactions (Internal Guide p.8; workbook
      round2 Mongolia row 88).'
    exceptions: []
    disambiguation:
    - 'TRAP: inverted polarity. Consumer protection text found in legislation is evidence of presence and
      scores 0; score 1 is reserved for economies where no consumer protection law reaches online purchases
      (Guide p.88; Methodology sheet 12.9).'
    - 'TRAP: consumer-protection rules on advertising, such as bans on misleading ads, score 0 under 9.3;
      Thailand''s Consumer Protection Act was coded 0 under both 9.3 and 12.9 (Guide p.71; Internal Guide
      p.14; workbook round2 Thailand rows 82 and 131).'
    - 'TRAP: provisions that only give legal validity to electronic messages, contracts or signatures relate
      to the UNCITRAL model-law indicators 12.11 and 12.12, which are not extracted, and do not by themselves
      show consumer protection; an e-signature law was nonetheless filed under 12.9 (Guide p.89; Non-regulatory
      note; workbook round2 Russian Federation row 110).'
    - 'TRAP: personal data duties such as consent and breach notification belong to pillar 7 (7.1 data protection
      framework), not to online consumer protection; one such row was filed under 12.9 (Guide p.57; workbook
      round2 Indonesia row 185).'
    - Purchase or delivery limits adopted for consumer protection, such as on alcohol, tobacco or pharmaceuticals,
      are not 12.2 restrictions (Guide p.84).
    - 'TRAP: economy-level, not provision-level. The question is whether a consumer protection framework
      reaching online purchases exists at all; each consumer right, disclosure duty or complaint rule in
      that law is not a new 12.9 finding (Guide p.88; Methodology sheet 12.9).'
    - An approval or licence requirement for e-money or payment services is a payment measure, tested under
      12.4.4 for restrictive licence conditions; consumer clauses inside such an instrument do not make
      it the consumer protection framework, although the host filed one such row under 12.9 (Guide p.85;
      workbook round1 Malaysia row 112).
    guide_examples: []
    null_statement: no consumer protection law applicable to online purchases found in the corpus
    sources:
      guide_heading: Lack of legal framework for online consumer protection
      guide_pages:
      - 88
      faq_pages: []
      methodology_row: 74
      template_row: 77
