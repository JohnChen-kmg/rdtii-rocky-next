# ----------------------------------------------------------------------------
# PILLAR 10 — NON-TECHNICAL NTMS
# Where the measures live: Customs acts and prohibited or restricted goods
# orders, import and export licensing regulations and notifications, strategic
# and dual-use control lists, telecom and radio equipment import rules,
# ministry regulations setting domestic-content thresholds, and government
# orders banning named applications (Guide pp.74-76).
# ----------------------------------------------------------------------------

  - id: "10.1"
    pillar: 10
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Import ban applied to ICT goods and online services (e.g. network equipment, servers, handsets,
      applications, and data processing)
    category_official: Import ban applied to ICT goods and online services (e.g. network equipment, servers,
      handsets, applications, and data processing)
    weight: 0.42
    question: Does the economy prohibit outright the import of one or more ICT goods or online services,
      such as named equipment or applications?
    definition: An import ban completely prohibits bringing an ICT good or online service into the market,
      which is why the indicator carries the highest weight in the pillar (Guide p.77). It covers bans aimed
      at ICT goods or online services and broader bans on many goods or services whose lists include them
      (Guide p.74). ICT goods are goods whose main purpose is to capture, transmit, process and render information,
      plus the intermediate goods needed to make them, as listed in the WTO ITA I and ITA II and the proposed
      ITA III (Guide p.9). Online services are digital services delivered over the internet; the host's
      own examples of what can be banned are network equipment, servers, handsets, applications and data
      processing (Guide p.9; Methodology sheet 10.1). Pillar 10 covers measures other than tariffs or taxes
      (Guide p.74).
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'number of products or services covered: a ban on more than one ICT good or online service scores
      higher than a ban on one specific product or service (Guide p.74; Methodology sheet 10.1)'
    - 'number of ban measures in place: more than one measure scores 1 even if each covers a single product
      (Guide p.74)'
    scoring_tree:
    - if: 'The economy bans more than one ICT good or online service: one measure prohibits several products
        or services, or more than one ban measure is in place, so count both the products in each measure
        and the measures across the economy (Guide p.74; Methodology sheet 10.1)'
      score: 1
    - if: There is only one ban and it covers a single specific ICT product or online service (Guide p.74;
        Methodology sheet 10.1)
      score: 0.5
    - else:
        score: 0
        meaning: No import ban on ICT goods or online services is in place (Guide p.74; Methodology sheet
          10.1)
    coding_rules:
    - 'Evidence needed: an official instrument that prohibits import outright, with no licence or approval
      route, and names the ICT goods or online services it covers; a ban completely prohibits imports (Guide
      p.74; Guide p.77; workbook round1 Malaysia row 79)'
    - 'General prohibited-goods schedules count when they list ICT items: read the schedule and name each
      ICT product, as with the telecom schedule that bars scanning receivers, jamming devices and radio
      equipment in set bands (Guide p.74; workbook round1 Singapore row 65)'
    - Check each banned good against the ITA I, ITA II and proposed ITA III lists that define ICT products
      (Guide p.9; Internal Guide p.11)
    - 'A government order that prohibits named applications is a ban on online services: the pillar uses
      import bans on applications as its illustration, and the host scored India''s 2020 bans of mobile
      apps 1 (Guide p.74; workbook round2 India row 125)'
    - Record each ban measure as its own finding with the products or services it covers; two single-product
      bans in one economy together meet the score-1 test of more than one measure (Guide p.74; Methodology
      sheet 10.1)
    - A power to prohibit imports, or a prohibited list that names no ICT good or online service, is recorded
      at 0 with the governing customs or trade law cited (Guide p.12; workbook round2 Lao PDR row 65; workbook
      round2 China row 95)
    - 'WTO I-TIP, Global Trade Alert and WTO Trade Policy Reviews only point to the law: cite the official
      order, schedule or notification, never the database entry or a news report (Guide p.74; Guide p.12)'
    exceptions:
    - Do not score bans on e-waste or on used ICT products (Internal Guide p.7; workbook round2 China row
      95)
    - Do not score bans on raw materials used to make ICT products, such as rare earths; such measures are
      recorded at 0 (Internal Guide p.14; Guide p.9)
    - Tariffs and taxes on imports are outside pillar 10, which covers measures other than tariffs or taxes
      (Guide p.74)
    disambiguation:
    - 'TRAP: a prohibition that a permit, licence or approval lifts is an import restriction, 10.2 at 0.5,
      not a ban. The wording does not decide it: the host reviewer moved Lao PDR''s rules that walkie-talkies
      and satellite equipment may not be imported without permission to 10.2, because they can still be
      imported once licensed (Guide p.75; workbook round2 Lao PDR row 65; workbook round2 Lao PDR rows 68
      and 69)'
    - 'TRAP: a ban that applies only to government bodies or government devices must be checked against
      2.1 (exclusion of foreign firms or products from public procurement) as well as 10.1, and listed under
      each that fits. A bar on officials using a named application limits what government buys or uses,
      not what the market may import: the host recorded the TikTok ban on Australian government devices
      in its 2.1 row and found no import ban under 10.1 (Internal Guide p.11; workbook round1 Australia
      row 5; workbook round1 Australia row 59)'
    - 'TRAP: blocking a commercial website or filtering its content is 9.1; prohibiting named applications
      is 10.1. The same blocking power can underlie both: the host coded India''s 2020 app bans as 10.1
      but a later order blocking loan and betting apps as 9.1, so decide by what is prohibited, not by the
      statute cited. Record an app ban under 10.1 and add a 9.1 row where the order also blocks websites
      or web content (Guide p.74; Guide p.69; Internal Guide p.11; workbook round2 India row 125; workbook
      round2 India row 119)'
    - 'TRAP: a product kept off the market only because it misses a domestic-content threshold is the local
      content requirement at work, 10.3: an LCR allows imports once they contain the required domestic share,
      while a ban blocks imports as such. The host put Indonesia''s iPhone 16 and Pixel sales ban in a 10.1
      row built on news reports and repeated it in the 10.3 row; record the content rule under 10.3 and
      use 10.1 only where an official instrument prohibits the product outright (Guide p.11; workbook round2
      Indonesia row 126; workbook round2 Indonesia row 135)'
    - A prohibited-goods list that bars media for what they carry (obscene, seditious or extremist material)
      does not ban an ICT product as such; the host recorded such a list at 0 (workbook round2 Russian Federation
      row 80)
    - An export ban is 10.4; an order that prohibits both import and export of the same ICT goods is recorded
      under each indicator (Guide p.76; Internal Guide p.11)
    - A trade defence measure on ICT goods (anti-dumping duty, countervailing duty or safeguard) is 1.4,
      not an import ban; 10.1 is a non-tariff prohibition of imports (Guide p.16; Guide p.74)
    guide_examples: []
    null_statement: no import ban on ICT goods or online services found in the corpus
    sources:
      guide_heading: Import bans on ICT goods and online services
      guide_pages:
      - 74
      faq_pages:
      - 11
      - 14
      methodology_row: 50
      template_row: 53
    review_notes:
    - The Guide gives no country example for this indicator (p.74), so guide_examples is empty.
    - 'Economy aggregation: ''more than one measure in place'' (Guide p.74) is an economy-level count, while
      the host workbooks score each row on its own. How the host turns rows into the economy score is not
      stated.'
    - Lao PDR row 66, the only 0.5 row, suspends satellite receiver imports 'without prior approval', and
      the reviewer note in Lao PDR row 65 doubts the 2018 notification is still in force. Ban (10.1) or
      permit-conditioned restriction (10.2) is open; flagged advisory.
    - The host scores content-based media prohibitions (Russian Federation row 80) and the prohibition on
      handsets with fake IMEI numbers (India row 124) 0 with no Guide sentence behind it.
    - India row 125 (10.1) and India row 119 (9.1) put the same kind of app-blocking order under different
      indicators; the host states no rule that separates them.

  - id: "10.2"
    pillar: 10
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Other import restrictions on ICT goods and online services
    category_official: Other import restrictions on ICT goods and online services
    weight: 0.21
    question: Does the economy restrict imports of ICT goods or online services by means other than a ban
      or a local content requirement, such as quotas, licences, permits, registration or labelling?
    definition: This indicator covers import restrictions on ICT goods and online services other than import
      bans and local content requirements (Guide p.75). Two families count. Trade-blocking measures, such
      as import quotas, limit the volume that can be imported. Cost-adding measures, such as import licensing
      schemes and procedures, do not block imports but discourage trade through extra cost and delay; they
      include licences, permits, authorisation and registration for ICT goods, labelling requirements and
      import controls (Guide p.75; Methodology sheet 10.2). ICT goods are the products on the WTO ITA I
      and ITA II lists and the proposed ITA III list; online services are digital services delivered over
      the internet (Guide p.9). The pillar leaves out tariffs and taxes (Guide p.74).
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'effect of the measure: a trade-blocking measure such as a quota scores higher than a cost-adding
      procedure such as a licence (Guide p.75; Methodology sheet 10.2)'
    - 'number of cost-adding measures: two or more score 1, one scores 0.5 (Guide p.75; Methodology sheet
      10.2)'
    scoring_tree:
    - if: A trade-blocking import restriction, such as a quota that limits the volume of ICT goods or online
        services imported, OR at least two cost-adding measures of the 0.5 category in place in the economy,
        so count the measures (Guide p.75; Methodology sheet 10.2)
      score: 1
    - if: 'One import restriction that adds regulatory compliance cost without blocking trade: an import
        licence, permit, authorisation or registration for ICT goods, a labelling requirement or an import
        control (Guide p.75; Methodology sheet 10.2)'
      score: 0.5
    - else:
        score: 0
        meaning: No import restriction on ICT goods or online services other than bans and local content
          requirements (Guide p.75; Methodology sheet 10.2)
    coding_rules:
    - 'Evidence needed: a provision that makes importing an ICT good or online service conditional on a
      licence, permit, approval, registration, label or similar control, or that caps the volume imported;
      name the products covered (Guide p.75; workbook round1 Singapore row 66)'
    - 'Count measures, not instruments: each distinct import procedure on ICT goods is one cost-adding measure,
      and the Guide points to the UNCTAD classification of non-tariff measures to tell procedure types apart.
      The host scored an import approval plus a surveyor report in one regulation 1 (Guide p.75; Methodology
      sheet 10.2; workbook round2 Indonesia row 131)'
    - Score each cost-adding measure 0.5 and record it as its own finding; two or more such measures in
      the economy give 1. The host rows keep every measure at 0.5 even where an economy has several, so
      state the number of measures found for the economy-level step (Guide p.75; Methodology sheet 10.2;
      workbook round2 Lao PDR rows 68 and 69)
    - The Guide also lists the absence of institutional transparency as a ground for 1, in wording about
      public procurement; the methodology sheet does not carry it. Follow the methodology sheet and do not
      raise the score on transparency grounds (Guide p.75; Methodology sheet 10.2)
    - Where a certificate, type approval or registration with a standards body is a condition of import,
      record that condition here and assess the certification route under 11.2 and any required testing
      under 11.3, as the host did for India's compulsory registration scheme (Internal Guide p.11; workbook
      round2 India row 128; workbook round2 India row 138)
    - Ordinary customs declaration documents required for all goods are not an ICT import restriction and
      are recorded at 0 (workbook round2 Mongolia row 61)
    - 'WTO I-TIP, Global Trade Alert, WTO Trade Policy Reviews and reports by international organisations
      only point to the law: cite the official law, regulation or notification (Guide p.75)'
    exceptions:
    - 'Import bans and local content requirements are excluded from this indicator: a ban is 10.1 and a
      local content requirement is 10.3 (Guide p.75)'
    - Do not score measures on e-waste or used ICT products (Internal Guide p.7)
    - Import measures on raw materials used to make ICT products, such as rare earths, are recorded at 0
      (Internal Guide p.14; Guide p.9)
    - Tariffs and taxes are outside pillar 10 (Guide p.74)
    disambiguation:
    - 'TRAP: a prohibition that a permit or licence lifts belongs here at 0.5, not in 10.1. Lao PDR''s rules
      that walkie-talkies and satellite communication equipment may not be imported without permission are
      worded as bans, yet the host reviewer placed them in 10.2 because import remains possible once licensed
      (Guide p.75; workbook round2 Lao PDR row 65; workbook round2 Lao PDR rows 68 and 69)'
    - 'TRAP: a licence, registration or permit to import encryption devices or technology is an import restriction
      here, not a deviation from encryption standards (11.4), unless its conditions impose a non-standard
      algorithm, weaker keys or disclosure of keys or source code (Guide p.81; workbook round2 Russian Federation
      row 81; workbook round2 China row 97)'
    - 'TRAP: an operator''s licence to provide telecom services or run telecom facilities is 5.5; a licence
      to import or deal in telecom equipment is 10.2, as with Singapore''s dealer''s licence and import
      permit for telecom equipment (Guide p.44; workbook round1 Singapore row 66)'
    - 'TRAP: trade defence measures on ICT goods (anti-dumping duties, countervailing duties, safeguards)
      are 1.4, customs duties on electronic transmissions are 12.6, and other tariffs or taxes are outside
      pillar 10; 10.2 holds non-tariff import restrictions such as quotas and licences. For imported software
      or other intangibles only a procedural step such as an import notification belongs here: the host
      scored Indonesia''s notification form 0.5 under 10.2 and the tariff classification under 12.6 (Guide
      p.74; Guide p.16; Guide p.86; workbook round2 Indonesia row 132; workbook round2 Indonesia row 170)'
    - 'TRAP: the way conformity is certified (supplier''s declaration or third-party certificates) is 11.2
      and required laboratory testing is 11.3; 10.2 records only that a certificate, approval or registration
      is a condition of import (Internal Guide p.15; Guide p.75)'
    - A rule that fixes the share of local or foreign content in a service's catalogue is a local content
      requirement, 10.3, following the Guide's example of a local-content share for over-the-top providers;
      an import quota in 10.2 limits the volume that may be imported (Guide pp.75-76; workbook round2 China
      row 98)
    - 'Export-side licences or permits in the same instrument are 10.4: record the import side here and
      the export side there (Internal Guide p.11; workbook round2 Russian Federation row 81; workbook round2
      Russian Federation row 84)'
    guide_examples:
    - 'Argentina: non-automatic import licences for ICT goods such as machines for making semiconductors
      bring extra documentation and the intervention of technical agencies (Guide p.75)'
    - 'Haiti: individuals of foreign nationality involved in importing must hold a licence that is renewed
      at the start of every fiscal year (Guide p.75)'
    - 'Botswana: the communications regulator must approve communications equipment before it is connected,
      used or operated for broadcasting or telecommunications services (Guide p.75)'
    - 'Pakistan: only the Pakistan Television Corporation and authorities licensed by the federal government
      may import radio or TV transmission equipment, TV cameras, digital cameras and video recorders (Guide
      p.75)'
    null_statement: no import licence, quota, registration, labelling or other import restriction on ICT
      goods or online services found in the corpus
    sources:
      guide_heading: Other import restrictions on ICT goods and online services
      guide_pages:
      - 75
      faq_pages:
      - 14
      methodology_row: 51
      template_row: 54
    review_notes:
    - 'Guide against methodology sheet: ''the absence of institutional transparency'' is a score-1 ground
      only in the Guide (p.75), in procurement wording that also appears on pp.12 and 20. The block follows
      the methodology sheet.'
    - 'Economy aggregation: the Guide scores 0.5 ''for each restriction'' and 1 for two or more (p.75).
      The host rows never show the aggregated 1: Lao PDR has seven rows and India four, all at 0.5.'
    - Indonesia rows 127 (0.5) and 131 (1) both describe Import Approval plus Surveyor Report for electronics.
      The block counts distinct procedures as distinct measures, which follows row 131; 'count measures,
      not instruments' is this draft's reading of the methodology sheet, not a host sentence. Both rows
      are flagged advisory.
    - The host records certificate-before-import rules under 10.2 (Lao PDR rows 70, 71 and 73; Malaysia
      row 81) while the same regimes are also coded 11.2 and 11.3. Whether such rows belong in 10.2 at all
      is not stated by the host.
    - The defining sentence on Guide p.75 is garbled ('excluding other than import bans and local content
      requirements'); the block reads it as 'other than'.
    - 'Round 2 mirror of 1.4: a safeguard can take the form of a quota. The Guide puts import quotas under
      10.2 (p.75) and safeguards under 1.4 (p.16) and gives no tie-break; the 1.4 block carries the same
      note.'

  - id: "10.3"
    pillar: 10
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Local content requirements
    category_official: Local content requirements
    weight: 0.21
    question: Must producers or suppliers of ICT goods or online services for the commercial market use
      a set share of domestic goods, components, services or content?
    definition: 'A local content requirement (LCR) obliges firms to use domestically manufactured goods
      or domestically supplied services in producing ICT-related goods and online services (Guide p.75).
      Applied to imports, it pushes foreign suppliers to buy the components built into their products from
      domestic suppliers, and it still allows imports that contain the required domestic share (Guide p.74;
      Guide p.11). The indicator covers the commercial market only: local content conditions in public procurement
      tenders belong to Pillar 2 (Guide p.75). Scoring turns on the level at which the LCR applies, using
      the Harmonised System (HS), the World Customs Organization''s product nomenclature: product level
      means HS-6 or HS-8 lines such as mobile phones and smartphones; sectoral or horizontal level means
      HS-4, such as telephony equipment, or HS-2 (Guide p.76).'
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'level of application: an LCR at sectoral or horizontal level (HS-4 or HS-2) scores higher than one
      at product level (HS-6 or HS-8) (Guide p.76; Methodology sheet 10.3)'
    - 'number of product-level LCRs: two or more score 1, one scores 0.5 (Guide p.76; Methodology sheet
      10.3)'
    scoring_tree:
    - if: At least one LCR applies at sectoral or horizontal level (HS-4, for example telephony equipment,
        or HS-2), OR at least two LCRs apply at product level, counted across the economy (Guide p.76; Methodology
        sheet 10.3)
      score: 1
    - if: One LCR at product level, that is HS-6 or HS-8 lines such as mobile phones and smartphones, and
        no second one (Guide p.76; Methodology sheet 10.3)
      score: 0.5
    - else:
        score: 0
        meaning: No local content requirement for ICT goods or online services in the commercial market
          (Guide p.76; Methodology sheet 10.3)
    coding_rules:
    - 'Evidence needed: a binding requirement to use domestic goods, components, services or content in
      producing or supplying ICT goods or online services for the commercial market; record the share or
      threshold and the products or services it covers (Guide pp.75-76; workbook round2 Indonesia row 136)'
    - 'Decide the level from the products named: a rule on one product line such as mobile phones or smartphones
      is product level; a rule on a class such as telephony equipment, on a whole sector or across sectors
      is sectoral or horizontal (Guide p.76; Methodology sheet 10.3)'
    - 'Count product-level LCRs across the economy: two or more give 1. One instrument that sets thresholds
      for two products already counts as two, as the host scored thresholds for base stations and for subscriber
      devices (Guide p.76; Methodology sheet 10.3; workbook round2 Indonesia row 135)'
    - HS levels do not fit services. The Guide's examples include a local-content share for over-the-top
      providers and a sourcing condition on retail including e-commerce; the host scored a sourcing rule
      on a whole class of retailers 1 and a cap on each website's foreign dramas 0.5 (Guide p.76; workbook
      round2 India row 130; workbook round2 China row 98)
    - A duty to make devices usable with pre-installed domestic software, or to offer a domestic search
      engine by default, was coded as an LCR at 1 (workbook round2 Russian Federation row 83)
    - Policy objectives, promotion bodies and powers to set content rules with no binding share are recorded
      at 0, as is a decree that repeals LCRs (workbook round1 Malaysia row 83; workbook round2 Russian Federation
      row 82; workbook round2 Lao PDR row 74)
    - 'WTO I-TIP, Global Trade Alert, WTO Trade Policy Reviews and reports by international organisations
      only point to the law: cite the ministry regulation that sets the requirement (Guide p.76)'
    exceptions:
    - Do not score local content conditions attached to public procurement tenders; Pillar 2 covers them
      (Guide p.75)
    - Requirements on raw materials used to make ICT products, such as domestic processing of minerals,
      are recorded at 0 (Internal Guide p.14; Guide p.9)
    - Measures that apply only to the offline version of a service are outside the database (Guide p.9;
      Internal Guide p.7)
    disambiguation:
    - 'TRAP: local content shares or domestic preferences in public procurement tenders are 2.3 (limitations
      in procurement bidding), and exclusion of foreign firms or products from tenders is 2.1; 10.3 covers
      the commercial market, including a domestic-component share in private operators'' own purchases such
      as telecom operators'' capital expenditure. The host filed one Indonesian domestic-component regulation
      under all three; decide by whether the buyer is government (Guide p.75; Guide pp.19-20; workbook round2
      Indonesia row 134; workbook round2 Indonesia row 16; workbook round2 Indonesia row 8)'
    - 'TRAP: a sales or import bar that only enforces a content threshold is still the LCR and stays in
      10.3, because an LCR allows imports once the domestic share is met; add a 10.1 import ban only where
      an official instrument prohibits the product outright. The host recorded Indonesia''s iPhone 16 case
      in both (Guide p.11; workbook round2 Indonesia row 135; workbook round2 Indonesia row 126)'
    - 'TRAP: a quota that limits how much may be imported is 10.2 and scores 1 there; a required domestic
      share of inputs or content is 10.3. A cap on a website''s foreign dramas, set as a share of its domestic
      purchases, was coded 10.3 by the host (Guide pp.75-76; workbook round2 China row 98)'
    - 'TRAP: export-side rules are 10.4, and raw-material rules such as ore export bans or domestic mineral
      processing are not scored: the host kept Indonesia''s nickel measures at 0 under 10.4 and noted that
      the local content requirement is scored under 10.3 (Internal Guide p.14; workbook round2 Indonesia
      row 140)'
    - 'TRAP: a local-sourcing share attached to a foreign-investment rule is 10.3, as with India''s single-brand
      retail condition; the equity limit is 12.01 for e-commerce, and such conditions are not director or
      manager rules (3.3) (Guide p.76; Guide p.84; Guide p.26; workbook round2 India row 130)'
    guide_examples:
    - 'Argentina: local content requirements for certain products (technical manuals, packaging and labels)
      in producing mobile and cellular radio communication equipment in Tierra del Fuego province (Guide
      p.76)'
    - 'Bhutan: over-the-top service providers must ensure that at least 60% of their content is local (Guide
      p.76)'
    - 'India: single-brand retail, including e-commerce with physical stores, must source at least 30% of
      the value of its goods from India for foreign investors to own more than 51% (Guide p.76)'
    - 'Indonesia: digital TV receivers and protocol set-top boxes need at least 20% local content, rising
      to 50% within five years (Guide p.76)'
    null_statement: no local content requirement for ICT goods or online services in the commercial market
      found in the corpus
    sources:
      guide_heading: Local content requirements for the commercial market
      guide_pages:
      - 75
      - 76
      faq_pages:
      - 14
      methodology_row: 52
      template_row: 55
    review_notes:
    - 'Services: the HS-level criteria cannot grade content or sourcing shares on services. Host rows give
      1 (Australia row 61, India row 130, Indonesia row 136) and 0.5 (China row 98) with no stated rule.
      Needs a lead decision.'
    - Australia row 61 scores a free-to-air television content quota 1; whether any online service is bound
      is not shown. Flagged advisory.
    - Indonesia row 128 (10.2, 0.5) contains a commitment to manufacture locally within three years as a
      condition of importer registration, which is close to an LCR; the host kept it in 10.2.
    - 'Evidence quality: Indonesia rows 133, 138 and 139 name no share, cite a different regulation from
      the one described, or say the text is unavailable. Flagged advisory.'
    - 'Economy aggregation: ''two or more LCRs at product level'' (Guide p.76) is an economy-level count;
      the host applied it inside single rows (Indonesia rows 135 and 137).'
    - 'Round 2 mirrors of 2.1, 3.3 and 12.01: the host also filed Indonesia''s operator capital-expenditure
      rule under 2.1 (Indonesia row 8, flagged suspect by gA) and India''s single-brand retail conditions
      under 3.3 (India row 27, score 1) although they hold no director or manager rule. The 10.3 lines agree
      with the other blocks'' wording.'

  - id: "10.4"
    pillar: 10
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Export restrictions on ICTgoods and online services
    category_official: Export restrictions on ICTgoods and online services
    weight: 0.17
    question: Does the economy ban, license or otherwise limit the export of ICT goods or online services?
    definition: 'This indicator covers export restrictions on ICT goods and services: export bans, export
      licences and other restrictions that limit the number of goods or services exported (Guide p.76).
      All types of export restriction count when they apply to ICT products on the WTO ITA I and ITA II
      lists or the proposed ITA III list (Internal Guide p.14; Guide p.9). Typical carriers are licensing
      regimes for strategic and dual-use items that cover computers, telecom equipment and information security
      products, and permits for radio equipment (Guide p.76). Some export bans protect products and technologies
      that an economy treats as vital to its national interests (Guide p.74). The indicator has the lowest
      weight in the pillar because export restrictions have a limited impact on foreign competition in the
      economy concerned (Guide p.77).'
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: 'At least one export restriction applies to ICT goods or online services: an export ban, an export
        licence or permit requirement, or another limit on how much may be exported (Guide p.76; Internal
        Guide p.14; Methodology sheet 10.4)'
      score: 1
    - else:
        score: 0
        meaning: No export restriction on ICT goods or online services (Guide p.76; Methodology sheet 10.4)
    coding_rules:
    - 'Evidence needed: a provision that prohibits export, requires an export licence or permit, or otherwise
      limits the quantity exported, and that reaches ICT products; name the ICT categories covered (Guide
      p.76; Internal Guide p.14)'
    - Every type counts and one measure is enough for 1; further export restrictions are recorded as their
      own findings but do not change the binary score (Guide p.76; Methodology sheet 10.4)
    - Strategic and dual-use control lists count when they cover ICT items such as computers, telecom equipment,
      encryption or information security products; cite the control list and the ICT categories on it (Guide
      p.76; workbook round2 China row 99; workbook round2 India row 131)
    - The host also recorded controls on exporting technologies, including intangible technology transfers,
      as export restrictions (workbook round2 China row 100; workbook round1 Australia row 62)
    - An export ban with listed exceptions still counts, as with a smartphone export ban that exempts travellers'
      personal phones and a temporary export ban list covering telecommunication equipment (Guide p.76;
      workbook round2 Russian Federation row 85)
    - A general power to prohibit or license exports, with no ICT product on the list, is recorded at 0
      (workbook round2 Thailand row 93; workbook round2 Lao PDR row 78)
    - WTO I-TIP, Global Trade Alert, the OECD Inventory on Export Restrictions on Industrial Raw Materials
      and WTO Trade Policy Reviews only point to the law; the OECD inventory concerns raw materials, which
      score 0, so use it only to find measures on ICT products (Guide p.76; Internal Guide p.14)
    exceptions:
    - Export restrictions on raw materials used to make ICT products, such as rare earths or nickel ore,
      are recorded at 0 (Internal Guide p.14; Guide p.9; workbook round2 Indonesia row 140)
    - Do not score export controls on e-waste or used ICT products (Internal Guide p.7)
    - Export duties and taxes are outside pillar 10, which covers measures other than tariffs or taxes (Guide
      p.74)
    disambiguation:
    - 'TRAP: one instrument often controls both directions. Record the import-side licence or permit under
      10.2 and the export-side one under 10.4, each with its own score: the host split the Eurasian Economic
      Commission''s non-tariff decision this way, 0.5 for import permits and 1 for export permits (Internal
      Guide p.11; workbook round2 Russian Federation row 81; workbook round2 Russian Federation row 84)'
    - 'TRAP: export licensing of dual-use and strategic goods is an export restriction (10.4) whenever the
      control list covers ICT items, including encryption products; it is not an encryption-standards deviation
      (11.4). The host scored Singapore''s strategic goods licensing 0 while scoring the same kind of regime
      1 for Australia, China and India; follow the Guide, whose first example is export licences for dual-use
      computers, telecom equipment and information security products (Guide p.76; Guide p.81; workbook round1
      Singapore row 69; workbook round1 Australia row 62)'
    - 'TRAP: export bans, duties or processing rules on raw materials (nickel ore, rare earths) are not
      scored as export restrictions on ICT goods, although the Guide lists a raw-materials inventory among
      its secondary sources; a domestic-content requirement on ICT products in the same instrument is assessed
      under 10.3 (Internal Guide p.14; Guide p.9; workbook round2 Indonesia row 140)'
    - An import ban is 10.1 and an export ban is 10.4; a prohibited-goods order that covers both directions
      is recorded under each (Guide p.76; Internal Guide p.11)
    guide_examples:
    - 'Armenia, Georgia, India, Kyrgyzstan and Republic of Korea: export licences are required for strategic
      items, including dual-use goods such as computers, telecom equipment and information security products
      (Guide p.76)'
    - 'Colombia: the export of smartphones is prohibited, with exceptions such as mobile phones that are
      travellers'' personal possessions (Guide p.76)'
    - 'Hong Kong, China: export permits are required for radio transmitting apparatus (Guide p.76)'
    - 'Thailand: an export licence is required for radio communication equipment and ancillary devices (Guide
      p.76)'
    null_statement: no export ban, licence or other export restriction on ICT goods or online services found
      in the corpus
    sources:
      guide_heading: Export restrictions on ICT goods and online services
      guide_pages:
      - 76
      faq_pages:
      - 14
      methodology_row: 53
      template_row: 56
    review_notes:
    - Singapore row 69 scores dual-use export licensing 0 against Guide p.76 and against the host's own
      rows for Australia, China, India and Malaysia. Flagged suspect; the row does not show which ICT items
      the Singapore list covers.
    - Thailand row 94 is the Guide's own Thailand example (p.76) and carries a host verification mark 'Not
      correct' with the score maintained. What is wrong is not stated.
    - Whether a catalogue of technologies restricted from export (China row 100) counts as 'ICT goods and
      online services' rests on the row alone.
    - The Guide names the OECD raw-materials inventory as a secondary source (p.76) while Internal Guide
      p.14 scores raw-material measures 0.

