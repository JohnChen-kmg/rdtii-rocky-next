  - id: "11.1"
    pillar: 11
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Lack of transparent technical standards
    category_official: Lack of transparent technical standards
    weight: 0.2
    polarity: inverted
    level: economy
    framework_name: transparent standard-setting process that is open to foreign stakeholders
    question: Does the economy lack an open and transparent standard-setting process, that is, are foreign
      stakeholders barred from standard-setting bodies or are standards made without public consultation?
    definition: 'Pillar 11 covers technical standards and related procedures that can restrict trade in
      ICT goods and online services, specifically in the telecommunication sector (Guide p.78). In an open
      and transparent standards regime all relevant stakeholders can engage and comment. This indicator
      asks two things about standard-setting in sectors relevant to digital trade: whether participation
      by relevant stakeholders, including foreign businesses, is barred or restricted, and whether transparent
      public consultation or engagement mechanisms exist (Guide p.78). A lack of institutional transparency
      can take the form of no clear consultation process or no public notification inviting stakeholder
      input (Guide p.78). The host names the indicator as a lack: the score is 1 when foreigners cannot
      take part in standard-setting bodies or standard-setting is not transparent, and 0 when the process
      is open and consulted (Guide p.79; Methodology sheet 11.1).'
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: 'Foreigners are not allowed to participate in the standard-setting bodies, OR standard-setting
        is not transparent: there is no clear consultation process or no public notification inviting stakeholder
        input (Guide pp.78-79; Methodology sheet 11.1)'
      score: 1
    - else:
        score: 0
        meaning: 'No restriction: standard-setting is open to relevant stakeholders, including foreign businesses,
          and uses transparent public consultation (Guide pp.78-79; Methodology sheet 11.1)'
    coding_rules:
    - 'ECONOMY-LEVEL: answer once per economy. Record whether standard-setting for ICT and telecom products
      is open to foreign stakeholders and consulted on, citing the provisions of the standards law or regulator
      procedure that establish participation and public comment; other provisions of the same law are not
      separate findings (Guide pp.78-79; workbook round2 China row 102)'
    - 'Two tests, either of which gives 1: foreigners are not allowed, or are restricted, in standard-setting
      bodies; or standard-setting is not transparent, with no clear consultation process or no public notice
      inviting input (Guide pp.78-79; Methodology sheet 11.1)'
    - 'Look at every body that sets standards for ICT or telecom products, not only the national standards
      body: the Guide''s Egypt example is the telecom regulator''s board setting equipment standards without
      foreign participation (Guide p.78)'
    - Evidence for 0 is a participation rule with no nationality bar together with a public comment step
      on draft standards, such as equal treatment of foreign-invested firms and a 60-day public comment
      period (workbook round2 China row 102; workbook round2 Lao PDR row 80)
    - 'Opacity is shown from the governing text: cite the standards law or the standard-setting body''s
      procedure and state that it provides no consultation or public notice step (Guide p.78; Guide p.12)'
    - Alignment with ISO, IEC or ITU standards, or membership of international standards bodies, is not
      one of the two tests; the evidence must go to participation and consultation in domestic standard-setting
      (Guide pp.78-79; Methodology sheet 11.1)
    - 'WTO Trade Policy Reviews only point to the law: cite the standards law, regulation or official procedure
      (Guide p.79)'
    exceptions: []
    disambiguation:
    - 'TRAP: inverted polarity. A standards law that opens participation and requires public consultation
      is evidence of presence and scores 0; score 1 is reserved for exclusion of foreigners or opaque standard-setting.
      Never emit 1 because a detailed standards law was found (Guide p.79; Methodology sheet 11.1)'
    - 'TRAP: economy-level, not provision-level. The question is whether the economy''s standard-setting
      is open and transparent; individual articles of the standards law are not separate 11.1 findings (Guide
      pp.78-79; workbook round2 China row 102)'
    - 'TRAP: a duty to comply with a standard, hold a certificate or pass testing concerns conformity assessment,
      which is 11.2 (certification route) or 11.3 (testing); 11.1 looks only at who may take part in making
      standards and whether drafts are consulted on (Guide pp.78-80; Internal Guide p.15)'
    - 'Limited roles short of exclusion were scored 0 by the host: foreign-invested firms taking part on
      equal terms, and foreign standards bodies sitting as observers without a vote (workbook round2 China
      row 102; workbook round2 Russian Federation row 87)'
    - A rule that only organisations headquartered in the economy may nominate committee members was also
      scored 0 by the host, although the Guide's question covers restricted foreign participation; state
      such a rule in the note so a reviewer can decide (Guide p.78; workbook round1 Australia row 64)
    guide_examples:
    - 'Cuba: foreign companies are not allowed to participate in institutional bodies that establish and
      regulate trade norms (Guide p.78)'
    - 'Egypt: the board of directors of the National Telecommunication Regulatory Authority sets standards
      for telecom equipment without foreign participation (Guide p.78)'
    null_statement: no provision on stakeholder participation or public consultation in standard-setting
      found in the corpus
    sources:
      guide_heading: Technical standards issues
      guide_pages:
      - 78
      - 79
      faq_pages: []
      methodology_row: 55
      template_row: 58
    review_notes:
    - 'No score-1 host row exists: all 13 rows are 0. The score-1 side rests on the Guide text and its Cuba
      and Egypt examples.'
    - 'level: economy is this draft''s call, not a host statement. The host''s economy-level rule (Indicator
      Reference row 80) names 7.1 and 7.2 only. Grounds: the opacity test is an absence, and all economies
      but Thailand have one row. Risk: a sectoral exclusion clause is a provision-level finding; the third
      coding rule covers it.'
    - 'Australia row 64 (0): nominating organisations must be headquartered in Australia. Guide p.78 asks
      whether foreign participation is ''not allowed or restricted'', while the scoring sentence on p.79
      says ''not allowed''. Flagged advisory.'
    - 'Opacity standard: the Guide does not say whether silence in the standards law is enough for 1 or
      whether a documented gap is needed.'
    - Host name 'Lack of transparent technical standards' differs from the Guide heading 'Technical standards
      issues' (p.78); matched by the criteria.
    - 'The host''s hands-on exercise 1 (deck pp.7-8) shows an AI output for 11.1 India built on IT Act s.70B
      and marks it as hallucination or wrong retrieval because the cited subsections do not appear in the
      act. Not promoted to a rule: it is a citation failure, covered by the citation contract.'

  - id: "11.2"
    pillar: 11
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Self-certification limitations for product safety (radio transmissions, EMC/EMI)
    category_official: Self-certification limitations for product safety (radio transmissions, EMC/EMI)
    weight: 0.2
    question: Are foreign suppliers of ICT products barred from self-certifying conformity with domestic
      standards, and if so are certificates from foreign conformity assessment bodies accepted instead?
    definition: Certification verifies that imported products meet domestic standards; electrical products,
      for instance, must generally meet domestic radio transmission, electromagnetic interference (EMI)
      or electromagnetic compatibility (EMC) standards (Guide p.79). The indicator asks whether suppliers
      may not self-certify product safety. Two routes lead to a certificate or declaration of conformity.
      Self-certification is a Supplier's Declaration of Conformity (SDoC). Third-party certification comes
      from Conformity Assessment Bodies (CABs) and removes the need for local testing of exported products;
      members of a Mutual Recognition Agreement (MRA), such as the ASEAN MRA for electrical and electronic
      equipment or the APEC MRA for telecommunications equipment, recognise each other's CABs (Guide p.79).
      The score rises as fewer of these routes are open to foreign suppliers (Guide p.79; Methodology sheet
      11.2). The indicator is about certification, meaning marking, not about additional testing procedures
      (Internal Guide p.15).
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - whether a supplier's declaration of conformity is accepted from foreign businesses for at least some
      ICT products (Guide p.79; Methodology sheet 11.2)
    - whether certificates from conformity assessment bodies in other economies are accepted, typically
      under an MRA (Guide p.79; Methodology sheet 11.2)
    scoring_tree:
    - if: Neither SDoC nor third-party certification from foreign conformity assessment bodies is recognised,
        so foreign suppliers must have their products tested or certified locally (Guide p.79; Methodology
        sheet 11.2)
      score: 1
    - if: SDoC is not permitted, but third-party certification from conformity assessment bodies in other
        economies is accepted, typically from a number of countries under an MRA; also where third-party
        certification is recognised for some ICT products while local testing is required for others (Guide
        p.79; Methodology sheet 11.2)
      score: 0.5
    - else:
        score: 0
        meaning: SDoC is permitted for foreign businesses, for at least some ICT products (Guide p.79; Methodology
          sheet 11.2)
    coding_rules:
    - 'Evidence needed: the rules on how conformity of ICT and telecom equipment is shown, who may declare
      or certify, and whose certificates are recognised. Search technical-standards and telecom-equipment
      regulations for the words certification and license, and check MRAs, where exceptions may sit (Internal
      Guide p.14; Guide p.79)'
    - 'Record each certification regime and each MRA as its own finding, then answer once per economy using
      the Guide''s product-mix rules: SDoC recognised for at least some ICT products gives 0; third-party
      certification recognised for some products with local testing required for others gives 0.5 (Guide
      p.79)'
    - Members of the ASEAN EE MRA, the APEC TEL MRA or the APEC EEMRA score 0.5 or less, because these MRAs
      keep reciprocal recognition of conformity assessment bodies; record the MRA as evidence (Internal
      Guide p.15; workbook round1 Malaysia row 90)
    - 'The Guide also gives 1 where an economy has no framework or indication for accepting SDoC, and for
      0.5 asks only that certificates from CABs in other economies be accepted; the methodology sheet gives
      1 only when neither SDoC nor third-party certification is allowed and words 0.5 as CABs from a number
      of MRA countries. Follow the methodology sheet: no SDoC with accepted foreign CAB certificates is
      0.5 (Guide p.79; Methodology sheet 11.2)'
    - Score 0 needs a provision or official indication that suppliers, including foreign ones, may declare
      conformity; silence is not acceptance of SDoC, and the Guide treats an economy with no framework or
      indication for accepting it as restrictive (Guide p.79; Methodology sheet 11.2)
    - 'The 0 test is an SDoC route open to foreign businesses: state who may file the declaration (foreign
      manufacturer, local representative, or local registered dealer only). The host scored 0.5 where only
      locally registered dealers may file (Guide p.79; Methodology sheet 11.2; workbook round1 Singapore
      row 72)'
    - 'Reports by business associations, WTO Trade Policy Reviews, the Telecommunication Industry Association
      and the ITU only point to the law: cite the regulation or the MRA text (Guide p.79)'
    exceptions: []
    disambiguation:
    - 'TRAP: 11.2 is about certification and marking, meaning who may certify or declare conformity; additional
      testing procedures are 11.3. One regime can evidence both: India''s mandatory testing and certification
      of telecom equipment is coded 1 under 11.2 and 1 under 11.3, so assess the certification route here
      and the testing requirement there (Internal Guide p.15; workbook round2 India row 134; workbook round2
      India row 137)'
    - 'TRAP: type approval or certification of telecom equipment is 11.2, not telecom operator licensing
      (5.5), even though the host''s search keyword for 11.2 includes the word license; 5.5 is the licence
      to provide telecom services or operate telecom facilities (Internal Guide p.14; Guide p.44)'
    - 'TRAP: a licence or permit needed to import equipment, and labelling required as an import condition,
      are 10.2. A language-labelling duty is not a certification limitation, and the host scored it 0 here
      (Guide p.75; workbook round2 Indonesia row 146)'
    - 'A declaration that must be registered with the regulator and backed by tests from accredited national
      laboratories is not self-certification: the host scored Russia''s regime for communication devices
      1 (workbook round2 Russian Federation row 88)'
    - A network access licence that requires in-country network testing is a testing requirement to assess
      under 11.3; score 11.2 only on what the measure says about declarations and certificates (Guide pp.79-80;
      workbook round2 China row 104)
    - How standards are made, meaning who participates and whether drafts are consulted on, is 11.1; 11.2
      starts once the standard exists and asks how conformity with it is certified (Guide pp.78-79)
    guide_examples: []
    null_statement: no rule on supplier's declaration of conformity or third-party certification of ICT
      products found in the corpus
    sources:
      guide_heading: Self-certification limitations for product safety (radio transmissions, EMC/EMI)
      guide_pages:
      - 79
      faq_pages:
      - 14
      - 15
      methodology_row: 56
      template_row: 59
    review_notes:
    - The Guide gives no country example for this indicator (p.79); it names only the ASEAN EE MRA and the
      APEC TEL MRA. guide_examples is empty.
    - 'Guide internal conflict (p.79): ''no regulatory framework or indication for accepting SDoC'' scores
      1, while the next sentence gives 0.5 when SDoC is refused and foreign CAB certificates are accepted.
      The block follows the methodology sheet; the host rows do the same (Malaysia row 88, Indonesia rows
      143 to 145).'
    - 'Guide against methodology sheet: the sheet words 0.5 as CABs ''from a number of countries with MRA'';
      the Guide asks only for CABs in other economies. No row tests foreign CAB acceptance without an MRA.'
    - 'Local-entity conditions on who may file an SDoC are scored inconsistently: Singapore row 72 is 0.5,
      Thailand rows 101, 102 and 104 are 0 (host verification marked them ''Not correct'' and kept the score).
      Needs a lead decision.'
    - 'Absence rows: the block is not marked inverted, yet an SDoC provision is evidence for 0 and the Guide
      scores ''no framework for accepting SDoC'' 1. A null row should not default to 0 without a decision.'
    - 'The product-mix rules are economy-level, while the host scores rows separately: India rows 134 (1),
      135 (0) and 136 (0.5); Thailand row 100 (0.5) beside rows at 0.'

  - id: "11.3"
    pillar: 11
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Product screening and testing requirements
    category_official: Product screening and testing requirements
    weight: 0.3
    question: Must ICT products pass screening or testing beyond standard conformity assessment before entering
      the market, and are third-party test results accepted?
    definition: 'The indicator asks whether an economy imposes an additional screening or testing requirement
      on ICT imports: products must undergo further technical tests, beyond standard conformity assessment,
      to verify aspects of compliance before they are allowed into the market (Guide p.80). The declared
      justification is often national security, which the Guide distinguishes from testing for public safety
      and product efficiency such as EMC or EMI testing (Guide p.80). Domestic testing includes testing
      that must be done by in-country designated or country-accredited assessment bodies; the lower score
      applies where local authorities accept third-party testing results (Guide p.80). The indicator concerns
      testing procedures, while certification and marking are 11.2 (Internal Guide p.15). Pillar 11 covers
      standards and procedures for ICT goods and online services, specifically in the telecommunication
      sector (Guide p.78).'
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'where testing must take place: mandatory domestic screening or testing, including by in-country designated
      or country-accredited bodies, scores higher (Guide p.80; Methodology sheet 11.3)'
    - whether local authorities accept third-party testing results for at least some ICT products (Guide
      p.80; Methodology sheet 11.3)
    scoring_tree:
    - if: A domestic screening or testing requirement is in place and applied to ICT products in scope,
        with no acceptance of third-party testing results; this includes testing that must be done by in-country
        designated or country-accredited bodies (Guide p.80; Methodology sheet 11.3)
      score: 1
    - if: A screening or testing requirement is in place, but local authorities accept third-party testing
        results, at least for some ICT products (Guide p.80; Methodology sheet 11.3)
      score: 0.5
    - else:
        score: 0
        meaning: No screening or testing requirement on ICT products (Guide p.80; Methodology sheet 11.3)
    coding_rules:
    - 'Evidence needed: a provision that makes import, sale or use of an ICT product conditional on screening
      or testing, plus who must carry it out and whether foreign or third-party test reports are accepted;
      record both facts (Guide p.80; Methodology sheet 11.3)'
    - 'Testing that only in-country designated or country-accredited laboratories may perform is domestic
      testing and scores 1: the host scored India''s telecom equipment testing by designated Indian labs,
      and registration tests at recognised labs all located in India, 1 (Guide p.80; workbook round2 India
      row 137; workbook round2 India row 138)'
    - 'Mixed regimes: the Guide gives 0.5 where third-party results are accepted for at least some ICT products,
      and 1 where domestic testing is required for certain products with no third-party acceptance; both
      can describe one economy. Follow the methodology sheet: a measure with any acceptance of third-party
      results is 0.5, and 1 is a requirement with none. The host scored Indonesia''s in-country sample testing
      with recognised foreign labs 0.5 (Guide p.80; Methodology sheet 11.3; workbook round2 Indonesia row
      147)'
    - Record each testing regime as its own finding and state the products it covers, so the product-mix
      rule can be applied once for the economy (Guide p.80)
    - The Guide's footnote sets safety and efficiency testing such as EMC or EMI apart from the security
      screening it targets, yet its own examples are conformity tests and the host scores radio and EMC
      type-approval testing here at 0.5 where foreign lab reports are accepted; record such regimes and
      give the stated ground for testing (Guide p.80; workbook round1 Singapore row 73; workbook round2
      Mongolia row 67)
    - A security review of network products and services counts as screening, and the host scored China's
      national security review mechanism 1; a voluntary security framework with no mandated product testing
      is recorded at 0 (workbook round2 China row 105; workbook round1 Australia row 66)
    - 'Reports by business associations, WTO Trade Policy Reviews, the Telecommunication Industry Association
      and the ITU only point to the law: cite the regulation that requires the testing (Guide p.80)'
    exceptions: []
    disambiguation:
    - 'TRAP: 11.3 is additional testing; the certification or marking route (supplier''s declaration, third-party
      certificates, MRAs) is 11.2. Local-laboratory testing appears in the score-1 text of both indicators,
      so one regime can be recorded under each (Internal Guide p.15; Guide pp.79-80; workbook round2 India
      row 137; workbook round2 India row 134)'
    - 'TRAP: a national security review of foreign investment is 3.4 (investment screening); a security
      review of network products and services is 11.3. China''s National Security Law provision covers both
      and the host recorded it under each (Guide p.26; workbook round2 China row 105; workbook round2 China
      row 20)'
    - 'TRAP: a notification, registration or licence needed to import or distribute encryption products
      is an import-side procedure assessed under 10.2, since the Guide sends such licensing to pillars 9
      and 10; record it under 11.3 only where the product itself must be examined or tested. The host placed
      Russia''s security-service notification for devices containing encryption under 11.3 at 1 and the
      same decision''s import permits under 10.2 (Guide p.81; Guide p.80; workbook round2 Russian Federation
      row 90; workbook round2 Russian Federation row 81)'
    - 'TRAP: mandatory testing or certification of commercial cryptographic products by accredited institutions
      is a testing requirement, 11.3; it becomes 11.4 only if certification demands a non-standard algorithm,
      weaker parameters or disclosure of keys or source code. The host scored China''s Cryptography Law
      rule that listed products may be sold only after such testing 0 here; follow the Guide, under which
      a testing requirement scores 1 or 0.5 (Guide p.80; Guide p.81; workbook round2 China row 106)'
    - A test or certificate that is also a condition of import can additionally be recorded under 10.2 as
      an import restriction, since one measure may be listed under several indicators (Internal Guide p.11;
      Guide p.75)
    - How standards are made is 11.1; 11.3 concerns testing products against them (Guide pp.78-80)
    guide_examples:
    - 'Gambia: electrical products, including audio and video products such as televisions and LCD panels,
      must undergo local testing and are certified only after conformity assessment by The Gambia Standards
      Bureau (Guide p.80)'
    - 'India: in-economy security testing is required for all telecom equipment before sale, import or use,
      by bodies designated by the Telecom Engineering Center, which issues certificates on their test reports
      (Guide p.80)'
    - 'Sri Lanka: importers of designated goods such as primary cells, batteries and PVC-insulated cables
      must submit documents to Customs and the Sri Lanka Standards Institution; samples are tested and the
      goods need prior approval before distribution (Guide p.80)'
    null_statement: no screening or testing requirement on ICT products found in the corpus
    sources:
      guide_heading: Product screening and testing requirements
      guide_pages:
      - 80
      faq_pages:
      - 15
      methodology_row: 57
      template_row: 60
    review_notes:
    - 'Guide internal conflict (p.80): the mixed-case paragraph gives 0.5 for third-party acceptance ''at
      least for some ICT products'' and 1 where domestic testing is required ''for certain products without
      acceptance of third-party testing''. Both can hold for one economy. The block follows the methodology
      sheet (any acceptance gives 0.5), as the host did for Indonesia row 147.'
    - Footnote 48 (p.80) separates safety and efficiency testing (EMC, EMI) from the indicator's target,
      but the Guide's Gambia and Sri Lanka examples and the host rows (Singapore row 73, Malaysia row 91,
      Mongolia row 67, Thailand row 103) score such testing. The block follows the examples and rows.
    - Russian Federation row 90 scores a security-service notification 1 with no testing described; Guide
      p.81 sends encryption registration and licensing to pillars 9 and 10. Flagged advisory.
    - China row 106 scores accredited testing of commercial cryptographic products 0 with no reason. Flagged
      suspect.
    - India's mandatory testing and certification regime scores 1 under both 11.2 (row 134) and 11.3 (row
      137); the host does not say whether this double count is intended.

  - id: "11.4"
    pillar: 11
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Deviation from international encryption standards (ISO, IEC, ITU, FIPS, AES, TDES, and ECC)
    category_official: Deviation from international encryption standards (ISO, IEC, ITU, FIPS, AES, TDES,
      and ECC)
    weight: 0.3
    question: Does any measure require encryption that departs from ISO/IEC standards, such as a mandated
      domestic algorithm, weaker keys, or disclosure of source code or keys to certify encryption products?
    definition: The indicator asks whether an economy adopts encryption standards that deviate from internationally
      recognised standards based on the ISO and IEC encryption standards (Guide p.80). Encryption encodes
      a message with an algorithm, turning plaintext into ciphertext; decryption reverses it with a password
      or private key; strength depends on key length, block size and design (Guide p.81). The benchmarks
      are the ISO/IEC 18033 series on encryption systems and the ISO/IEC 11770 series on key management
      (Guide p.81). A deviation is a requirement to use an algorithm outside ISO/IEC 18033 such as a domestic
      algorithm, block sizes or key lengths below its minimums, key management outside ISO/IEC 11770, or
      disclosure of trade secrets such as source code or encryption keys when certifying encryption products
      beyond the ISO/IEC validation requirements, which test and validate cryptographic modules without
      mandating disclosure (Guide p.81).
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: 'At least one measure requires encryption that deviates from the ISO/IEC benchmarks: an algorithm
        not listed in ISO/IEC 18033 (such as a mandated domestic algorithm), block sizes or key lengths
        below its minimums, key management outside ISO/IEC 11770, or disclosure of trade secrets such as
        source code or keys to certify encryption products beyond ISO/IEC validation (Guide p.81; Methodology
        sheet 11.4)'
      score: 1
    - else:
        score: 0
        meaning: 'No restriction: no measure requires a deviation, because there is no encryption standard
          or the standards follow the international ones (Guide p.81; Methodology sheet 11.4)'
    coding_rules:
    - 'Evidence needed: a binding requirement in an official text together with the technical parameter
      it sets: the algorithm named, the key length or block size, the key-management method, or what must
      be disclosed for certification. Compare that parameter with the benchmarks (Guide p.81)'
    - 'Benchmarks: ISO/IEC 18033 recognises algorithms such as TDEA, MISTY1, CAST-128, HIGHT, AES, Camellia
      and SEED and recommends symmetric keys of 128 bits or more; ISO/IEC 11770 covers key management such
      as RSA-based key transport and ECC-based key exchange (Guide p.81)'
    - A requirement to use strong, internationally accepted, non-deprecated algorithms and key lengths is
      alignment and is recorded at 0 (workbook round2 India row 140; workbook round1 Australia row 67)
    - 'A national cryptography programme is not a deviation by itself: the host scored 0 where domestic
      algorithms had been adopted as ISO/IEC standards, and where a national algorithm policy still allowed
      international algorithms and required no trade-secret disclosure (workbook round2 China row 107; workbook
      round2 Indonesia row 150; workbook round1 Malaysia row 93)'
    - The methodology sheet also counts a known case. The Guide asks for official laws, regulations and
      notifications, and 11.4 is not among the practice-based indicators, so a known case still needs an
      official source (Methodology sheet 11.4; Guide p.81; Internal Guide p.8)
    - One measure is enough and the score is binary; an economy with no encryption standard or policy is
      recorded at 0 with the governing law cited (Guide p.81; Guide p.12; workbook round2 Lao PDR row 83)
    - 'The World Map of Encryption Laws and Policies and Freedom House''s reports on the Net only point
      to the law: cite the official text (Guide p.81)'
    exceptions:
    - Registration and licensing requirements to use, import or distribute an encryption device are not
      a restriction under this indicator unless their conditions include one of the listed deviations; other
      pillars such as 9 and 10 cover them (Guide p.81)
    disambiguation:
    - 'TRAP: a licence, registration or permit to use, import, export or distribute encryption products
      or services is not 11.4 unless its conditions set a deviating algorithm, parameter or disclosure:
      import permits are 10.2, export licences are 10.4 and licences for encryption services are 9.4. The
      host scored Russia''s encryption licensing 0 here and 0.5 under 9.4 (Guide p.81; workbook round2 Russian
      Federation row 92; workbook round2 Russian Federation row 77)'
    - 'TRAP: disclosure of source code or encryption keys demanded to certify encryption products, beyond
      ISO/IEC module validation, is 11.4, not 4.9; 4.9 (mandatory disclosure of trade secrets) leaves out
      disclosure tied to encryption and to public procurement (Guide p.81; Guide p.37)'
    - 'TRAP: a requirement to use a specific encryption standard, or to surrender source code or encryption
      keys, as a condition of winning a public tender is 2.2, scored 0.5 for specific encryption and 1 for
      surrender of trade secrets; 11.4 does not need a procurement setting (Guide pp.19-20; Guide p.81)'
    - 'TRAP: national standards for payment security that deviate from international standards are an online
      payment limitation, 12.4.3. One payment-security direction can be read under both, and the host recorded
      India''s central bank direction at 0 under each (Guide p.85; workbook round2 India row 140; workbook
      round2 India row 148)'
    - 'TRAP: a government power to decrypt data or to order decryption is government access to data, 7.5,
      not an encryption standard; the host coded Thailand''s decryption power under 7.5 and recorded 0 here
      (Guide p.62; workbook round2 Thailand row 105; workbook round2 Thailand row 69)'
    - Testing or certification of encryption products by accredited bodies, with no deviating parameter
      and no forced disclosure, is a testing requirement (11.3), not a deviation; the host scored China's
      sales certification of commercial cryptography products 0 here because it forces no trade-secret disclosure
      (Guide p.80; Guide p.81; workbook round2 China row 107)
    guide_examples: []
    null_statement: no measure requiring encryption that deviates from international standards found in
      the corpus
    sources:
      guide_heading: Deviation from international encryption standards
      guide_pages:
      - 80
      - 81
      faq_pages: []
      methodology_row: 58
      template_row: 61
    review_notes:
    - The Guide gives no country example for this indicator (pp.80-81), so guide_examples is empty.
    - 'No score-1 host row exists: all 11 rows are 0. Malaysia row 93, Indonesia row 150 and China row 107
      are close calls that rest on the rows'' reading that no binding mandate for an unlisted algorithm
      exists. Indonesia row 150 is flagged advisory.'
    - The methodology sheet's 'known case' hints at practice evidence; the Guide asks for official texts
      and Internal Guide p.8 does not list 11.4 as practice-based.
    - The host name lists ITU, FIPS, AES, TDES and ECC, while the Guide benchmark is ISO/IEC 18033 and 11770
      only (p.81). The host never says whether a FIPS-based requirement counts as aligned.
    - Guide p.37 leaves encryption-related disclosure out of 4.9 yet lists Malawi's rule that encryption
      service providers declare source code as a 4.9 example. The 4.9 and 11.4 boundary is inconsistent
      in the Guide itself.
    - The block-size bullet on Guide p.81 is garbled ('lower than 64-bit block cyphers and 128-bit block
      cyphers'); the block does not restate a number for block size.

# ----------------------------------------------------------------------------
# PILLAR 12 — ONLINE SALES AND TRANSACTIONS
# Where the measures live: E-commerce laws and decrees; foreign investment
# policies and negative lists; postal and courier rules; central bank rules on
# payment systems, electronic money and foreign exchange; customs rules on
# low-value imports and electronic transmissions; domain name registry rules;
# rules on local representatives of online service providers; consumer
# protection laws (Guide pp.83-88).
# ----------------------------------------------------------------------------

  - id: "12.01"
    pillar: 12
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Foreign equity limits in e-commerce sector
    category_official: Foreign equity limits in e-commerce sector
    weight: 0.22
    question: Does a law or policy written for the e-commerce sector limit the share of an e-commerce company
      that foreign investors may own, and does it allow only a minority stake, a capped controlling stake,
      or full ownership?
    definition: The indicator records the maximum share of equity that foreign investors may hold in the
      e-commerce sector specifically (Guide p.84). Foreign equity shares are shares that foreign natural
      or legal persons hold in a firm incorporated in the economy receiving the investment (Guide p.84).
      E-commerce means sales or purchases of goods or services ordered over computer networks, for example
      through marketplaces, online platforms and websites (Guide p.8). Equity limits in telecommunications
      and in other sectors relevant to digital trade are outside the indicator and are captured in Pillars
      5 and 3 (Guide p.84). Because the focus is on e-commerce alone, the scoring has no separate metric
      for State-owned enterprises (Guide p.84). This is the Guide's first Pillar 12 indicator; the host
      writes its ID as 12.01 (Methodology sheet 12.01).
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'size of the foreign stake allowed in an e-commerce firm: a ban or a minority-only stake scores highest,
      a capped controlling stake scores in the middle, and full ownership scores 0 (Guide p.84; Methodology
      sheet 12.01)'
    scoring_tree:
    - if: Foreign investors may hold only a minority stake in an e-commerce business, meaning a cap between
        1% and 50%, or foreign investment in an e-commerce business model is banned outright; the Guide's
        own example is a ban, and the host scored India's ban on foreign investment in inventory-based e-commerce
        1 (Guide p.84; Methodology sheet 12.01; workbook round2 India row 142)
      score: 1
    - if: Foreign investors may hold a controlling stake but a maximum cap remains, meaning a cap between
        51% and 99%, such as the 90% limit in Lao PDR's e-commerce decree (Guide p.84; Methodology sheet
        12.01; workbook round2 Lao PDR row 85)
      score: 0.5
    - else:
        score: 0
        meaning: Full foreign ownership (100%) is allowed in the e-commerce sector; no e-commerce-specific
          limit on foreign equity is in force (Guide p.84; Methodology sheet 12.01)
    coding_rules:
    - 'Score only a limit stated for e-commerce itself: an e-commerce law or decree, a sector regulator''s
      notice, or the e-commerce entry of a foreign investment policy (Guide p.84; workbook round2 Lao PDR
      row 85; workbook round2 China row 109; workbook round2 India row 142).'
    - A cap of exactly 50% scores 1. The methodology band for score 1 runs from 1% to 50%, while the Guide
      describes score 1 as less than 50% and score 0.5 as more than 50%, which leaves 50% unplaced; follow
      the methodology sheet (Methodology sheet 12.01; Guide p.84).
    - 'A ban or cap on one e-commerce business model is enough even when another model is fully open: India
      allows 100% foreign investment in marketplace e-commerce but none in inventory-based e-commerce, and
      scored 1 (workbook round2 India row 142).'
    - A capital threshold below which foreign ownership is barred counts when it is written for retail trade
      or e-commerce, as in the Guide's Philippines example; a minimum investment value required of foreign
      investors in every sector is a horizontal condition and was scored 0 (Guide p.84; workbook round2
      Indonesia row 153).
    - 'The State-owned enterprise metric of the Pillar 3 and Pillar 5 equity indicators is not used: score
      only the limit that applies to e-commerce firms (Guide p.84).'
    - 'Score the measure in force: a notice that lifts an earlier cap and allows 100% foreign ownership
      scores 0 (workbook round2 China row 109; Internal Guide p.8).'
    - Where no e-commerce-specific limit exists, record score 0, say so, and cite the general investment
      or company law as the governing rule (Guide p.12; workbook round2 Russian Federation row 94; workbook
      round1 Singapore row 77).
    exceptions:
    - Foreign equity limits in other sectors relevant to digital trade are 3.1 and those in telecommunications
      are 5.2; neither is scored under 12.01 (Guide p.84; Internal Guide p.11).
    - The scoring metric on State-owned enterprises is not included in this indicator (Guide p.84).
    disambiguation:
    - 'TRAP: an equity cap in a sector other than e-commerce is 3.1, not 12.01, even when e-commerce firms
      depend on that sector: caps on hypermarkets and convenience stores concern physical retail formats
      and scored 0 here, and an 85% cap on digital payment and e-wallet firms was coded 3.1 (Guide p.84;
      Internal Guide p.11; workbook round1 Malaysia row 96; workbook round2 Indonesia row 23).'
    - 'TRAP: a cap on telecommunications operators is 5.2, not 12.01. A cap is 12.01 when the instrument
      addresses e-commerce, whoever issues it: the notice of China''s industry and information technology
      ministry on online data processing and transaction processing services, labelled operational e-commerce,
      was coded 12.01 (Guide p.84; Guide p.42; workbook round2 China row 109).'
    - 'TRAP: a foreign equity cap that applies under a horizontal investment framework to all sectors is
      recorded only under 3.1, to avoid double counting; it is not repeated under 12.01 (Guide p.25).'
    - 'TRAP: a cap on postal, courier or express delivery companies is not an e-commerce equity limit: Indonesia''s
      49% limit in delivery services scored 0 under 12.01 and was recorded under 3.1 and 5.2 (Guide p.84;
      workbook round2 Indonesia rows 152, 26 and 48).'
    - 'TRAP: conditions on e-commerce investment other than the equity share map elsewhere: India''s approval
      requirement above 49% in single-brand retail e-commerce was coded 3.4, its physical-store condition
      3.5 and its 30% local sourcing condition 10.3 (Guide p.11; workbook round2 India rows 30, 31 and 130).'
    - A rule in an investment policy that caps one vendor's share of a marketplace's sales is not an equity
      limit; the host recorded India's 25% rule under 12.2 and scored it 0 (workbook round2 India row 143).
    - 'One e-commerce instrument can carry both an equity cap and a licence: Lao PDR''s e-commerce decree
      was coded 12.01 for its 90% cap and 12.3 for its licence duty (workbook round2 Lao PDR rows 85 and
      87).'
    - An e-commerce equity cap alone is 12.01, not a joint venture requirement; a duty to take a local partner
      is 3.2, and a cap attached to it is recorded under 12.01 (Guide p.25; Guide p.11).
    guide_examples:
    - 'Philippines: foreign ownership of retail trade enterprises with paid-up capital of less than US$
      2.5 million is banned (Guide p.84).'
    null_statement: no foreign equity limit specific to the e-commerce sector found in the corpus
    sources:
      guide_heading: Foreign equity limits in the e-commerce sector
      guide_pages:
      - 84
      faq_pages:
      - 11
      methodology_row: 60
      template_row: 63
    review_notes:
    - 'Band edge: the methodology band for score 1 is 1-50%, the Guide says less than 50% and more than
      50%. The block follows the methodology sheet for an exact 50% cap. No host row tests it.'
    - A 0% ban is not in the methodology bands. It is placed in the score-1 branch on the strength of India
      row 142 (score 1) and the Guide's Philippines example, which is a ban.
    - Indonesia row 153 (score 0) treats the IDR 10 billion minimum as a horizontal condition, yet the row
      also says e-commerce below that value is reserved for domestic investors; this sits close to the Guide's
      Philippines example. Flagged advisory. Needs a ruling on capital-threshold reservations.
    - 'Thailand row 107 (score 0, host-marked Not correct with no action given): Foreign Business Act List
      3 lets foreigners hold 100% only after permission. The block does not cite it. Whether a permit-gated
      majority is 12.01 = 0 plus 3.4 screening is not settled by any host text.'
    - Lao PDR row 85 (the only 0.5 row) mixes the e-commerce decree's 90% cap with the wholesale and retail
      decision's 50%, 70% and 100% tiers. The 0.5 rests on the decree.
    - Internal Guide p.11 calls the telecom equity indicator 'Pillar 5.1' and this one 'Pillar 12.1'; both
      are numbering slips for host 5.2 and 12.01 (Internal Guide p.12 says Indicator 5.2).
    - The Guide gives one example only (Philippines), so guide_examples has one line.

  - id: "12.2"
    pillar: 12
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Online purchases and delivery limitations
    category_official: Online purchases and delivery limitations
    weight: 0.11
    question: Does any law or regulation limit how many or how much consumers may buy online, or restrict
      how products bought online are delivered by carriers or received by users?
    definition: 'The indicator covers direct requirements on online purchases and requirements on the delivery
      of products bought online that affect consumers or retailers (Guide p.84). The Guide lists four kinds
      of measure: limits on the number of goods that customers import through e-commerce platforms, limits
      on the number of goods bought through e-commerce platforms, delivery limits placed on the delivery
      company, and delivery limits placed on users, such as how, where or when consumers can receive deliveries
      (Guide p.84). The indicator does not cover taxation, customs duties or fees on online purchases or
      deliveries, limits adopted specifically for consumer protection, or foreign investment measures aimed
      at companies such as delivery service providers (Guide p.84).'
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: At least one measure in force limits the number or value of products that can be bought or imported
        through e-commerce, or restricts the delivery of products bought online, whether the restriction
        falls on the delivery company or on the user; one such measure is enough (Guide p.84; Methodology
        sheet 12.2)
      score: 1
    - else:
        score: 0
        meaning: No measure limits online purchases or the delivery of products bought online; consumer-protection
          limits, taxes, duties and fees do not count as measures here (Guide p.84; Methodology sheet 12.2)
    coding_rules:
    - The methodology criterion joins purchase limits and delivery restrictions with 'AND', while the Guide
      gives 1 if at least one requirement limits purchases or delivery. The sheet's only other category
      is no measure, so one measure of either kind scores 1, as the host did for a delivery-only rule and
      for a purchase-only quota (Methodology sheet 12.2; Guide p.84; workbook round2 Indonesia row 154;
      workbook round2 China row 110).
    - 'A limit counts whether it is set as a quantity or as a value: per-shipment value ceilings and periodic
      purchase allowances are Guide examples, and an annual quota with a single-transaction limit on cross-border
      e-commerce retail imports scored 1 (Guide p.84; workbook round2 China row 110).'
    - Delivery restrictions count whether they bind the delivery company, such as a ban on intercity delivery
      or a duty to work through local carriers, or the user, such as rules on how, where or when a consumer
      may receive a delivery (Guide p.84; workbook round2 Indonesia row 154).
    - The Guide excludes taxation, customs duties and fees, yet its own examples are a customs per-shipment
      value ceiling (Brazil) and a tax-free purchase allowance (Argentina), and the host scored China's
      quota from a tax-policy notice 1. Treat a ceiling on how much may be bought or imported through e-commerce
      as a limit, and a plain duty to pay or collect tax, such as VAT collection by foreign sellers, as
      excluded (Guide p.84; workbook round2 China row 110; workbook round2 Indonesia row 155).
    - 'The limit must come from a law, regulation or other official measure: weak logistics or delivery
      problems in the market are not regulatory limits and scored 0 (Guide p.84; workbook round2 Russian
      Federation row 95).'
    - Where no limit exists, record score 0, say so, and cite the general e-commerce or civil law as the
      governing rule (Guide p.12; workbook round2 Mongolia row 71; workbook round1 Singapore row 78).
    - Cite the official law or regulation; secondary sources such as the OECD Digital STRI only guide researchers
      to it (Guide p.84).
    exceptions:
    - Do not score limits on online purchases and delivery applied specifically to products for consumer
      protection, notably restrictions on alcoholic beverages, tobacco and pharmaceuticals (Indicator Reference
      note; Methodology sheet 12.2; Guide p.84).
    - Do not score taxation, customs duties or fees imposed on online purchases or deliveries (Guide p.84).
    - Do not score foreign direct investment measures aimed at companies such as delivery service providers,
      for example foreign equity caps and commercial presence requirements; record them under the relevant
      Pillar 3 indicators (Guide p.84).
    disambiguation:
    - 'TRAP: a foreign equity cap on delivery, postal or courier companies is 3.1, a rule that a delivery
      company be set up as a joint venture is 3.2, and a duty on them to establish a commercial presence
      is 3.5; none is a 12.2 delivery limit. Indonesia''s 49% limit in delivery services was recorded under
      3.1, while its rule confining foreign delivery firms to provincial level and to cooperation with local
      carriers is the 12.2 measure (Guide p.84; workbook round2 Indonesia rows 26 and 154).'
    - 'TRAP: product-specific limits adopted for consumer protection are not scored under 12.2: Russia''s
      row lists remote-sale bans on alcohol and tobacco, licensing of online medicine sales and items barred
      from postal shipment, and scores 0. Consumer-protection rules for distance sales are evidence for
      12.9, an inverted indicator where having the framework scores 0 (Indicator Reference note; Guide p.84;
      Guide p.88; workbook round2 Russian Federation row 95).'
    - 'TRAP: a de minimis threshold, the value below which no duty or tax is charged at the border, is 12.5,
      not a purchase limit: Russia''s duty-free thresholds for goods imported for personal use were coded
      12.5 while its 12.2 row scored 0. 12.2 needs a ceiling on how much may be bought or shipped through
      e-commerce, such as a per-transaction or per-shipment value limit or an annual purchase quota (Guide
      p.86; Guide p.84; workbook round2 Russian Federation rows 95 and 105).'
    - 'TRAP: a licence for postal, courier or delivery operators is not by itself a delivery limit: Mongolia''s
      postal licences, with no restriction on applying or renewing, scored 0. Such a licence is not 12.3
      either, because 12.3 is the licence to run the e-commerce business and excludes delivery licences
      (workbook round2 Mongolia row 72; Guide p.85).'
    - 'A ceiling on the amount that can be paid by an electronic payment method is 12.4.5, not a purchase
      limit: it caps the payment instrument, not the goods. China''s cross-border purchase quota was coded
      12.2 and its daily payment-account limits 12.4.5 (Guide p.85; workbook round2 China rows 110 and 116).'
    - Conditions in a foreign investment policy for marketplaces, such as India's rule that one vendor may
      not exceed 25% of a marketplace's sales, are not purchase or delivery limits and scored 0; a cap on
      foreign equity in e-commerce firms is 12.01 (Guide p.84; workbook round2 India rows 143 and 142).
    - A rule on advertising a product online is 9.3; 12.2 tests only limits on buying or delivering it.
      Both leave out limits on alcohol, tobacco and medicines (Guide p.84; Guide p.71).
    - 'TRAP: VAT collection on online sales from abroad is taxation and is not scored under 12.2; customs
      duties on electronically delivered digital products are 12.6 (Guide p.84; Guide p.86; workbook round2
      Indonesia row 155).'
    guide_examples:
    - 'Brazil: customs express services carry a maximum per-shipment value limit of US$ 3,000 for imports
      (Guide p.84).'
    - 'Argentina: consumers may buy goods worth up to US$ 50 a month tax-free, with an annual tax-free limit
      of US$ 600, and pay a 50% tax on the monthly value above US$ 50 (Guide p.84).'
    - 'Indonesia: foreign postal operators may not run intercity delivery services and must cooperate with
      local delivery service companies for deliveries at provincial level (Guide p.84).'
    null_statement: no limit on online purchases or on delivery of products bought online found in the corpus
    sources:
      guide_heading: Online purchases and delivery limitations
      guide_pages:
      - 84
      faq_pages: []
      methodology_row: 61
      template_row: 64
    review_notes:
    - 'AND versus or: the methodology criterion for score 1 joins purchase limits and delivery restrictions
      with AND; the Guide says at least one requirement limiting purchases or delivery. The block keeps
      the sheet''s two score values and reads the sheet''s second category (No measure) as the only route
      to 0, so one measure of either kind scores 1. Both host score-1 rows (Indonesia 154, delivery only;
      China 110, purchase only) fit this reading. If the lead reads the sheet as requiring both kinds, both
      rows become 0 and the Guide''s own Indonesia example stops scoring.'
    - 'Tax exclusion versus examples: the Guide excludes taxation, customs duties and fees but its Argentina
      example is a tax-free allowance and its Brazil example a customs value ceiling. China row 110 (score
      1) comes from a tax-policy notice and is flagged advisory. The coding rule that separates a ceiling
      on purchases from a plain tax duty is a working reading.'
    - The line between a 12.2 purchase allowance (Argentina type) and a 12.5 de minimis threshold is not
      drawn by the Guide. The TRAP line rests on Russia rows 95 and 105.
    - The Indicator Reference note speaks of limits applied to 'products related to consumer protection';
      the Guide speaks of limits applied for consumer protection purposes. The block uses both wordings.

  - id: "12.3"
    pillar: 12
    tier: B
    review_status: drafted 2026-09-13 at Tier A depth (Claude), additions 2026-10-04, not yet reviewed
    name: Licensing scheme for e-commerce providers (B2B and B2C)
    category_official: Licensing scheme for e-commerce providers (B2B and B2C)
    weight: 0.11
    question: Must a business that sells or intermediates goods or services online (a B2B or B2C platform,
      marketplace or e-commerce operator) obtain a licence to operate its e-commerce business?
    definition: Captures any licensing scheme imposed on e-commerce providers, covering both business-to-business
      and business-to-consumer platforms (Guide p.85). The target is the licence to run the e-commerce business
      itself; licences for other aspects of that business, such as operating online payment services or
      delivery, fall outside the indicator (Guide p.85; Indicator Reference note).
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: At least one licensing requirement applies to e-commerce providers, whether B2B or B2C (Guide
        p.85; Methodology sheet 12.3).
      score: 1
    - else:
        score: 0
        meaning: No licence is required to operate an e-commerce business.
    coding_rules:
    - 'Any licence scores 1: unlike 5.5 and 9.4, the criteria do not ask for strict, discriminatory or entry-blocking
      conditions (Methodology sheet 12.3; Guide p.85; Guide p.44; Guide p.72).'
    - Prior approval to operate an e-commerce portal or platform counts, as in the Guide's Bhutan example
      (Guide p.85).
    - A licence triggered only above a size threshold still counts, as in the Guide's Türkiye example based
      on annual transaction value and number (Guide p.85).
    - A licensing law for digital platforms that include online marketplaces is recorded under both 9.4
      and 12.3 (Guide p.11).
    - When one measure has elements of several indicators, record it under each applicable indicator (Guide
      p.11).
    - A prior-notification duty for digital platforms was recorded under 12.3 but scored 0 because it is
      not a licence (workbook round2 Thailand row 112; workbook round2 Thailand row 109).
    - A registration duty imposed on every business, online or offline, was not treated as an e-commerce
      licence and scored 0 (workbook round1 Singapore row 80).
    - Cite official laws, regulations and other measures; secondary sources such as the OECD Digital STRI
      only guide researchers to them (Guide p.85).
    exceptions:
    - Do not capture licences for other aspects of e-commerce businesses, such as licences to operate online
      payment services or delivery (Indicator Reference note; Guide p.85).
    disambiguation:
    - 'TRAP: a licence to operate online payment or e-money services is not 12.3; when its conditions are
      restrictive (local incorporation, nationality, limits on licence types or numbers) it is 12.4.4 (Indicator
      Reference note; Guide p.85).'
    - 'TRAP: licences for ISPs, ICPs, social media, news, VPN or cloud services are 9.4, and 9.4 excludes
      e-commerce platform licences, which belong to Pillar 12 (Internal Guide p.12; Guide p.71; Indicator
      Reference note, 9.4).'
    - 'TRAP: a licence to provide telecom services or operate telecom facilities is 5.5; an e-commerce platform
      licence issued under telecom rules (China''s online transaction processing licence) was still coded
      12.3 (Guide p.44; Internal Guide p.12; workbook round2 China row 111).'
    - A postal, courier or delivery licence is not 12.3; restrictions on delivering goods bought online
      are 12.2 (Indicator Reference note; Guide p.84).
    - A condition to set up a local company in order to obtain the licence is also a commercial presence
      requirement under 3.5 (Guide p.28; workbook round2 China row 21).
    - A duty on foreign e-commerce operators to open a local representative office or appoint a domiciled
      liaison officer is 12.8, not a licence (Guide p.88; workbook round2 Indonesia row 178).
    - 'Other duties inside e-commerce statutes map elsewhere: a three-year transaction-record retention
      duty is 7.3 and a personal-data export condition is 6.4 (workbook round2 China row 62; workbook round2
      Indonesia row 70).'
    - Payment measures are never 12.3. A payment licence is tested under 12.4.4 and scores there only when
      its conditions are restrictive; a local bank account mandate is 12.4.1, a currency mandate for international
      payments 12.4.2, a deviating payment-security standard 12.4.3, a ceiling on amounts payable electronically
      12.4.5, a mandated payment intermediary 12.4.6 and any other payment restriction 12.4.7 (Guide p.85;
      Indicator Reference note).
    - 'A foreign equity cap written into an e-commerce law is 12.01, not a licence: Lao PDR''s e-commerce
      decree was coded 12.01 for its 90% cap and 12.3 for its licence duty (workbook round2 Lao PDR rows
      85 and 87).'
    - A duty to use a local domain name, or a presence or representative condition for registering one,
      is 12.7; an e-commerce business licence or commercial-registry registration is tested under 12.3 (Guide
      p.87; Guide p.85).
    guide_examples:
    - 'Bhutan: a company or a Bhutanese individual aged 18 or older needs a licence to run an e-commerce
      business, and a national e-commerce portal or platform needs prior approval from the Department of
      Trade (Guide p.85).'
    - 'Colombia: commercial, financial or service websites of Colombian origin must be entered in the commercial
      registry and give the tax and customs directorate information on their transactions (Guide p.85).'
    - 'Lao PDR: B2B and B2C e-commerce businesses need an acknowledgement certificate from the Ministry
      of Industry and Commerce; electronic marketplaces must be incorporated and hold an e-commerce business
      licence and a technical conformity certificate (Guide p.85).'
    - 'Türkiye: e-commerce service providers above 10 billion lira of annual net transactions and 100,000
      transactions need a licence from the Ministry (Guide p.85).'
    null_statement: no licensing requirement for e-commerce providers found in the corpus
    sources:
      guide_heading: Licensing requirements in the e-commerce sector
      guide_pages:
      - 85
      faq_pages:
      - 12
      methodology_row: 62
      template_row: 65
    review_notes:
    - 'UNRESOLVED: the Guide''s Colombia example is a commercial-registry registration of commercial websites,
      yet e-commerce-specific registration duties were scored 0 in the workbook (Guide p.85; workbook round2
      Thailand row 109; workbook round2 Indonesia row 156).'

  - id: "12.4.1"
    pillar: 12
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: 'Online payment limitations: mandate local bank account'
    category_official: 'Online payment limitations: mandate local bank account'
    weight: null
    question: Does a law or regulation require payment providers, merchants or users to hold or use an account
      with a bank in the economy in order to make, receive or process online payments?
    definition: One of seven sub-indicators that the host scores separately within the Guide's single section
      on online payment limitations. That section covers requirements for online payments and other requirements
      affecting the use of electronic payment and credit services, such as online transactions, digital
      wallets and mobile payments (Guide p.85; workbook round2 Mongolia row 74). This sub-indicator asks
      whether there is a requirement to use a local bank account (Guide p.85; Methodology sheet 12.4.1).
      Such a requirement obliges a payment service provider, a business or a user to keep funds in, or route
      receipts and disbursements through, an account with a bank in the regulating economy (workbook round2
      Lao PDR row 88; workbook round2 India row 145). The score is 1 if such a measure is present and 0
      otherwise (Guide p.86).
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: At least one measure in force requires the use of a local bank account for online payments, for
        example a duty on online payment services to use local bank accounts for receipts and disbursements,
        or on electronic money issuers to keep customer balances in escrow with a bank in the economy (Guide
        pp.85-86; Methodology sheet 12.4.1; workbook round2 Lao PDR row 88; workbook round2 India row 145)
      score: 1
    - else:
        score: 0
        meaning: 'No restriction: no requirement to use a local bank account for online payments (Guide
          p.86; Methodology sheet 12.4.1)'
    coding_rules:
    - 'The requirement must be stated in the text: score 1 where a provision obliges someone to open, hold
      or use an account with a bank in the economy, not where the need for an account is only inferred from
      other duties (Methodology sheet 12.4.1; Guide p.85).'
    - 'The duty may fall on any party: non-bank prepaid instrument issuers that must keep outstanding balances
      in escrow with a domestic bank, and users who may load a wallet only from instruments issued by entities
      regulated in the economy, both scored 1 (workbook round2 India rows 145 and 146).'
    - A payment licensing or supervision regime with no account mandate scores 0; record the absence and
      cite the payment law as the governing rule (Guide p.12; workbook round1 Singapore row 81; workbook
      round2 Thailand row 114).
    - Each payment sub-indicator is scored on its own type of measure and a cumulative weight is applied
      across the seven, so file a measure under the type it matches (Guide p.86).
    - Cite the official law or regulation; secondary sources such as the OECD Digital STRI only guide researchers
      to it (Guide p.86).
    exceptions:
    - Requirements on cryptocurrencies are not listed under online payment limitations and are not scored
      (Guide p.86).
    disambiguation:
    - 'TRAP: a duty to process payment transactions inside the economy is a local processing requirement,
      6.1, not a bank account mandate. The host scored Indonesia''s rule that electronic money transactions
      be processed domestically 1 here by inferring a need for local bank accounts, although the rule states
      no account requirement; follow the criterion (Methodology sheet 12.4.1; workbook round2 Indonesia
      row 159; workbook round2 Thailand row 43).'
    - 'TRAP: a condition that a payment provider be incorporated in the economy is a restrictive licensing
      condition, 12.4.4, not a bank account mandate; India''s row mixes the two, and only its escrow-account
      rule supports 12.4.1 (Guide p.85; workbook round2 India row 145).'
    - 'TRAP: a rule on which currency must be used is 12.4.2 when it reaches international payments; a rule
      on where the account must sit is 12.4.1. India''s prepaid-instrument rule, loading only from instruments
      issued in India and in rupees only, was coded 12.4.1 (Guide p.85; workbook round2 India row 146).'
    - A duty to store payment data in the economy is local storage, 6.2, not a bank account mandate (workbook
      round2 India row 61).
    - 'The other payment measures have their own sub-indicators: a national payment-security standard that
      deviates from international standards is 12.4.3, a ceiling on amounts payable electronically 12.4.5,
      a mandated payment intermediary 12.4.6 and any other payment restriction 12.4.7; a licence to run
      the e-commerce business itself is 12.3 (Guide p.85).'
    guide_examples: []
    null_statement: no requirement to use a local bank account for online payments found in the corpus
    sources:
      guide_heading: Online payment limitations
      guide_pages:
      - 85
      - 86
      faq_pages: []
      methodology_row: 63
      template_row: 66
    review_notes:
    - The Guide gives no example for any of the six payment bullets, so guide_examples is empty.
    - Indonesia row 159 (score 1) infers a bank account need from a domestic-processing rule (BI Regulation
      20/6/PBI/2018 Article 38); its own note, which reads as government feedback on the e-commerce regulation
      PP 80/2019, says there is no explicit local bank account requirement. Flagged suspect.
    - Lao PDR row 89 (score 1) is a local bank account for settling VAT, described as implied. Flagged advisory;
      not used in a rule line.
    - India row 145 and Lao PDR row 88 are current exemplars with mixed rationales (incorporation; an e-signature
      application document). Both flagged advisory.
    - Malaysia row 99 (score 0) carries impact text copied from the currency sub-indicator. The label is
      fine; no flag.
    - The Guide does not say how the 7% weight is split across the seven sub-indicators (Guide p.86 fn 53;
      Guide p.91).

  - id: "12.4.2"
    pillar: 12
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: 'Online payment limitations: mandate currency used for international payments'
    category_official: 'Online payment limitations: mandate currency used for international payments'
    weight: null
    question: Does a law or regulation prescribe the currency in which international, cross-border payments
      must be made or settled?
    definition: One of seven sub-indicators that the host scores separately within the Guide's single section
      on online payment limitations. That section covers requirements for online payments and other requirements
      affecting the use of electronic payment and credit services, such as online transactions, digital
      wallets and mobile payments (Guide p.85; workbook round2 Mongolia row 75). This sub-indicator asks
      whether there are requirements on the currency used for international payments (Guide p.85; Methodology
      sheet 12.4.2). A currency requirement fixes the currency in which a cross-border payment must be made
      or settled, for example a rule that trade with named partner economies be settled in the national
      currency (workbook round2 India row 147). The score is 1 if such a measure is present and 0 otherwise
      (Guide p.86).
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: At least one measure in force prescribes the currency to be used for international payments, such
        as a rule that trade with named partner economies be settled in the national currency (Guide pp.85-86;
        Methodology sheet 12.4.2; workbook round2 India row 147)
      score: 1
    - else:
        score: 0
        meaning: 'No restriction: no requirement on the currency used for international payments (Guide
          p.86; Methodology sheet 12.4.2)'
    coding_rules:
    - 'Look for the international element: the rule must reach cross-border payments. An obligation to use
      the national currency inside the economy that exempts international trade transactions was scored
      0 (Methodology sheet 12.4.2; workbook round2 Indonesia row 161).'
    - 'A mandate that covers only some partners is enough: India scored 1 because trade with Nepal and Bhutan
      must be settled in rupees, although other trade may be settled in rupees or in any foreign currency
      (workbook round2 India row 147).'
    - Rules that let electronic money be recorded in the national currency or in foreign currencies, or
      that route foreign currency transactions through authorised banks without fixing a currency, scored
      0 (workbook round2 Thailand row 116; workbook round2 Mongolia row 76).
    - 'A rule that electronic money be denominated only in the national currency does not by itself fix
      the currency of international payments: the host scored it 0 for Mongolia and 1 for Lao PDR. Score
      1 only where the text reaches cross-border payments (Methodology sheet 12.4.2; workbook round2 Mongolia
      row 75; workbook round2 Lao PDR row 90).'
    - Each payment sub-indicator is scored on its own type of measure and a cumulative weight is applied
      across the seven, so file a measure under the type it matches (Guide p.86).
    - Cite the official law or regulation; secondary sources such as the OECD Digital STRI only guide researchers
      to it (Guide p.86).
    exceptions:
    - Requirements on cryptocurrencies are not listed under online payment limitations and are not scored
      (Guide p.86).
    disambiguation:
    - 'TRAP: a legal-tender rule for transactions inside the economy is not scored under 12.4.2. The host
      scored Indonesia''s domestic Rupiah obligations 1 in two rows and 0 in a third that records the exemption
      for international trade; follow the criterion, which asks about international payments (Methodology
      sheet 12.4.2; Guide p.85; workbook round2 Indonesia rows 160, 161 and 162).'
    - 'TRAP: a ban on advertisements that show prices in foreign currency is an online advertising restriction,
      9.3, not a rule on the currency of payment (Guide p.71).'
    - 'TRAP: a rule on where the account must sit is 12.4.1, not 12.4.2: India''s prepaid-instrument rule,
      loading only from instruments issued in India and in rupees only, was coded 12.4.1 (Guide p.85; workbook
      round2 India row 146).'
    - 'The other payment measures have their own sub-indicators: a national payment-security standard that
      deviates from international standards is 12.4.3, a payment licence with restrictive conditions 12.4.4,
      a ceiling on amounts payable electronically 12.4.5, a mandated payment intermediary 12.4.6 and any
      other payment restriction 12.4.7; a licence to run the e-commerce business itself is 12.3 (Guide p.85).'
    guide_examples: []
    null_statement: no requirement on the currency used for international payments found in the corpus
    sources:
      guide_heading: Online payment limitations
      guide_pages:
      - 85
      - 86
      faq_pages: []
      methodology_row: 64
      template_row: 67
    review_notes:
    - The Guide gives no example for this bullet, so guide_examples is empty.
    - 'Indonesia is scored inconsistently: rows 160, 162 and 163 score domestic Rupiah obligations 1, row
      161 scores the same obligation 0 because international trade transactions are exempt. The block follows
      the criterion (international payments). Row 160 is flagged suspect, rows 162 and 163 advisory.'
    - Row 163 also leans on Minister of Trade Regulation 50/2020, which other Indonesia rows report as revoked
      and replaced by Regulation 31/2023, and on a reading of PP 80/2019 Article 60 that Indonesian feedback
      in other rows disputes.
    - Lao PDR row 90 (e-money in Kip only, score 1 after a reviewer thread) and Mongolia row 75 (e-money
      equal to the national currency, score 0) score the same kind of rule differently. Lao row flagged
      advisory.
    - India row 147 is the only clean score-1 row.

  - id: "12.4.3"
    pillar: 12
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: 'Online payment limitations: deviate national standards'
    category_official: 'Online payment limitations: deviate national standards'
    weight: null
    question: Does the economy impose a national standard for payment security that deviates from international
      standards?
    definition: 'One of seven sub-indicators that the host scores separately within the Guide''s single
      section on online payment limitations. That section covers requirements for online payments and other
      requirements affecting the use of electronic payment and credit services, such as online transactions,
      digital wallets and mobile payments (Guide p.85; workbook round2 Mongolia row 78). This sub-indicator
      asks whether national standards for payment security deviate from international standards (Guide p.85;
      Methodology sheet 12.4.3). The Guide takes a flexible approach: it recognises any international standard
      that the law refers to for online payment security, including those of ISO/IEC, the PCI DSS of the
      Payment Card Industry Security Standards Council, and other recognised frameworks (Guide p.85). The
      score is 1 if a deviating standard is present and 0 otherwise (Guide p.86).'
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: At least one national standard for payment security that payment providers or merchants must follow
        deviates from international standards, that is, it neither refers to nor is based on any recognised
        international standard (Guide pp.85-86; Methodology sheet 12.4.3)
      score: 1
    - else:
        score: 0
        meaning: 'No restriction: payment-security rules refer to or are based on international standards,
          or no national payment-security standard is imposed (Guide pp.85-86; Methodology sheet 12.4.3)'
    coding_rules:
    - 'Apply the Guide''s flexible test: a standard is international if the law refers to any recognised
      international standard on online payment security, such as ISO/IEC or PCI DSS; only a requirement
      outside all of them deviates (Guide p.85).'
    - 'A national standard built on an international one does not deviate: China''s mobile payment standard
      based on ISO/IEC 18092 and 21481, Singapore''s unified payment QR code built on the EMVCo standard,
      and Indonesia''s rules aligned with ISO 27001 and PCI DSS all scored 0 (workbook round2 China row
      114; workbook round1 Singapore row 83; workbook round2 Indonesia row 164).'
    - A rule that requires internationally accepted and published standards, without imposing a national
      one, scores 0 (workbook round2 India row 148).
    - The indicator covers requirements, so a voluntary technical reference scores 0 (Guide p.85; workbook
      round1 Singapore row 84).
    - Score 1 needs the text of a binding national payment-security standard that neither refers to nor
      builds on an international standard; where none is found, record score 0 and cite the payment law
      as the governing rule (Guide p.85; Guide p.12; Methodology sheet 12.4.3).
    - Each payment sub-indicator is scored on its own type of measure and a cumulative weight is applied
      across the seven, so file a measure under the type it matches (Guide p.86).
    - Cite the official law or regulation; secondary sources such as the OECD Digital STRI only guide researchers
      to it (Guide p.86).
    exceptions:
    - Requirements on cryptocurrencies are not listed under online payment limitations and are not scored
      (Guide p.86).
    disambiguation:
    - 'TRAP: a general requirement to use a domestic encryption algorithm, a weaker key length or a non-standard
      key management method is a deviation from international encryption standards, 11.4, whatever the sector;
      12.4.3 is limited to payment-security standards. India''s payment security direction was recorded
      under both and scored 0 in each because it requires internationally accepted standards (Guide p.81;
      workbook round2 India rows 140 and 148).'
    - 'TRAP: technical standards for electronic signatures are not payment-security standards. Lao PDR''s
      rule that signature keys be generated under FIPS 140-2 was filed here with score 0; cryptographic
      standards of that kind are the subject of 11.4 (workbook round2 Lao PDR row 91; Methodology sheet
      11.4).'
    - 'The other payment measures have their own sub-indicators: a local bank account mandate is 12.4.1,
      a currency mandate for international payments 12.4.2, a payment licence with restrictive conditions
      12.4.4, a ceiling on amounts payable electronically 12.4.5, a mandated payment intermediary 12.4.6
      and any other payment restriction 12.4.7; a licence to run the e-commerce business itself is 12.3
      (Guide p.85).'
    guide_examples: []
    null_statement: no national payment-security standard deviating from international standards found in
      the corpus
    sources:
      guide_heading: Online payment limitations
      guide_pages:
      - 85
      - 86
      faq_pages: []
      methodology_row: 65
      template_row: 68
    review_notes:
    - The Guide gives no example for this bullet, so guide_examples is empty.
    - 'No score-1 row exists in either workbook: all 12 host rows score 0. The score-1 branch rests on the
      Guide and the methodology sheet only.'
    - Boundary with 11.4 (encryption standards) is not allocated by any host text. India's RBI direction
      appears under both 11.4 (row 140) and 12.4.3 (row 148), score 0 in each.
    - Several absence rows cite laws with no payment-security content (for example Mongolia row 77, the
      banking law); they are weak evidence and are not cited in rule lines.

  - id: "12.4.4"
    pillar: 12
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: 'Online payment limitations: licensing requirements'
    category_official: 'Online payment limitations: licensing requirements'
    weight: null
    question: Must online payment service providers hold a licence whose conditions are restrictive, such
      as local incorporation, nationality requirements, or limits on the types or number of licences available?
    definition: One of seven sub-indicators that the host scores separately within the Guide's single section
      on online payment limitations. That section covers requirements for online payments and other requirements
      affecting the use of electronic payment and credit services, such as online transactions, digital
      wallets and mobile payments (Guide p.85; workbook round2 Mongolia row 79). This sub-indicator asks
      whether licensing requirements for payment services carry restrictive conditions, such as local incorporation
      requirements, nationality restrictions, or limitations on the types or numbers of licences that can
      be obtained (Guide p.85; Methodology sheet 12.4.4). A payment licence is an authorisation to provide
      payment services, for example issuing electronic money or handling payments and transfers (workbook
      round2 Thailand row 118). The score is 1 if such a measure is present and 0 otherwise (Guide p.86).
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: 'At least one licensing requirement for payment services carries a restrictive condition: a local
        incorporation requirement, a nationality restriction, or a limitation on the types or numbers of
        licences that can be obtained (Guide pp.85-86; Methodology sheet 12.4.4)'
      score: 1
    - else:
        score: 0
        meaning: 'No restriction: no licence is required for payment services, or the licence carries no
          restrictive condition (Guide pp.85-86; Methodology sheet 12.4.4)'
    coding_rules:
    - 'A payment licence alone does not score: the criterion is a licence with restrictive conditions. This
      differs from 12.3, where any licence for e-commerce providers scores 1 (Methodology sheet 12.4.4;
      Methodology sheet 12.3; Guide p.85).'
    - 'Conditions the host scored 1: a licence open only to legal entities established in the economy (China),
      a director who is a citizen or permanent resident (Singapore), and at least one director who is a
      national residing in the country (Thailand) (workbook round2 China row 115; workbook round1 Singapore
      row 85; workbook round2 Thailand row 118).'
    - Prudential and technical conditions alone, such as minimum capital, fund safeguarding, technical capability
      or a business plan, scored 0 where the licence is open to domestic and foreign applicants (workbook
      round2 Mongolia row 79; workbook round1 Malaysia row 102).
    - 'A limit on the type of licence available counts: in Australia the holder of stored value in a purchased
      payment facility classed as banking business must be an authorised deposit-taking institution, and
      foreign providers receive that licence on condition that their branches accept no retail deposits
      (Guide p.85; workbook round1 Australia row 75).'
    - Each payment sub-indicator is scored on its own type of measure and a cumulative weight is applied
      across the seven, so file a measure under the type it matches (Guide p.86).
    - Cite the licensing provision and the provision that sets the restrictive condition from the official
      text; secondary sources such as the OECD Digital STRI only guide researchers to it (Guide p.86).
    exceptions:
    - Requirements on cryptocurrencies are not listed under online payment limitations and are not scored
      (Guide p.86).
    disambiguation:
    - 'TRAP: a licence to operate online payment or electronic money services is never 12.3, which is the
      licence to run the e-commerce business itself and excludes payment and delivery licences. A payment
      licence is tested here and scores only when its conditions are restrictive (Guide p.85; Indicator
      Reference note for 12.3).'
    - 'TRAP: a representative office that a foreign payment system must open in order to be registered was
      coded 12.4.4, not 12.8: it is a condition of the payment registration, whereas 12.8 covers a local
      representative or contact point required of online service providers as a condition for supplying
      services remotely (Guide p.87; workbook round2 Russian Federation row 100).'
    - 'TRAP: a foreign equity cap on payment or electronic money companies is an equity limit, 3.1, where
      the host coded an 85% cap on digital payment and e-wallet firms; a domestic-ownership condition written
      into the payment licence was also scored here. Record the cap under 3.1 and the licence condition
      under 12.4.4 (Guide p.11; workbook round2 Indonesia rows 23 and 165).'
    - 'TRAP: a resident or national director rule in general company law is 3.3; the same kind of rule written
      as a condition of the payment licence is 12.4.4. Singapore''s Companies Act resident-director rule
      was coded 3.3 and its payment-licence director rule 12.4.4 (Guide p.26; workbook round1 Singapore
      rows 11 and 85).'
    - 'TRAP: an authorisation requirement for payment aggregators is licensing and belongs here, scored
      only if its conditions are restrictive; the host filed India''s authorisation rule for non-bank payment
      aggregators under 12.4.6, the mandated-intermediary sub-indicator (Methodology sheet 12.4.4; workbook
      round2 India row 152).'
    - 'TRAP: a licence for electronic-signature certification providers is not a licence for payment services
      and is not scored under 12.4.4, although the host filed one here with score 1 (Guide p.85; workbook
      round2 Lao PDR row 93).'
    - 'The other payment measures have their own sub-indicators: a local bank account mandate is 12.4.1,
      a currency mandate for international payments 12.4.2, a national payment-security standard that deviates
      from international standards 12.4.3, a ceiling on amounts payable electronically 12.4.5 and any other
      payment restriction 12.4.7 (Guide p.85).'
    - Consumer-protection clauses in a payment or e-money instrument are not restrictive licence conditions
      and do not make it the consumer protection framework tested under 12.9 (Guide p.85; Guide p.88; workbook
      round1 Malaysia row 102).
    guide_examples: []
    null_statement: no payment-service licensing requirement with restrictive conditions found in the corpus
    sources:
      guide_heading: Online payment limitations
      guide_pages:
      - 85
      - 86
      faq_pages: []
      methodology_row: 66
      template_row: 69
    review_notes:
    - The Guide gives no example for this bullet, so guide_examples is empty.
    - India row 149 scores 0 although the Payment Aggregator Guidelines it cites require incorporation in
      India (quoted in India row 145 under 12.4.1); local incorporation is a Guide-named restrictive condition.
      Flagged suspect.
    - Lao PDR row 92 scores 1 on prudential conditions only, while Mongolia row 79 and Malaysia row 102
      score comparable regimes 0. The Guide's list of restrictive conditions is introduced by 'such as',
      so the list is not closed. Flagged advisory.
    - Lao PDR row 93 (score 1) is an e-signature certification licence. Flagged suspect. Its proper home
      is not settled by any host text.
    - Indonesia row 165 states a 49% foreign ownership limit under BI Regulation 20/6/PBI/2018; the 3.1
      row 23 cites the same regulation for an 85% cap, and the 12.4.7 row 168 cites the later Regulation
      23/6/PBI/2021. The facts need checking. Flagged advisory.
    - Russian Federation row 100 treats a representative office plus register entry as a restrictive condition;
      a representative office is not one of the Guide's three named conditions. Kept as the host coded it.

