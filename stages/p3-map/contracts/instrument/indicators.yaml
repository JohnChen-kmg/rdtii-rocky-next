  - id: "5.1"
    pillar: 5
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Lack of passive infrastructure sharing
    category_official: Lack of passive infrastructure sharing
    weight: 0.15
    polarity: inverted
    level: economy
    framework_name: obligation for telecom operators to share passive infrastructure
    question: Does the economy lack an obligation for telecom operators to share passive infrastructure
      such as towers, ducts and sites, and where sharing takes place, is it mandated or only voluntary?
    definition: 'The indicator looks at whether the economy has an obligation for passive infrastructure
      sharing and whether the approach is mandatory or voluntary (Guide p.41). Passive infrastructure is
      the non-electronic, physical part of a telecom network: buildings, sites, network cabinets, masts
      or towers, poles, ducts and trays. Active infrastructure is the electronic part, such as the radio
      access network and the core network, and is a separate category (Guide p.41). Under a sharing obligation,
      operators share infrastructure to deliver services to end-users, which lowers network deployment costs
      and enhances competition (Guide p.41). Telecom here means basic and value-added telecommunication
      services whatever the technology, not broadcasting (Guide p.40). It is a lack indicator: the absence
      of any obligation scores 1 and a mandate scores 0 (Guide p.42).'
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'existence of a passive sharing obligation: no obligation scores highest (Guide p.42; Methodology
      sheet 5.1)'
    - 'regulatory approach: voluntary sharing that is practised, or a mandate that applies only case by
      case, scores above a general mandate (Guide p.42)'
    scoring_tree:
    - if: 'No passive infrastructure sharing obligation exists: sharing is neither mandated nor practised
        in the market under a voluntary arrangement (Guide p.42; Methodology sheet 5.1)'
      score: 1
    - if: Passive sharing is not mandated but is practised in the market, for example under commercial agreements
        or a voluntary co-location framework; the Guide also gives 0.5 where the obligation is mandated
        only case by case, in specific circumstances or upon request (Guide pp.41-42; Methodology sheet
        5.1)
      score: 0.5
    - else:
        score: 0
        meaning: The economy mandates at least one obligation for passive infrastructure sharing (Guide
          p.42; Methodology sheet 5.1)
    coding_rules:
    - 'Economy-level: answer once per economy. Record the sharing regime, or its absence, once and cite
      the provision that establishes the obligation; further provisions of the same instrument are not separate
      findings (Guide pp.41-42).'
    - 'One mandate is enough for 0, whatever the level of the instrument: an act, a government decree, a
      regulator''s resolution or a code of practice. A standing duty not to refuse access counts as a mandate
      even when it is qualified by technical or economic feasibility (Guide p.42; workbook round2 Indonesia
      row 44; workbook round2 Russian Federation row 34; workbook round2 Mongolia row 24; workbook round1
      Singapore row 26).'
    - 'The 0.5 band needs two findings: no general mandate, and sharing that actually takes place, for example
      through commercial agreements between operators or a voluntary co-location framework (Guide pp.41-42;
      Methodology sheet 5.1).'
    - The methodology sheet's 0.5 criterion covers only sharing that is not mandated but practised; the
      Guide adds an obligation mandated only in specific circumstances or upon request, and the host scored
      Australia 0.5 on that basis, so a duty limited to declared services with the rest left to commercial
      negotiation is 0.5 (Methodology sheet 5.1; Guide p.42; workbook round1 Australia row 26).
    - 'Look for duties over physical facilities: towers or masts, poles, ducts, sites, buildings and cabinets.
      Access and infrastructure-sharing instruments issued by the regulator are where host coders found
      them (Guide p.41; workbook round1 Malaysia rows 30 and 31; workbook round2 Mongolia row 24).'
    - Cite the enforced instrument that carries the duty, such as the act, decree, regulator determination
      or licence condition; a consultation paper or inquiry report that recommends sharing is not a measure
      (Internal Guide p.8).
    - ITU DataHub answers, STRI databases, WTO Trade Policy Reviews and legal guides only point to the law;
      cite the official text (Internal Guide p.12; Guide p.41).
    exceptions:
    - Active infrastructure sharing (radio access network, antennas, backhaul, core network) is a separate
      category and does not show a passive sharing obligation (Guide p.41).
    disambiguation:
    - 'TRAP: inverted polarity. A sharing mandate found in the law scores 0, not 1; 1 is reserved for economies
      with no sharing obligation and no sharing in practice (Guide p.42; Methodology sheet 5.1).'
    - 'TRAP: economy-level, not provision-level. The question is whether a passive sharing obligation exists
      in the economy; each article of an access code or sharing regulation is not a separate 5.1 finding
      (Guide pp.41-42).'
    - 'TRAP: permission is not a mandate and is not scored 0. The host scored India 0 on licence clauses
      that allow sharing by mutual agreement and on a power to permit spectrum sharing, although the row''s
      own note says sharing is not mandatory; under the Guide that is 0.5 if sharing is practised and 1
      if it is not (Guide p.42; Methodology sheet 5.1; workbook round2 India rows 47 and 48).'
    - 'TRAP: a duty on a dominant operator to share or open its physical facilities is 5.1, while a duty
      to keep separate accounts or to split business units is 5.4; one competition code can carry both (Guide
      p.41; Guide pp.43-44; workbook round1 Singapore rows 26 and 29).'
    - 'TRAP: a limit on foreign ownership of tower or other passive-infrastructure companies is a telecom
      equity cap under 5.2, not a sharing rule (Guide p.42; workbook round2 Indonesia rows 45 and 47).'
    - 'TRAP: a sharing duty written as a licence condition is still 5.1 evidence and lowers the score; 5.5
      is about discriminatory or entry-blocking licence conditions, and the Guide treats sharing as a safeguard
      whose absence hampers entry (Guide p.41; Guide p.44; Guide p.47; workbook round2 Thailand row 34).'
    guide_examples:
    - 'Thailand: fixed and mobile operators must share wireless network infrastructure, including towers
      or masts, sites, buildings and other physical facilities, with other operators on fair, reasonable
      and non-discriminatory terms (mandated) (Guide p.41)'
    - 'Pakistan, Vanuatu and Hong Kong (China): no passive sharing mandate, but sharing is implemented through
      commercial agreements in the mobile and fixed sectors (optional but implemented) (Guide p.41)'
    - 'New Zealand: no sharing obligation, but a framework for voluntary co-location of cellular infrastructure
      facilitates sharing of towers, masts and related sites (Guide p.41)'
    - 'Australia: mobile co-location on towers and ducts is negotiated commercially, while owners of declared
      fixed services such as line sharing and local carriage must give access upon request (mandated in
      specific circumstances or upon request) (Guide p.41)'
    null_statement: no passive infrastructure sharing obligation for telecom operators found in the corpus
    sources:
      guide_heading: Lack of passive infrastructure sharing
      guide_pages:
      - 41
      - 42
      faq_pages:
      - 12
      methodology_row: 23
      template_row: 25
    review_notes:
    - Methodology sheet 5.1 has no case-by-case clause; Guide p.42 adds it and the host follows the Guide
      (round1 Australia row 26 = 0.5). The block applies the Guide's wording inside the 0.5 branch; the
      possible scores are unchanged.
    - The line between a general mandate (0) and a mandate in specific circumstances or upon request (0.5)
      is thin. Duties not to refuse access scored 0 (Russian Federation row 34, Mongolia row 24), Singapore's
      regulator-determined sharing of critical support infrastructure scored 0 (row 26), and Australia's
      access to declared services scored 0.5 (row 26). The host has not said where the line is.
    - 'level: economy was chosen because the Guide asks whether an obligation exists in the economy. The
      host still records a second instrument as a separate row in four economies (Malaysia, India, Indonesia,
      Mongolia), and Mongolia''s two rows carry different scores (0.5 and 0).'
    - No host row scores 1. India rows 47 and 48 score 0 on clauses that only permit sharing (flagged suspect
      in flags.yaml).
    - The Guide does not say what evidence shows that sharing is 'practised'. 5.1 is not on the Internal
      Guide's list of practice-based indicators (p.8), so the 0.5 band may be hard to evidence from legislation
      alone.
    - Internal Guide p.11 says telecom foreign equity is 'listed under Pillar 5.1'; that is older numbering
      for the equity indicator (host 5.2), not a statement about this indicator.

  - id: "5.2"
    pillar: 5
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Foreign equity limits in telecom sector
    category_official: Foreign equity limits in telecom sector
    weight: 0.29
    question: 'Under telecom-specific rules, what is the largest share of a telecommunications company that
      foreign investors may hold: none, a minority, a capped majority, or the whole company?'
    definition: The indicator concerns the maximum foreign equity share allowed in the telecommunications
      sector, in (a) privately owned companies and (b) Government-controlled companies, meaning fully or
      partially state-owned enterprises (Guide p.42; Internal Guide p.12). Foreign equity shares are shares
      that foreign natural or legal persons hold in a firm incorporated in the investee economy (Guide p.42).
      Telecommunications covers basic services, which carry customer information end to end (voice telephony,
      data transmission, fixed satellite services), and value-added services that enhance them (online data
      processing, email, voice mail), whatever the technology; broadcasting is not covered (Guide p.40).
      Foreign equity limits in other sectors relevant to digital trade and in e-commerce are captured in
      Pillars 3 and 12 (Guide p.42).
    scoring:
      values:
      - 1
      - 0.8
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'size of the permitted foreign stake: a ban scores highest, then a minority-only cap, then a cap that
      still allows control (Guide p.42; Methodology sheet 5.2)'
    - 'number of measures: minority-only caps in more than one measure raise 0.8 to 1 (Guide p.42; Methodology
      sheet 5.2)'
    - 'who is capped: limits that exist only for state-owned telecom enterprises score 0.5 (Guide p.42;
      Methodology sheet 5.2)'
    scoring_tree:
    - if: Foreign ownership is banned (0%) in the telecommunication sector, or only a minority stake is
        allowed in more than one measure (Guide p.42; Methodology sheet 5.2)
      score: 1
    - if: Only a minority stake is allowed, in a single measure; the methodology band is 1-50% (Guide p.42;
        Methodology sheet 5.2)
      score: 0.8
    - if: A controlling stake is allowed but capped (51-99%), or limits on foreign equity exist only in
        state-owned enterprises within the telecommunication sector (Guide p.42; Methodology sheet 5.2)
      score: 0.5
    - else:
        score: 0
        meaning: Full foreign ownership (100%) is allowed in the telecommunication sector; no limitation
          on foreign equity (Guide p.42; Methodology sheet 5.2)
    coding_rules:
    - 'Score caps that target telecommunications: a telecom act, telecom licensing rules, or the telecom
      entry of an investment list or FDI policy (workbook round2 India row 49; workbook round2 Indonesia
      row 46). A cap that applies across sectors under a horizontal framework is recorded only under 3.1
      (Guide p.25).'
    - 'Read the cap as the highest foreign share allowed: 0% is a ban, 1-50% a minority stake, 51-99% a
      controlling stake, 100% no limit. A cap of exactly 50% is a minority stake under the methodology band,
      although the Guide words minority as less than 50% and control as more than 50% (Methodology sheet
      5.2; Guide p.42; workbook round2 China row 32).'
    - 'A minimum local shareholding requirement is a foreign cap at the remainder: a reserved 30% local
      shareholding leaves a 70% cap, a controlling stake, 0.5 (workbook round1 Malaysia row 32).'
    - 'Where the cap differs by licence type or service, the most restrictive telecom cap decides: a 49%
      cap on network licences scored 0.8 although service-only licences were open to full foreign ownership
      (workbook round2 Thailand row 35; workbook round1 Malaysia row 32).'
    - The step from 0.8 to 1 needs minority-only caps in more than one measure. Host rows that describe
      one regime, such as one regulation capping both basic and value-added services, or a sectoral act
      read together with another act, stayed at 0.8 (Methodology sheet 5.2; workbook round2 China row 32;
      workbook round1 Australia row 27; workbook round2 Thailand row 35).
    - Both privately owned and state-owned telecom companies are in scope, and telecom includes radio-frequency
      and VoIP services; where foreign equity is limited only in state-owned telecom enterprises, the score
      is 0.5 (Guide p.42; Internal Guide pp.11-12; Methodology sheet 5.2).
    - ITU DataHub entries, STRI databases, WTO Trade Policy Reviews and legal guides only point to the law;
      cite the official text that sets the cap (Internal Guide p.12; Guide p.41).
    exceptions:
    - Do not record here foreign equity limits in other sectors relevant to digital trade (3.1) or in the
      e-commerce sector (12.01); Pillars 3 and 12 capture them (Guide p.42).
    - Broadcasting is outside Pillar 5; foreign equity limits on broadcasting services are recorded under
      Pillar 3 (Guide p.25; Guide p.40).
    disambiguation:
    - 'TRAP: a cap set by a horizontal investment, privatization or state-enterprise law is 3.1 only, to
      avoid double-counting. The host nonetheless repeated horizontal state-enterprise rules under 5.2;
      follow the Guide (Guide p.25; workbook round2 Russian Federation rows 15 and 36; workbook round2 Indonesia
      rows 26 and 48).'
    - 'TRAP: broadcasting is not telecom. A foreign equity cap on broadcasting services is 3.1, not 5.2;
      the Internal Guide FAQ lists broadcasting with telecom, but the Guide and the host rows place it in
      Pillar 3 (Guide p.25; Guide p.40; Internal Guide p.11; workbook round1 Malaysia row 12; workbook round2
      Thailand row 15).'
    - 'TRAP: foreign equity rules for e-commerce are 12.01, even where the e-commerce activity is licensed
      as a value-added telecom service: China''s notice lifting the cap for online data processing and transaction
      processing (operational e-commerce) is coded 12.01 (Guide p.84; workbook round2 China row 109).'
    - 'TRAP: other investment conditions in telecom rules stay in Pillar 3. An approval threshold for acquiring
      shares or control is screening (3.4) and a requirement that the licensee be a locally incorporated
      company is commercial presence (3.5); neither is an equity cap, and 5.2 is 0 when full foreign ownership
      remains possible (Guide p.11; workbook round1 Singapore rows 12 and 27; workbook round1 Malaysia row
      19; workbook round2 Russian Federation row 35).'
    - 'TRAP: 5.2 scores only the equity ceiling in telecom rules; a mandate to form a joint venture with
      a local partner is 3.2, and a nationality or residency rule for directors or managers is 3.3 (Guide
      pp.25-26; Guide p.11; workbook round2 China rows 14 and 32).'
    - 'TRAP: shares the Government itself holds in telecom companies are 5.3; 5.2 is the ceiling on what
      foreign investors may hold, in private and state-owned companies alike (Internal Guide p.12; Guide
      p.42).'
    - 'TRAP: a foreign ownership limit written as a licence eligibility condition is still a 5.2 cap; record
      the cap here and the discriminatory licence condition under 5.5 (Guide p.11; Guide p.44; workbook
      round1 Malaysia rows 32 and 35).'
    - 'TRAP: a cap on foreign ownership of tower or other passive-infrastructure companies is 5.2, while
      a duty to share those towers is 5.1 (Guide p.41; workbook round2 Indonesia rows 44 and 47).'
    guide_examples: []
    null_statement: no telecom-specific limit on foreign equity found in the corpus
    sources:
      guide_heading: Foreign equity limits in telecom sector
      guide_pages:
      - 42
      faq_pages:
      - 11
      - 12
      methodology_row: 24
      template_row: 26
    review_notes:
    - The Guide gives no country example for this indicator (p.42), so guide_examples is empty.
    - Internal Guide p.11 uses older numbering ('Pillar 5.1' for telecom equity, '12.1' for e-commerce equity)
      and says telecom licensing and foreign equity include broadcasting, radio frequencies and VoIP. Guide
      p.25 fn 9 and p.40 exclude broadcasting from Pillar 5, and the host rows follow the Guide (broadcasting
      caps under 3.1). The block follows the Guide.
    - '''More than one measure'' is not defined and no host row scores 1. Rows that cite two acts for one
      cap stayed at 0.8 (Australia row 27, Thailand row 35). How the host would count two separate minority
      caps is untested.'
    - Guide p.42 words minority as less than 50% and control as more than 50%; Methodology sheet 5.2 uses
      1-50% and 51-99%. Exactly 50% is minority under the methodology (China row 32, 0.8). The block follows
      the methodology.
    - The host repeats horizontal state-enterprise rules under both 3.1 and 5.2 (Indonesia 26/48, Russian
      Federation 15/36, Thailand 14/36, China 13/33) and one telecom licence cap under 3.1 (Malaysia row
      13 = row 32). Guide p.25 says horizontal caps go only under 3.1. A pipeline that follows the Guide
      will not reproduce these 5.2 rows.
    - 'Guide p.25 can also be read more broadly: any cap applied ''under a horizontal framework'', even
      a telecom entry in a general investment list, goes only under 3.1. Host rows do not read it that way
      (India row 49, Indonesia row 46, Thailand row 35 are 5.2).'
    - Indonesia rows 46 and 49 disagree on whether a 67% cap on internet and application service providers
      survives Presidential Regulation 10/2021 (row 49 flagged advisory).
    - The Guide's China example (p.25) pairs a VPN joint venture with a 50% cap. The host codes the joint
      venture under 3.2 (round2 China row 14) and the general 49% and 50% telecom caps of the same Provisions
      under 5.2 (row 32); no row files the VPN cap on its own. Whether that cap is 5.2 or 3.1 is open, as
      the 3.1 and 3.2 blocks also note.

  - id: "5.3"
    pillar: 5
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Shares owned by the Government in telecom companies
    category_official: Shares owned by the Government in telecom companies
    weight: 0.15
    question: Does the Government hold shares in any telecom company operating in the economy, in how many
      companies, and is any holding above 50%?
    definition: 'The indicator concerns the percentage of shares the Government owns in telecom companies,
      including operators that are state-owned enterprises (Guide p.42). It is about Government-held shares,
      not caps on foreign equity (Internal Guide p.12). Where a state-owned enterprise operates in telecommunications,
      the Guide asks for the percentage of Government ownership and the company''s market share; market
      structures range from a statutory monopoly and a de facto monopoly to ownership through a foreign
      state-owned enterprise, partial ownership without market dominance, and several state-owned operators
      competing (Guide pp.42-43). Telecommunications means basic and value-added services whatever the technology,
      not broadcasting (Guide p.40). The indicator is practice-based: ownership facts decide it, and they
      need not appear in any legal provision (Internal Guide p.8).'
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - 'size of the largest Government holding: above 50% in any one telecom company scores 1 (Guide p.43;
      Methodology sheet 5.3)'
    - 'number of companies with a Government holding between 1% and 50%: more than one scores 1, exactly
      one scores 0.5 (Guide p.43; Methodology sheet 5.3)'
    scoring_tree:
    - if: Government ownership is above 50% in at least one telecom company, or the Government holds between
        1% and 50% in more than one telecom company (Guide p.43; Methodology sheet 5.3)
      score: 1
    - if: The Government holds between 1% and 50% of the shares in one telecom company only, and above 50%
        in none (Guide p.43; Methodology sheet 5.3)
      score: 0.5
    - else:
        score: 0
        meaning: The Government owns no shares in telecom companies (Guide p.43; Methodology sheet 5.3)
    coding_rules:
    - 'Practice-based indicator: the evidence is the ownership fact, shown by the telecom regulator''s market
      report, a list of state-owned enterprises (for example from the ministry supervising them), company
      annual reports or shareholder records. Secondary sources of this kind may show the practice (Internal
      Guide p.8; Internal Guide p.12; Guide p.43).'
    - For every telecom company in which the Government holds shares, record the company name and the percentage
      held (Internal Guide p.12).
    - 'Answer once per economy by aggregating over all companies: one holding above 50%, or more than one
      holding between 1% and 50%, gives 1. Host rows that take one company each carry that company''s own
      band, as in India, where two majority state-owned operators score 1 and a single minority holding
      scores 0.5 (Methodology sheet 5.3; workbook round2 India rows 50, 51 and 52).'
    - Holdings through a sovereign wealth fund, a state holding company or a state-owned parent count as
      Government ownership; the Guide also lists ownership through a foreign state-owned enterprise among
      the structures it covers (Guide p.43; workbook round1 Singapore row 28; workbook round2 Indonesia
      row 50).
    - Where a statute fixes the holding, cite it as the legal basis next to the ownership fact, such as
      a law requiring the State to keep full ownership of a network company (Guide p.42; workbook round1
      Australia row 28).
    - 'Record the company''s market share where the source gives it, but score on the ownership percentage:
      a state-owned operator that is not dominant in every segment still scores by its percentage (Guide
      pp.42-43; workbook round2 Thailand row 37).'
    - ITU DataHub answers cannot be the source for the answer; go to the regulator's report, the state-enterprise
      list or the company's own records (Internal Guide p.12; Guide p.43).
    exceptions: []
    disambiguation:
    - 'TRAP: a ceiling on foreign shares is an equity limit, not Government ownership: 5.2 if telecom-specific,
      3.1 if a horizontal law caps foreign shares in state-owned enterprises; 5.3 is the Government''s own
      holding (Internal Guide p.12; Guide p.42; Guide p.25).'
    - 'TRAP: silence in the legislation is not scored 0. The answer comes from ownership facts, so a corpus
      of laws alone cannot show that the Government holds no shares (Internal Guide p.8; Internal Guide
      p.12).'
    - 'TRAP: a licence rule that reserves telecom operation for majority state-owned companies is a strict
      licensing condition under 5.5; 5.3 needs the shares the Government actually holds in named companies
      (Guide p.42; workbook round2 China rows 34 and 36).'
    - 'TRAP: provisions that place the sector under a ministry''s management, or let the State take temporary
      control of networks, concern the regulator and its powers (5.7), not ownership; the host''s Lao PDR
      row cites such articles next to the shareholdings (Guide p.46; workbook round2 Lao PDR row 30).'
    - Count telecom companies only (basic or value-added telecommunication services); a state-owned postal
      or broadcasting company is not a telecom company, although one host row lists a postal operator next
      to the telecom operators (Guide p.40; workbook round2 Mongolia row 26).
    guide_examples:
    - 'Turkmenistan: the Law on Communication mandates exclusive state ownership of telecom networks used
      for national security and national broadcasting, and the two operators are 100% state-owned (statutory
      monopoly) (Guide p.42)'
    - 'Kiribati: the sole telecom provider is a subsidiary of a Fiji-based holding company that is majority-owned
      by the Fijian Government (ownership through a foreign state-owned enterprise) (Guide p.43)'
    - 'Thailand: the state-owned National Telecom dominates fixed-line telephony while private operators
      dominate the mobile market (partial Government ownership without market dominance) (Guide p.43)'
    - 'China: China Unicom, China Telecom and China Mobile are wholly state-owned enterprises providing
      basic, mobile and value-added services (several state-owned operators in a competitive market) (Guide
      p.43)'
    null_statement: no government-held shares in telecom companies found in the corpus
    sources:
      guide_heading: Shares owned by the Government
      guide_pages:
      - 42
      - 43
      faq_pages:
      - 8
      - 12
      methodology_row: 25
      template_row: 27
    review_notes:
    - 'No host row scores 0: every economy in the two workbooks has some Government ownership. The 0 branch
      rests on the Guide and the methodology sheet alone.'
    - Indirect ownership is not defined. Singapore row 28 counts a sovereign fund's 51% as Government ownership
      above 50% (1). Malaysia row 33 adds up holdings of state funds in four companies, each between 1%
      and 50%, and still scores 0.5, where Guide p.43 gives 1 (flagged suspect).
    - Whether ownership by a foreign Government's enterprise (the Guide's Kiribati example, p.43) feeds
      the score is not stated; the Guide lists it only as a market structure.
    - The methodology sheet says 'more than one measure of category (2)'; Guide p.43 says 'more than one
      company'. The block uses the Guide's wording.
    - A legislation-only corpus cannot evidence this indicator. The pipeline needs market reports, state-enterprise
      lists or company records as inputs, or it should report that the evidence is outside the corpus rather
      than emit 0.
    - The 3.1 block says a statutory ceiling on foreign shares in state-owned enterprises is 3.1's SOE case.
      That holds for horizontal state-enterprise laws (Guide p.25); a ceiling written for telecom state-owned
      enterprises is 5.2 (Guide p.42). The first trap line here states both cases.

  - id: "5.4"
    pillar: 5
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Lack of functional/accounting separation
    category_official: Lack of functional/accounting separation
    weight: 0.15
    polarity: inverted
    level: economy
    framework_name: mandate for accounting or functional separation of telecom operators with significant
      market power
    question: Does the economy lack a requirement that telecom operators with significant market power keep
      separate accounts, separate their business units, or both?
    definition: 'The indicator asks whether the economy mandates functional and/or accounting separation
      for operators with significant market power (SMP), the regulatory status of holding a dominant position
      in the telecom market (Guide p.43). Functional separation, also called operational separation, separates
      the units that run different activity branches of a telecom company, so that an entity dominant in
      one area cannot control operations in another; the Guide''s examples include a structural split of
      network operations from retail services (Guide p.43). Accounting separation keeps separate accounting
      records for the different businesses and parts of businesses of one company, so that the costs, revenue
      and assets of each part can be identified and allocated (Guide p.44). It is a lack indicator: no separation
      requirement scores 1 and both requirements together score 0 (Guide p.44).'
    scoring:
      values:
      - 1
      - 0.5
      - 0.25
      - 0
      type: ordinal
    scoring_features:
    - 'which kind of separation is mandated: none scores highest, accounting separation alone scores above
      functional separation alone, and both together score lowest (Guide p.44; Methodology sheet 5.4)'
    scoring_tree:
    - if: Neither functional nor accounting separation is mandated (Guide p.44; Methodology sheet 5.4)
      score: 1
    - if: Only accounting separation is mandated (Guide p.44; Methodology sheet 5.4)
      score: 0.5
    - if: Only functional separation is mandated (Guide p.44; Methodology sheet 5.4)
      score: 0.25
    - else:
        score: 0
        meaning: Both accounting and functional separation are mandated for dominant network operators (Guide
          p.44; Methodology sheet 5.4)
    coding_rules:
    - 'Economy-level: answer once per economy by combining what the corpus shows for both kinds of separation,
      and cite the provision that establishes each mandate. An accounting-separation provision and a functional-separation
      provision are two halves of one answer, not two findings (Guide p.44; Methodology sheet 5.4; workbook
      round1 Australia row 29).'
    - The mandate may sit in the telecom act, carrier licence conditions, or a regulator's regulation, order
      or notification on accounting separation reports (workbook round1 Australia row 29; workbook round2
      India row 53; workbook round2 Russian Federation row 38; workbook round2 Thailand row 38).
    - Accounting separation means separate accounts or reports by service, activity or network part, so
      that costs, revenues and assets can be attributed to each (Guide p.44; workbook round2 Russian Federation
      row 38).
    - Functional separation may take the form of a regulator's power to require SMP operators to separate
      functional resources within their networks, or of a structural split of network from retail; both
      are the Guide's examples (Guide p.43).
    - 'The duty need not be limited to SMP operators: host rows scored accounting separation duties that
      apply above a turnover threshold, or to operators generally, as 0.5 (Guide p.43; workbook round2 India
      row 53; workbook round2 Russian Federation row 38).'
    - 'A separation duty that binds one named operator still counts toward the answer: Australia scored
      0 with functional separation for SMP operators and separate accounts required of one company (Guide
      p.44; workbook round1 Australia row 29).'
    - ITU DataHub answers and other secondary sources only point to the law; cite the official text that
      imposes the separation (Internal Guide p.12; Guide p.41).
    exceptions: []
    disambiguation:
    - 'TRAP: inverted polarity. A separation mandate found in the law lowers the score: both mandates together
      score 0, and 1 is reserved for economies with neither; never score 1 because a separation rule was
      found (Guide p.44; Methodology sheet 5.4).'
    - 'TRAP: under inverted polarity the two middle scores are easy to swap: accounting separation alone
      is 0.5 and functional separation alone is 0.25 (Guide p.44; Methodology sheet 5.4).'
    - 'TRAP: economy-level, not provision-level. The answer combines both kinds of separation across the
      corpus; do not emit 0.5 for one provision and 0.25 for another (Guide p.44; Methodology sheet 5.4).'
    - 'TRAP: a duty to follow accounting standards, or to report statistics, volumes and prices to the regulator,
      is not accounting separation and is not scored as a mandate; the host''s Lao PDR row cites such articles
      and contradicts itself on which separation exists (Guide p.44; workbook round2 Lao PDR row 31).'
    - 'TRAP: a duty on a dominant operator to share or open its physical facilities is passive infrastructure
      sharing (5.1), not separation; 5.4 needs separate accounts or separated business units (Guide p.41;
      Guide pp.43-44; workbook round1 Singapore rows 26 and 29).'
    - 'TRAP: a separation duty imposed through licence conditions is still 5.4 evidence and lowers the score;
      it is not a strict licensing condition under 5.5, which is about discriminatory or entry-blocking
      conditions (Guide pp.43-44; Guide p.47; workbook round1 Australia row 29).'
    guide_examples:
    - 'Georgia: the National Communications Commission may identify operators with SMP through market analysis
      and require them to separate functional resources within their networks (functional separation) (Guide
      p.43)'
    - 'New Zealand: structural separation split Telecom New Zealand into Chorus, which operates the physical
      infrastructure, and Spark, which provides retail services (functional separation) (Guide p.43)'
    - 'Armenia: operators with SMP must maintain separate accounts for different services (accounting separation)
      (Guide p.44)'
    - 'Australia: one telecom company must maintain separate accounts for its different technology units
      (accounting separation) (Guide p.44)'
    - 'Pakistan: fixed and mobile providers with SMP must submit costs and revenues for each regulated service,
      with profit and loss statement, balance sheet information and return on capital employed (accounting
      separation) (Guide p.44)'
    null_statement: no accounting or functional separation requirement for telecom operators found in the
      corpus
    sources:
      guide_heading: Lack of functional/accounting separation
      guide_pages:
      - 43
      - 44
      faq_pages:
      - 12
      methodology_row: 26
      template_row: 28
    review_notes:
    - 'The only host row at 0.25 (round2 Lao PDR row 31) contradicts itself: the impact text says functional
      separation only, the reviewer note says accounting separation only (flagged suspect). The 0.25 branch
      therefore has no reliable host example.'
    - Whether a separation remedy that the regulator may impose counts as 'mandated' is unsettled. The Guide's
      Georgia example (p.43) treats such a power as functional separation. Singapore row 29 scores 0.5 for
      accounting separation described as 'not applied by default', and Singapore's 5.7 row says the Minister
      can issue separation orders, yet row 29 says functional separation is not mandated.
    - The Guide scopes the question to SMP operators (p.43); host rows accept broader duties (India row
      53, Russian Federation row 38). The block follows the rows on this point because a broader duty also
      binds SMP operators.
    - Malaysia's only 5.4 row (round1 row 34) is struck through, so Malaysia has no host answer.
    - Indonesia row 51 (0.5) infers accounting separation from a duty to separate business activities in
      Government Regulation 52/2000, which another host row says Regulation 46/2021 replaced; not verified
      from host materials.

  - id: "5.5"
    pillar: 5
    tier: B
    review_status: drafted 2026-09-13 at Tier A depth (Claude), additions 2026-10-04, not yet reviewed
    name: Licensing requirements in telecom sector for operators
    category_official: Licensing requirements in telecom sector for operators
    weight: 0.15
    question: Do the conditions for obtaining a licence to supply telecommunication services or operate
      telecom facilities discriminate against foreign firms or create significant entry barriers for all
      providers?
    definition: Concerns licences for private telecommunication services or for operating telecommunication
      facilities, and asks whether their conditions discriminate against foreign firms or create significant
      barriers to entry for foreign and local providers alike (Guide p.44). Pillar 5 covers basic and value-added
      telecommunication services whatever the technology, but not broadcasting (Guide p.40). Barrier types
      named by the Guide include mandatory performance requirements, separate licensing for value-added
      services, caps on the number of licences and capital restrictions (Guide p.44).
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: 'At least one telecom licensing scheme includes a strict condition: discrimination against foreign
        providers, a minimum capital requirement, mandatory performance requirements, or another significant
        entry barrier such as a cap on the number of licences, separate value-added licensing, or revenue
        sharing with the regulator on top of licence fees (Guide p.44; Methodology sheet 5.5).'
      score: 1
    - else:
        score: 0
        meaning: Licensing without strict conditions, or no licence required for the service (Guide p.44;
          Methodology sheet 5.5).
    coding_rules:
    - Holding a licence is not scored by itself; the eligibility criteria and licence conditions decide,
      so capture the clauses that set them (Guide p.44).
    - 'The Guide counts as barriers: administrative allocation of radio frequencies instead of auctions,
      revenue sharing with the regulator on top of acquisition and annual fees, and a mandatory public offering
      of part of the licensee''s shares (Guide p.44).'
    - Radio-frequency and VoIP licensing count as telecom licensing for this pillar (Internal Guide p.11;
      Guide p.44).
    - Licence eligibility that excludes foreign companies or requires local shareholding scores 1 here even
      when the same limit is also recorded under 5.2 (workbook round1 Malaysia row 35; workbook round2 Thailand
      row 39).
    - Host coders scored capacity criteria applied identically to foreign and domestic applicants (adequate
      financial resources, qualified staff, infrastructure) 0, reasoning that they do not discriminate (workbook
      round2 Lao PDR row 32).
    - Secondary sources (ITU DataHub, WTO Trade Policy Reviews, Lexology and similar legal guides) only
      point to the licensing law; cite the official text that sets the licence conditions (Internal Guide
      p.12; Guide p.44).
    exceptions:
    - 'Do not score broadcasting licences here: broadcasting is outside Pillar 5 (Guide p.40), and the broadcasting
      licence is captured under 9.4 (Internal Guide p.14).'
    - Do not score e-commerce platform licences here; Pillar 12 captures them (Indicator Reference note,
      9.4; Guide p.85).
    disambiguation:
    - 'TRAP: licences for digital service providers such as ISPs and ICPs belong to 9.4, while telecom licences
      belong to 5.5; classify by licence type (Internal Guide p.12; Indicator Reference note, 9.4).'
    - 'TRAP: a standalone foreign equity cap on telecom operators is 5.2; commercial presence requirements
      are 3.5 and investment screening is 3.4 (Guide p.11).'
    - 'TRAP: host coders split on bare local-registration licence conditions, scoring Singapore''s facilities-based
      licence 1 but Russia''s communications licence 0; record such a condition under 3.5 and flag any 5.5
      score of 1 that rests on it alone (Guide p.11; workbook round1 Singapore row 30; workbook round2 Russian
      Federation row 39).'
    - 'TRAP: host coders scored India''s unified licence 0 despite an entry fee plus a licence fee of 8%
      of adjusted gross revenue, while the Guide treats revenue sharing on top of fees as a barrier; flag
      for review (workbook round2 India row 54; Guide p.44).'
    - Certification or type approval of telecom equipment is a standards matter under 11.2, not operator
      licensing (Internal Guide p.14).
    - Licences to deal in encryption tools or services are not telecom operator licences, even when the
      same licensing law lists both (Guide p.81; workbook round2 Russian Federation row 77).
    - 'TRAP: an e-commerce platform licence is 12.3 even when it is issued under telecom licensing rules,
      as with the value-added telecom licences China requires of e-commerce operators; 5.5 keeps licences
      to supply telecom services or operate telecom facilities. Under 12.3 any licence scores 1, while 5.5
      needs a strict condition (Guide p.85; Guide p.44; Methodology sheet 5.5; workbook round2 China row
      111).'
    - 'TRAP: when the telecom law or a telecom service licence is the source of a licence duty for VPN or
      Internet of Things providers, the host coded it under 9.4; 5.5 keeps the licences of telecom operators
      themselves (Guide p.72; workbook round2 Indonesia rows 120 and 124).'
    - 'TRAP: a licence condition that obliges the licensee to share towers, ducts or sites is a passive
      sharing obligation under 5.1, and one that requires separate accounts or separated business units
      is 5.4; both are competition safeguards that lower those scores, not strict licensing conditions (Guide
      p.41; Guide pp.43-44; Guide p.47; workbook round1 Australia row 29).'
    - 'TRAP: a licence rule that reserves telecom operation for majority state-owned companies is a strict
      condition here; the shares the Government actually holds in named operators are 5.3 (Guide p.42; workbook
      round2 China rows 34 and 36).'
    - 'TRAP: a licence to import or deal in telecom equipment is an import restriction under 10.2, not operator
      licensing; the host''s Singapore 5.5 row also lists the dealer''s licence that its 10.2 row scores
      (Guide p.44; Guide p.75; workbook round1 Singapore rows 30 and 66).'
    guide_examples:
    - 'Indonesia: radio frequencies allocated through administrative licensing rather than auctions (Guide
      p.44).'
    - 'Bangladesh: nationwide transmission network operators share revenue with the regulator from the second
      year, on top of licence acquisition and annual fees (Guide p.44).'
    - 'Tanzania: network facilities and network services licensees must offer at least 25% of their shares
      to the public through an IPO (Guide p.44).'
    - 'Other barriers: separate licensing for value-added telecommunication services and caps on the number
      of licences issued (Guide p.44).'
    null_statement: no telecom licensing scheme with discriminatory or entry-blocking conditions found in
      the corpus
    sources:
      guide_heading: Licensing requirements in telecom sector
      guide_pages:
      - 40
      - 44
      faq_pages:
