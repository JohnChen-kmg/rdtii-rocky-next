  - id: "9.1"
    pillar: 9
    tier: B
    review_status: drafted 2026-09-13 at Tier A depth (Claude), additions 2026-10-04, not yet reviewed
    name: Blocking or filtering commercial web content
    category_official: Blocking or filtering commercial web content
    weight: 0.33
    question: Has the Government blocked or filtered commercial web content, or required Internet intermediaries
      to do so, outside the excluded content categories?
    definition: Blocking denies access to a commercial website in its entirety, while filtering limits access
      only to certain content on a given website; both count whether carried out by the Government or by
      Internet intermediaries as the Government requires (Guide p.69). The concern is limiting commercial
      websites or web content on broadly defined public-policy grounds, such as public morality or national
      security, without clear or objective criteria (Guide p.69).
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - Blocking a whole website scores higher than filtering specific content on it (Guide p.70).
    - 'Every blocking technique counts: IP address and protocol-based, deep packet inspection, URL and DNS
      blocking (Guide p.70).'
    scoring_tree:
    - if: 'Any blocking measure: access to a commercial website or online service is denied in its entirety,
        by the Government or by an intermediary as the Government requires (Guide pp.69-70; Methodology
        sheet 9.1).'
      score: 1
    - if: 'Any filtering measure and no blocking measure: access is limited only to certain content on a
        given commercial website (Guide pp.69-70; Methodology sheet 9.1).'
      score: 0.5
    - else:
        score: 0
        meaning: No case of blocking or filtering commercial web content, or blocking only of excluded content
          such as internationally agreed illegal content or child pornography (Methodology sheet 9.1; Guide
          p.70).
    coding_rules:
    - 'Score per measure: each blocking measure scores 1 and each filtering measure scores 0.5 (Guide p.70).'
    - 'EVIDENCE TYPE: practice-based indicator. Record legal bases that empower or require blocking and
      documented instances of blocking; enforcement and practice sources such as government blocking announcements
      and technical monitoring reports may be recorded and scored here, not only primary law (Internal Guide
      p.8; Extraction slides pp.8-9, 21).'
    - Use the named secondary sources (Global Network Initiative, World Intermediary Liability Map, Freedom
      House on the Net) to reach the primary source wherever one exists (Guide p.70).
    - 'A legal power or duty to block on broad grounds counts without a documented incident: the Guide''s
      examples are a best-efforts ban on content against the public interest or national harmony, and powers
      to block for national security, public order and crime prevention (Guide p.69; workbook round2 Lao
      PDR row 60).'
    - 'The stated ground does not decide the case: Government blocking may rest on political or public-policy
      justifications and is recorded when it impacts commercial websites (Internal Guide p.14), but not
      when the content blocked is itself political, criminal, age-restricted, defamatory or otherwise non-commercial
      (Guide p.70).'
    - A measure letting authorities block an entire service for failing registration or local-branch duties
      is a blocking measure (workbook round2 Indonesia row 107; workbook round2 Russian Federation row 72).
    - A measure that allows blocking whole websites is scored as blocking even if it also allows removal
      or filtering of specific content (Methodology sheet 9.1; Guide p.70).
    - Workbook practice records ancillary fines on ISPs that fail to block at 0, while the blocking duty
      itself carries the score (workbook round2 Russian Federation rows 68 and 70).
    exceptions:
    - Do not score blocking or filtering of political content, criminal content (e.g. child pornography),
      age-restricted content, defamation or other non-commercial content (Indicator Reference note; Guide
      p.70).
    - Do not score blocking or filtering based on intellectual property violations such as copyright-infringing
      content; it is not considered a restriction (Guide p.70; workbook round1 Australia row 54).
    - Do not record blocking of services that are already illegal in the economy, such as illegal betting
      apps or unauthorised remote gambling sites, as commercial web content (workbook round2 India row 118;
      Hands-on deck p.10).
    disambiguation:
    - 'TRAP: an intermediary''s duty to monitor content, or to remove or block illegal content, is 8.4;
      add a 9.1 row only when the measure blocks or filters commercial web content (Guide p.67; Internal
      Guide p.13; Guide p.11).'
    - 'TRAP: the same instrument often carries both an 8.4 row and a 9.1 row, so check both (workbook round2
      Indonesia rows 102 and 107; workbook round2 Russian Federation rows 65 and 70).'
    - 'TRAP: a government ban on named applications may be an import ban on online services, 10.1; the workbooks
      code India''s 2020 ban of 267 apps as 10.1 but a later app-blocking wave as 9.1 (Guide p.74; workbook
      round2 India rows 119 and 125).'
    - 'TRAP: network-wide disruption of Internet access or online services is 9.2 Internet shutdowns, which
      is non-regulatory and not extracted; do not map shutdown powers to 9.1 (Guide p.70; Non-regulatory
      note; Internal Guide p.8).'
    - A duty to open a local branch or entity is 3.5 (a representative-only duty is 12.8); the access restriction
      imposed for breaching it is 9.1 (Guide pp.27-28; Guide pp.87-88; workbook round2 Russian Federation
      row 72).
    - The registration or licensing precondition itself is recorded under 9.4; blocking a service that has
      not registered is 9.1 (workbook round2 Indonesia rows 107 and 122).
    - 'TRAP: blocking copyright-infringing sites is not a 9.1 restriction: a court''s power to order it
      is 4.6 enforcement evidence, and it does not show an 8.1 safe harbour, which needs a limit on intermediaries''
      liability (Guide p.70; Guide p.64; workbook round1 Australia rows 47 and 54; workbook round2 Thailand
      row 30).'
    - An order to block domain names, or a state register of blocked domains, is DNS-based blocking under
      9.1, not a 12.7 domain name requirement (Guide p.70; workbook round2 Russian Federation row 70).
    - 'TRAP: a rule on what may be advertised online is tested under 9.3; 9.1 needs access to a website
      or to content on it to be blocked or filtered. The host filed a pornography law''s advertising ban
      under 9.1 as well and scored it 0 in both places (Guide p.69; Guide p.71; workbook round2 Indonesia
      rows 108 and 111).'
    guide_examples:
    - 'Brunei Darussalam: bans, or requires licensed Internet service providers and online content providers
      to use their best efforts to ban, online content against the public interest or national harmony (Guide
      p.69).'
    - 'Türkiye: authorities may block or remove online content for national security, public order and crime
      prevention; social network providers with over one million daily users must remove or block illegal
      content within 24 hours of notification, on pain of fines, advertising bans or bandwidth throttling
      (Guide p.69).'
    null_statement: no blocking or filtering of commercial web content found in the corpus
    sources:
      guide_heading: Blocking or filtering commercial web content
      guide_pages:
      - 69
      - 70
      faq_pages:
      - 8
      - 13
      - 14
      methodology_row: 46
      template_row: 49

  - id: "9.3"
    pillar: 9
    tier: B
    review_status: drafted 2026-10-04 at Tier A depth (Claude), not yet reviewed
    name: Online advertising requirements
    category_official: Online advertising requirements
    weight: 0.13
    question: Does any binding rule restrict what, how or where businesses may advertise online, other than
      consumer-protection truthfulness rules and product-specific health or safety limits?
    definition: 'The indicator covers requirements that limit online advertising (Guide p.71). Online advertising
      is one of the digital trade activities in the database: a rule counts when it applies to online advertising
      only or to online and offline advertising alike, and a rule silent on the medium is taken to reach
      online advertising unless it clearly applies only offline (Guide p.9; Guide p.71). Two groups of rules
      fall outside the indicator: general consumer-protection measures, such as prohibitions on misleading
      or false advertising, and restrictions on advertising specific products and services, for example
      weapons, drugs, tobacco, alcohol or medicine, for public health or safety reasons (Guide p.71). The
      Guide''s examples of limiting requirements are language and prior-approval rules, a ban on comparative
      advertising, a compulsory share of unpaid social advertising and a ban on showing prices in foreign
      currency (Guide p.71).'
    scoring:
      values:
      - 1
      - 0
      type: binary
    scoring_features: []
    scoring_tree:
    - if: 'At least one requirement limits online advertising: it applies to online advertising, or to online
        and offline advertising alike, and it is neither a consumer-protection rule nor a product-specific
        public health or safety restriction. Each such requirement scores 1 (Guide p.71; Methodology sheet
        9.3)'
      score: 1
    - else:
        score: 0
        meaning: 'No restriction on online advertising: nothing found, or only consumer-protection rules
          such as bans on misleading advertising, product-specific health or safety limits, or offline-only
          rules (Guide p.71; Methodology sheet 9.3)'
    coding_rules:
    - 'Check the medium first: record a rule that applies only to online advertising or to both online and
      offline advertising, treat a rule that is silent on the medium as covering online advertising, and
      leave out rules that apply only offline, such as billboard requirements. The scope is usually set
      in the law''s definitions (Guide p.71; Guide p.9; Internal Guide p.14).'
    - 'The Guide''s examples show what limits advertising: compulsory languages with prior approval by a
      commission, a ban on comparative advertising, a duty to give a share of advertising volume to unpaid
      social advertising and to report, and a ban on prices in foreign currency (Guide p.71). The host also
      scored 1 a duty to mark every online advertisement with an identifier and report it to a state register
      (workbook round2 Russian Federation row 74).'
    - 'Purpose decides the consumer-protection exclusion: a rule that advertisements be truthful, accurate
      or not misleading scores 0 even though it reaches online advertising, and the FAQ gives a consent
      rule as a further example of a consumer-protection measure that is not a restriction (Guide p.71;
      Internal Guide p.14; workbook round2 Indonesia row 109).'
    - 'The requirement must be legally binding: the host recorded a non-binding advertising guideline for
      digital platforms and a self-regulatory advertising code, and scored both 0 (workbook round2 Thailand
      row 83; workbook round1 Singapore row 61).'
    - The product exclusion covers any specific product or service restricted for public health or safety
      reasons; the Guide's list is given as examples, and the host also scored 0 an advertising ban on gambling
      where gambling itself is prohibited (Guide p.71; workbook round2 Indonesia row 115).
    - 'The indicator concerns commercial advertising as a digital trade activity: the host scored election-law
      limits on campaign advertising 0 (Guide p.9; workbook round2 Indonesia row 117).'
    - Cite the official text; the OECD Digital STRI only guides the researcher to the primary source. Where
      no restriction exists, record the general advertising or consumer protection law that was searched
      with score 0 and state the reason (Guide p.71; Guide p.12; Internal Guide p.10; workbook round2 Thailand
      row 82).
    exceptions:
    - Do not score requirements that advertising must not be misleading (Indicator Reference note; Methodology
      sheet 9.3).
    - Do not score general consumer-protection measures, such as prohibitions on misleading or false advertising;
      any measure on online advertisements adopted for the purpose of consumer protection scores 0 (Guide
      p.71; Internal Guide p.14).
    - Do not score restrictions on advertising specific products and services, such as weapons, drugs, tobacco,
      alcohol or medicine, imposed for public health or safety reasons (Guide p.71; workbook round2 India
      row 120).
    - Do not score rules that apply only to offline advertising, such as billboard requirements (Guide p.9;
      Internal Guide p.14).
    disambiguation:
    - 'TRAP: a ban on misleading or false advertising in a consumer protection law is not a 9.3 restriction
      and scores 0 here. The same law is evidence for 12.9, which asks whether a consumer protection framework
      reaches online purchases; finding it scores 0 there as well. Thailand''s Consumer Protection Act was
      coded 0 under both (Guide p.71; Guide p.88; workbook round2 Thailand rows 82 and 131).'
    - 'TRAP: a general duty on platforms to moderate, remove or block unlawful content is an 8.4 monitoring
      requirement even when that content includes advertisements; record it under 9.3 only where it sets
      rules for the advertisements themselves. The host scored two general moderation duties 1 here, one
      of them in the regulation that is also its 8.4 row (Guide p.67; Guide p.71; workbook round2 Indonesia
      rows 102, 118 and 119).'
    - 'TRAP: blocking or filtering a website because of what it advertises is tested under 9.1, which leaves
      out criminal and age-restricted content; a rule on what may be advertised is tested here. The host
      filed a pornography law''s advertising ban under both indicators and scored it 0 in each (Guide p.70;
      Guide p.71; workbook round2 Indonesia rows 108 and 111).'
    - 'TRAP: prior approval or certification of advertisements limits advertising only when its purpose
      is not consumer protection, as in the Guide''s language-commission example. An approval step set in
      a consumer protection law, or a certificate attesting that an advertisement is not misleading, is
      a consumer-protection measure and scores 0; where it sits in a consumer protection law, that law is
      12.9 evidence. The host scored two such regimes 1: follow the Guide and say so in Notes (Guide p.71;
      Internal Guide p.14; workbook round2 Lao PDR rows 61 and 101; workbook round2 India row 121).'
    - A ban or limit on selling or delivering a product online is tested under 12.2, which likewise leaves
      out limits on alcohol, tobacco and pharmaceuticals adopted for consumer protection; 9.3 looks only
      at the rule on advertising (Guide p.84; Guide p.71).
    - A ban on advertisements that show prices in foreign currency is a 9.3 restriction; a rule on the currency
      used for international payments is 12.4.2 (Guide p.71; Guide p.85).
    guide_examples:
    - 'Marshall Islands: advertisements must be published in both Marshallese and English, with Marshallese
      first, and must be approved by the Customary Law and Language Commission (Guide p.71)'
    - 'Kazakhstan: prohibits advertisements that compare the advertised goods, work or services with those
      of other persons or that discredit their honour and business reputation (Guide p.71)'
    - 'Russian Federation: online advertising distributors, ad placement service owners and aggregators
      of goods and services must allocate at least 5% of their annual advertising volume to unpaid social
      advertising and report daily user access and advertising volumes (Guide p.71)'
    - 'Uzbekistan: prohibits advertisements that show prices in foreign currency (Guide p.71)'
    null_statement: no requirement limiting online advertising found in the corpus
    sources:
      guide_heading: Online advertising requirements
      guide_pages:
      - 71
      faq_pages:
      - 14
      methodology_row: 47
      template_row: 50
    review_notes:
    - 'Prior approval and certification: the Guide scores 0 any online-advertising measure adopted for consumer
      protection (Guide p.71) and the FAQ says the same (Internal Guide p.14), while the methodology sheet''s
      exception names only requirements that advertising not be misleading. The host scored 1 a prior-permission
      rule in Lao PDR''s consumer protection law (row 61) and India''s self-declaration certificate (row
      121). The block follows the Guide and the FAQ (score 0, with a Notes entry) against these two rows;
      the opposite reading, that any pre-publication approval step is a restriction whatever its purpose,
      is defensible and matches the rows. A host ruling is needed.'
    - 'Gambling, betting and financial-product advertising: not in the Guide''s product list. Indonesia
      row 115 (gambling ad ban, gambling illegal) and row 116 (financial and crypto advertising rules) score
      0; Australia row 56 (gambling ads in live-sport streams) and Russian Federation row 73 (digital-currency
      ad ban, gambling ads limited to certain sites, plus excluded products) score 1.'
    - General content-moderation duties scored 1 under 9.3 (Indonesia rows 118 and 119) look like 8.4 duties.
      Thailand row 83 suggests the host would score ad-specific platform duties (advertiser verification,
      pre-publication review) 1 if they were binding.
    - The FAQ's consumer-protection example is garbled in the source ('advertisement cannot be made after
      obtaining consent'); the block reads it as a consent rule for advertising (Internal Guide p.14).
    - Russian Federation row 75's note mentions a 3% levy on online-advertising revenue from April 2025;
      the row does not score it and no host text says whether a levy is a 9.3 requirement.
    - The Guide says the score is 1 for each requirement, but the indicator is binary (1 or 0), so counting
      requirements cannot change the indicator score.
    - Malaysia row 75 (current exemplar, score 1) rests on an industry content code whose unacceptable-products
      list mixes excluded health or safety items with others; weaker evidence than the Russian rows.

  - id: "9.4"
    pillar: 9
    tier: B
    review_status: drafted 2026-09-13 at Tier A depth (Claude), additions 2026-10-04, not yet reviewed
    name: Licensing requirements for online content providers and applications (social media platforms,
      news providers, VPN, cloud services, etc.)
    category_official: Licensing requirements for online content providers and applications (social media
      platforms, new providers, VPN, cloud servics, etc.)
    weight: 0.21
    question: Must an online content provider or digital application (social media, news or broadcast service,
      VPN, cloud or data-centre service) hold a licence to operate, and is that licence strict?
    definition: A licensing scheme applicable to online service providers, meaning Internet content providers
      and applications such as social media platforms, news providers (media and broadcast services), VPNs
      and cloud services (Guide p.71). It excludes telecommunication facilities and service providers, covered
      by Pillar 5, and e-commerce platforms, covered by Pillar 12 (Guide p.71). A scheme is strict when
      licence conditions significantly limit market access or competition beyond normal regulatory standards,
      such as commercial presence, nationality or residency, excessively high minimum paid-up capital, or
      mandated government-approved systems, local data storage or proprietary technology (Guide p.72).
    scoring:
      values:
      - 1
      - 0.5
      - 0
      type: ordinal
    scoring_features:
    - Strictness of the licence conditions (Guide p.72).
    - Number of licensing schemes the economy imposes on online content providers and applications (Guide
      p.72).
    scoring_tree:
    - if: At least one strict licensing scheme, or more than one licensing scheme in this category even
        if none is individually strict (Guide p.72; Methodology sheet 9.4).
      score: 1
    - if: Exactly one licensing scheme for online content providers or applications, with no strict conditions
        (Guide p.72; Methodology sheet 9.4).
      score: 0.5
    - else:
        score: 0
        meaning: No licensing requirement for online content providers or applications (Guide p.72; Methodology
          sheet 9.4).
    coding_rules:
    - Scope includes licences for digital service providers such as ISPs and ICPs (Internal Guide p.12),
      broadcasting licences, and licences for digital services and applications such as cloud computing
      and data centres (Internal Guide p.14).
    - Judge strictness from the licence conditions, not the licence name; the Guide's strict examples are
      an IoT licence tied to a local numbering or addressing system, a broadcasting licence closed to foreigners,
      and social network licences limited to locally established companies (Guide p.72).
    - The more-than-one-scheme escalation is an economy-level rule (Guide p.72), yet Round 2 rows still
      score each non-strict scheme 0.5 when an economy has several (workbook round2 China rows 89 and 91;
      workbook round2 Russian Federation rows 77 and 78).
    - A duty only to register or to give prior notification was recorded but scored 0 as not a licence (workbook
      round2 Thailand row 87; workbook round2 Indonesia row 123).
    - A law requiring licences for digital platforms that span online marketplaces, car sharing and social
      media is recorded under both 9.4 and 12.3 (Guide p.11).
    - Record the licence here and its component conditions under their own indicators as well, for example
      an in-country server condition under 6.3 (Guide p.11; workbook round2 China rows 49 and 88).
    - The Global Network Initiative reports, Freedom House's Freedom on the Net and the World Map of Encryption
      Laws and Policies only point to the law; cite the official text (Guide p.72).
    exceptions:
    - Do not cover licences for telecommunication facilities and service providers; they are captured under
      Pillar 5 (Indicator Reference note; Guide p.71).
    - Do not cover licences for e-commerce platforms; they are captured under Pillar 12 (Indicator Reference
      note; Guide p.71).
    disambiguation:
    - 'TRAP: a telecom operator licence (network facilities, network services, basic or value-added telecom
      operation) is 5.5, while a licence for digital service providers such as ISPs and ICPs is 9.4; classify
      by licence type (Internal Guide p.12; workbook round2 India rows 54 and 122).'
    - 'TRAP: an e-commerce business or marketplace licence is 12.3; a platform licence that also reaches
      social media or other applications is recorded under both 12.3 and 9.4 (Guide p.11; Guide p.85).'
    - 'TRAP: data-centre licensing or registration is not 6.3 but may be 9.4, whereas a licence condition
      to keep servers in-country is also recorded under 6.3 and makes the licence strict (Internal Guide
      p.13; Guide p.72; workbook round2 China rows 49 and 88).'
    - 'TRAP: broadcasting licences are 9.4, not 5.5, because Pillar 5 does not cover broadcasting services
      (Internal Guide p.14; Guide p.40).'
    - A standalone duty to establish a local office or entity is 3.5 and one to appoint a local representative
      is 12.8; a commercial presence condition inside a licence also makes the 9.4 scheme strict (Guide
      pp.27-28; Guide pp.87-88; Guide p.72).
    - Blocking a service that operates without a required registration or licence is 9.1, not 9.4 (workbook
      round2 Indonesia rows 107 and 122).
    - 'TRAP: a licence condition that the operator be a locally established company is recorded under 3.5
      as well, and it makes the 9.4 scheme strict, as in the Guide''s Viet Nam example. The host recorded
      that condition under 3.5 for China''s internet information service licence but left the 9.4 row at
      0.5; follow the Guide (Guide p.72; workbook round2 China rows 21 and 89).'
    - 'TRAP: the Guide''s own strict example, Indonesia''s Internet of Things licence with a local addressing
      requirement, was scored 0.5 in the workbook; follow the Guide and score a licence with such conditions
      1 (Guide p.72; workbook round2 Indonesia row 120).'
    - Registration of electronic system operators is not a licence and scored 0 here, while the duty in
      the same regulation to appoint liaison officers domiciled in the economy is a 12.8 local presence
      requirement, scored 1 there (Guide p.88; workbook round2 Indonesia rows 121 and 179).
    - 'TRAP: a director or manager nationality or residency condition in an online-service licence makes
      the 9.4 scheme strict and is also 3.3; a review of the foreign investor itself is screening, 3.4,
      not a licence (Guide p.72; Guide p.26; Guide p.11; workbook round2 China row 90).'
    - 'TRAP: a licence duty placed on VPN or Internet of Things providers is 9.4 even when the telecom law
      or a telecom service licence is its source; a telecom operator''s own licence stays 5.5 (Guide pp.71-72;
      workbook round2 Indonesia rows 120 and 124).'
    - 'TRAP: an encryption-service licence is a 9.4 scheme; it is 11.4 only if its conditions set a deviating
      algorithm, parameter or disclosure (Guide p.81; workbook round2 Russian Federation rows 77 and 92).'
    - A duty on licensed online providers to use the national domain is 12.7; the licence is 9.4. A domain
      test that only sets a law's offshore reach is not a domain requirement (Guide p.87; workbook round2
      Thailand row 87).
    guide_examples:
    - 'Indonesia: Internet of Things service providers must obtain a licence or partner with a licensed
      telecom operator, and must implement a unique addressing system such as a local MSISDN, device end-user
      ID or IP number (strict) (Guide p.72).'
    - 'Pakistan: a broadcasting media and distribution licence is barred to persons who are neither citizens
      nor residents, foreign companies, foreign-controlled companies and anyone funded by a foreign Government
      or organisation (strict) (Guide p.72).'
    - 'Viet Nam: aggregate sites and social networks must be operated by companies legally established in
      Viet Nam that meet technical and operational standards in order to register for a licence (strict)
      (Guide p.72).'
    null_statement: no licensing requirement for online content providers or applications found in the corpus
