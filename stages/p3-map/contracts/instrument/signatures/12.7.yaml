- economy: AU
  law: Guidelines on the Interpretation of Policy Rules for Open 2LDs 2012
  coverage: Horizontal
  score: 1
  impact: In Australia, it is not possible to register directly under an ".au" domain, and therefore it
    is required to have a registration under the open second level domains such as ".com.au" or ".org.au."
    A company that wants to register for the second level domain needs to be a registered Australian company
    or a foreign company licensed to trade in Australia. For certain second level domains such as "id.au",
    the registrants must be an Australian citizen or resident. The domain name policies were approved
    in 2012.
  url: http://www.auda.org.au/policies/index-of-published-policies/2012/2012-05/
  teaching_note: 'Score-1: .com.au limited to Australian-registered companies or foreign companies licensed
    to trade locally, a presence condition on the local domain.'
