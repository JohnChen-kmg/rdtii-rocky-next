definition_text: 'Conditions on commercial country-code domain names that raise compliance costs for foreign
  sellers: a rule that companies must use a local domain name to do e-commerce, a physical or legal presence
  condition for registering the local domain (both the top score), or a duty to appoint a local administrative
  contact or representative (intermediate). Government, military and education domains are outside.'
exemplar_law_types:
- ccTLD registry registration policies (auDA, MYNIC, SGNIC, THNIC, PANDI)
- ministerial regulations on domain name management
- internet management and domain name decrees
- e-commerce or online-content regulations mandating the national domain
- telecommunications laws assigning domain administration
scope_patterns:
  horizontal: eligibility rules for the main commercial ccTLD or its commercial second-level domains
  sectoral: domain categories reserved for a sector (telecom licensees, SMEs) or a mandate on licensed
    news sites and portals
negative_signals:
- local representative required of foreign online providers, not tied to a domain -> 12.8
- registration of commercial websites in a commercial registry or e-commerce licence -> 12.3
- national domain mandate for government, party or military websites -> not scored
- duty to give true registrant identity information -> not scored
- law that only encourages or prioritises the national domain -> not scored (coded 0)
spec_note: 'Indonesia .co.id, .net.id and .biz.id rows (173-175) score 0.5 for local-entity eligibility
  with no administrator element, while Thailand and Australia score similar presence conditions 1; excluded.

  '
