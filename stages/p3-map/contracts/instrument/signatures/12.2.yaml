definition_text: 'Direct limits on what consumers or retailers can buy online, or on delivery of goods
  bought online: caps on the number or value of goods bought or imported via e-commerce platforms, and
  restrictions on delivery firms (e.g. foreign couriers barred from intercity delivery) or on how, where
  or when buyers receive parcels. Excludes taxes, duties and fees, consumer-protection limits on alcohol,
  tobacco or medicines, and FDI rules on delivery firms.'
exemplar_law_types:
- cross-border e-commerce retail import notices (annual quotas, per-transaction limits)
- customs rules for express consignments and personal imports
- postal and courier services regulations
- e-commerce and retail sale regulations
scope_patterns:
  horizontal: civil code or retail sale rules cited as the general rule when no limit exists
  sectoral: cross-border e-commerce import channels, postal and express delivery operators
negative_signals:
- VAT or tax-collector thresholds on e-commerce sales -> not scored under 12.2
- general de minimis duty or tax exemption threshold for low-value consignments -> 12.5
- remote-sale bans or licences for alcohol, tobacco or pharmaceuticals -> not scored
- foreign equity cap on delivery companies -> 3.1; commercial presence rule for them -> 3.5
- postal or courier licence with no purchase or delivery limit -> score 0 (and not 12.3)
spec_note: Methodology criterion reads 'purchase limit AND delivery restriction'; Guide p.84 and workbook
  score either one. Guide lists a tax-free monthly allowance (Argentina) as a limit while excluding taxation
  measures.
