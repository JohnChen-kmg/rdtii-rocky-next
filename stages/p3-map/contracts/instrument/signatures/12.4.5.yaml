indicator: 12.4.5
name: 'Online payment limitations: ceiling on the maximum amount'
tier: B
instrument_version: 2.1.0
keywords:
- maximum amount
- maximum value
- transaction limit
- daily limit
- cumulative transaction amount
- shall not exceed
- wallet limit
- stored value
- electronic money balance
- holding limit
- per transaction
- annual limit
- unregistered electronic money
- value per unit of goods
- small-value transactions
- total amount transferred
definition_text: 'Online payment rule capping how much can be paid, transferred or held through electronic
  payment methods: per-transaction or daily limits, annual transfer caps, e-wallet or stored-value holding
  limits, or a maximum value per cross-border sale via payment aggregators. AML reporting thresholds,
  and limits above which extra authentication is needed, are not ceilings. One of seven binary online
  payment sub-indicators.'
exemplar_law_types:
- payment services acts
- electronic money regulations and central bank notifications
- online payment business measures for non-bank payment institutions
- cross-border payment aggregator directions
scope_patterns:
  horizontal: AML/CFT or payment system laws for all payments (reporting thresholds are not ceilings)
  sectoral: e-money wallets, non-bank online payment accounts, cross-border payment aggregators
negative_signals:
- AML threshold or suspicious transaction reporting amount -> score 0
- higher limit allowed once extra authentication is used -> score 0
- tax-free monthly allowance on online purchases -> 12.2
- de minimis duty threshold on low-value imports -> 12.5
spec_note: Workbook treats e-wallet holding caps as ceilings (Singapore, Indonesia, Malaysia, Mongolia)
  but scored Russia 0 although its row note lists e-money balance caps.
