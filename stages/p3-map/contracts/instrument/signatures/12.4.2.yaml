definition_text: Online payment rule fixing the currency in which cross-border payments must be paid or
  settled, e.g. trade with certain partners settled only in the national currency, or e-commerce payments
  required in local currency. A domestic legal-tender rule exempting international trade, or e-money that
  may be held in foreign currency, does not fix the currency of international payments. One of seven binary
  online payment sub-indicators.
exemplar_law_types:
- foreign exchange management regulations
- currency laws
- central bank regulations on mandatory use of the national currency
- electronic money regulations
- e-commerce regulations
scope_patterns:
  horizontal: currency and foreign-exchange laws covering all transactions
  sectoral: e-money issuers, payment system operators, e-commerce operators
negative_signals:
- advertising ban on prices shown in foreign currency -> 9.3
- requirement to use a local bank account -> 12.4.1
- foreign-exchange reporting or authorised-channel rules without a currency mandate -> score 0
- domestic-only legal tender rule exempting international trade -> score 0 (workbook split; see notes)
spec_note: 'Workbook inconsistent on domestic local-currency rules: Indonesia rows 160/162 score 1 but
  row 161 scores 0; Lao PDR e-money-in-Kip scores 1 but Mongolia e-money-in-MNT scores 0.'
