indicator: '3.3'
name: Nationality or residency requirements for board of directors or managers
tier: C
instrument_version: 2.1.0
keywords:
- director
- board of directors
- resident director
- ordinarily resident
- reside in
- residency
- domicile
- citizens of
- nationality
- nationals
- managing director
- manager
- chief executive officer
- majority of directors
- positions closed to foreign
- foreign manpower
- local director
- resident in the country
definition_text: A law requires at least one board member or manager to be a national or resident of the
  economy, whether for all companies under company law or in digital-trade sectors such as broadcasting
  or internet services. Any such requirement scores 1. Rules for officers who are neither directors nor
  managers, such as company secretaries or chief accountants, and general local-hiring quotas do not count.
exemplar_law_types:
- companies acts (resident director rules)
- public companies acts
- foreign business acts
- FDI policy conditions for broadcasting services
- manpower regulations reserving positions for nationals
- banking regulator rules on executive bodies
scope_patterns:
  horizontal: company-law resident director rules applying to every company
  sectoral: 'broadcasting, internet service providers, banks: nationality or residency of directors, CEO
    or key managers'
negative_signals:
- residency or nationality rule only for officers who are not directors or managers -> not scored
- quota for local employees in the workforce -> not scored
- foreign equity cap in the same provision, outside telecom and e-commerce -> 3.1
- duty to appoint a local representative or contact point for online services -> 12.8
spec_note: Beyond absence rows the pool has one true boundary negative (Russian chief accountant rule);
  round2 India row 27 carries no director rule.
