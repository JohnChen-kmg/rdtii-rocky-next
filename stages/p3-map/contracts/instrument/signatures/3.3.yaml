- economy: SG
  law: Companies Act 1967; Significant Investments Review Act 2024
  coverage: Horizontal
  score: 1
  impact: Pursuant to the Singapore Companies Act 1967 (section 145(1)), a director must be a natural
    person (i.e. a company or business entity cannot be a director) , at least one director must be ordinarily
    resident in Singapore—that is, Singapore citizen, Singapore permanent resident, EntrePass holder,
    or Employment Pass (EP) holder. A company is required to have at least one director who is ordinarily
    resident in Singapore. It must also have a company secretary, who cannot be a sole director and must
    be resident in Singapore.
  url: https://sso.agc.gov.sg/Act/CoA1967#pr4-
