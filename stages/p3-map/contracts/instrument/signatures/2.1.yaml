indicator: '2.1'
name: Foreign exclusions from public procurement related to ICT goods and digital services
tier: B
instrument_version: 2.1.0
keywords:
- public procurement
- government procurement
- public tenders
- domestic goods
- domestic products
- domestic suppliers
- local supplier
- non-local supplier
- foreign supplier
- foreign bidder
- foreign-owned
- international tender
- international competitive bidding
- not available domestically
- cannot be obtained
- ban on the procurement
- eligible to bid
- national treatment
definition_text: A procurement measure bars foreign firms, or foreign goods and services, from public
  tenders for ICT goods or digital services, or bans named foreign companies or economies. Letting foreign
  bidders in only when no domestic supplier can meet demand is also an exclusion. Quotas, price preferences
  and local-content conditions are limitations (2.3); a bare legal power to exclude scores 0.
exemplar_law_types:
- public or government procurement acts and implementing regulations
- presidential or government regulations on procurement of goods and services
- domestic-preference public procurement orders
- information technology or information security laws restricting state bodies' use of foreign products
- foreign investment laws guaranteeing equal access to procurement (score-0 reference rows)
scope_patterns:
  horizontal: procurement laws closing tenders to foreign goods or suppliers across sectors, including
    ICT
  sectoral: product- or service-specific bans (messenger services, security products, mobile phones, listed
    electrical equipment)
negative_signals:
- quota, set-aside, price preference or local-content condition that still lets foreign bidders compete
  -> 2.3
- condition to hand over source code or use a specific encryption standard to win a tender -> 2.2
- ban on importing a foreign product, not limited to procurement -> 10.1
- clause empowering the government to restrict foreign participation, with no implementing measure ->
  not scored
- nationality rules limited to construction or other non-digital procurement -> not scored
spec_note: Round2 Indonesia rows 6-9 code local-content, quota and price-preference rules as 2.1 = 1;
  the Guide treats these as 2.3 limitations, so they were not curated.
