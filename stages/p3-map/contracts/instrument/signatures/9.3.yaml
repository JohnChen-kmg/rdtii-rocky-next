    '
  impact: The Amendment to the Federal Law On Advertising No. 38-FZ, entered into force in September 2022,
    requires that all online advertising disseminated within the Russian Federation be properly marked
    in accordance with Article 18.1 of the law. Marking entails assigning a unique advertising identifier,
    or token, to each advertisement, labeling the material with the word “advertising,” and disclosing
    information about the advertiser (i.e., the manufacturer or seller of the advertised product or service).
    This information must be submitted to the Unified Register of Online Advertising (UROA), a centralized
    database operated by Roskomnadzor.
