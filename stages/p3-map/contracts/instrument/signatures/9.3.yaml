definition_text: 'Requirements that limit online advertising, including general advertising rules that
  do not exclude online media: prior approval of ads, mandatory languages, bans on comparative ads or
  on prices in foreign currency, quotas of unpaid social advertising, and marking, registration or reporting
  duties for online ads. Excludes consumer protection rules such as bans on misleading ads, public-health
  or safety limits on products, and offline-only rules.'
exemplar_law_types:
- general advertising laws
- internet advertising measures and amendments
- communications and multimedia content codes
- language laws governing advertisements
- consumer protection laws (mostly negatives)
scope_patterns:
  horizontal: advertising laws silent on medium, presumed to cover online ads unless clearly offline-only
  sectoral: online-specific duties on ad distributors, platforms and aggregators; sector ad rules (financial,
    gambling)
negative_signals:
- prohibition on misleading or false advertising -> not scored (consumer protection)
- ad bans on tobacco, alcohol, drugs, weapons or medicine for public health or safety -> not scored
- rules that apply only to offline advertising such as billboards -> not scored
- election or political campaign advertising rules -> not scored (non-commercial)
- platform duty to moderate user content, including ads -> 8.4
spec_note: 'Only Russian Federation rows match a Guide example (5% unpaid social advertising quota). Several
  workbook score-1 rows are consumer-protection or moderation duties (see notes.md).

