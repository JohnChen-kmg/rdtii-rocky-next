indicator: 12.4.6
name: 'Online payment limitations: mandate specific intermediaries'
tier: B
instrument_version: 2.1.0
keywords:
- payment intermediary
- national payment gateway
- switching institution
- processed through
- exclusively through
- single operator
- designated operator
- national payment card system
- clearing
- settlement institution
- payment agent
- payment aggregator
- acquirer
- authorised payment system provider
- domestic processing
definition_text: Online payment rule forcing merchants, platforms or payers to route online payments through
  a particular intermediary, such as a named or state-designated switch, clearing house, gateway, bank
  or operator. A general duty to use licensed or authorised payment providers, a licensing duty for aggregators,
  or a permission to engage agents is not such a mandate. One of seven binary online payment sub-indicators.
exemplar_law_types:
- national payment system laws
- central bank payment system and electronic money regulations
- e-commerce regulations on payment processing
scope_patterns:
  horizontal: payment system laws naming a national switch or single processor
  sectoral: card payments, e-money, e-commerce payment collection
negative_signals:
- duty to use licensed or authorised payment providers -> score 0
- optional engagement of payment agents or aggregators -> score 0
- authorisation of payment aggregators with restrictive conditions -> 12.4.4
- local processing of payment card transactions -> 6.1
spec_note: The only score-1 row (India, non-bank payment aggregator authorisation) reads as a licensing
  measure; no clean score-1 exemplar exists.
