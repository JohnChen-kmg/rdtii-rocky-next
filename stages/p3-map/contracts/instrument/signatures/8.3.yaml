indicator: '8.3'
name: User identity requirements
tier: B
instrument_version: 2.1.0
keywords:
- real name
- real-name
- real identity information
- verify the identity
- identity verification
- identification of users
- identity document
- identity card
- passport
- register subscribers
- subscriber registration
- SIM card registration
- prepaid
- know your customer
- e-KYC
- first originator
- anonymous use
- authentication
- registration of end-users
- biometric
definition_text: A law obliges Internet intermediaries or operators to collect, verify, record or authenticate
  users' identity (names, ID numbers or documents, phone numbers, biometrics) before users may connect
  to the Internet or use online services such as social media, messaging, forums, apps or cyber cafés
  (score 1), or only when registering a SIM card (score 0.5). Identity checks that are merely encouraged
  are not a requirement.
exemplar_law_types:
- internet information service provisions (forums, comments, apps, messaging)
- information or IT laws and intermediary rules (instant-messaging and first-originator identification)
- cyber café rules
- SIM and mobile subscriber registration regulations and guidelines
- counter-terrorism laws (customer identity checks)
- telecom licence conditions (subscriber registration)
scope_patterns:
  horizontal: identity checks for all telecom and internet service customers (CN Counterterrorism Law
    Art. 21)
  sectoral: SIM registration for mobile operators; cyber cafés; named online services such as social media,
    forums, comments, apps and messaging
negative_signals:
- retention of user ID records or traffic data for a set period -> 7.3
- authorities obtaining subscriber lists or user data from providers -> 7.5
- duty to monitor, filter or remove users' content -> 8.4
- voluntary or merely encouraged identity authentication -> not scored
