definition_text: 'A statutory shield limits the liability of Internet intermediaries (access providers,
  hosts, caching, search and platform services) for copyright infringement by their users, usually if
  they lack knowledge and remove material on notice. Inverted polarity: no shield scores 1; a shield only
  in a sectoral law such as an e-commerce or telecoms rule scores 0.5; a horizontal shield scores 0. General
  intermediary exemptions count for copyright too.'
exemplar_law_types:
- copyright acts (service-provider liability limits, notice-and-takedown)
- civil codes (IP liability of information intermediaries)
- information technology or electronic transactions acts (general intermediary immunity)
- regulations on the right of communication over information networks
- e-commerce regulations (intermediary liability exemptions)
scope_patterns:
  horizontal: copyright act, civil code or IT act covering intermediaries in all sectors (SG Copyright
    Act 2021, RU Civil Code Art. 1253.1, IN IT Act s.79)
  sectoral: e-commerce or telecommunications instruments that limit intermediary liability (ID GR 80/2019;
    Georgia's e-commerce law in the Guide)
negative_signals:
- rights-holder remedies (injunctions, takedown procedures) with no liability limit for intermediaries
  -> 4.6
- shield limited to non-copyright unlawful content -> 8.2 (a general shield counts for both)
- duty to prevent infringement or block infringing works, with no shield -> 8.4
- blocking of copyright-infringing websites -> not scored under 9.1
spec_note: 'No trustworthy score-1 exemplar: the only score-1 row (Lao PDR row 50) conflicts with Guide
  p.65 footnote 40. See notes.md.'
