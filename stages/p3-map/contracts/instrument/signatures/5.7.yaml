indicator: '5.7'
name: Lack of independent telecom authority
tier: B
instrument_version: 2.1.0
keywords:
- independent regulator
- regulatory authority
- regulatory commission
- body corporate
- statutory body
- independence
- ministerial direction
- the Minister may give directions
- appointment of members
- term of office
- removal from office
- conflict of interest
- budget of the Commission
- industry levy
- not subject to the direction
- telecommunications regulatory authority
- dissolution of the regulatory body
definition_text: 'Whether telecommunications are supervised by an authority independent of operators,
  the Government and other interested parties. Functional independence: decisions without government or
  operator approval, limited and defined overrides, equal treatment of SOEs and rivals. Institutional
  and financial independence: separation from operators, stable budget, control of staff. Inverted polarity:
  no independent authority scores 1.'
exemplar_law_types:
- regulator establishment acts
- telecommunications acts (authority and ministerial powers)
- presidential or state council decrees on ministry structure
- regulations dissolving or merging regulatory bodies
- regulator staff and appointment regulations
scope_patterns:
  horizontal: not observed; converged communications regulators may also cover broadcasting and media
  sectoral: telecom or ICT regulator established by statute or decree
negative_signals:
- Government ownership of telecom operators -> 5.3
- commitment to the WTO Telecom Reference Paper -> not scored (5.6 is non-regulatory)
- independence of data protection or competition authorities -> not scored
- appeal tribunal for telecom disputes on its own -> not scored as the regulator
spec_note: 'TRAP: inverted polarity (an independent regulator scores 0). The Guide does not say how many
  independence criteria must fail for a score of 1 (see notes).

  '
