indicator: '7.5'
name: Requirements to allow government access to personal data
tier: A
instrument_version: 2.1.0
keywords:
- without a warrant
- without court order
- without judicial
- access to computerized data
- interception of communication
- lawful interception
- production order
- provide access to
- shall be given access
- disclose to the authority
- surveillance
- police officer
- authorized officer
- intelligence
- national security
- decryption
- password
- encryption code
definition_text: 'A measure allowing the Government to access personal data without the explicit authorization
  of an independent judicial body (court decision, judicial warrant, or equivalent). Includes standing
  access for agencies, access on regulator or ministerial request, and interception authorized by non-judicial
  or undefined authorities. Usually found OUTSIDE privacy law: criminal procedure codes, surveillance
  and interception statutes, telecom and intelligence laws.'
exemplar_law_types:
- criminal procedure codes (computer-access / production powers)
- security-offences and surveillance acts
- interception/telecom access acts
- cybersecurity acts (search/access powers)
- intelligence laws
- data-availability / government data-sharing schemes
scope_patterns:
  horizontal: CPC powers, intelligence acts, data-sharing schemes
  sectoral: telecom operator obligations, sector codes' law-enforcement carve-outs
negative_signals:
- access gated on a judicial warrant or court order -> score 0
- the privacy act's own investigation powers may be warrant-gated (score 0) while the CPC is not — cite
  the CPC
exemplars:
- economy: SG
  law: Criminal Procedure Code 2010
  coverage: Horizontal
  score: 1
  impact: Under the Criminal Procedure Code, (section 39 and 40) police officers have the power to access
    computers and the power to access decrypted information. Moreover, (section 20) empowers the police
    to order the "production of any document or other thing" for the purposes of criminal investigations.
    Any person who obstructs the lawful exercise by a police officer or an authorised person shall be
    guilty of an offence and shall be liable on conviction to a fine not exceeding $10,000 or to imprisonment
    for a term not exceeding 3 years or to both.
  url: https://sso.agc.gov.sg/Act/CPC2010
  teaching_note: 'CANONICAL look-beyond-privacy-law: CPC ss.20/39/40 — police access to computers and
    decrypted information, production orders -> 1.'
