- economy: MY
  law: Criminal Procedure Code (Act 593) 2018
  coverage: Horizontal
  score: 1
  impact: The Criminal Procedure Code (Act 593) 2018 Section 116B (Access to computerized data) of the
    Criminal Procedure Code provides that a police officer conducting a search under the Code must be
    given access to computerised data whether stored in a computer or otherwise. For the purpose of this
    section, 'access' includes being provided with the necessary password, encryption code, decryption
    code, software, or hardware and any other means required to enable comprehension of the computerised
    data. It is not clear whether a court order is needed to access the information.
