indicator: '6.1'
name: Ban and local processing requirements
tier: A
instrument_version: 2.1.0
keywords:
- shall not transfer
- prohibited from transferring
- ban on transfer
- cross-border transfer
- transfer outside
- outside the country
- outside the Federation
- processed locally
- local processing
- process within
- processed within the territory
- data localization
- onshore processing
- domestic processing
- may not be transferred
- transfer of personal data abroad
definition_text: A law prohibits, per se, the cross-border transfer of data, or mandates that certain
  data be processed domestically (processing = collection, organization, structuring, storage, adaptation,
  use, disclosure, dissemination). A complete prohibition with no compliant transfer path, or an obligation
  that processing happen only in-country. Higher restriction when it covers personal data generally or
  applies horizontally across all sectors.
exemplar_law_types:
- comprehensive data-protection statutes (transfer-prohibition provisions)
- sectoral health-records laws
- financial/credit-reporting regulations
- ride-hailing / platform-sector interim measures
- national payment-system laws
scope_patterns:
  horizontal: prohibition/processing mandate on personal data across all sectors
  sectoral: health records, credit data, ride-hailing, payment data, single-country bans
negative_signals:
- transfer permitted when conditions met (consent/adequacy/approval) -> 6.4
- copy must remain in-country while transfer allowed -> 6.2
- must build/use local server or data centre -> 6.3
- bank-secrecy/confidentiality disclosure rules are not transfer bans
- measures on government data are not scored
