indicator: '12.3'
name: Licensing scheme for e-commerce providers (B2B and B2C)
tier: B
instrument_version: 2.1.0
keywords:
- e-commerce business licence
- e-commerce business license
- business licence
- business license
- licence to operate
- license to operate
- prior approval
- electronic commerce
- e-commerce operator
- e-commerce platform
- electronic marketplace
- trading through electronic systems
- online data processing and transaction processing
- value-added telecommunications business
- acknowledgement certificate
- commercial registry
- B2B
- B2C
definition_text: Whether businesses selling or intermediating goods or services online, including B2B
  and B2C platforms, marketplaces and online sellers, must hold a licence or prior approval to run the
  e-commerce business itself, such as an e-commerce business licence or marketplace approval. Any licence
  scores; strict conditions are not needed. Licences for adjacent activities, such as online payment services
  or delivery, are excluded.
exemplar_law_types:
- e-commerce laws and decrees
- trade laws and regulations on trading through electronic systems
- telecom licensing measures for online data and transaction processing
- commercial registration notifications covering online sellers
- digital platform regulations
scope_patterns:
  horizontal: general company, trade or business registration laws for all businesses; a registration
    duty on every business was scored 0
  sectoral: e-commerce business licences, marketplace or platform operator licences and approvals
negative_signals:
- licence to operate online payment or e-money services -> 12.4.4 (only if conditions are restrictive)
- licence for ISPs, ICPs, social media, news, VPN or cloud services -> 9.4
- licence for telecom services or facilities -> 5.5
- postal, courier or delivery licence -> not 12.3; delivery limits -> 12.2
- duty to open a local representative office or appoint a local liaison officer -> 12.8
