definition_text: 'Licensing or authorisation of payment service providers (e-money issuers, payment gateways
  and aggregators, money transfer or payment system operators) with restrictive conditions: local incorporation,
  nationality or residency of directors, a local office for foreign payment systems, or limits on licence
  types or numbers. Licences with only prudential conditions, such as capital and fund safeguarding, were
  mostly scored 0.'
exemplar_law_types:
- payment services acts
- national payment system laws
- central bank licensing notifications for e-payment businesses
- electronic money regulations
- banking acts covering stored-value facilities
scope_patterns:
  horizontal: banking or payment system laws covering all payment service providers
  sectoral: e-money, payment gateway and aggregator, remittance and card scheme licences
negative_signals:
- licence to run the e-commerce business itself -> 12.3
- foreign equity cap on payment or e-money firms -> 3.1
- resident or national director rule under general company law -> 3.3
- payment licence with only capital, fit-and-proper or safeguarding conditions -> score 0
- electronic signature certification licence -> not an online payment licence (see notes)
spec_note: Workbook split on prudential-only licences (Lao PDR row 92 scores 1; Malaysia and Mongolia
  score 0). India row 149 scores 0 although the same RBI guidelines require incorporation in India.
