indicator: '12.8'
name: Local presence requirements for online service providers
tier: B
instrument_version: 2.1.0
keywords:
- local representative
- legal representative
- local agent
- authorized representative
- appoint a representative
- designate a representative
- representative office
- point of contact
- contact person
- liaison officer
- domiciled in
- located within the territory
- foreign service provider
- offshore
- foreign electronic system operator
- without a physical office
- post-box
- post office box
- daily users
definition_text: A rule that a foreign online service provider must have a representative office, local
  agent, legal representative, contact point or post-box in the economy as a condition for supplying services
  remotely, without setting up a subsidiary or branch. Often triggered by user or transaction thresholds
  and found in platform, e-commerce, electronic systems and personal information laws. Corporate-law registered
  offices do not count.
exemplar_law_types:
- electronic system operator and platform registration regulations
- e-commerce trade regulations (foreign operators above thresholds)
- personal information protection laws (offshore processor representatives)
- social network or internet resource laws for foreign providers
- digital platform service decrees (local point of contact)
scope_patterns:
  horizontal: all foreign electronic system operators or all offshore personal information processors
  sectoral: social networks, e-commerce platforms, digital platforms, IT service providers above user
    thresholds
negative_signals:
- must incorporate locally, open a branch or subsidiary, or set up a permanent office -> 3.5
- foreign-company registered office or registered agent under companies law -> 3.5 (score 0 here)
- local administrative contact to register a ccTLD domain -> 12.7
- appointment of a Data Protection Officer or person in charge of data protection -> 7.4
- local agent for patent applications or patent enforcement -> 4.01 / 4.3
spec_note: 'Clean score-1 rows are few: Indonesia 178 and 179, China 122. Malaysia 109 (local incorporation),
  Thailand 127 and 129 are doubtful; Thailand 128 codes a mandated local contact point 0 against Guide
  pp.87-88.

  '
