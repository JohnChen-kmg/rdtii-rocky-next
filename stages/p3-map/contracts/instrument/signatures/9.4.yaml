indicator: '9.4'
name: Licensing requirements for online content providers and applications (social media platforms, news
  providers, VPN, cloud services, etc.)
tier: B
instrument_version: 2.1.0
keywords:
- licence
- license
- licensing requirement
- class licence
- individual licence
- special license
- permit to operate
- content applications service
- applications service provider
- internet content provider
- internet information service
- online news
- online publishing
- broadcasting licence
- broadcasting license
- virtual private network
- cloud computing service
- data center
- data centre
- social media platform
definition_text: 'Licensing schemes that online service providers must meet to operate: licences or special
  permits for internet content providers and ISPs, social media and messaging platforms, online news and
  publishing, broadcasting, VPNs, cloud and data-centre services. A scheme is strict when conditions limit
  market access, such as local incorporation, nationality or residency, high paid-up capital, local servers
  or approved technology.'
exemplar_law_types:
- communications and multimedia or broadcasting acts, licence notifications and licensing guidebooks
- internet information service, online news and online publishing regulations
- licensing-of-activities and permit laws
- telecom-law authorisations applied to ISPs, VPNs and IoT connectivity
- digital platform and electronic system operator rules (registration-only negatives)
scope_patterns:
  horizontal: permit or licensing-of-activities laws listing content, broadcasting or encryption services
  sectoral: 'service-specific licences: online news, publishing, broadcasting, ISP authorisation, VPN,
    maps, ride-hailing, IoT, social media above a user threshold'
negative_signals:
- telecom network facilities, network services or operator licence -> 5.5
- e-commerce business or marketplace licence -> 12.3 (record both if it also covers social media or apps)
- condition to locate servers or a data centre in-country -> 6.3 (also makes the licence strict)
- registration or prior notification without a licence -> not scored (recorded at 0 in workbooks)
- standalone duty to establish a local entity or appoint a local representative -> 3.5 / 12.8
spec_note: 'Workbooks apply the Guide''s more-than-one-scheme escalation inconsistently, and the Guide''s
  own strict example (Indonesia IoT licence) is scored 0.5 in workbook round2 Indonesia row 120.

  '
