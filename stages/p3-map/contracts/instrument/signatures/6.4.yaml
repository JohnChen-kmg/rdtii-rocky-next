indicator: '6.4'
name: Conditional flow regimes
tier: A
instrument_version: 2.1.0
keywords:
- unless
- except in accordance
- subject to the following conditions
- adequate level of protection
- comparable standard of protection
- adequacy
- consent of the data subject
- explicit consent
- prior authorization
- prior approval
- security assessment
- standard contractual clauses
- binding corporate rules
- whitelist
- specified in the Gazette
- transfer impact assessment
definition_text: 'Cross-border data transfer is permitted only if conditions are satisfied: data-subject
  consent, adequacy or equivalence of protection in the destination, contractual safeguards or self-assessment,
  or government approval/authorization. The drafting is often a default prohibition with exceptions —
  that pattern is a conditional flow regime, not a ban, because a compliant transfer path exists.'
exemplar_law_types:
- comprehensive data-protection statutes (cross-border transfer sections)
- privacy principles in omnibus acts (e.g. APP 8)
- sectoral codes of practice (banking, communications)
- central-bank/cloud outsourcing rules
- CAC-style security-assessment provisions
scope_patterns:
  horizontal: conditions on personal data generally (scores 1 even if sector-specific)
  sectoral: conditions limited to specific NON-personal data categories score 0.5
negative_signals:
- complete prohibition with no compliant path -> 6.1
- transfer freely allowed except to blacklisted countries -> 6.1 at 0.5, not 6.4
- conditions applied to government data are not scored
