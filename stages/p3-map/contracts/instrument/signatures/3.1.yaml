indicator: '3.1'
name: Foreign equity limits in sectors relevant to digital trade
tier: C
instrument_version: 2.1.0
keywords:
- foreign equity
- foreign ownership
- foreign shareholding
- foreign capital
- foreign investment shall not exceed
- percent of the shares
- prohibited for foreign investment
- negative list
- positive investment list
- minority stake
- wholly owned by citizens
- foreign participation in the authorized capital
- state-owned enterprise
- broadcasting
- mass media
- foreign business
- foreign direct investment policy
- government route
definition_text: A law caps or bans foreign equity in firms in sectors relevant to digital trade other
  than telecom and e-commerce, such as broadcasting, online media, computer services or fintech, in private
  firms or state-owned enterprises. A ban, or minority caps in two or more sectors, scores 1; a minority
  cap in one sector 0.8; a majority cap, or limits only in SOEs, 0.5; full ownership allowed 0.
exemplar_law_types:
- foreign investment laws and negative or positive investment lists
- FDI policy circulars and press notes
- broadcasting and mass media acts
- state-owned enterprise and privatisation laws
- financial regulator rules on e-money, fintech or lending platform ownership
- foreign business acts
scope_patterns:
  horizontal: foreign business acts, investment lists and SOE-wide caps (recorded only under 3.1)
  sectoral: broadcasting, online news and publishing, audiovisual services, satellites, digital payments,
    peer-to-peer lending
negative_signals:
- foreign equity cap on telecommunications services or network licences -> 5.2
- foreign equity cap on e-commerce or online retail businesses -> 12.01
- requirement to invest through a joint venture with a local partner -> 3.2
- approval needed above an ownership threshold -> 3.4
- government-held shares in telecom companies -> 5.3
spec_note: 'Rows are scored per measure; the economy total rises to 1 when minority caps exist in several
  sectors (reviewer note, round2 Indonesia row 26). No clean 0.5 controlling-stake row: 85% caps are coded
  0.8.'
