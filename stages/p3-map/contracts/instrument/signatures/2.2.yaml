indicator: '2.2'
name: Specific requirements on source codes, encryption and trade secrets
tier: B
instrument_version: 2.1.0
keywords:
- source code
- submit the source code
- source code and documentation
- escrow
- trade secret
- patented technology
- transfer of technology
- exclusive rights
- royalty-free
- encryption
- encryption standard
- cryptographic
- custom software
- software developer
- public electronic system
- public procurement
- tender
- bidding
definition_text: A public procurement rule makes taking part in or winning a tender conditional on handing
  over source code, trade secrets or patent rights (score 1), or on using a specific encryption standard
  (score 0.5). Typical cases are custom software for public electronic systems and software registers
  for government buyers. Disclosure duties outside procurement belong to 4.9; encryption standards in
  general belong to 11.4.
exemplar_law_types:
- electronic systems and transactions regulations (software for public institutions)
- public procurement acts and software procurement guidelines
- e-government open source or open standards policies
- encryption and information security rules for public information systems
scope_patterns:
  horizontal: procurement laws requiring all bidders to disclose code or trade secrets, or to use a set
    encryption standard
  sectoral: custom software for public electronic systems, e-governance applications, security products
    for classified systems
negative_signals:
- duty to disclose source code or algorithms to a regulator outside procurement -> 4.9
- national encryption algorithm or standard imposed generally -> 11.4
- procuring entity must keep bidders' trade secrets confidential -> not scored
- exclusion of foreign software suppliers from tenders -> 2.1
- intellectual property statute with no tender condition -> not scored
spec_note: No 0.5 (encryption-to-win) row exists in either workbook; only two score-1 rows (Indonesia
  source code, India open-source policy).
