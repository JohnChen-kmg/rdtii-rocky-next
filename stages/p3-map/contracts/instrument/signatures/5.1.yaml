definition_text: Whether telecom operators must share passive (non-electronic) infrastructure such as
  buildings, sites, towers, masts, poles, ducts and cabinets with other operators. A mandatory sharing
  obligation scores 0. Sharing that is voluntary but practised, or mandated only case by case or on request,
  scores 0.5. No obligation scores 1. Active network sharing (radio access, core) is a different concept.
exemplar_law_types:
- telecommunications acts
- regulator notifications on infrastructure sharing
- government decrees on access to infrastructure
- omnibus investment laws amending telecom rules
- telecom competition codes of practice
- mandatory standards on access
scope_patterns:
  horizontal: 'rare: general rules on access to transport or energy infrastructure for network deployment'
  sectoral: telecom-sector obligations on licensees, dominant operators or infrastructure owners, fixed
    or mobile
negative_signals:
- active infrastructure or spectrum sharing only -> not scored as passive sharing
- network interconnection obligations -> not scored as passive sharing
- functional or accounting separation for SMP operators -> 5.4
- consultation papers or pending sharing regulations -> not scored (not enforced)
spec_note: 'TRAP: inverted polarity (a sharing mandate scores 0). No score-1 row in the workbooks.

  '
