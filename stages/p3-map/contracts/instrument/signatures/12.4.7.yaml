definition_text: 'Residual online payment sub-indicator for requirements affecting electronic payment
  and credit services that fall outside the six named types (local bank account, currency, deviating security
  standards, restrictive licensing, amount ceilings, specific intermediaries). Example: foreign payment
  providers allowed to operate only through an agreement with a domestic operator and a central-bank register
  listing. Safeguarding and AML duties scored 0.'
exemplar_law_types:
- national payment system laws
- central bank circulars on cross-border online payments
- payment services acts
scope_patterns:
  horizontal: payment system laws applying to all payment instruments
  sectoral: foreign payment systems and cross-border online payment gateways
negative_signals:
- value ceilings on payments -> 12.4.5
- restrictive licence conditions for payment providers -> 12.4.4
- customer-fund safeguarding or licensed-agent rules -> score 0
- AML/CFT obligations -> score 0
- market problems such as card fraud without a legal measure -> not scored
